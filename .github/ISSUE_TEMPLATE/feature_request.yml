name: Feature request
description: Suggest something new or an improvement to an existing feature
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that's currently hard, missing, or awkward?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
      description: A rough idea is fine — doesn't need to be fully thought out.
    validations:
      required: false

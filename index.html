                  markers={[{value:0,color:'#94a3b8',label:'EQUAL'}]}
                  readout={(()=>{
                    return Math.abs(tune.settle-tune.settleR)<0.01?'EQUAL':`F ${tune.settle.toFixed(2)}s | ${tune.settleR.toFixed(2)}s R`;
                  })()}
                  hint="Biases settle time between front and rear. At centre (0), front and rear damp out in equal time. Left (FRONT) makes the front settle faster — sharper turn-in. Right (REAR) makes the rear settle faster — more rotation, looser rear end. The bias scales as 2× at ±50."/>
              : <FeelSlider label="Damping Bias" value={-(fe.dampingBias??0)}
                  onChange={v=>pFe('dampingBias')(-v)} min={-50} max={50} step={1}
                  leftLabel="FRONT" rightLabel="REAR"
                  markers={[{value:0,color:'#94a3b8',label:'EQUAL'}]}
                  readout={(()=>{const tot=physics.zetaF+physics.zetaR;const fP=tot>0?Math.round(physics.zetaF/tot*100):50;return`F ${fP} | ${100-fP} R`;})()}
                  hint="Biases damping toward one axle by softening the opposite side. The biased axle stays at the base ζ; the other drops up to 50% at ±50. Front bias: front stays firm, rear softens — understeer tendency, more stable overall. Rear bias: rear stays firm, front softens — oversteer tendency, looser rotation."/>}
            {(()=>{
              const biased=(fe.dampingBias??0)!==0||!!(fe.settleMode)||(fe.dampCharMode??'zeta')==='settle';
              const worst=Math.max(tune.settle,tune.settleR);
              const[cat,col]=worst<0.35?['PLANTED','#ef4444']:worst<0.60?['RACE','#f59e0b']:
                             worst<0.90?['SPORT','#9ca3af']:worst<1.30?['ROAD','#60a5fa']:['SOFT','#818cf8'];
              const lbl=t=><span style={{fontSize:10,color:'#94a3b8',letterSpacing:1,width:44,flexShrink:0}}>{t}</span>;

                  </div>
                  {biased&&(
                    <div style={{display:'flex',alignItems:'center',marginBottom:2}}>
                      {lbl('BUMP')}
                      {val(`${Math.round(physics.bumpZetaF)}%`)}<div style={{flex:1}}/>{val(`${Math.round(physics.bumpZetaR)}%`)}
                    </div>

                  <div style={{display:'flex',alignItems:'center',marginTop:biased?0:-2}}>
                    {lbl('SETTLE')}
                    {biased?<>{val(`${tune.settle.toFixed(2)}s`)}<div style={{flex:1}}/>{val(`${tune.settleR.toFixed(2)}s`)}</>
                           :<>{val(`${tune.settle.toFixed(2)}s`)}</>}
                    <span style={{fontSize:10,color:col,letterSpacing:1,marginLeft:biased?4:6}}>{cat}</span>
                  </div>
                </div>
              );
            })()}
          </Sec></div>

          {uiMode==='pro'&&<div id="zone-alignment" style={dim('alignment')}><Sec title="ALIGNMENT" open={open.alignment} onToggle={tog('alignment')}
            onReset={()=>setAl({...DEF_AL})}>
            <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:6}}>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:2}}>ALIGNMENT MODE</span>
              <Hint text="BUILD (default): camber/toe/caster recommended from build type, layout, weight bias, and roll angle only. MECH: nudges camber and toe toward your resolved Mech Balance Target's gap from natural — reinforces whatever oversteer/understeer intent you've already dialed in via the ARB/Mech Balance Target. GRIP: nudges to counteract the chassis's own natural grip tendency instead, independent of ARB mode. MANUAL: type in exact values."/>
            </div>
            <div style={{display:'flex',gap:3,marginBottom:10,flexWrap:'wrap'}}>
              {['build','mech','grip','manual'].map(m=>(
                <button key={m} className={`tog${alignMode===m?' on':''}`}

            {(alignMode==='mech'||alignMode==='grip')&&

                readout={`${al.nudgeStrength??50}%`}

                  hint="Front toe, entered directly. Negative = toe-out, positive = toe-in."/>
                <Field label="Toe R" value={al.toeR} onChange={pAl('toeR')} min={0.0} max={0.25} step={0.01} unit="°"
                  hint="Rear toe, entered directly."/>
              </div>
              <Field label="Caster" value={al.caster} onChange={pAl('caster')} min={4.0} max={7.5} step={0.1} unit="°"
                hint="Caster, entered directly."/>
            </>}
          </Sec></div>}

          </>}
        </div>
        {/* PINNED — stays put while the scrollable content above it scrolls, so graphs/dials

        {uiMode!=='beginner'&&<div id="zone-visuals" style={{flexShrink:0,borderTop:'1px solid #0f172a',...dim('visuals')}}>
          <Sec title="VISUALS" open={open.visuals} onToggle={tog('visuals')}>
            <div style={{maxHeight:'50vh',overflowY:'auto',overscrollBehavior:'contain'}}>
              <div className="collapsible-hdr" onClick={()=>setOpen(p=>({...p,visArb:!p.visArb}))}
                style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',marginBottom:3,userSelect:'none',padding:'3px 4px'}}>
                <span style={{fontSize:9,letterSpacing:2,color:'#334155'}}>ARB</span>
                <span style={{marginLeft:'auto',fontSize:9,color:'#475569'}}>{open.visArb?'▲':'▼'}</span>
              </div>
              {open.visArb&&<>
              <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:18}}>
                <div style={{flex:1,minWidth:0,display:'flex',justifyContent:'center'}}>
                  <ArbDial arbF={tune.arbF} arbR={tune.arbR} arbLimit={lim.arb}
                    rsAbF={tune.rsAbF} rsAbR={tune.rsAbR}
                    natBal={natMechBalance} target={resolveArbBalTarget(ch,fe)} rideRef={physics.rideRef}/>
                </div>
                <div style={{flex:1,minWidth:0,display:'flex',justifyContent:'center'}}>
                <div style={{width:120,flexShrink:0,display:'flex',flexDirection:'column',gap:6}}>
                  {/* roll seesaw preview */}
                  <div style={{padding:'0 4px'}}>
                    <svg width="100%" height="24" viewBox="0 0 100 24" style={{overflow:'visible'}}>

                      {(fe.arbMode??'auto')==='roll'&&(

                            strokeDasharray="3 2" opacity="0.4" strokeLinecap="round"/>
                        </g>
                      )}
                      <g transform={`rotate(${-Math.min(tune.rollDeg*4,25)} 50 20)`}

                          stroke={tune.rollClamped?'#f59e0b':'#e2e8f0'} strokeWidth="1.5" strokeLinecap="round"/>
                        <rect x="15" y="10" width="5" height="8" rx="1.5" fill="#0f172a"
                          stroke={tune.rollClamped?'#f59e0b':'#cbd5e1'} strokeWidth="1.5"/>
                        <rect x="80" y="10" width="5" height="8" rx="1.5" fill="#0f172a"
                          stroke={tune.rollClamped?'#f59e0b':'#cbd5e1'} strokeWidth="1.5"/>
                      </g>
                    </svg>
                  </div>
                  {/* roll value */}
                  <div style={{display:'flex',alignItems:'center',gap:6,padding:'0 4px'}}>
                    <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>ROLL</span>
                    <span style={{marginLeft:'auto',fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,
                                  color:tune.rollClamped?'#f59e0b':'#e2e8f0'}}>{tune.rollDeg.toFixed(1)}</span>
                    <span style={{fontSize:10,color:'#94a3b8'}}>°</span>
                  </div>
                  {/* springs/ARBs contribution bar — also serves as the ARB SHARE readout */}
                  <div style={{padding:'0 4px'}}>
                    <div style={{display:'flex',height:3,borderRadius:2,overflow:'hidden',marginBottom:4}}>

                    </div>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'#94a3b8'}}>
                      <span>SPRINGS {Math.round(100-tune.arbShare)}%</span>
                      <span>ARBs {Math.round(tune.arbShare)}%</span>
                    </div>
                  </div>
                </div>
                </div>
              </div>
              </>}

              <div className="collapsible-hdr" onClick={()=>setOpen(p=>({...p,visRideDampers:!p.visRideDampers}))}
                style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',marginBottom:3,userSelect:'none',padding:'3px 4px'}}>
                <span style={{fontSize:9,letterSpacing:2,color:'#334155'}}>RIDE / DAMPERS</span>
                <span style={{marginLeft:'auto',fontSize:9,color:'#475569'}}>{open.visRideDampers?'▲':'▼'}</span>
              </div>

                <div style={{flex:1,minWidth:0,display:'flex',justifyContent:'center'}}>

                    rsSpF={tune.rsSpF} rsSpR={tune.rsSpR}
                    clamped={physics.rearHzClamped}
                    natBal={natMechBalance} target={resolveArbBalTarget(ch,fe)} rideRef={physics.rideRef}/>
                </div>
                <div style={{flex:1,minWidth:0,display:'flex',justifyContent:'center'}}>
                  <DampingDial rebound={(fe.dampCharMode??'zeta')==='settle'?Math.round(physics.zetaF):(fe.reboundZeta??70)} bump={(fe.dampCharMode??'zeta')==='settle'?Math.round(physics.bumpZetaF):physics.bumpZeta}/>

              <div className="collapsible-hdr" onClick={()=>setOpen(p=>({...p,visDynamics:!p.visDynamics}))}
                style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',marginBottom:3,userSelect:'none',padding:'3px 4px'}}>
                <span style={{fontSize:9,letterSpacing:2,color:'#334155'}}>DYNAMICS</span>
                <Hint text="Damped spring step response — shows how fast the car settles, whether it overshoots, and how ride stiffness and damping interact. Dashed lines mark each axle's settle time."/>
                <span style={{marginLeft:'auto',fontSize:9,color:'#475569'}}>{open.visDynamics?'▲':'▼'}</span>
              </div>
              {open.visDynamics&&(()=>{
                const durSec=Math.min(4,Math.max(1.5,Math.max(tune.settle??2,tune.settleR??2)*1.8));
                const fReb=tune.zetaF??physics.reboundZeta??70;
                const fBmp=tune.bumpZetaF??physics.bumpZeta??39;
                const rReb=tune.zetaR??physics.reboundZeta??70;
                const rBmp=tune.bumpZetaR??physics.bumpZeta??39;
                const frontPts=computeOscillation(tune.fHz,fReb,fBmp,durSec);
                const rearPts=computeOscillation(tune.rHz,rReb,rBmp,durSec);
                const W=280,H=80,midY=40,yScale=32,xScale=W/durSec;
                const toPolyPts=pts=>pts.map(p=>`${(p.t*xScale).toFixed(1)},${(midY-p.x*yScale).toFixed(1)}`).join(' ');
                const fSetX=Math.min(W-1,(tune.settle??2)*xScale);
                const rSetX=Math.min(W-1,(tune.settleR??2)*xScale);
                return(
                  <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}
                       style={{display:'block',background:'#020617',borderRadius:3,marginBottom:6,border:'1px solid #1e293b'}}>

                    <polyline points={toPolyPts(rearPts)}  fill="none" stroke="#fb923c" strokeWidth={1.5} strokeLinejoin="round"/>
                    <polyline points={toPolyPts(frontPts)} fill="none" stroke="#38bdf8" strokeWidth={1.5} strokeLinejoin="round"/>
                    <text x={W-6} y={13} textAnchor="end" fontSize={9} fill="#38bdf8" fontFamily="JetBrains Mono, monospace">F</text>
                    <text x={W-6} y={25} textAnchor="end" fontSize={9} fill="#fb923c" fontFamily="JetBrains Mono, monospace">R</text>
                  </svg>
                );
              })()}

              {ch.useRideHeightCG&&(()=>{
                const pF=parseTyre(ch.tyreF),pR=parseTyre(ch.tyreR);
                const tyresOk=pF?.radius!=null&&pR?.radius!=null;
                if(!tyresOk)return null;
                const gConst=9810;
                const sagF=gConst/Math.pow(2*Math.PI*tune.fHz,2);
                const sagR=gConst/Math.pow(2*Math.PI*tune.rHz,2);
                const rhF=ch.rideHeightF*1000,rhR=ch.rideHeightR*1000;
                const riskOf=ratio=>ratio>=1?['BOTTOMED','#ef4444']:ratio>=0.8?['HIGH','#f59e0b']:ratio>=0.5?['MED','#eab308']:['LOW','#4ade80'];
                const[rF]=riskOf(sagF/rhF),[rR]=riskOf(sagR/rhR);
                const COL_F='#60a5fa',COL_R='#fb923c';
                const gBottomF=rhF/sagF,gBottomR=rhR/sagR;
                const gMax=Math.max(1,Math.min(6,Math.max(gBottomF,gBottomR)*1.25));
                const yMax=Math.max(rhF,rhR,sagF*gMax,sagR*gMax)*1.08;
                const W=280,H=115,padL=36,padB=20,padT=10,padR=10;
                const plotW=W-padL-padR,plotH=H-padT-padB;
                const xS=g_=>padL+(g_/gMax)*plotW;
                const yS=mm=>padT+plotH-(mm/yMax)*plotH;
                const toDisp=mm=>metricUnits?mm/10:mm/IN_TO_MM;
                const gEndF=Math.min(gMax,yMax/sagF),gEndR=Math.min(gMax,yMax/sagR);
                const xTicks=Array.from({length:Math.floor(gMax)+1},(_,i)=>i).filter(g_=>g_<=gMax);
                return(<>
                  <div className="collapsible-hdr" onClick={()=>setOpen(p=>({...p,visSag:!p.visSag}))}
                    style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',marginBottom:3,marginTop:6,userSelect:'none',padding:'3px 4px'}}>
                    <span style={{fontSize:9,letterSpacing:2,color:'#334155'}}>SAG vs LOAD</span>
                    <Hint text="Suspension compression scales linearly with vertical wheel load (mass cancels out of the spring/frequency relation), so this line is just static 1g sag × load factor. Dashed lines mark the ride height you entered per axle — where a diagonal crosses its dashed line is the load (in g) at which that axle bottoms out. Doesn't distinguish cornering/braking/bump load — treat it as 'how many g before contact', not a precise dynamic simulation."/>
                    {open.visSag&&<span style={{marginLeft:'auto',display:'flex',gap:8,fontSize:9}}>
                      <span style={{color:COL_F}}>● FRONT {rF}</span>
                      <span style={{color:COL_R}}>● REAR {rR}</span>
                    </span>}
                    <span style={{marginLeft:open.visSag?0:'auto',fontSize:9,color:'#475569'}}>{open.visSag?'▲':'▼'}</span>
                  </div>
                  {open.visSag&&
                  <div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:2,padding:'6px 8px',marginBottom:4,display:'flex',flexDirection:'column',gap:4}}>
                    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto'}}>
                      {/* axes */}
                      <line x1={padL} y1={padT} x2={padL} y2={H-padB} stroke="#1e293b" strokeWidth={1}/>

                      <text x={2} y={padT+4} fontSize={8} fill="#475569" fontFamily="var(--font-mono)">{Math.round(toDisp(yMax))}{metricUnits?'cm':'in'}</text>

                      <line x1={xS(0)} y1={yS(0)} x2={xS(gEndF)} y2={yS(sagF*gEndF)} stroke={COL_F} strokeWidth={2}/>
                      <line x1={xS(0)} y1={yS(0)} x2={xS(gEndR)} y2={yS(sagR*gEndR)} stroke={COL_R} strokeWidth={2}/>

                      {gBottomF<=gMax&&<circle cx={xS(gBottomF)} cy={yS(rhF)} r={2.5} fill={COL_F}/>}
                      {gBottomR<=gMax&&<circle cx={xS(gBottomR)} cy={yS(rhR)} r={2.5} fill={COL_R}/>}
                    </svg>
                    <div style={{display:'flex',gap:12,fontFamily:'var(--font-mono)'}}>
                      <span style={{fontSize:9,color:COL_F}}>{gBottomF<=gMax?`bottoms ≈${gBottomF.toFixed(1)}g`:`no bottom ≤${gMax.toFixed(1)}g`}</span>
                      <span style={{fontSize:9,color:COL_R}}>{gBottomR<=gMax?`bottoms ≈${gBottomR.toFixed(1)}g`:`no bottom ≤${gMax.toFixed(1)}g`}</span>
                    </div>
                  </div>}
                </>);
              })()}
            </div>
          </Sec>
        </div>}
        </div>

          <Card title="ALIGNMENT"
            hint={(()=>{

              <Readout label="REAR" value={tune.arbR} warn={tune.arbR>lim.arb*0.88}

                  `${Math.round(tune.rsAbR/(tune.rsSpR+tune.rsAbR)*100)}% of rear roll`,

              Mech balance target ({resolveArbBalTarget(ch,fe).toFixed(2)}) couldn't be reached —

                :(fe.arbMode??'auto')==='basic'

                  <Readout label="REAR"

                    {buildLabel} build → {recommendedCenter}% rear: {centerReasons[dr.buildType??'track']}.

                      base {_baseCenter}%{_weightAdj!==0?` · weight ${_weightAdj>0?'+':''}${_weightAdj}%`:''}{_diamAdj!==0?` · tyres ${_diamAdj>0?'+':''}${_diamAdj}%`:''}{_natAdj!==0?` · balance ${_natAdj>0?'+':''}${_natAdj}%`:''}

                  {isAWD&&centerMatch&&<div style={{fontSize:10,color:'#334155',lineHeight:1.5}}>
                    {buildLabel} build → {recommendedCenter}% rear: {centerReasons[dr.buildType??'track']}.
                    {uiMode==='pro'&&(_weightAdj!==0||_diamAdj!==0||_natAdj!==0)&&<div style={{fontSize:9,color:'#1e293b',marginTop:2}}>

                    </div>}
                  </div>}
                </div>}
              </>);
            })()}
          </Card>

          {showDataModal&&(()=>{
            const close=()=>setShowDataModal(false);
            const sharePayload=encodeTune(
              shareSel.ch?ch:DEF_CH,
              shareSel.fe?fe:DEF_FE,
              shareSel.dr?dr:DEF_DR
            );
            const doCopy=()=>{
              if(navigator.clipboard&&navigator.clipboard.writeText){
                navigator.clipboard.writeText(sharePayload).then(()=>setShareCopied(true)).catch(()=>{});
              } else {
                const ta=document.createElement('textarea');
                ta.value=sharePayload;document.body.appendChild(ta);ta.select();
                document.execCommand('copy');document.body.removeChild(ta);
                setShareCopied(true);
              }
            };
            const selectStyle={width:'100%',background:'#020617',border:'1px solid #1e293b',
              borderRadius:2,padding:'5px 8px',fontSize:11,color:'#e2e8f0',outline:'none',
              fontFamily:'var(--font-mono)',letterSpacing:1,marginBottom:14,cursor:'pointer',
              appearance:'none',WebkitAppearance:'none'};
            const chkRow=(key,label,sub,checked,onChange,disabled=false)=>(
              <label key={key} style={{display:'flex',alignItems:'center',gap:10,
                                       padding:'7px 0',borderBottom:'1px solid #1e293b',
                                       cursor:disabled?'default':'pointer',userSelect:'none',
                                       opacity:disabled?0.35:1}}>
                <input type="checkbox" checked={checked} disabled={disabled}
                  onChange={onChange}
                  style={{accentColor:'#94a3b8',width:14,height:14,cursor:disabled?'default':'pointer'}}/>
                <div>
                  <div style={{fontSize:11,color:'#e2e8f0',letterSpacing:1}}>{label}</div>
                  <div style={{fontSize:9,color:'#475569'}}>{sub}</div>
                </div>
              </label>
            );
            return(
            <div style={{position:'fixed',inset:0,zIndex:900,display:'flex',alignItems:'center',
                         justifyContent:'center',background:'#000a'}}
                 onClick={e=>{if(e.target===e.currentTarget)close();}}>
              <div style={{background:'#0f172a',border:'1px solid #334155',borderRadius:4,
                           padding:'20px 22px',width:280,fontFamily:'var(--font-mono)',
                           boxShadow:'0 8px 40px #000d'}}>
                <div style={{fontSize:11,letterSpacing:2,color:'#94a3b8',marginBottom:12}}>SHARE</div>
                {/* mode selector */}
                <div style={{position:'relative',marginBottom:14}}>
                  <select value={dataMode} onChange={e=>{setDataMode(e.target.value);setShareCopied(false);setImportErr('');setRestoreData(null);setRestoreErr('');}}
                    style={selectStyle}>
                    <option value="share">COPY CODE — generate a tune code</option>
                    <option value="load">LOAD CODE — load from a tune code</option>
                    <option value="backup">BACKUP — download saved data</option>
                    <option value="restore">RESTORE — load from a backup file</option>
                  </select>
                  <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',
                                color:'#475569',pointerEvents:'none',fontSize:10}}>▾</span>
                </div>
                {(()=>{
                  const hints={
                    share:'Generates a compact code for the current tune — chassis, springs, dampers, ARBs, and all feel settings. Share it with any SUSP.OS user. Does not include your garage saves or saved builds.',
                    load:'Paste a code from another device or user to load their tune. This overwrites your current setup — save your current tune to MY BUILDS first if you want to keep it.',
                    backup:'Downloads a JSON file of all your garage saves and saved builds. Use this to move your collection to another device or keep a local copy. Does not include the current unsaved tune.',
                    restore:'Loads garage saves and builds from a backup file. You can choose to restore only garage, only builds, or both. Does not affect the current unsaved tune.',
                  };
                  return<div style={{fontSize:10,color:'#94a3b8',lineHeight:1.6,marginBottom:12,letterSpacing:0.3}}>{hints[dataMode]}</div>;
                })()}

                {/* SHARE */}
                {dataMode==='share'&&(<>
                  <div style={{fontSize:9,letterSpacing:2,color:'#475569',marginBottom:6}}>INCLUDE</div>
                  {[
                    {key:'ch',label:'CHASSIS',sub:'Weight · bias · tyres · geometry · layout'},
                    {key:'fe',label:'FEEL',sub:'Ride · damping · ARB · balance'},
                    {key:'dr',label:'DRIVETRAIN',sub:'Build type · diff'},
                  ].map(({key,label,sub})=>chkRow(key,label,sub,shareSel[key],
                    e=>{setShareSel(s=>({...s,[key]:e.target.checked}));setShareCopied(false);}))}
                  <textarea readOnly value={sharePayload} rows={3} onFocus={e=>e.target.select()}
                    style={{width:'100%',background:'#020617',border:'1px solid #1e293b',borderRadius:2,
                            padding:'6px 8px',fontSize:10,color:'#e2e8f0',outline:'none',resize:'none',
                            fontFamily:'var(--font-mono)',letterSpacing:0.5,marginTop:10,marginBottom:6,cursor:'text'}}/>
                  <div style={{fontSize:9,color:'#475569',marginBottom:12,letterSpacing:0.5}}>
                    Paste into LOAD CODE on any device running SUSP.OS
                  </div>
                  <div style={{display:'flex',gap:6}}>
                    <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CLOSE</button>
                    <button className={`tbtn${shareCopied?' saved':' on'}`} style={{flex:1,fontSize:11}}
                      onClick={doCopy}>{shareCopied?'COPIED':'COPY'}</button>
                  </div>
                </>)}

                {/* LOAD CODE */}
                {dataMode==='load'&&(<>
                  <textarea value={importCode} onChange={e=>{setImportCode(e.target.value);setImportErr('');}}
                    placeholder="Paste tune code here…" rows={3}
                    style={{width:'100%',background:'#020617',border:'1px solid #1e293b',borderRadius:2,
                            padding:'6px 8px',fontSize:10,color:'#e2e8f0',outline:'none',resize:'none',
                            fontFamily:'var(--font-mono)',letterSpacing:0.5,marginBottom:10}}/>
                  {importErr&&<div style={{fontSize:9,color:'#f87171',marginBottom:8,letterSpacing:0.5}}>{importErr}</div>}
                  <div style={{fontSize:9,letterSpacing:2,color:'#475569',marginBottom:6}}>APPLY TO</div>
                  {[
                    {key:'ch',label:'CHASSIS',sub:'Weight · bias · tyres · geometry · layout'},
                    {key:'fe',label:'FEEL',sub:'Ride · damping · ARB · balance'},
                    {key:'dr',label:'DRIVETRAIN',sub:'Build type · diff'},
                  ].map(({key,label,sub})=>chkRow(key,label,sub,importSel[key],
                    e=>setImportSel(s=>({...s,[key]:e.target.checked}))))}
                  <div style={{display:'flex',gap:6,marginTop:14}}>
                    <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CANCEL</button>
                    <button className="tbtn on" style={{flex:1,fontSize:11}}
                      disabled={!importCode.trim()||(!importSel.ch&&!importSel.fe&&!importSel.dr)}
                      onClick={()=>{
                        const code=importCode.replace(/\s/g,'');
                        try{
                          const{ch:ic,fe:ife,dr:idr}=sanitizeTune(decodeTune(code));
                          if(importSel.ch) setCh({...DEF_CH,...ic});
                          if(importSel.fe) setFe({...DEF_FE,...ife});
                          if(importSel.dr) setDr({...DEF_DR,...idr});
                          close();
                        }catch(e){
                          console.error('Import failed:',e,code);
                          setImportErr('Invalid code — make sure you pasted the full string.');
                        }
                      }}>LOAD</button>
                  </div>
                </>)}

                {/* BACKUP */}
                {dataMode==='backup'&&(<>
                  <div style={{fontSize:9,color:'#475569',marginBottom:10,letterSpacing:0.5,lineHeight:1.5}}>
                    Download a JSON backup of your saved data. Use this to transfer between devices or browsers.
                  </div>
                  {[
                    {key:'garage',label:'GARAGE',sub:'Chassis saves'},
                    {key:'builds',label:'MY BUILDS',sub:'Tune saves'},
                  ].map(({key,label,sub})=>chkRow(key,label,sub,exportSel[key],
                    e=>setExportSel(s=>({...s,[key]:e.target.checked}))))}
                  <div style={{display:'flex',gap:6,marginTop:14}}>
                    <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CANCEL</button>
                    <button className="tbtn on" style={{flex:1,fontSize:11}}
                      disabled={!exportSel.garage&&!exportSel.builds}
                      onClick={()=>{
                        const out={};
                        if(exportSel.garage) out.garage=garage;
                        if(exportSel.builds) out.builds=myBuilds;
                        const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
                        const url=URL.createObjectURL(blob);
                        const a=document.createElement('a');
                        a.href=url;a.download='suspos-data.json';a.click();
                        URL.revokeObjectURL(url);
                        close();
                      }}>DOWNLOAD</button>
                  </div>
                </>)}

                {/* RESTORE */}
                {dataMode==='restore'&&(<>
                  {!restoreData&&(<>
                    <div style={{fontSize:9,color:'#475569',marginBottom:10,letterSpacing:0.5,lineHeight:1.5}}>
                      Load a suspos-data.json backup file to restore saved data.
                    </div>
                    {restoreErr&&<div style={{fontSize:9,color:'#f87171',marginBottom:8,letterSpacing:0.5}}>{restoreErr}</div>}
                    <div style={{display:'flex',gap:6,marginTop:4}}>
                      <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CANCEL</button>
                      <button className="tbtn on" style={{flex:1,fontSize:11}} onClick={()=>{
                        const inp=document.createElement('input');
                        inp.type='file';inp.accept='.json,application/json';
                        inp.onchange=e=>{
                          const file=e.target.files?.[0];
                          if(!file)return;
                          const reader=new FileReader();
                          reader.onload=ev=>{
                            try{
                              const parsed=JSON.parse(ev.target.result);
                              if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw new Error();
                              if(!Array.isArray(parsed.garage)&&!Array.isArray(parsed.builds))throw new Error();
                              setRestoreData(parsed);
                              setRestoreSel({garage:Array.isArray(parsed.garage),builds:Array.isArray(parsed.builds)});
                              setRestoreErr('');
                            }catch{setRestoreErr('Invalid backup file.');}
                          };
                          reader.readAsText(file);
                        };
                        inp.click();
                      }}>CHOOSE FILE</button>
                    </div>
                  </>)}
                  {restoreData&&(<>
                    <div style={{fontSize:9,color:'#475569',marginBottom:8,letterSpacing:0.5,lineHeight:1.5}}>
                      Select what to restore. This will overwrite your current saves.
                    </div>
                    {[
                      {key:'garage',label:'GARAGE',sub:'Chassis saves'},
                      {key:'builds',label:'MY BUILDS',sub:'Tune saves'},
                    ].map(({key,label,sub})=>chkRow(key,label,sub,restoreSel[key],
                      e=>setRestoreSel(s=>({...s,[key]:e.target.checked})),
                      !Array.isArray(restoreData[key])))}
                    <div style={{display:'flex',gap:6,marginTop:14}}>
                      <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CANCEL</button>
                      <button className="tbtn on" style={{flex:1,fontSize:11}}
                        disabled={!restoreSel.garage&&!restoreSel.builds}
                        onClick={()=>{
                          if(restoreSel.garage&&Array.isArray(restoreData.garage)) setGarage(restoreData.garage);
                          if(restoreSel.builds&&Array.isArray(restoreData.builds)) setMyBuilds(restoreData.builds);
                          close();
                        }}>RESTORE</button>
                    </div>
                  </>)}
                </>)}
              </div>
            </div>
            );
          })()}

          {/* PINNED — HANDLING BALANCE */}
          <div id="zone-balance-bar" style={{flexShrink:0,borderTop:'1px solid #1e293b',background:'#020617',
                                             paddingBottom:'env(safe-area-inset-bottom,0px)',...dim('balance-bar')}}>
            {/* compact header row — tap to expand */}
            <div className="collapsible-hdr"
                 onClick={()=>{
                   if(isPhone){
                     // On phones the tap reveals/hides the full bar stack (the summary line stays).
                     const next=!footerOpen;
                     setFooterOpen(next);
                     if(next){ if(!balTutSeen){setBalTutSeen(true);openBalTut();} }
                     else { setOpen(p=>({...p,balanceExpanded:false})); } // collapsing also hides the detail panel
                   } else {
                     setOpen(p=>{
                       const next=!p.balanceExpanded;
                       if(next&&!balTutSeen){setBalTutSeen(true);openBalTut();}
                       return{...p,balanceExpanded:next};
                     });
                   }
                 }}
                 style={{padding:isPhone?'10px 8px':'10px 14px',cursor:'pointer'}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:5}}>
                <div style={{display:'flex',alignItems:'center',gap:isPhone?5:8,flex:1,minWidth:0,overflow:'hidden'}}>
                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:2,flexShrink:0}}>HANDLING BALANCE</span>
                  <Hint text="Combined steady-state handling tendency from all tuning inputs. Positive (+) = oversteer tendency, negative (−) = understeer. Zero is weight-matched neutral — neither end saturates grip first. Tap to expand for contributor breakdown and actionable tip."/>
                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1,flexShrink:0}}>·</span>
                  <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,flexShrink:0,
                                color:Math.abs(bTotFull)<3?'#e2e8f0':bTotFull>0?'#ef4444':'#3b82f6'}}>
                    {`${bTotFull>=0?'+':''}${bTotFull.toFixed(1)}`}
                  </span>
                  {!isMobile&&<span style={{fontSize:11,letterSpacing:2,flexShrink:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',
                                color:Math.abs(bTotFull)<3?'#e2e8f0':bTotFull>0?'#ef4444':'#3b82f6'}}>
                    {Math.abs(bTotFull)<3?'NEUTRAL':bTotFull>0?'OVERSTEER':'UNDERSTEER'}
                  </span>}
                </div>
                <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
                  {uiMode==='pro'&&tune.mechBalance!=null&&<span style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#475569',letterSpacing:1,fontFamily:'var(--font-mono)'}}>
                    <span>MECH {tune.mechBalance.toFixed(2)}
                    {(()=>{const _d=tune.mechBalance-natMechBalance;const _a=Math.abs(_d);
                      if(_a<0.01)return null;
                      return <span style={{color:_d>0?'#60a5fa':'#f59e0b'}}>{(_d>=0?'+':'')+_d.toFixed(2)}</span>;
                    })()}</span>
                    <Hint text="Mech Balance is the rear fraction of total roll stiffness (0 = all front, 1 = all rear, 0.5 = even split). This matches Forza's in-game mech balance display. The delta shows how far your setup has shifted from the car's natural balance — blue means more rear-biased than natural, amber means more front-biased."/>
                  </span>}
                  <span style={{fontSize:10,color:'#94a3b8'}}>
                    {(isPhone?footerOpen:open.balanceExpanded)?'▲':'▼'}
                  </span>
                </div>
              </div>
              {/* Bar stack — always shown on desktop; on phones it collapses behind the summary line. */}
              {(!isPhone||footerOpen)&&<>
              {/* compact stacked balance bar — each contributor rendered as a segment from centre */}
              {(()=>{
                const cl=v=>Math.max(-50,Math.min(50,v));
                const allSegs=[
                  {key:'sp', val:tune.bSp??0,   col:'#60a5fa'},  // springs — blue family
                  {key:'ab', val:tune.bAb??0,   col:'#818cf8'},  // ARBs — indigo
                  {key:'df', val:(diff.bDiffAccel??0)+(diff.bDiffDecel??0), col:'#f59e0b'}, // diff — amber
                  {key:'br', val:bBrakeEntry,   col:'#34d399'},  // brakes — green
                  {key:'dm', val:bDampBias,      col:'#a78bfa'},  // damping — violet
                ].filter(s=>Math.abs(s.val)>0.3);
                // Build segments left→right; each stacks outward from the previous
                // Negative segs grow leftward from centre, positive grow rightward
                let posOffset=0, negOffset=0;
                return(
                  <div style={{position:'relative',height:16,background:'#0a0f1a',border:'1px solid #1e293b',
                               borderRadius:2,overflow:'hidden'}}>
                    {/* zone shading */}
                    <div style={{position:'absolute',left:'5%', width:'20%',top:0,bottom:0,background:'#3b82f614'}}/>
                    <div style={{position:'absolute',left:'25%',width:'20%',top:0,bottom:0,background:'#3b82f608'}}/>
                    <div style={{position:'absolute',left:'55%',width:'20%',top:0,bottom:0,background:'#ef444408'}}/>
                    <div style={{position:'absolute',left:'75%',width:'15%',top:0,bottom:0,background:'#f9731614'}}/>
                    <div style={{position:'absolute',left:'90%',width:'10%',top:0,bottom:0,background:'#ef444422'}}/>
                    <div style={{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'#334155'}}/>
                    {allSegs.map(({key,val,col})=>{
                      const p=cl(val);
                      if(p>=0){
                        const seg={position:'absolute',top:2,bottom:2,borderRadius:1,
                          left:`${50+posOffset}%`,width:`${p}%`,
                          background:col+'bb'};
                        posOffset+=p;
                        return <div key={key} style={seg}/>;
                      } else {
                        const seg={position:'absolute',top:2,bottom:2,borderRadius:1,
                          right:`${50+negOffset}%`,width:`${-p}%`,
                          background:col+'bb'};
                        negOffset+=(-p);
                        return <div key={key} style={seg}/>;
                      }
                    })}
                    <div style={{position:'absolute',left:5,top:'50%',transform:'translateY(-50%)',
                                 fontSize:10,color:'#3b82f6',letterSpacing:1,fontWeight:700}}>US</div>
                    <div style={{position:'absolute',right:5,top:'50%',transform:'translateY(-50%)',
                                 fontSize:10,color:'#ef4444',letterSpacing:1,fontWeight:700}}>OS</div>
                  </div>
                );
              })()}
              {/* stacked bar legend — immediately below the bar it describes */}
              <div style={{display:'flex',gap:8,marginTop:3,paddingLeft:2,alignItems:'center',flexWrap:'wrap'}}>
                {[
                  {key:'sp',col:'#60a5fa',label:'SPR',  val:tune.bSp??0},
                  {key:'ab',col:'#818cf8',label:'ARB',  val:tune.bAb??0},
                  {key:'df',col:'#f59e0b',label:'DIFF', val:(diff.bDiffAccel??0)+(diff.bDiffDecel??0)},
                  {key:'br',col:'#34d399',label:'BRK',  val:bBrakeEntry},
                  {key:'dm',col:'#a78bfa',label:'DAMP', val:bDampBias},
                ].filter(s=>Math.abs(s.val)>0.3).map(({key,col,label})=>(
                  <span key={key} style={{display:'flex',alignItems:'center',gap:3,fontSize:10,color:'#94a3b8'}}>
                    <span style={{display:'inline-block',width:8,height:4,borderRadius:1,background:col+'bb',flexShrink:0}}/>
                    {label}
                  </span>
                ))}
                <Hint text="Stacked bar shows each contributor as a coloured segment: SPR (springs), ARB (anti-roll bars), DIFF (differential), BRK (brakes), DAMP (damping bias). Segments stack outward from neutral — the bar's total reach is the combined handling balance."/>
              </div>
              {/* mech balance reference strip: NAT · CURRENT · TARGET on 0–1 scale */}
              {uiMode==='pro'&&tune.mechBalance!=null&&(()=>{
                const cur=tune.mechBalance;
                const nat=natMechBalance;
                const tgt=feEffective.arbBalTarget??MECH_BALANCE_TARGET;
                const pct=v=>`${Math.max(0,Math.min(100,v*100)).toFixed(1)}%`;
                const showTgt=(physics.arbMode!=='man'&&(physics.arbBalMode==='mech'||physics.arbBalMode==='coSolve'))||(physics.arbMode==='man'&&physics.rearHzMode==='mech');
                const _d=cur-nat;
                return(
                  <div style={{marginTop:8}}>
                    {/* label row: section header + inline NAT/CUR/TGT values */}
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:3}}>
                      <span style={{fontSize:10,color:'#475569',letterSpacing:2}}>MECH BALANCE</span>
                      <Hint text="Roll stiffness rear fraction on the 0–1 scale. NAT is the car's natural balance with equal spring rates and no ARBs. CUR is where your current setup lands. TGT (shown in MECH/CO-SOLVE modes) is the balance you are targeting. The band between NAT and CUR shows how much correction your setup applies."/>
                      <span style={{fontSize:10,color:'#475569',letterSpacing:1}}>·</span>
                      <span style={{fontSize:10,color:'#475569',fontFamily:'var(--font-mono)'}}>
                        NAT <span style={{color:'#94a3b8'}}>{nat.toFixed(2)}</span>
                      </span>
                      <span style={{fontSize:10,color:'#334155'}}>→</span>
                      <span style={{fontSize:10,color:'#475569',fontFamily:'var(--font-mono)'}}>
                        CUR <span style={{color:'#e2e8f0'}}>{cur.toFixed(2)}</span>
                        {Math.abs(_d)>=0.01&&<span style={{color:_d>0?'#60a5fa':'#f59e0b',marginLeft:2}}>
                          {(_d>=0?'+':'')+_d.toFixed(2)}
                        </span>}
                      </span>
                      {showTgt&&<>
                        <span style={{fontSize:10,color:'#334155'}}>→</span>
                        <span style={{fontSize:10,color:'#60a5fa88',fontFamily:'var(--font-mono)'}}>
                          TGT <span style={{color:'#60a5fa'}}>{tgt.toFixed(2)}</span>
                        </span>
                      </>}
                    </div>
                    <div style={{position:'relative',height:8,background:'#0a0f1a',
                                 border:'1px solid #1e293b',borderRadius:2}}>
                      {/* filled band from NAT to CURRENT */}
                      {(()=>{
                        const lo=Math.min(nat,cur),hi=Math.max(nat,cur);
                        return lo<hi&&<div style={{position:'absolute',top:1,bottom:1,
                          left:pct(lo),width:pct(hi-lo),background:'#1e293b',borderRadius:1}}/>;
                      })()}
                      {/* NAT tick */}
                      <div style={{position:'absolute',top:0,bottom:0,left:pct(nat),width:1,
                                   background:'#475569',transform:'translateX(-50%)'}}/>
                      {/* TARGET tick — only shown in MECH/CO-SOLVE */}
                      {showTgt&&<div style={{position:'absolute',top:0,bottom:0,left:pct(tgt),width:2,
                                            background:'#60a5fa99',transform:'translateX(-50%)',borderRadius:1}}/>}
                      {/* CURRENT position */}
                      <div style={{position:'absolute',top:0,bottom:0,left:pct(cur),width:2,
                                   background:'#e2e8f0cc',transform:'translateX(-50%)',borderRadius:1}}/>
                      <span style={{position:'absolute',left:3,top:'50%',transform:'translateY(-50%)',
                                    fontSize:8,color:'#1e293b',letterSpacing:1}}>F</span>
                      <span style={{position:'absolute',right:3,top:'50%',transform:'translateY(-50%)',
                                    fontSize:8,color:'#1e293b',letterSpacing:1}}>R</span>
                    </div>
                  </div>
                );
              })()}
              {/* response bar */}
              {(()=>{
                const{score}=responseFactors;
                const p=Math.max(-50,Math.min(50,(score-0.5)*100));
                const aLabel=Math.abs(p)<15?'BALANCED':p>0?'REACTIVE':'PLANTED';
                const aCol=Math.abs(p)<15?'#475569':p>0?'#f59e0b':'#22c55e';
                const fs=p>=0?{left:'50%',width:`${p}%`}:{left:`${50+p}%`,width:`${-p}%`};
                return(<>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginTop:8,marginBottom:3}}>
                    <span style={{fontSize:10,color:'#475569',letterSpacing:2}}>RESPONSE</span>
                    <Hint text="Transient response character — how quickly and freely the car reacts to steering inputs. PLANTED (left) means settled and damped: the car resists sudden direction changes but feels stable and predictable. REACTIVE (right) means quick to respond: the car turns in immediately but can feel nervous. Driven by front Hz (35%), front damping (12%), rear Hz (20%), rear damping (8%), toe (15%), and caster (10%). Independent of handling balance — a car can be neutral and still feel very planted or very reactive."/>
                    <span style={{fontSize:10,color:'#475569',letterSpacing:1}}>·</span>
                    <span style={{fontFamily:'var(--font-mono)',fontSize:11,fontWeight:700,color:aCol}}>
                      {`${p>=0?'+':''}${Math.round(p)}`}
                    </span>
                    <span style={{fontSize:10,letterSpacing:2,color:aCol}}>{aLabel}</span>
                  </div>
                  <div style={{position:'relative',height:14,background:'#0a0f1a',border:'1px solid #1e293b',
                               borderRadius:2,overflow:'hidden'}}>
                    {/* zone shading: planted | balanced | responsive | twitchy */}
                    <div style={{position:'absolute',left:'0%',  width:'20%',top:0,bottom:0,background:'#22c55e14'}}/>
                    <div style={{position:'absolute',left:'20%', width:'30%',top:0,bottom:0,background:'#22c55e08'}}/>
                    <div style={{position:'absolute',left:'55%', width:'25%',top:0,bottom:0,background:'#f59e0b08'}}/>
                    <div style={{position:'absolute',left:'80%', width:'20%',top:0,bottom:0,background:'#f59e0b18'}}/>
                    <div style={{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'#1e293b'}}/>
                    {p!==0&&<div style={{position:'absolute',top:2,bottom:2,borderRadius:1,
                                        background:p>0?'#f59e0b55':'#22c55e55',...fs}}/>}
                    <div style={{position:'absolute',left:5,top:'50%',transform:'translateY(-50%)',
                                 fontSize:10,color:'#22c55e',letterSpacing:1,fontWeight:700}}>PLANTED</div>
                    <div style={{position:'absolute',right:5,top:'50%',transform:'translateY(-50%)',
                                 fontSize:10,color:'#f59e0b',letterSpacing:1,fontWeight:700}}>REACTIVE</div>
                  </div>
                </>);
              })()}
              {/* phones: reach the full contributor breakdown + actionable tip (desktop taps the header for this) */}
              {isPhone&&<div style={{display:'flex',justifyContent:'center',marginTop:8}}>
                <button onClick={e=>{e.stopPropagation();setOpen(p=>({...p,balanceExpanded:!p.balanceExpanded}));}}
                  style={{background:'none',border:'1px solid #1e293b',borderRadius:2,color:'#94a3b8',
                          fontFamily:'var(--font-mono)',fontSize:10,padding:'5px 14px',cursor:'pointer',letterSpacing:1}}>
                  {open.balanceExpanded?'HIDE CONTRIBUTIONS ▲':'CONTRIBUTIONS ▼'}
                </button>
              </div>}
              </>}
            </div>
            {/* expanded full verdict */}
            {open.balanceExpanded&&
              <div style={{padding:'0 14px 12px',borderTop:'1px solid #0f172a'}}>
                <div style={{display:'flex',justifyContent:'flex-end',gap:4,padding:'6px 0 4px'}}>
                  {(()=>{
                    const bs={background:'none',border:'1px solid #1e293b',borderRadius:2,
                      fontFamily:'var(--font-mono)',fontSize:10,padding:'3px 8px',cursor:'pointer',letterSpacing:1};
                    return(<>
                      <button style={{...bs,color:'#94a3b8'}} onClick={e=>{e.stopPropagation();openBalTut();}}>? GUIDE</button>
                      {isPhone&&<button style={{...bs,color:'#94a3b8'}} onClick={e=>{e.stopPropagation();setOpen(p=>({...p,balanceExpanded:false}));}}>✕ CLOSE</button>}
                    </>);
                  })()}
                </div>
                {/* cap expanded height on all devices — ensures LOAD TRANSFER is reachable on short screens */}
                <div style={{maxHeight:isPhone?'42vh':'60vh',overflowY:'auto',overflowX:'hidden',overscrollBehavior:'contain',WebkitOverflowScrolling:'touch'}}>
                <HandlingVerdict total={bTotFull} bSp={tune.bSp} bAb={tune.bAb}
                  bDiffAccel={diff.bDiffAccel} bDiffDecel={diff.bDiffDecel}
                  bDiffFront={diff.bDiffFront} bDiffRear={diff.bDiffRear}
                  diffLayout={diff.layout}
                  bBrakeEntry={bBrakeEntry} bDampBias={bDampBias}
                  gripBalance={tune.gripBalance} uiMode={uiMode}
                  settleDamping={(fe.dampCharMode??'zeta')==='settle'||!!(fe.settleMode)}/>
                {/* RESPONSE factor breakdown */}
                {(()=>{
                  const{score,fHzNorm,rHzNorm,dampFNorm,dampRNorm,toeNorm,casterNorm}=responseFactors;
                  const segs=[
                    {label:'Hz F',    norm:fHzNorm,        weight:0.35,hint:'Front ride frequency — higher Hz = faster initial turn-in response. Primary driver of transient character.'},
                    {label:'DAMP F',  norm:1-dampFNorm,    weight:0.12,hint:'Front rebound damping — lower = less resistance to roll initiation = sharper turn-in. Higher = more planted entry.'},
                    {label:'Hz R',    norm:rHzNorm,        weight:0.20,hint:'Rear ride frequency — higher Hz = quicker rear body control and rotation feel.'},
                    {label:'DAMP R',  norm:1-dampRNorm,    weight:0.08,hint:'Rear rebound damping — lower = more rotation freedom and rear agility. Higher = more planted rear.'},
                    {label:'TOE F',   norm:toeNorm,        weight:0.15,hint:'Front toe-out sharpens turn-in response (agile). Toe-in adds straight-line stability.'},
                    {label:'CASTER',  norm:casterNorm,     weight:0.10,hint:'Lower caster reduces self-centering force, allowing quicker steering response.'},
                  ].map(s=>({...s,
                    // weighted deviation from neutral: positive = pushing agile, negative = pushing stable
                    deviation:(s.norm-0.5)*s.weight,
                  }));
                  const domSorted=[...segs].sort((a,b)=>Math.abs(b.deviation)-Math.abs(a.deviation));
                  const dom=domSorted[0];
                  const domBig=Math.abs(dom.deviation)>0.05;
                  const agileP=Math.round((score-0.5)*100);
                  const aCol=Math.abs(agileP)<15?'#94a3b8':agileP>0?'#f59e0b':'#22c55e';
                  const totalAbsDev=segs.reduce((s,x)=>s+Math.abs(x.deviation),0);
                  const tips={
                    'Hz F':   agileP>0?'Soften front springs (lower Hz) for a more planted entry feel.':'Stiffen front springs to sharpen initial turn-in response.',
                    'DAMP F': agileP>0?'Increase front rebound damping to settle entry more firmly.':'Reduce front rebound damping to free up initial roll response.',
                    'Hz R':   agileP>0?'Soften rear springs (lower Hz) to reduce rotation tendency.':'Stiffen rear springs to improve rear body control and rotation speed.',
                    'DAMP R': agileP>0?'Increase rear rebound damping to plant the rear more firmly.':'Reduce rear rebound damping for more rotation freedom.',
                    'TOE F':  agileP>0?'Add front toe-in to improve straight-line stability.':'Reduce front toe-in to sharpen turn-in response.',
                    CASTER:   agileP>0?'Increase caster for stronger self-centering and stability.':'Reduce caster for lighter, quicker steering response.',
                  };
                  const tip=Math.abs(agileP)<15
                    ?'Transient response is balanced.'+(domBig?' '+dom.label+' is the primary character driver.':'')
                    :domBig?(tips[dom.label]||'Adjust the dominant factor.'):'Setup is near balanced.';
                  return(
                    <div style={{marginTop:10,paddingTop:8,borderTop:'1px solid #0f172a'}}>
                      <div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6,padding:'6px 8px',marginBottom:8,
                                   background:'#020617',borderRadius:2,border:'1px solid #0f172a'}}>{tip}</div>
                      {segs.map(({label,deviation,hint})=>{
                        // bar: deviation scaled so ±0.25 (max spring deviation) = ±50%
                        const barPct=Math.min(50,Math.abs(deviation)/0.25*50);
                        const barStyle=deviation>=0?{left:'50%',width:`${barPct}%`}:{right:'50%',width:`${barPct}%`};
                        const c=deviation>0.02?'#f59e0b':deviation<-0.02?'#22c55e':'#cbd5e1';
                        const pctOfTotal=totalAbsDev>0.01?Math.round(Math.abs(deviation)/totalAbsDev*100):null;
                        const isDom=label===dom.label&&domBig;
                        return(
                          <div key={label} style={{display:'flex',alignItems:'center',gap:6,marginBottom:3,
                                   ...(isDom?{background:'#0a0f1a',
                                     borderLeft:'2px solid '+(deviation>0?'#f59e0b66':'#22c55e66'),
                                     borderRadius:2,padding:'3px 0 3px 4px',margin:'0 -2px 3px -4px'}:{})}}>
                            <div style={{width:80,display:'flex',alignItems:'center',gap:2,flexShrink:0}}>
                              <span style={{fontSize:10,color:isDom?'#cbd5e1':'#94a3b8',letterSpacing:1,
                                             whiteSpace:'nowrap',fontWeight:isDom?700:400}}>{label}</span>
                              <Hint text={hint}/>
                            </div>
                            <div style={{flex:1,position:'relative',height:8,background:'#0f172a',borderRadius:2}}>
                              <div style={{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'#1e293b'}}/>
                              {barPct>1&&<div style={{position:'absolute',top:1,bottom:1,borderRadius:1,
                                background:c+(isDom?'ee':'99'),...barStyle}}/>}
                            </div>
                            <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:c,width:34,
                                           textAlign:'right',flexShrink:0,fontWeight:isDom?700:400}}>
                              {deviation>=0?'+':''}{(deviation*100).toFixed(1)}
                            </span>
                            <span style={{fontSize:10,color:pctOfTotal>40?c:'#475569',width:28,textAlign:'right',flexShrink:0}}>
                              {pctOfTotal!=null?`${pctOfTotal}%`:''}
                            </span>
                          </div>
                        );
                      })}
                      <div style={{fontSize:10,color:'#475569',lineHeight:1.5,marginTop:4}}>
                        Transient response factors. Higher Hz and lower damping shift toward reactive.
                      </div>
                    </div>
                  );
                })()}
                {uiMode==='pro'&&(()=>{
                  const xferF=2*cm.front*ch.cgHeight/ch.trackF;
                  const xferR=2*cm.rear*ch.cgHeight/ch.trackR;
                  const Row=({la,lv,ra,rv,dim,last})=>(
                    <div style={{display:'flex',alignItems:'center',gap:6,padding:'2px 8px',
                                 ...(last?{}:{borderBottom:'1px solid #0f172a'}),
                                 opacity:dim?0.55:1}}>
                      <span style={{fontSize:9,color:'#475569',letterSpacing:1,minWidth:54}}>{la}</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#64748b'}}>{lv}</span>
                      <div style={{flex:1,height:1,background:'#0f172a'}}/>
                      <span style={{fontSize:9,color:'#475569',letterSpacing:1}}>{ra}</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#64748b'}}>{rv}</span>
                    </div>
                  );
                  return(
                    <div style={{marginTop:10,paddingTop:8,borderTop:'1px solid #0f172a'}}>
                      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                        <span style={{fontSize:9,color:'#334155',letterSpacing:2}}>LOAD TRANSFER</span>
                        <Hint text="Corner weights and lateral load transfer at 1g cornering. CORNER WT: static per-corner mass from weight and bias. XFER: total axle load transfer per g — how much weight shifts to the outer tyre under cornering. OUT/IN: outer and inner wheel loads at 1g. Wider track and lower CG reduce transfer. High XFER calls for stiffer ARBs and more outer camber to compensate."/>
                      </div>
                      <div style={{border:'1px solid #0f172a',borderRadius:2,overflow:'hidden'}}>
                        <Row la="F CORNER" lv={dispMass(cm.front)} ra="R CORNER" rv={dispMass(cm.rear)} dim/>
                        <Row la="XFER F" lv={`${dispMass(xferF)}/g`} ra="XFER R" rv={`${dispMass(xferR)}/g`}/>
                        <Row la="OUT F" lv={dispMass(cm.front+xferF)} ra="OUT R" rv={dispMass(cm.rear+xferR)}/>
                        <Row la="IN F" lv={dispMass(Math.max(0,cm.front-xferF))} ra="IN R" rv={dispMass(Math.max(0,cm.rear-xferR))} last/>
                      </div>
                    </div>
                  );
                })()}
                </div>
              </div>}
          </div>

        </div>{/* end output panel */}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
</script>
<script>
(function(){
  var preload=document.getElementById('pre-load');
  function showError(msg,detail){
    if(preload){
      preload.style.display='block';
      preload.innerHTML='<div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">SUSP.OS \u2014 Failed to load</div>'
        +'<div style="color:#6b7280;margin-bottom:12px">'+msg+'</div>'
        +'<div style="background:#0f172a;padding:12px;border-radius:4px;color:#ef4444;word-break:break-all;line-height:1.6;font-size:11px">'+(detail||'')+'</div>'
        +'<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#0f172a;border:1px solid #1e293b;color:#e2e8f0;border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-size:12px">RELOAD</button>';
    }
  }
  try{
    if(typeof Babel==='undefined'){showError('Babel failed to load','Check your internet connection and reload.');return;}
    var src=document.getElementById('app-source').textContent;
    var compiled;
    try{
      compiled=Babel.transform(src,{
        presets:['env','react'],
        plugins:['transform-optional-chaining','transform-nullish-coalescing-operator','transform-logical-assignment-operators'],
        filename:'susp-os.jsx'
      }).code;
    }catch(e){
      showError('Babel compilation failed',e.message||String(e));
      return;
    }
    // Use indirect eval so errors are catchable on all browsers including iOS WebKit.
    // Direct script injection loses the error context on WebKit.
    try{
      (0,eval)(compiled);
    }catch(e){
      showError('Runtime error',e.message||String(e));
    }
  }catch(e){
    showError('Load failed',e.message||String(e));
  }
})();
</script>
</body>
</html>

const GAME_MODE_ENC={'horizon':0,'motorsport':1};
const GAME_MODE_DEC=['horizon','motorsport'];
const DAMPING_MODE_ENC={'ratio':0,'independent':1};
const DAMPING_MODE_DEC=['ratio','independent'];
const REAR_HZ_MODE_ENC={'flatRide':0,'independent':1,'multiplier':2,'mech':3};
const REAR_HZ_MODE_DEC=['flatRide','independent','multiplier','mech'];
const ARB_MODE_ENC={'auto':0,'roll':1,'share':2,'man':4,'basic':5};
const ARB_MODE_DEC=['auto','roll','share','auto','man','basic']; // index 3 was legacy 'balance' → auto; index 4 = MAN (moved from ARB_BAL_MODE — see sanitizeTune migration)
const ARB_BAL_MODE_ENC={'weight':0,'mech':1,'coSolve':2,'man':3,'neutral':4,'chassis':5,'manual':6};
const ARB_BAL_MODE_DEC=['weight','mech','coSolve','man','neutral','chassis','manual']; // 'man' kept for old-code decode only — see sanitizeTune migration
// 'manual': invisible placeholder used when Stiffness Mode is MAN — behaves identically to
// 'weight' everywhere (see feelToPhysics/computeTune) but never lights up a Balance Mode
// button, so switching Stiffness Mode away from MAN doesn't look like the user chose WEIGHT.
const RIDE_REF_ENC={'front':0,'rear':1,'shared':2};
const RIDE_REF_DEC=['front','rear','shared'];
const LAYOUT_ENC={'FWD':0,'RWD':1,'AWD':2};
const LAYOUT_DEC=['FWD','RWD','AWD'];
const BUILD_ENC={'street':0,'track':1,'drift':2,'rally':3,'offroad':4,'drag':5};
const BUILD_DEC=['street','track','drift','rally','offroad','drag'];

// ── Share codec ──────────────────────────────────────────────────────────
// Single source of truth: each live field is one entry below (stable id,
// never reassigned once shipped — retire dead ids by deleting the entry,
// never reuse the number). encodeTune/decodeTune are generic loops over
// this table, so adding a field later never touches existing codes or
// requires a length guard — codes are sparse "id:value" pairs, defaults
// are omitted, and unknown ids are ignored on decode (forward-compatible).
const CODEC_VERSION=1;
const DEF_GROUPS={ch:DEF_CH,fe:DEF_FE,dr:DEF_DR};
const CODEC_FIELDS=[
  {id:1, group:'ch',key:'weight'},
  {id:2, group:'ch',key:'frontBias'},
  {id:3, group:'ch',key:'wheelbase'},
  {id:4, group:'ch',key:'cgHeight'},
  {id:5, group:'ch',key:'trackF'},
  {id:6, group:'ch',key:'trackR'},
  {id:7, group:'fe',key:'rideStiffness'},
  {id:8, group:'fe',key:'arbBias'},
  {id:9, group:'fe',key:'targetSpeed'},
  {id:10,group:'fe',key:'gameMode',enc:GAME_MODE_ENC,dec:GAME_MODE_DEC},
  {id:11,group:'fe',key:'dampingMode',enc:DAMPING_MODE_ENC,dec:DAMPING_MODE_DEC},
  {id:12,group:'fe',key:'reboundZeta'},
  {id:13,group:'fe',key:'bumpRatio'},
  {id:14,group:'fe',key:'bumpZeta'},
  {id:15,group:'fe',key:'arbMode',enc:ARB_MODE_ENC,dec:ARB_MODE_DEC},
  {id:16,group:'fe',key:'arbTargetRollMan'},
  {id:17,group:'fe',key:'arbShareMan'},
  {id:57,group:'fe',key:'arbBasicMan'},
  {id:18,group:'ch',key:'layout',enc:LAYOUT_ENC,dec:LAYOUT_DEC},
  {id:19,group:'dr',key:'buildType',enc:BUILD_ENC,dec:BUILD_DEC},
  {id:20,group:'dr',key:'diffManual',bool:true},
  {id:21,group:'dr',key:'diffBiasExit'},
  {id:22,group:'dr',key:'diffAccel'},
  {id:23,group:'dr',key:'diffDecel'},
  {id:24,group:'dr',key:'diffFrontAccel'},
  {id:25,group:'dr',key:'diffFrontDecel'},
  {id:26,group:'dr',key:'diffRearAccel'},
  {id:27,group:'dr',key:'diffRearDecel'},
  {id:28,group:'dr',key:'diffCenter'},
  {id:29,group:'dr',key:'diffBiasEntry'},
  {id:30,group:'fe',key:'rearHzMode',enc:REAR_HZ_MODE_ENC,dec:REAR_HZ_MODE_DEC},
  {id:31,group:'fe',key:'rearHzMan'},
  {id:32,group:'fe',key:'rearHzMult'},
  {id:33,group:'fe',key:'dampingBias'},
  {id:34,tyre:'F',part:'width',def:265},
  {id:35,tyre:'R',part:'width',def:265},
  {id:36,tyre:'F',part:'aspectRatio',def:35},
  {id:37,tyre:'F',part:'rimDiameter',def:18},
  {id:38,tyre:'R',part:'aspectRatio',def:35},
  {id:39,tyre:'R',part:'rimDiameter',def:18},
  {id:40,group:'fe',key:'arbBalTarget'},
  {id:41,group:'fe',key:'arbBalMode',enc:ARB_BAL_MODE_ENC,dec:ARB_BAL_MODE_DEC},
  {id:42,group:'dr',key:'diffFrontExitBias'},
  {id:43,group:'fe',key:'springShare'},
  {id:44,group:'fe',key:'rideRef',enc:RIDE_REF_ENC,dec:RIDE_REF_DEC},
  {id:45,group:'dr',key:'diffComplement',bool:true},
  {id:46,group:'fe',key:'arbManF'},
  {id:47,group:'fe',key:'arbManR'},
  {id:48,group:'fe',key:'settleBias'},
  {id:49,group:'fe',key:'settleMode',bool:true},
  {id:50,group:'fe',key:'settleTarget'},
  {id:51,group:'fe',key:'dampCharMode',enc:{zeta:0,settle:1},dec:['zeta','settle']},
  {id:52,group:'dr',key:'diffType',enc:DIFF_TYPE_ENC,dec:DIFF_TYPE_DEC},
  {id:53,group:'fe',key:'arbBalTargetMode',enc:{manual:0,grip:1},dec:['manual','grip']},
  {id:54,group:'fe',key:'arbBalDelta'},
  {id:55,group:'fe',key:'springShareAuto',bool:true},
  {id:56,group:'fe',key:'arbSplitOpposite',bool:true},
  // Retired ids — never reuse: none yet (dead fields removed pre-v1 never had an id).
];
const codecFieldDefault=f=>f.tyre?f.def:DEF_GROUPS[f.group][f.key];
const codecReadField=(src,f)=>{
  if(f.tyre){
    const t=parseTyre(f.tyre==='F'?src.ch.tyreF:src.ch.tyreR);
    return t?.[f.part]??f.def;
  }
  return src[f.group][f.key];
};

const encodeTune=(ch,fe,dr)=>{
  const src={ch,fe,dr};
  const same=(a,b)=>typeof a==='number'&&typeof b==='number'?Math.abs(a-b)<1e-9:a===b;
  const parts=[CODEC_VERSION];
  for(const f of CODEC_FIELDS){
    const enc=x=>f.enc?f.enc[x]:(f.bool?(x?1:0):x);
    const raw=enc(codecReadField(src,f)), defRaw=enc(codecFieldDefault(f));
    if(same(raw,defRaw))continue;
    parts.push(`${f.id}:${raw}`);
  }
  return btoa(parts.join('|'));
};

const decodeTune=(code)=>{
  const parts=atob(code.trim()).split('|');
  const version=parseInt(parts[0],10);
  if(version!==CODEC_VERSION)throw new Error('Outdated or invalid tune code — ask for a new one.');
  const ch={},fe={},dr={};
  const tyreParts={F:{},R:{}};
  const dest=f=>f.group==='ch'?ch:f.group==='fe'?fe:dr;
  for(const f of CODEC_FIELDS){
    if(f.tyre)tyreParts[f.tyre][f.part]=f.def;
    else dest(f)[f.key]=codecFieldDefault(f);
  }
  for(let i=1;i<parts.length;i++){
    const ci=parts[i].indexOf(':');
    if(ci<0)continue;
    const id=Number(parts[i].slice(0,ci)),raw=parts[i].slice(ci+1);
    const f=CODEC_FIELDS.find(x=>x.id===id);
    if(!f)continue; // unknown id (e.g. from a newer app version) — safely ignored
    const val=f.enc?(f.dec[Number(raw)]??codecFieldDefault(f)):(f.bool?raw==='1':Number(raw));
    if(f.tyre)tyreParts[f.tyre][f.part]=val;
    else dest(f)[f.key]=val;
  }
  ch.tyreF=`${tyreParts.F.width}/${tyreParts.F.aspectRatio}R${tyreParts.F.rimDiameter}`;
  ch.tyreR=`${tyreParts.R.width}/${tyreParts.R.aspectRatio}R${tyreParts.R.rimDiameter}`;
  return{ch,fe,dr};
};

const sanitizeTune=({ch,fe,dr})=>{
  const n=(v,def)=>(typeof v==='number'&&isFinite(v))?v:def;
  const cl=(v,lo,hi,def)=>Math.max(lo,Math.min(hi,n(v,def)));
  return{
    ch:{
      weight:       cl(ch?.weight,        100,  18000, DEF_CH.weight),
      frontBias:    cl(ch?.frontBias,      30,   70,   DEF_CH.frontBias),
      wheelbase:    cl(ch?.wheelbase,      0.4,  4.0,  DEF_CH.wheelbase),
      cgHeight:     cl(ch?.cgHeight,       0.2,  0.9,  DEF_CH.cgHeight),
      trackF:       cl(ch?.trackF,         1.0,  2.2,  DEF_CH.trackF),
      trackR:       cl(ch?.trackR,         1.0,  2.2,  DEF_CH.trackR),
      tyreF: parseTyre(ch?.tyreF)?ch.tyreF:DEF_CH.tyreF,
      tyreR: parseTyre(ch?.tyreR)?ch.tyreR:DEF_CH.tyreR,
      layout:       LAYOUT_DEC.includes(ch?.layout)?ch.layout:DEF_CH.layout,
    },
    fe:{
      rideStiffness:    (()=>{const rs=n(fe?.rideStiffness,DEF_FE.rideStiffness);const hz=rs>6?0.8+(rs/100)*2.7:rs;return Math.max(HZ_MIN,Math.min(HZ_MAX,Math.round(hz*100)/100));})(),
      arbBias:          cl(fe?.arbBias,          -50,   50,  DEF_FE.arbBias),
      arbBalTarget:     fe?.arbBalTarget==null?null:cl(fe.arbBalTarget,-0.70,0.70,0),
      arbBalMode:       (()=>{
                          const bm=ARB_BAL_MODE_DEC.includes(fe?.arbBalMode)?fe.arbBalMode:DEF_FE.arbBalMode;
                          // MAN moved from Balance Mode to Stiffness Mode (arbMode) — old saves/share
                          // codes with arbBalMode:'man' fall back to the invisible 'manual' placeholder
                          // here; the arbMode migration below picks up the actual MAN behavior so old
                          // manual-click tunes still work.
                          return bm==='man'?'manual':bm;
                        })(),
      springShare:      cl(fe?.springShare,         0,  100, DEF_FE.springShare),
      springShareAuto:  fe?.springShareAuto!==false,
      arbSplitOpposite: !!fe?.arbSplitOpposite,
      dampingBias:      cl(fe?.dampingBias,      -50,   50,  DEF_FE.dampingBias),
      targetSpeed:      cl(fe?.targetSpeed,       60,  200,  DEF_FE.targetSpeed),
      gameMode:         GAME_MODE_DEC.includes(fe?.gameMode)?fe.gameMode:DEF_FE.gameMode,
      dampingMode:      DAMPING_MODE_DEC.includes(fe?.dampingMode)?fe.dampingMode:DEF_FE.dampingMode,
      reboundZeta:      cl(fe?.reboundZeta,       10,  115,  DEF_FE.reboundZeta),
      bumpRatio:        cl(fe?.bumpRatio,         10,  100,  DEF_FE.bumpRatio),
      bumpZeta:         cl(fe?.bumpZeta,          10,  115,  DEF_FE.bumpZeta),
      arbMode:          (()=>{
                          const am=ARB_MODE_DEC.includes(fe?.arbMode)?fe.arbMode:DEF_FE.arbMode;
                          // Migrate old saves/share codes where MAN was a Balance Mode value.
                          return (am===DEF_FE.arbMode&&fe?.arbBalMode==='man')?'man':am;
                        })(),
      arbTargetRollMan: cl(fe?.arbTargetRollMan,  0.3,  5.0, DEF_FE.arbTargetRollMan),
      arbShareMan:      cl(fe?.arbShareMan,        0,   80,  DEF_FE.arbShareMan),
      arbBasicMan:      cl(fe?.arbBasicMan,        0,  100,  DEF_FE.arbBasicMan),
      rearHzMode:       REAR_HZ_MODE_DEC.includes(fe?.rearHzMode)?fe.rearHzMode:DEF_FE.rearHzMode,
      rearHzMan:        cl(fe?.rearHzMan,          HZ_MIN, HZ_MAX, DEF_FE.rearHzMan),
      rearHzMult:       cl(fe?.rearHzMult,         0.5,  3.0, DEF_FE.rearHzMult),
      rideRef:          ['front','rear','shared'].includes(fe?.rideRef)?fe.rideRef:'front',
      arbManF:          cl(fe?.arbManF,             1,   65,   20),
      arbManR:          cl(fe?.arbManR,             1,   65,   20),
      settleMode:       !!(fe?.settleMode),
      settleBias:       cl(fe?.settleBias,        -50,   50,    0),
      settleTarget:     cl(fe?.settleTarget,      0.10,  2.00,  DEF_FE.settleTarget),
      dampCharMode:     fe?.dampCharMode==='settle'?'settle':'zeta',
      arbBalTargetMode: ['manual','grip'].includes(fe?.arbBalTargetMode)?fe.arbBalTargetMode:DEF_FE.arbBalTargetMode,
      arbBalDelta:      cl(fe?.arbBalDelta,       -0.20, 0.20, DEF_FE.arbBalDelta),
    },
    dr:{
      buildType:      BUILD_DEC.includes(dr?.buildType)?dr.buildType:DEF_DR.buildType,
      diffType:       DIFF_TYPE_DEC.includes(dr?.diffType)?dr.diffType:DEF_DR.diffType,
      diffManual:     typeof dr?.diffManual==='boolean'?dr.diffManual:dr?.diffManual===1,
      diffComplement: typeof dr?.diffComplement==='boolean'?dr.diffComplement:false,
      diffBiasExit:      cl(dr?.diffBiasExit,      -50, 50, DEF_DR.diffBiasExit),
      diffBiasEntry:     cl(dr?.diffBiasEntry,     -50, 50, DEF_DR.diffBiasEntry),
      diffFrontExitBias: cl(dr?.diffFrontExitBias, -50, 50, DEF_DR.diffFrontExitBias),
      diffAccel:      cl(dr?.diffAccel,       0,  100,  DEF_DR.diffAccel),
      diffDecel:      cl(dr?.diffDecel,       0,  100,  DEF_DR.diffDecel),
      diffFrontAccel: cl(dr?.diffFrontAccel,  0,  100,  DEF_DR.diffFrontAccel),
      diffFrontDecel: cl(dr?.diffFrontDecel,  0,  100,  DEF_DR.diffFrontDecel),
      diffRearAccel:  cl(dr?.diffRearAccel,   0,  100,  DEF_DR.diffRearAccel),
      diffRearDecel:  cl(dr?.diffRearDecel,   0,  100,  DEF_DR.diffRearDecel),
      diffCenter:     cl(dr?.diffCenter,      0,  100,  DEF_DR.diffCenter),
    },
  };
};

const useTwoTap=(callback,delay=2000)=>{
  const[pending,setPending]=useState(false);
  const timer=useRef(null);
  useEffect(()=>()=>clearTimeout(timer.current),[]);
  const handle=()=>{
    if(pending){clearTimeout(timer.current);setPending(false);callback();}
    else{setPending(true);timer.current=setTimeout(()=>setPending(false),delay);}
  };
  return[pending,handle];
};

const OverwriteBtn=({onConfirm})=>{
  const[pending,handle]=useTwoTap(onConfirm);
  return(
    <button onClick={handle}
      style={{background:'none',border:'none',cursor:'pointer',fontSize:12,lineHeight:1,
              padding:'0 0 0 3px',flexShrink:0,color:pending?'#f59e0b':'#374151'}}
      title={pending?'Click again to overwrite':'Overwrite with current data'}>↺</button>
  );
};

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}

      <div style={{padding:24,color:'#ef4444',fontFamily:'var(--font-mono)',fontSize:12,background:'#020617',minHeight:'100vh'}}>
        <div style={{marginBottom:8,color:'#e2e8f0',fontSize:14}}>SUSP.OS — Failed to load</div>
        <div style={{marginBottom:16,color:'#94a3b8'}}>An error occurred. Try reloading the page.</div>
        <div style={{background:'#0f172a',padding:12,borderRadius:4,border:'1px solid #1e293b',
                     whiteSpace:'pre-wrap',wordBreak:'break-all',lineHeight:1.6}}>
          {this.state.err.toString()}
        </div>
        <button onClick={()=>window.location.reload()}
          style={{marginTop:16,padding:'8px 16px',background:'#0f172a',border:'1px solid #1e293b',
                  color:'#e2e8f0',borderRadius:4,cursor:'pointer',fontFamily:'var(--font-mono)',fontSize:12}}>
          RELOAD
        </button>
      </div>
    );
    return this.props.children;
  }
}

// Standalone reference — unlike TUTORIALS this isn't a guided sequence, it's an
// always-available lookup for anyone who forgets what a term means. Not tier-gated:
// every term is shown regardless of BEG/INT/PRO, since a BEG user can still run into
// these words in a hint or a shared tune. Grouped to match how the app's own sections
// are organized, not alphabetically — easier to scan when you roughly know the area.
const GLOSSARY=[
  {group:'Ride & Springs',terms:[
    {term:'Hz (Ride Frequency)',def:'How many times per second a corner would bounce if pushed down and released. Higher Hz = stiffer spring, faster response, more control at the cost of compliance. Street cars usually run 1.0–2.0 Hz; track cars 2.0–4.0 Hz.'},
    {term:'Spring Rate (lb/in or N/mm)',def:"The force needed to compress a spring by one unit of travel. SUSP.OS derives it from your Ride Stiffness (Hz) target and each axle's corner mass — you don't set it directly."},
    {term:'Flat Ride',def:"A rear Hz set slightly higher than front so a bump hits the rear axle just as the front axle's response is finishing, cancelling pitch (nose-dive/squat) at a chosen target speed. One of three ways to set the secondary axle's Hz, alongside MULTIPLIER (fixed ratio) and INDEPENDENT (manual)."},
    {term:'Corner Mass',def:"The weight resting on one wheel — total weight split by front/rear bias, then by two for each side. Drives spring rate and damping calculations, since a heavier corner needs more force to move the same amount."},
  ]},
  {group:'Damping',terms:[
    {term:'ζ (Zeta / Damping Ratio)',def:"How quickly a bounce dies out, expressed as a percentage of critical damping. 100% = critically damped (returns to rest in one smooth motion, no overshoot). SUSP.OS defaults to 70% (Butterworth) — settles cleanly in one or two cycles without feeling harsh. Below ~40% feels bouncy and underdamped; above ~100% feels sluggish and overdamped."},
    {term:'Critical Damping',def:"The exact amount of damping that stops a spring's oscillation as fast as possible without overshooting past rest. It's the reference point damping ratio (ζ) is measured against — ζ is always a percentage of this value, not an absolute number."},
    {term:'Butterworth (≈70% ζ)',def:"The damping ratio (≈0.707, rounded to 70% here) that gives the flattest, smoothest response with no resonant peak — borrowed from Butterworth filter design. It's the reason SUSP.OS defaults Rebound ζ to 70%: firm enough to control the car, soft enough not to feel harsh over bumps."},
    {term:'Rebound',def:'Damping resistance as the suspension extends — the wheel dropping back down after being compressed. Controls how fast the wheel returns to full extension after a bump or during weight transfer.'},
    {term:'Bump (Compression)',def:'Damping resistance as the suspension compresses — the wheel moving up into a bump or under load transfer. Usually softer than rebound; Bump Ratio expresses it as a percentage of the rebound value.'},
    {term:'Settle Time',def:'Seconds for the suspension to stop moving after a disturbance. Short settle time feels planted and controlled; long settle time is more compliant over rough surfaces but can leave the car still moving mid-corner.'},
  ]},
  {group:'Roll & Anti-Roll Bars',terms:[
    {term:'Roll Stiffness',def:"Total resistance to body lean in a corner, supplied by springs and ARBs together. How it's split front-to-rear — not its total amount — is what determines understeer/oversteer tendency."},
    {term:'ARB (Anti-Roll Bar)',def:"A bar linking the left and right wheels on one axle that resists body roll without stiffening the ride vertically (it only engages when one side compresses relative to the other). The front/rear ARB split is the main lever for mechanical handling balance."},
    {term:'Mech(anical) Balance',def:"The rear axle's fraction of total roll stiffness (springs + ARBs), on a 0–1 scale where 0.50 is perfectly even. Higher = more rear roll resistance = more oversteer tendency. Lower = more front resistance = more understeer tendency. This is the number Forza's own tuning screen displays as \"Mech Balance.\""},
    {term:'Natural (Mech) Balance',def:"What your mech balance would be from springs alone, at equal front/rear Hz, before any ARB is added — derived from track width and corner mass, or from an in-game MEASURE NAT BAL reading. The baseline everything else is compared against."},
  ]},
  {group:'Handling Balance',terms:[
    {term:'Understeer (US)',def:"The front tyres lose grip before the rear — the car doesn't turn as much as the steering input asks for. Feels stable and safe, but resists rotation."},
    {term:'Oversteer (OS)',def:'The rear tyres lose grip before the front — the car rotates more than the steering input asks for. Feels lively and rotates freely, but can snap if overdone.'},
    {term:'Grip Bias',def:"The car's physical at-the-limit handling tendency — derived from tyre load sensitivity and lateral load transfer, not just roll stiffness split. Distinct from Mech Balance: two cars with identical mech balance can have different grip bias if their tyre widths or load transfer differ."},
    {term:'Load Transfer',def:'Weight shifting onto the outside tyres as a car corners. More transfer on an axle reduces that axle\'s total available grip (since tyres lose grip faster than they gain load). Wider track and lower CG height both reduce it.'},
  ]},
  {group:'Differential',terms:[
    {term:'Accel Lock',def:"How much the differential locks the driven wheels together under throttle. More lock forces both wheels to spin at closer to the same speed — more traction putting power down, but can add understeer (RWD/AWD) or resist rotation (FWD)."},
    {term:'Decel Lock',def:'Locking under lift-off or braking. More lock resists sudden weight-transfer oversteer on corner entry (lift-off oversteer); less lock allows freer rotation trail-braking into a corner.'},
  ]},
  {group:'Alignment',terms:[
    {term:'Camber',def:"The wheel's tilt viewed from the front — negative camber leans the top inward. Keeps more of the tyre's contact patch flat on the road once the body rolls in a corner."},
    {term:'Toe',def:'The angle the wheels point relative to straight-ahead, viewed from above. Toe-in (wheels angled inward) adds stability; toe-out adds sharper turn-in response at the cost of some straight-line stability.'},
    {term:'Caster',def:"The steering axis's forward/backward tilt. More caster adds self-centering feel and increases camber gain while turning (the outside tyre gains negative camber as you turn into a corner), at the cost of heavier steering effort."},
  ]},
];

const TutorialPanel=({mode,step,onNext,onPrev,onClose,onDone,zoom=1})=>{
  const steps=TUTORIALS[mode]??[];
  const total=steps.length;
  const t=steps[step];
  // balance mode always anchors to the balance bar zone even though its steps have focus:null
  const focusKey=mode==='balance'?'balance-bar':(t?.focus?.[0]??null);
  const CARD_W=264;
  // pos: {top,left?,right?,arrowDir,arrowOff} or null = centred
  const[pos,setPos]=useState(null);
  const cardRef=useRef(null);
  const bodyRef=useRef(null);
  const[showMore,setShowMore]=useState(false);
  const checkOverflow=()=>{
    const el=bodyRef.current;
    setShowMore(!!el&&el.scrollHeight-el.scrollTop-el.clientHeight>4);
  };

  useEffect(()=>{
    const el=focusKey?document.getElementById('zone-'+focusKey):null;
    // Scroll sidebar so element is visible — use direct scrollTop rather than
    // scrollIntoView which can target the wrong scroll container on mobile
    if(el){
      const sidebar=document.querySelector('.sidebar-scroll');
      if(sidebar){
        const sr=sidebar.getBoundingClientRect();
        const er=el.getBoundingClientRect();
        if(er.top<sr.top+40||er.bottom>sr.bottom-40){
          const relTop=er.top-sr.top+sidebar.scrollTop;
          // Instant, not smooth — an in-flight smooth scroll wouldn't be done yet
          // when measure() reads positions below, leaving the card pointing at
          // where the target *used to* be instead of where it ends up.
          sidebar.scrollTo({top:Math.max(0,relTop-80),behavior:'auto'});
        }
      }
    }
    const measure=()=>{
      if(!el){setPos(null);return;}
      const raw=el.getBoundingClientRect();
      // Hidden element (sidebar collapsed on desktop) → centre card
      if(raw.width===0&&raw.height===0){setPos(null);return;}
      // getBoundingClientRect() returns visual (viewport) pixels, but position:fixed
      // coordinates inside a CSS-zoomed container are in zoomed units (divide by zoom).
      const r={top:raw.top/zoom,bottom:raw.bottom/zoom,left:raw.left/zoom,right:raw.right/zoom};
      const vw=window.innerWidth/zoom;
      // Use the *visible* viewport height (excludes the iOS address bar/toolbar).
      const vh=((window.visualViewport&&window.visualViewport.height)||window.innerHeight)/zoom;
      const midY=(r.top+r.bottom)/2;
      const midX=(r.left+r.right)/2;
      if(midX<vw/2){
        // LEFT panel: float card just past the sidebar's right edge
        const sidebar=document.querySelector('.sidebar-scroll');
        const sbRight=sidebar?sidebar.getBoundingClientRect().right/zoom:r.right;
        const left=Math.min(sbRight+10,vw-CARD_W-8);
        // Anchor higher when the target sits near the bottom so the card keeps usable height.
        const top=Math.max(8,Math.min(vh-260,midY-80));
        const maxH=Math.max(140,vh-top-16);
        const arrowOff=Math.max(16,Math.min(maxH-16,midY-top));
        setPos({top,left,arrowDir:'left',arrowOff,maxH});
      } else {
        // RIGHT panel (output, balance-bar): float card just above the element,
        // hugging its actual rendered height rather than filling all available
        // space above the target — otherwise a short card ends up pinned to the
        // top of the screen with a large gap to whatever it's meant to point at.
        const GAP=10;
        const availH=r.top-8-GAP;
        // Some right-panel targets (zone-output) span nearly the full panel height,
        // starting almost at the very top — leaving no real room to float a card
        // above them. Forcing a floor of 140px there produces a box too short for
        // real body text, with the "more below" fade covering the only visible line.
        // Centre instead once there isn't enough room to hug the target usefully.
        const MIN_USABLE=180;
        if(availH<MIN_USABLE){ setPos(null); return; }
        const maxH=Math.max(140,Math.min(availH,vh-24));
        // cardRef's rect is raw (post-zoom) viewport pixels, but everything else in this
        // branch (r.top, maxH, vh) is pre-zoom — must divide by zoom before mixing them,
        // or the card renders too tall/low and can push off the bottom of the viewport
        // at any zoom level other than 100% (the default is 110%, so this hit everyone).
        const rawCardH=cardRef.current?.getBoundingClientRect().height;
        const cardH=Math.min(rawCardH?rawCardH/zoom:maxH,maxH);
        const top=Math.max(8,r.top-cardH-GAP);
        const left=Math.max(8,Math.min(vw-CARD_W-8,midX-CARD_W/2));
        const arrowOff=Math.max(12,Math.min(CARD_W-24,midX-left));
        setPos({top,left,arrowDir:'down',arrowOff,maxH});
      }
    };
    // Slight delay lets the accordion open/collapse reflow settle before we measure
    const tid=setTimeout(measure,60);
    window.addEventListener('resize',measure);
    if(window.visualViewport)window.visualViewport.addEventListener('resize',measure);
    return()=>{clearTimeout(tid);window.removeEventListener('resize',measure);
      if(window.visualViewport)window.visualViewport.removeEventListener('resize',measure);};
  },[focusKey,step]); // eslint-disable-line

  // Detect body text overflowing its scrollable area (can happen when the target sits
  // low enough that maxH gets clamped small) so we can show a "more below" affordance —
  // otherwise clipped content has no visual cue that it's there at all.
  useEffect(()=>{
    // Two staggered checks: pos settling (measure()'s own 60ms delay) doesn't guarantee
    // the body div's final scrollHeight is painted yet, so re-check once more shortly
    // after — cheap, and avoids a "false: fits" read that hides a real overflow.
    const t1=setTimeout(checkOverflow,120);
    const t2=setTimeout(checkOverflow,320);
    window.addEventListener('resize',checkOverflow);
    return()=>{clearTimeout(t1);clearTimeout(t2);window.removeEventListener('resize',checkOverflow);};
  },[step,pos]); // eslint-disable-line

  if(!t)return null;
  // 'HANDLING' (not 'BALANCE') — this tutorial mode walks through the Handling Balance
  // results bar, which would otherwise render as "BALANCE GUIDE" and collide with the
  // sidebar's actual BALANCE section, which has its own unrelated "BALANCE GUIDE" widget.
  const mLabel={beginner:'BEG',intermediate:'INT',pro:'PRO',balance:'HANDLING'}[mode]??mode.toUpperCase();
  const btnStyle={background:'none',border:'1px solid #1e293b',borderRadius:2,color:'#9ca3af',
    fontFamily:'var(--font-mono)',fontSize:10,padding:'4px 10px',cursor:'pointer',letterSpacing:1};

  const cardBase={position:'fixed',zIndex:700,width:CARD_W,
    maxHeight:'calc(100dvh - 40px)',display:'flex',flexDirection:'column',
    background:'#0f172a',border:'1px solid #334155',borderRadius:4,
    padding:'16px 16px 14px',boxShadow:'0 8px 40px #000d',fontFamily:'var(--font-mono)'};
  const cardStyle=pos
    ?{...cardBase,top:pos.top,...(pos.left!==undefined?{left:pos.left}:{right:pos.right}),
       maxHeight:pos.maxH}
    :{...cardBase,top:'50%',left:'50%',transform:'translate(-50%,-50%)'};

  const arrow=(()=>{
    if(!pos)return null;
    const base={position:'absolute',width:0,height:0};
    if(pos.arrowDir==='left') return(<>
      <div style={{...base,left:-8,top:pos.arrowOff-8,
        borderTop:'8px solid transparent',borderBottom:'8px solid transparent',borderRight:'8px solid #334155'}}/>
      <div style={{...base,left:-6,top:pos.arrowOff-7,
        borderTop:'7px solid transparent',borderBottom:'7px solid transparent',borderRight:'7px solid #0f172a'}}/>
    </>);
    return(<>
      <div style={{...base,bottom:-8,left:pos.arrowOff-8,
        borderLeft:'8px solid transparent',borderRight:'8px solid transparent',borderTop:'8px solid #334155'}}/>
      <div style={{...base,bottom:-6,left:pos.arrowOff-7,
        borderLeft:'7px solid transparent',borderRight:'7px solid transparent',borderTop:'7px solid #0f172a'}}/>
    </>);
  })();

  return(
    <div ref={cardRef} style={cardStyle}>
      {arrow}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:6}}>
        <div>
          <span style={{fontSize:10,color:'#94a3b8',letterSpacing:2}}>{mLabel} GUIDE  ·  {step+1} / {total}</span>
          <div style={{fontSize:13,color:'#e2e8f0',fontWeight:700,marginTop:3,letterSpacing:0.5}}>{t.title}</div>
        </div>
        <button onClick={onClose} style={{...btnStyle,padding:'3px 8px',marginTop:2,color:'#94a3b8'}}>✕</button>
      </div>
      {/* progress bar */}
      <div style={{display:'flex',gap:3,marginBottom:10}}>
        {steps.map((_,i)=>(
          <div key={i} style={{height:2,flex:1,borderRadius:1,transition:'background .2s',
            background:i<step?'#334155':i===step?'#6366f1':'#1e293b'}}/>
        ))}
      </div>
      <div style={{position:'relative',flex:1,minHeight:0,display:'flex',flexDirection:'column'}}>
        <div ref={bodyRef} onScroll={checkOverflow}
             style={{fontSize:11,color:'#94a3b8',lineHeight:1.65,margin:'0 0 10px',
                 overflowY:'auto',flex:1,minHeight:0,
                 WebkitOverflowScrolling:'touch',overscrollBehavior:'contain'}}>
          {t.terms
            ? t.terms.map(x=>(
                <div key={x.term} style={{marginBottom:8}}>
                  <div style={{fontSize:12,fontWeight:700,color:'#e2e8f0',marginBottom:2,
                               fontFamily:'var(--font-mono)'}}>{x.term}</div>
                  <div>{x.def}</div>
                </div>
              ))
            : t.body}
        </div>
        {showMore&&<div style={{position:'absolute',left:0,right:0,bottom:10,height:26,
             background:'linear-gradient(transparent,#0f172a)',pointerEvents:'none',
             display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
          <span style={{fontSize:9,color:'#818cf8',letterSpacing:1,paddingBottom:1}}>▼ SCROLL FOR MORE</span>
        </div>}
      </div>
      <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
        {step>0&&<button style={btnStyle} onClick={onPrev}>← PREV</button>}
        {step<total-1
          ?<button style={{...btnStyle,borderColor:'#4f46e5',color:'#818cf8'}} onClick={onNext}>NEXT →</button>
          :<button style={{...btnStyle,borderColor:'#16a34a',color:'#4ade80'}} onClick={onDone??onClose}>DONE ✓</button>}
      </div>
    </div>
  );
};

// ────────────────────────────────────────────────────────────────────────────
function App(){
  const[ch,setCh]=usePersist('suspos_ch_v8',DEF_CH);

  const[tutSeen,setTutSeen]=usePersist('suspos_tutorial_seen_v1',{beginner:false,intermediate:false,pro:false});
  const[balTutSeen,setBalTutSeen]=usePersist('suspos_baltut_seen_v1',false);
  const[balTutOpen,setBalTutOpen]=useState(false);
  const[balTutStep,setBalTutStep]=useState(0);
  const openBalTut=()=>{setBalTutStep(0);setBalTutOpen(true);};
  const closeBalTut=()=>setBalTutOpen(false);
  const[onboardSeen,setOnboardSeen]=usePersist('suspos_onboard_v1',true);
  const[garage,setGarage]=usePersist('suspos_garage_v1',[]);
  const[garageOpen,setGarageOpen]=useState(false);
  const[garageName,setGarageName]=useState('');
  const[myBuilds,setMyBuilds]=usePersist('suspos_builds_v1',[]);
  const[buildName,setBuildName]=useState('');
  // One-time migration: pull any customized old preset slots (suspos_saves_v9) into MY BUILDS.
  // The 6 factory slots that match their defaults are skipped; only renamed/overwritten slots move.
  // Non-destructive (old key left intact); guarded by a flag so it runs at most once per browser.
  useEffect(()=>{
    try{
      if(localStorage.getItem('suspos_builds_migrated_v1'))return;
      const migrated=[];
      for(let i=1;i<=6;i++){
        const s=saves[i],def=PRESET_SAVES[i];
        if(!s||!def)continue;
        const customized=s.name!==def.name||JSON.stringify(s.fe)!==JSON.stringify(def.fe)||JSON.stringify(s.dr)!==JSON.stringify(def.dr);
        if(!customized)continue;
        // skip if MY BUILDS already has an identical entry (idempotency safety)
        const dup=myBuilds.some(b=>b.name===s.name&&JSON.stringify(b.fe)===JSON.stringify(s.fe)&&JSON.stringify(b.dr)===JSON.stringify(s.dr));
        if(dup)continue;
        migrated.push({id:Date.now()+i,name:s.name,fe:{...DEF_FE,...s.fe},dr:{...DEF_DR,...s.dr},savedAt:'imported'});
      }
      if(migrated.length)setMyBuilds(b=>[...migrated,...b]);
      localStorage.setItem('suspos_builds_migrated_v1','1');
    }catch(e){/* corrupt/unavailable storage — skip migration, never block load */}
  },[]); // eslint-disable-line
  // One-time migration: MAN moved from Balance Mode (arbBalMode) to Stiffness Mode (arbMode).
  // sanitizeTune carries the matching fix for LOAD CODE imports; this covers plain persisted
  // state from before the move (self-guarding — once fixed, the condition never matches again).
  useEffect(()=>{
    if(fe.arbBalMode==='man'&&fe.arbMode!=='man'){
      setFe(p=>({...p,arbBalMode:'manual',arbMode:'man'}));
    }
  },[]); // eslint-disable-line
  const[showComplexity,setShowComplexity]=useState(false);
  const closeOnboard=()=>{setOnboardSeen(true);setShowComplexity(false);};
  const[tutMode,setTutMode]=useState(null);
  const[tutStep,setTutStep]=useState(0);
  const openTut=mode=>{
    setTutMode(mode);setTutStep(0);
    // Step 0 sidebar is driven by its own metadata; default to open for all other guides
    const step0=TUTORIALS[mode]?.[0];
    if(!step0?.sidebar)setSidebarOpen(true);
  };
  const closeTut=()=>setTutMode(null);
  // Called only when user clicks DONE on the last step of the beginner guide
  const closeTutDone=()=>{if(tutMode==='beginner'||tutMode==='intermediate')setShowComplexity(true);closeTut();};
  // Gating: INT requires BEG completion, PRO requires INT completion
  const canAccessMode=m=>{
    if(m==='beginner')return true;

  const tryAccessMode=m=>{

  useEffect(()=>{

      chassis:!!(tutFocus?.includes('chassis')||tutFocus?.includes('garage')),

      ride:!!(tutFocus?.includes('feel')),

      alignment:!!(tutFocus?.includes('alignment')),

    const stepMeta=TUTORIALS[tutMode]?.[tutStep];
    if(stepMeta?.sidebar==='close')setSidebarOpen(false);
    else if(stepMeta?.sidebar==='open')setSidebarOpen(true);
    // Sidebar now defaults closed too — a step whose focus lives in the sidebar
    // must force it open, or the dimmed background has nothing left to spotlight.
    // Steps that only reference the output panel/balance bar force it closed so
    // that panel isn't obstructed. Focus-less info steps leave it as the user set it.
    else if(tutFocus)setSidebarOpen(!(tutFocus.includes('output')||tutFocus.includes('balance-bar')));
  },[tutMode,tutStep]); // eslint-disable-line
  const[open,setOpen]=useState({chassis:false,build:false,balance:false,ride:false,dampers:false,arb:false,drivetrain:false,balanceExpanded:false,presetsOpen:false,startFromOpen:true,factoryOpen:true,myBuildsOpen:true,visuals:false,visArb:true,visRideDampers:true,visDynamics:true,visSag:true});
  // RIDE HEIGHT → CG: when active, keep ch.cgHeight in sync with the ride-height/tyre-radius
  // estimate instead of leaving it as a plain manual field. Only writes when both tyre sizes
  // parse to a full radius, and only when the rounded-mm result actually changed, so this
  // doesn't fight the user's own edits or churn on every render.
  useEffect(()=>{
    if(!ch.useRideHeightCG)return;
    const pF=parseTyre(ch.tyreF),pR=parseTyre(ch.tyreR);
    if(pF?.radius==null||pR?.radius==null)return;
    const tyreRadiusAvg=(pF.radius+pR.radius)/2;
    const rideHeightAvg=(ch.rideHeightF*1000)*(ch.frontBias/100)+(ch.rideHeightR*1000)*(1-ch.frontBias/100);
    const estMm=Math.max(200,Math.min(900,tyreRadiusAvg+rideHeightAvg));
    if(Math.round(ch.cgHeight*1000)!==Math.round(estMm))setCh(p=>({...p,cgHeight:estMm/1000}));
  },[ch.useRideHeightCG,ch.rideHeightF,ch.rideHeightR,ch.tyreF,ch.tyreR,ch.frontBias,ch.cgHeight]); // eslint-disable-line
  const[showChecker,setShowChecker]=useState(false);
  const[checkerInitMode,setCheckerInitMode]=useState('decode');
  const[showGlossary,setShowGlossary]=useState(false);
  const[showResetModal,setShowResetModal]=useState(false);
  const[begResetArmed,setBegResetArmed]=useState(false);

  const[showDataModal,setShowDataModal]=useState(false);
  const[dataMode,setDataMode]=useState('share'); // 'share'|'load'|'backup'|'restore'
  const[exportSel,setExportSel]=useState({garage:true,builds:true});
  const[importCode,setImportCode]=useState('');
  const[importSel,setImportSel]=useState({ch:true,fe:true,dr:true});
  const[importErr,setImportErr]=useState('');
  const[shareCopied,setShareCopied]=useState(false);
  const[shareSel,setShareSel]=useState({ch:true,fe:true,dr:true});
  const[restoreData,setRestoreData]=useState(null);
  const[restoreErr,setRestoreErr]=useState('');
  const[restoreSel,setRestoreSel]=useState({garage:true,builds:true});
  const[resetOpts,setResetOpts]=useState({tune:true,tutorials:false});
  const[hzDraft,setHzDraft]=useState(null);     // transient: direct front Hz entry
  const[rearHzDraft,setRearHzDraft]=useState(null); // transient: direct rear Hz entry (independent mode)

  const[sidebarOpen,setSidebarOpen]=useState(false);

  const[footerOpen,setFooterOpen]=useState(()=>window.innerWidth>=480);
  const[windowWidth,setWindowWidth]=useState(window.innerWidth);
  useEffect(()=>{

    let prevMobile=null;
    const check=()=>{
      const w=window.innerWidth;

      setIsPhone(w<480);

  // Auto-scale chassis geometry with weight in BEG/INT modes
  useEffect(()=>{
    if(uiMode==='pro')return;
    const r=ch.weight/DEF_CH.weight; // weight ratio vs default 3200 lb
    const r5=v=>Math.round(v/0.005)*0.005; // round to nearest 5 mm
    setCh(p=>({...p,
      wheelbase: r5(DEF_CH.wheelbase * Math.pow(r,0.20)),
      trackF:    r5(DEF_CH.trackF    * Math.pow(r,0.15)),

  const pDr=k=>v=>setDr(p=>({...p,[k]:v}));
  const pAl=k=>v=>setAl(p=>({...p,[k]:v}));
  const tog=k=>()=>setOpen(p=>({...p,[k]:!p[k]}));

  // ─── Undo history ───────────────────────────────────────────────────────────
  const historyRef=useRef([]);
  const snapTimerRef=useRef(null);
  const undoingRef=useRef(false);
  const[histLen,setHistLen]=useState(0);
  useEffect(()=>{
    if(undoingRef.current){undoingRef.current=false;return;}
    clearTimeout(snapTimerRef.current);
    snapTimerRef.current=setTimeout(()=>{
      const snap={ch,fe,dr,al};
      const hist=historyRef.current;
      if(hist.length>0&&JSON.stringify(hist[hist.length-1])===JSON.stringify(snap))return;
      hist.push(snap);
      if(hist.length>50)hist.shift();

  },[ch,fe,dr,al]); // eslint-disable-line
  const undo=()=>{

  const canUndo=histLen>=2;

  const cm=useMemo(()=>cornerMasses(ch),[ch]);
  const dispMass=kg=>metricUnits?`${Math.round(kg)} kg`:`${Math.round(kg/KG_TO_LB)} lb`;

  // GRIP modes to an absolute value for the physics engine and every downstream display.
  const feEffective=(fe.arbBalTargetMode??'manual')==='grip'
    ?{...fe,arbBalTarget:gripBalTarget}
    :{...fe,arbBalTarget:resolveArbBalTarget(ch,fe)};
  const physics=useMemo(()=>feelToPhysics(ch,feEffective),[ch,feEffective]);
  const tune=useMemo(()=>computeTune(ch,physics,fe.gameMode),[ch,physics,fe.gameMode]);
  const autoAlign=useMemo(()=>computeAlignment(ch,tune,ch.layout,dr.buildType),[ch,tune,ch.layout,dr.buildType]);
  // alignMode: 'build' (default, computeAlignment only) | 'mech' (nudge toward the resolved
  // Mech Balance Target's gap from natural — reinforces deliberate tuning intent, same signal
  // computeDiff's MATCH CHASSIS uses) | 'grip' (nudge to counteract the chassis's own natural
  // grip tendency, independent of ARB mode) | 'manual' (direct camber/toe/caster entry).
  // Falls back to the legacy alignManual boolean for old persisted state.
  const alignMode=ALIGN_MODE_DEC.includes(al.mode)?al.mode:(al.alignManual?'manual':'build');
  const align=(()=>{
    if(alignMode==='manual')return{recCamberF:al.camberF,recCamberR:al.camberR,
      recToeF:al.toeF,recToeR:al.toeR,recCaster:al.caster};
    if(alignMode!=='mech'&&alignMode!=='grip')return autoAlign;
    const mechGap=resolveArbBalTarget(ch,fe)-naturalMechBalanceOf(ch);
    const gripGap=-(natGripBalance-0.5)*2;
    const rawGap=alignMode==='mech'?mechGap:gripGap;
    const normGap=Math.max(-1,Math.min(1,rawGap/0.30));
    const k=normGap*((al.nudgeStrength??50)/100);
    return{
      recCamberF:Math.round(Math.max(-4.0,Math.min(0.0,autoAlign.recCamberF-0.5*k))*10)/10,
      recCamberR:Math.round(Math.max(-3.5,Math.min(0.0,autoAlign.recCamberR+0.3*k))*10)/10,
      recToeF:Math.round(Math.max(-0.20,Math.min(0.15,autoAlign.recToeF-0.05*k))*10)/10,
      recToeR:Math.round(Math.max(0.0,Math.min(0.25,autoAlign.recToeR-0.05*k))*10)/10,
      recCaster:autoAlign.recCaster,
    };
  })();
  const _measuredNatForDiff=ch.useMeasuredNatBal&&ch.measuredNatBal!=null?Math.max(0.10,Math.min(0.90,ch.measuredNatBal)):null;
  const diff=useMemo(()=>computeDiff(ch,fe,dr,_measuredNatForDiff),[ch,fe,dr,_measuredNatForDiff]);
  const _brakeWtMod=ch.wheelbase>0?Math.round((ch.cgHeight/ch.wheelbase)*50):8;
  const _brakeBuildMod={street:0,track:3,drift:-5,rally:0,offroad:-3,drag:-8}[dr.buildType??'track']??3;
  const _brakeGripAdj=uiMode==='pro'?Math.round((natGripBalance-0.5)*15):0;
  const recBrakeBias=Math.round(Math.max(50,Math.min(68,ch.frontBias+_brakeWtMod+_brakeBuildMod+_brakeGripAdj)));
  const brakeBias=recBrakeBias;
  const brakePressure=100;
  // positive = oversteer, negative = understeer
  const bBrakeEntry=-(brakeBias-50)*BRAKE_BIAS_SCALE; // high front bias → understeer (−)
  const effectiveAvgZeta=(tune.zetaF+tune.zetaR)/2||70;
  const bDampBias=-(tune.zetaF-tune.zetaR)*16/effectiveAvgZeta; // more front rebound → understeer (−)
  const bTotFull=tune.bTot+diff.bDiffAccel+diff.bDiffDecel+bBrakeEntry+bDampBias;
  const recommendedDiffType=(()=>{
    const build=dr.buildType??'track';
    const base={track:'race',street:'sport',drift:'drift',rally:'rally',offroad:'offroad',drag:'race'}[build]??'race';
    // strongly oversteery track/drift/drag builds benefit from a softer type
    if(bTotFull>8&&base==='race') return 'sport';
    return base;
  })();
  const lim=GAME_LIMITS[fe.gameMode];
  const responseFactors=(()=>{
    // Agility = transient response character: how quickly and freely the car responds to steering inputs.
    // ARBs and weight bias are excluded — they govern roll moment distribution (Handling Balance bar),
    // not response speed. Research (Milliken, OptimumG) confirms ARBs are a balance tool, not agility.
    const fHzNorm=Math.min(1,Math.max(0,(tune.fHz-HZ_MIN)/(HZ_MAX-HZ_MIN)));
    const rHzNorm=Math.min(1,Math.max(0,(tune.rHz-HZ_MIN)/(HZ_MAX-HZ_MIN)));
    const dampFNorm=Math.min(1,Math.max(0,(tune.zetaF-10)/105));
    const dampRNorm=Math.min(1,Math.max(0,(tune.zetaR-10)/105));
    // Toe range is -0.20° (toe-out, reactive) to +0.20° (toe-in, planted).
    // Old formula used a much wider range and only ever hit 0.20–0.47 of 0–1.
    const TOE_MIN=-0.20,TOE_MAX=0.20;
    const toeNorm=Math.min(1,Math.max(0,(TOE_MAX-(align.recToeF??-0.1))/(TOE_MAX-TOE_MIN)));
    const casterNorm=Math.min(1,Math.max(0,(7.5-(align.recCaster??5.5))/3.5));
    const score=fHzNorm*0.35+(1-dampFNorm)*0.12+rHzNorm*0.20+(1-dampRNorm)*0.08+toeNorm*0.15+casterNorm*0.10;
    return{score,fHzNorm,rHzNorm,dampFNorm,dampRNorm,toeNorm,casterNorm};
  })();

  // Full chassis geometry analysis — equal Hz, no ARBs
  const chassisAnalysis=(()=>{
    const twF=parseTyre(ch.tyreF)?.width??265,twR=parseTyre(ch.tyreR)?.width??265;
    // Natural balance = pure roll-stiffness rear fraction at equal springs, no ARBs.
    // This matches Forza's scale (arbBalTarget is also an rsBalance on this scale).
    const natBal=cm.rear*ch.trackR*ch.trackR/(cm.front*ch.trackF*ch.trackF+cm.rear*ch.trackR*ch.trackR);
    // Stability index: track width × tire width normalised to typical values
    const avgTrack=(ch.trackF+ch.trackR)/2;   // metres
    const avgTire=(twF+twR)/2;                 // mm
    const stabIdx=Math.sqrt((avgTrack/1.6)*(avgTire/265));
    // Recommendation target: co-solve/mech target when active, else neutral 0.50.
    // MAN ARB stiffness bypasses arbBalMode's solve entirely — unless Hz MECH mode is
    // separately still solving spring Hz toward the target — so a leftover arbBalMode of
    // mech/coSolve from before switching to MAN must not count here (see KNOWN_ISSUES.md).
    const hasMechTarget=((feEffective.arbMode??'auto')!=='man'&&(feEffective.arbBalMode==='coSolve'||feEffective.arbBalMode==='mech'))
      ||(feEffective.rearHzMode??'flatRide')==='mech';
    const targetBal=hasMechTarget?Math.max(0.20,Math.min(0.90,feEffective.arbBalTarget??0.55)):0.50;
    // REACH: find track-width changes that bring natural rsBalance toward target.
    // Tyre width affects grip capacity (shown via CHASSIS BAL physical display) but NOT
    // roll-stiffness fraction, so REACH shows track-only recommendations.
    const rsBalOf=o=>{const c={...ch,...o};const mc=cornerMasses(c);
      return mc.rear*c.trackR*c.trackR/(mc.front*c.trackF*c.trackF+mc.rear*c.trackR*c.trackR);};
    const scan=f=>{let best=f.lo,err=Infinity;
      for(let i=0;i<=80;i++){const v=f.lo+(f.hi-f.lo)*i/80;const e=Math.abs(f.bal(v)-targetBal);if(e<err){err=e;best=v;}}return best;};
    const r5=v=>Math.round(v/5)*5;
    const trackF_rec=r5(Math.max(800,Math.min(2200,scan({lo:0.8,hi:2.2,bal:t=>rsBalOf({trackF:t})})*1000)));
    const trackR_rec=r5(Math.max(800,Math.min(2200,scan({lo:0.8,hi:2.2,bal:t=>rsBalOf({trackR:t})})*1000)));
    const trackF_curr=Math.round(ch.trackF*1000),trackR_curr=Math.round(ch.trackR*1000);
    const dTrackF=trackF_rec-trackF_curr,dTrackR=trackR_rec-trackR_curr;
    // Feasibility: track ± 65mm
    const trackFfeas=Math.abs(dTrackF)<=65;
    const trackRfeas=Math.abs(dTrackR)<=65;
    return{natBal,stabIdx,targetBal,hasMechTarget,
           trackF_rec,trackR_rec,dTrackF,dTrackR,trackFfeas,trackRfeas};
  })();

                </div>

                <div id="zone-ride-stiffness" style={dim('ride-stiffness')}>

                  markers={HZ_MARKERS}
                  readout={<span style={{display:'flex',alignItems:'center',gap:5}}>

                    <span style={{fontSize:10,color:'#94a3b8',fontFamily:'var(--font-mono)'}}>{ridePrimaryHz.toFixed(2)} Hz</span>

                </div>
                <div id="zone-balance" style={dim('balance')}>
                <FeelSlider label="Balance" value={balVal}
                  onChange={v=>{const c=Math.max(-50,Math.min(50,v));setFe(p=>{
                    // Nudge rearHzMult incrementally from wherever it already sits (e.g. a
                    // loaded preset's tuned ratio) rather than overwriting it outright, so
                    // touching this slider doesn't erase a preset's Hz character.
                    const prevC=p.arbBias??0;
                    const baseMult=p.rearHzMode==='multiplier'?(p.rearHzMult??1.20):1.20;
                    const nudged=Math.max(0.50,Math.min(3.00,baseMult*(1+(c-prevC)*0.0008)));
                    return{...p,
                      arbBalMode:'neutral',
                      rearHzMode:'multiplier',
                      arbBias:c,
                      rearHzMult:Math.round(nudged*100)/100};
                  });}}
                  min={-50} max={50} step={1}
                  leftLabel="UNDERSTEER" rightLabel="OVERSTEER"
                  markers={[{value:0,color:'#94a3b8',label:'NEUTRAL'}]}
                  readout={balVal<-10?'UNDERSTEER':balVal>10?'OVERSTEER':'NEUTRAL'}
                  hint="Blends two mechanisms: ARB Bias in NEUTRAL mode (nudges the ARB split away from the point that exactly cancels the springs' balance-bar bias) with a slight rear/front spring frequency ratio nudge — applied on top of whatever ratio a loaded preset already set, not a reset. Right (OVERSTEER) = more rotation, freer rear end. Left (UNDERSTEER) = more stability. Start at centre for most builds."/>
                </div>
                <div id="zone-character" style={dim('character')}>
                <FeelSlider label="Character" value={stAgVal}
                  onChange={v=>setFe(p=>({...p,
                    reboundZeta:Math.max(10,Math.min(115,70-v*0.5)),
                    bumpRatio:Math.max(10,Math.min(100,Math.round(56+v*0.22)))
                  }))}
                  min={-50} max={50} step={1}
                  leftLabel="STABLE" rightLabel="AGILE"
                  markers={[{value:0,color:'#94a3b8',label:'NEUTRAL'}]}
                  readout={stAgVal===0?'NEUTRAL':stAgVal>0?'AGILE':'STABLE'}
                  hint="Controls damping character. Stable (left) = higher damping, settles quickly, more predictable. Agile (right) = lighter damping, more lively and responsive, quicker direction changes. Start at centre."/>

                <div style={{display:'flex',justifyContent:'flex-end',marginTop:18,...dim('ride-stiffness','balance','character')}}>
                  <button className="tbtn" style={{fontSize:10,color:begResetArmed?'#ffffff':'#fca5a5',

                      if(!begResetArmed){setBegResetArmed(true);setTimeout(()=>setBegResetArmed(false),2000);return;}
                      setBegResetArmed(false);
                      setCh({...DEF_CH});
                      setDr({...DEF_DR});
                      setFe({...DEF_FE,springShare:50,rearHzMode:'multiplier',rearHzMult:1.0});

            <button className="tbtn" style={{fontSize:10}}

          {uiMode!=='beginner'&&<>
          <div id="zone-chassis" style={dim('chassis','garage')}><Sec title="CHASSIS" open={open.chassis} onToggle={tog('chassis')}

                    <span style={{fontSize:10,letterSpacing:2,color:'#64748b'}}>GARAGE</span>

                        <input value={garageName} onChange={e=>setGarageName(e.target.value)}
                          onKeyDown={e=>e.key==='Enter'&&saveCurrentChassis()}
                          placeholder="Name this chassis…"
                          style={{flex:1,background:'#0f172a',border:'1px solid #1e293b',borderRadius:2,
                                  padding:'4px 7px',fontSize:11,color:'#e2e8f0',outline:'none',
                                  fontFamily:'inherit'}}/>
                        <button onClick={saveCurrentChassis}
                          style={{padding:'4px 10px',fontSize:10,letterSpacing:1,
                                  background:'#1e293b',border:'1px solid #334155',borderRadius:2,
                                  color:'#94a3b8',cursor:'pointer',flexShrink:0}}>SAVE</button>
                      </div>
                      {/* saved list */}
                      {garage.length===0

                            {garage.map(s=>(
                              <div key={s.id}
                                style={{background:'#0f172a',border:'1px solid #1e293b',borderRadius:2,

                                <div style={{display:'flex',alignItems:'flex-start',gap:3,minWidth:0}}>

                                  <span style={{fontSize:11,color:'#cbd5e1',fontWeight:600,

            <Toggle label="Layout" value={ch.layout} onChange={pCh('layout')}

            <Field label="Front Weight Bias" value={ch.frontBias} onChange={pCh('frontBias')} min={30} max={70} step={1} unit="%"

            {(()=>{
              if(uiMode!=='pro')return null;
              const tyreInput=(key,label,onCopyFront)=>{
                const val=ch[key]??DEF_CH[key];
                const isBlank=val.trim()==='';
                const parsed=parseTyre(val);
                return(
                  <div style={{flex:1}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>

                      {onCopyFront&&

                    </div>
                    <input type="text" value={val}
                      onChange={e=>pCh(key)(e.target.value)}
                      placeholder="265/30R19"
                      style={{width:'100%',boxSizing:'border-box',background:'#020617',
                              border:`1px solid ${isBlank||parsed?'#1e293b':'#7f1d1d'}`,borderRadius:2,
                              color:'#e2e8f0',fontFamily:'var(--font-mono)',fontSize:12,
                              padding:'4px 6px',outline:'none'}}/>
                    <div style={{marginTop:4,fontFamily:'var(--font-mono)'}}>
                      {isBlank

                    </div>
                  </div>

              return(<>

                    </div>
                  );

            {uiMode==='pro'&&<>
            <Field label="Wheelbase" value={Math.round(ch.wheelbase*1000)} onChange={v=>pCh('wheelbase')(v/1000)} min={400} max={4000} step={5} unit="mm"

            {!ch.useMeasuredNatBal&&
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 10px'}}>
              <Field label="Track Width F" value={Math.round(ch.trackF*1000)} onChange={v=>pCh('trackF')(v/1000)} min={1000} max={2600} step={5} unit="mm"
                hint="Distance between left and right wheels at the front. Typical: 1400–1800 mm. Wider = more roll resistance."/>
              <Field label="Track Width R" value={Math.round(ch.trackR*1000)} onChange={v=>pCh('trackR')(v/1000)} min={1000} max={2600} step={5} unit="mm"
                hint="Distance between left and right wheels at the rear. Typical: 1400–1800 mm. Often slightly wider than front."/>
            </div>}
            <div style={{background:'#060c17',border:'1px solid #1e293b',borderRadius:2,padding:'5px 10px',margin:'2px 0 8px',display:'flex',alignItems:'center',gap:6}}>
              <button className="tbtn" style={{fontSize:11,color:ch.useRideHeightCG?'#60a5fa':'#475569',flexShrink:0}}
                onClick={()=>setCh(p=>({...p,useRideHeightCG:!p.useRideHeightCG}))}>RIDE HEIGHT → CG</button>
              <Hint text="An alternative to entering CG height directly — uses the front/rear ride height Forza shows on the car's stat screen, plus tyre radius, to estimate CG height. This is a rough heuristic (real CG height also depends on engine position, body height, and mass distribution, none of which are available inputs) — treat it as a starting point, not a precise reading."/>
            </div>
            {ch.useRideHeightCG?(()=>{
              const pF=parseTyre(ch.tyreF),pR=parseTyre(ch.tyreR);
              const tyresOk=pF?.radius!=null&&pR?.radius!=null;
              const inMm=metricUnits?10:IN_TO_MM; // display unit → mm: cm ×10, in ×25.4
              const unitLbl=metricUnits?'cm':'in';
              return(<>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 10px'}}>
                  <Field label="Ride Height F" value={Math.round((ch.rideHeightF*1000/inMm)*10)/10}

                    min={metricUnits?5:2} max={metricUnits?61:24} step={metricUnits?0.5:0.1} unit={unitLbl}

                  <Field label="Ride Height R" value={Math.round((ch.rideHeightR*1000/inMm)*10)/10}
                    onChange={v=>pCh('rideHeightR')((v*inMm)/1000)}
                    min={metricUnits?5:2} max={metricUnits?61:24} step={metricUnits?0.5:0.1} unit={unitLbl}
                    hint={`Rear ride height as shown on the car's stat/tuning screen in Forza (${unitLbl}).`}/>
                </div>
                <div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:2,padding:'6px 8px',marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>CG HEIGHT (EST.)</span>
                  <span style={{marginLeft:'auto',fontFamily:'var(--font-mono)',fontSize:13,color:'#60a5fa'}}>{Math.round(ch.cgHeight*1000)} mm</span>
                  <button className="tbtn" style={{fontSize:11,color:'#6b7280',flexShrink:0,padding:'2px 6px'}}

                </div>
                {!tyresOk&&<div style={{fontSize:9,color:'#f59e0b',padding:'2px 0 8px'}}>Enter valid tyre sizes above to compute CG height from ride height.</div>}

              </>);
            })():
              <Field label="CG Height" value={Math.round(ch.cgHeight*1000)} onChange={v=>pCh('cgHeight')(v/1000)} min={200} max={900} step={5} unit="mm"
                hint="Estimated height of the centre of gravity above ground. The game doesn't expose this — use 400–460 mm for sports cars, 480–550 mm for sedans, 580–700 mm for SUVs. Affects roll moment and ARB stiffness."/>
            }
            </> }

                      hint="Deviation from the chassis natural roll balance. 0 = target the natural balance exactly — no ARB correction needed. Positive = rear-biased from natural (oversteer tendency). Negative = front-biased from natural (understeer tendency). The BALANCE GUIDE shows the recommended range for your drivetrain and build type as deltas from NAT — use those as your reference. MECH and CO-SOLVE modes solve springs and ARBs to hit this target exactly. FH6 surfaces Mech Balance in-game so you can verify the result directly."/>

            {(()=>{
              if(uiMode!=='pro')return null;

              const _deltaMap={
                FWD:{street:[0.06,0.17],track:[0.11,0.24],drift:[0.18,0.32],rally:[0.05,0.15],offroad:[0.02,0.12],drag:[0.10,0.22]},

              const _hasMechTarget=((fe.arbMode??'auto')!=='man'&&((fe.arbBalMode??'weight')==='mech'||(fe.arbBalMode??'weight')==='coSolve'))
                ||(fe.rearHzMode??'flatRide')==='mech';
              const _cur=_hasMechTarget?(feEffective.arbBalTarget??natMechBalance):tune.mechBalance;

              const{stabIdx}=chassisAnalysis;
              const[stabLabel,stabCol]=stabIdx<0.85?['AGILE','#f59e0b']

              return(

                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>

            {(fe.arbBalMode??'weight')==='coSolve'&&<>
              <div style={{display:'flex',gap:8,marginBottom:6}}>
                <div style={{flex:1,display:'flex',alignItems:'center',gap:8,
                             padding:'6px 10px',background:'#0a0f1a',borderRadius:2,
                             border:'1px solid #1e293b'}}>
                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>ARB SPLIT</span>
                  <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>
                    F {tune.balArbSplit!=null?100-tune.balArbSplit:'—'}% / R {tune.balArbSplit??'—'}%
                  </span>
                </div>
                <div style={{flex:1,display:'flex',alignItems:'center',gap:8,
                             padding:'6px 10px',background:'#0a0f1a',borderRadius:2,

                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>SOLVED REAR Hz</span>
                  <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>

                  </span>
                </div>
              </div>
              {tune.coSolveSpCorr!=null&&<div style={{display:'flex',gap:8,marginBottom:6}}>
                <div style={{flex:1,display:'flex',alignItems:'center',gap:8,
                             padding:'6px 10px',background:'#0a0f1a',borderRadius:2,
                             border:'1px solid #1e293b'}}>
                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>SPR CORR</span>
                  <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>

                  </span>
                </div>
                <div style={{flex:1,display:'flex',alignItems:'center',gap:8,
                             padding:'6px 10px',background:'#0a0f1a',borderRadius:2,

                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>ARB CORR</span>
                  <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>

              </div>
            </>}
          </Sec></div>

          <div id="zone-feel" style={dim('ride','feel')}><Sec title="RIDE" open={open.ride} onToggle={tog('ride')}
            onReset={()=>setFe(p=>({...p,
              rideStiffness:DEF_FE.rideStiffness,
              targetSpeed:DEF_FE.targetSpeed,
              rearHzMode:DEF_FE.rearHzMode,
              rearHzMan:DEF_FE.rearHzMan,
              rearHzMult:DEF_FE.rearHzMult,
              rideRef:DEF_FE.rideRef}))}>
            <div style={dim('feel')}>
            {(()=>{
              const rRef=physics.rideRef??'front'; // 'front', 'rear', or 'shared'
              // Use tune.fHz/tune.rHz (not physics values) so CO-SOLVE effectiveRHz is reflected.
              // physics.rearHz is the pre-CO-SOLVE flatRide value; tune.rHz is the actual solved Hz.
              const avgHz=(tune.fHz+tune.rHz)/2;
              const primaryHz=rRef==='rear'?tune.rHz:rRef==='shared'?avgHz:tune.fHz;

                  <button className={`tog${rRef==='front'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,

                      rideStiffness:hzToRs(physics.frontHz),

                  <button className={`tog${rRef==='shared'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,

                    onClick={()=>setFe(p=>({...p,

                      onFocus={()=>setHzDraft(primaryHz.toFixed(2))}
                      onChange={e=>setHzDraft(e.target.value)}

                      onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}/>

                  </span>}
                  hint={rRef==='rear'
                    ?'Rear spring frequency — the fixed reference. The mode below derives front Hz from it. Click the Hz value to type directly. Typical range: 1.0–1.8 Hz for street, 1.8–2.6 Hz for track.'
                    :rRef==='shared'
                    ?'Average of front and rear spring frequency. Moving the slider scales both axles together while the mode below holds the front/rear ratio. Click the Hz value to type directly.'
                    :'Front spring frequency — the fixed reference. The mode below derives rear Hz from it. Click the Hz value to type directly. Typical range: 1.0–1.8 Hz for street, 1.8–2.6 Hz for track.'}/>
              </>);
            })()}
            {/* secondary Hz mode toggle — hidden in CO-SOLVE (rear Hz solved automatically) */}
            {(fe.arbBalMode??'weight')!=='coSolve'&&(()=>{
              const isShared=(physics.rideRef??'front')==='shared';
              return<>
                <div style={{display:'flex',alignItems:'center',marginBottom:3,marginTop:-2}}>
                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1,flex:1}}>Hz MODE<Hint text="How the secondary axle frequency is derived. FLAT RIDE: the mathematically ideal pitch-cancelling ratio for a target speed. MULTIPLIER: a fixed ratio of the anchored axle Hz. INDEPENDENT: set manually, free of the other axle. MECH: derived from the mech balance target — PRO only. Hidden in CO-SOLVE — rear Hz is solved automatically."/></span>
                </div>
                <div style={{display:'grid',gridTemplateColumns:uiMode==='pro'?(isShared?'1fr 1fr 1fr':'1fr 1fr'):(isShared?'1fr 1fr':'1fr 1fr 1fr'),gap:3,marginBottom:10}}>
                  <button className={`tog${(fe.rearHzMode??'flatRide')==='flatRide'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,rearHzMode:'flatRide'}))}>FLAT RIDE</button>
                  <button className={`tog${(fe.rearHzMode??'flatRide')==='multiplier'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,rearHzMode:'multiplier',
                      rearHzMult:Math.round(physics.rearHz/physics.frontHz*100)/100}))}>MULTIPLIER</button>
                  {uiMode==='pro'&&<button className={`tog${(fe.rearHzMode??'flatRide')==='mech'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,rearHzMode:'mech'}))}>MECH</button>}
                  {!isShared&&<button className={`tog${(fe.rearHzMode??'flatRide')==='independent'?' on':''}`}
                    onClick={()=>setFe(p=>({...p,rearHzMode:'independent',

                </div>
              </>;
            })()}
            {(fe.arbBalMode??'weight')!=='coSolve'&&(()=>{
              const rRef=physics.rideRef??'front';
              const isShared=rRef==='shared';
              const secLabel=rRef==='rear'?'front':'rear';
              const secHz=rRef==='rear'?physics.frontHz:physics.rearHz;
              const sharedReadout=`F ${physics.frontHz.toFixed(2)} · R ${physics.rearHz.toFixed(2)} Hz${physics.rearHzClamped?' ⚠':''}`;
              return(fe.rearHzMode??'flatRide')==='flatRide'
              ? <FeelSlider label="Target Speed" value={240-fe.targetSpeed}
                  onChange={v=>pFe('targetSpeed')(240-v)} min={40} max={180} step={5}
                  leftLabel="OFF" rightLabel="CITY"
                  readout={fe.targetSpeed>=200
                    ? isShared?`FLAT RIDE OFF · ${physics.frontHz.toFixed(2)} Hz both`:`FLAT RIDE OFF · ${secHz.toFixed(2)} Hz ${secLabel}`

                      ? (metricUnits?`${Math.round(fe.targetSpeed*KMH_PER_MPH)} km/h · `:`${fe.targetSpeed} mph · `)+sharedReadout
                      : metricUnits
                        ? `${Math.round(fe.targetSpeed*KMH_PER_MPH)} km/h · ${secHz.toFixed(2)} Hz ${secLabel}${physics.rearHzClamped?' ⚠':''}`

                  onChange={pFe('rearHzMult')} min={0.50} max={3.00} step={0.01}

                  readout={isShared
                    ?`×${(fe.rearHzMult??1.20).toFixed(2)} · ${sharedReadout}`

                    ?`÷${(fe.rearHzMult??1.20).toFixed(2)} → ${secHz.toFixed(2)} Hz front`
                    :`×${(fe.rearHzMult??1.20).toFixed(2)} → ${secHz.toFixed(2)} Hz rear`}
                  hint={isShared
                    ?"Rear-to-front Hz ratio. The average is held by the Avg Stiffness slider — changing the ratio shifts stiffness between axles without moving the average."
                    :rRef==='rear'
                    ?"Front Hz as a fraction of rear Hz. ÷1.20 = front is 83% of rear stiffness. Useful when you want the front consistently softer."
                    :"Rear Hz as a multiple of front Hz. ×1.00 = matched. ×1.20 is a typical starting point for most builds."}/>
            : (fe.rearHzMode??'flatRide')==='mech'
              ? <div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:2,
                             padding:'6px 10px',marginBottom:6}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                    <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>
                      {isShared?'SOLVED SPLIT':'SOLVED '+secLabel.toUpperCase()+' Hz'}
                    </span>
                    {isShared
                      ?<><span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:physics.rearHzClamped?'#f59e0b':'#e2e8f0'}}>F {physics.frontHz.toFixed(2)}</span>
                        <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span>
                        <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:physics.rearHzClamped?'#f59e0b':'#e2e8f0'}}>R {physics.rearHz.toFixed(2)}</span>
                        <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span></>
                      :<><span style={{fontFamily:'var(--font-mono)',fontSize:14,fontWeight:700,
                                    color:physics.rearHzClamped?'#f59e0b':'#e2e8f0'}}>
                          {secHz.toFixed(2)}
                        </span>
                        <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span></>}

                    </span>
                  </div>
                  <div style={{fontSize:10,color:'#94a3b8',lineHeight:1.4}}>
                    {isShared?'Both springs solved from average to reach':'Rear spring stiffness solved to reach'} mech balance target{' '}
                    <span style={{color:'#9ca3af',fontFamily:'var(--font-mono)'}}>{resolveArbBalTarget(ch,fe).toFixed(2)}</span>.
                    {' '}{isShared?'Avg Stiffness slider shifts both together.':'Set target in ARB section above.'}
                  </div>
                </div>
              : <FeelSlider
                  label={rRef==='rear'?'Front Hz':'Rear Hz'}
                  value={fe.rearHzMan??secHz}
                  onChange={pFe('rearHzMan')} min={HZ_MIN} max={HZ_MAX} step={0.01}
                  leftLabel={HZ_MIN.toFixed(2)} rightLabel={HZ_MAX.toFixed(2)}
                  readout={<span style={{display:'flex',alignItems:'center',gap:3}}>
                    <input type="number" className="num"
                      style={{width:44,fontSize:11,fontWeight:700,color:'#94a3b8',
                              background:'transparent',fontFamily:'var(--font-mono)',
                              borderRadius:2,textAlign:'right',padding:'0 2px',
                              border:rearHzDraft!==null?'1px solid #334155':'1px solid transparent'}}
                      min={HZ_MIN} max={HZ_MAX} step={0.01}
                      value={rearHzDraft??secHz.toFixed(2)}
                      onFocus={()=>setRearHzDraft(secHz.toFixed(2))}
                      onChange={e=>setRearHzDraft(e.target.value)}
                      onBlur={()=>{
                        const v=parseFloat(rearHzDraft);
                        if(!isNaN(v)) pFe('rearHzMan')(Math.max(HZ_MIN,Math.min(HZ_MAX,v)));
                        setRearHzDraft(null);
                      }}
                      onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}/>
                    <span style={{fontSize:11,color:'#94a3b8',fontFamily:'var(--font-mono)'}}>Hz</span>
                  </span>}
                  hint={rRef==='rear'
                    ?"Front spring frequency set independently. Full decoupling — set rear via Ride Stiffness above, set front here."
                    :"Rear spring frequency set independently from flat-ride. Allows full decoupling of front and rear stiffness. Front Hz is still set by Ride Stiffness above."}/>;
            })()}
            <div style={{display:'flex',alignItems:'center',gap:6,
                         padding:'5px 8px',background:'#0a0f1a',borderRadius:2,

              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>FRONT</span>
              <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>{physics.frontHz.toFixed(2)}</span>
              <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span>
              <div style={{flex:1,height:1,background:'#1e293b'}}/>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:0.5,fontFamily:'var(--font-mono)'}}>

              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>REAR</span>
              <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>{tune.rHz.toFixed(2)}</span>
              <span style={{fontSize:10,color:'#94a3b8'}}>Hz</span>

            {/* spring rate strip */}
            <div style={{display:'flex',alignItems:'center',gap:6,
                         padding:'4px 8px',background:'#0a0f1a',borderRadius:2,
                         border:'1px solid #1e293b',marginBottom:8,marginTop:-4}}>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>SPR F</span>
              <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#9ca3af'}}>
                {metricUnits

                  :`${Math.round(tune.springF)} lb/in`}
              </span>
              <div style={{flex:1,height:1,background:'#1e293b'}}/>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>SPR R</span>
              <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#9ca3af'}}>
                {metricUnits
                  ?`${(tune.springR*NMM_PER_LBIN).toFixed(1)} N/mm`
                  :`${Math.round(tune.springR)} lb/in`}
              </span>
            </div>
            </div>
          </Sec></div>

          <div id="zone-damping" style={dim('damping')}><Sec title="DAMPERS" open={open.dampers} onToggle={tog('dampers')}
            onReset={()=>setFe(p=>({...p,
              dampingMode:DEF_FE.dampingMode,
              dampingBias:DEF_FE.dampingBias,
              reboundZeta:DEF_FE.reboundZeta,
              bumpRatio:DEF_FE.bumpRatio,
              bumpZeta:DEF_FE.bumpZeta,
              dampCharMode:DEF_FE.dampCharMode,
              settleTarget:DEF_FE.settleTarget}))}>
            {/* damping character mode toggle — INT/PRO only */}
            {uiMode!=='beginner'&&<>
              <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:3}}>
                <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>REBOUND MODE</span>
                <Hint text={(fe.dampCharMode??'zeta')==='settle'
                  ?"SETTLE TIME: set a target settle time in seconds. The app back-calculates the rebound ζ needed to hit that time for each axle individually — front and rear derive their own ζ from their own spring frequency."
                  :"CHARACTER: set rebound damping directly as a ζ (damping ratio) percentage. Full manual control — you pick the value, the app doesn't back-solve anything."}/>
              </div>
              <div style={{display:'flex',gap:3,marginBottom:8}}>
                <button className={`tog${(fe.dampCharMode??'zeta')==='zeta'?' on':''}`}
                  onClick={()=>setFe(p=>({...p,dampCharMode:'zeta'}))}>CHARACTER</button>
                <button className={`tog${(fe.dampCharMode??'zeta')==='settle'?' on':''}`}
                  onClick={()=>setFe(p=>({...p,dampCharMode:'settle'}))}>SETTLE TIME</button>
              </div>
            </>}
            {(fe.dampCharMode??'zeta')==='settle'
              ? <FeelSlider label="Settle Target" value={fe.settleTarget??0.80}
                  onChange={pFe('settleTarget')} min={0.10} max={2.00} step={0.01}
                  leftLabel="0.10s" rightLabel="2.0s"
                  hint="Target settle time — how quickly oscillations die out after a bump. The app back-calculates rebound ζ for each axle from its spring frequency. Lower = tighter, more controlled. Higher = softer, more comfortable. Settle Bias skews the F/R timing ratio."
                  markers={[
                    {value:0.35,color:'#ef4444',label:'PLANTED'},
                    {value:0.60,color:'#f59e0b',label:'RACE'},
                    {value:0.90,color:'#9ca3af',label:'SPORT'},
                    {value:1.30,color:'#60a5fa',label:'ROAD'},
                  ]}
                  readout={(()=>{
                    const t=fe.settleTarget??0.80;
                    return`${t.toFixed(2)}s → F ${Math.round(physics.zetaF)}% R ${Math.round(physics.zetaR)}%`;
                  })()}/>
              : <FeelSlider label="Rebound ζ" value={fe.reboundZeta??70}
                  onChange={pFe('reboundZeta')} min={10} max={115} step={1}
                  leftLabel="10%" rightLabel="115%"
                  hint="Damping ratio for the rebound (extension) stroke — how quickly the suspension returns after compression. 55–70% is typical. Above 70% (Butterworth) the car feels planted but stiff. Above 100% (overdamped) the suspension moves sluggishly."

                    {value:40, color:'#60a5fa',label:'UNDER',lessThan:true},
                    {value:70, color:'#f59e0b',label:'BWORTH'},

                ?"INDEPENDENT: set bump ζ directly, decoupled from rebound. Use this when you want a specific bump/rebound combination the ratio can't express — e.g. soft bump with firm rebound."

            </div>
            <div style={{display:'flex',gap:3,marginBottom:10}}>
              <button className={`tog${(fe.dampingMode??'ratio')==='ratio'?' on':''}`}
                onClick={()=>setFe(p=>({...p,dampingMode:'ratio'}))}>BUMP RATIO</button>
              <button className={`tog${(fe.dampingMode??'ratio')==='independent'?' on':''}`}

                  bumpZeta:Math.round(physics.bumpZeta)}))}>INDEPENDENT</button>
            </div>
            {(fe.dampingMode??'ratio')==='ratio'
              ? <FeelSlider label="Bump Ratio" value={fe.bumpRatio??56}

                  leftLabel="10%" rightLabel="100%"
                  hint="Bump damping as a percentage of rebound. Lower = softer over sharp hits, more compliant on rough roads. Higher = more consistent feel between bump and rebound strokes. 40–65% is the typical range for most builds. Readout shows ratio / resulting bump ζ."
                  markers={[{value:30,color:'#60a5fa',label:'UNDER',lessThan:true},{value:65,color:'#f59e0b',label:'FIRM'}]}
                  readout={(()=>{
                    const ratio=Math.min(100,fe.bumpRatio??56);
                    const effReb=(fe.dampCharMode??'zeta')==='settle'?physics.zetaF:(fe.reboundZeta??70);
                    const bz=Math.max(10,Math.min(effReb,effReb*ratio/100));
                    const zLabel=bz>100?`${Math.round(bz)}% ⚠ OVERDAMPED`:
                                 bz>70 ?`${Math.round(bz)}% · BUTTERWORTH`:
                                         `${Math.round(bz)}%`;
                    return`${ratio}% / ${zLabel}`;
                  })()}/>
              : <FeelSlider label="Bump ζ" value={fe.bumpZeta??39}
                  onChange={pFe('bumpZeta')} min={10} max={115} step={1}
                  leftLabel="10%" rightLabel="115%"
                  hint="Bump damping ratio set independently from rebound. Useful when you want precise control — e.g. soft bump for road compliance with firm rebound for body control. Keep below rebound for normal handling."
                  markers={[
                    {value:40, color:'#60a5fa',label:'UNDER',lessThan:true},
                    {value:70, color:'#f59e0b',label:'BWORTH'},

            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
              <span style={{fontSize:11,color:'#94a3b8',letterSpacing:1,flexShrink:0}}>SETTLE SYNC</span>

              <div style={{marginLeft:'auto'}}>
                <button className={`tog${fe.settleMode?' on':''}`}

            {(fe.settleMode||(fe.dampCharMode??'zeta')==='settle')
              ? <FeelSlider label="Settle Bias" value={fe.settleBias??0}
                  onChange={pFe('settleBias')} min={-50} max={50} step={1}

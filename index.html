<style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;height:-webkit-fill-available;}
body{background:#020617;color:#cbd5e1;font-family:'Courier New',monospace;overflow:hidden;
     -webkit-text-size-adjust:100%;height:100%;height:-webkit-fill-available;}
@media(max-width:768px){
  body{overflow:auto}
  #root>div>div:nth-child(2){flex-direction:column!important;overflow-y:auto}
  #root>div>div:nth-child(2)>div:first-child{width:100%!important;border-right:none;border-bottom:1px solid #0f172a}
  .tog{padding:7px 0;min-height:32px}
  .tbtn{padding:6px 10px}
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#0a0f1a}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px}
.sidebar-scroll::-webkit-scrollbar{width:12px}
.sidebar-scroll::-webkit-scrollbar-track{background:#0a0f1a;border-left:1px solid #0f172a}
.sidebar-scroll::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px;border:3px solid #0a0f1a}
.sidebar-scroll::-webkit-scrollbar-thumb:hover{background:#334155}
input[type=number]{-moz-appearance:textfield}

     color:#e2e8f0;font-family:'Courier New',monospace;font-size:16px;padding:1px 2px;
     outline:none;text-align:right;transition:border-color .12s,background .12s}

     outline:none;margin-top:6px;cursor:pointer;display:block;border:none;padding:10px 0;
     box-sizing:content-box;background-clip:content-box}
.sli::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#e2e8f0;
  border-radius:50%;cursor:pointer;margin-top:-5.5px;transition:transform .15s;
  box-shadow:0 0 0 2px #02061799}
.sli::-webkit-slider-thumb:hover{transform:scale(1.2)}
.sli::-moz-range-thumb{width:14px;height:14px;background:#e2e8f0;border-radius:50%;border:none;
  cursor:pointer;box-shadow:0 0 0 2px #02061799}

     letter-spacing:1px;transition:all .12s;-webkit-tap-highlight-color:transparent}

.stog-open{color:#9ca3af}
.card{background:#020617;border:1px solid #1e293b;border-radius:2px;overflow:hidden;margin-bottom:10px}

    display:flex;align-items:center;gap:6px;column-gap:6px}
.ch span{font-size:10px;color:#9ca3af;letter-spacing:2px;text-transform:uppercase}
.cb{padding:7px 8px}

.sl{color:#9ca3af}.sv{color:#9ca3af;font-size:12px}.su{font-size:10px;color:#6b7280;margin-left:3px}

<body>
<div id="root">
  <!-- Shown only if React fails to mount -->
  <div id="pre-load" style="padding:24px;color:#6b7280;font-family:Courier New,monospace;font-size:12px;background:#020617;min-height:100vh">
    <div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">SUSP.OS</div>
    <div style="margin-bottom:16px">Loading...</div>
  </div>
</div>
<script>
// Global error catcher — fires before React/Babel, shows error on blank screen
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('pre-load');
  if(d){
    d.innerHTML='<div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">SUSP.OS — Failed to load</div>'
      +'<div style="color:#6b7280;margin-bottom:12px">JavaScript error on line '+line+'</div>'
      +'<div style="background:#0f172a;padding:12px;border-radius:4px;color:#ef4444;word-break:break-all;line-height:1.6">'+(msg||'Unknown error')+'</div>'
      +'<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#0f172a;border:1px solid #1e293b;color:#e2e8f0;border-radius:4px;cursor:pointer;font-family:Courier New;font-size:12px">RELOAD</button>';
  }
};
// Hide the pre-load message once React takes over
window.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){
    var d=document.getElementById('pre-load');
    if(d&&d.innerHTML.indexOf('Loading')>-1)d.style.display='none';
  },5000);
});
</script>
<script id="app-source" type="text/plain">
const {useState,useMemo,useRef,useEffect,useLayoutEffect,useCallback}=React;

const KG_TO_LB=2.204622622,LB_IN_TO_NM=175.126790921,MPH_TO_MS=0.44704;
const KMH_PER_MPH=1.60934;
const NMM_PER_LBIN=LB_IN_TO_NM/100; // ≈1.751 N/mm per lb/in
const ARB_RS_SCALE=240,CAMBER_GAIN=0.7;
const ROLL_CENTER_HEIGHT=0.09;
const DAMPING_CALIBRATION=0.001;
//
//
const MECH_BALANCE_STIFFNESS_WEIGHT=0.60;
const MECH_BALANCE_TARGET=0.65;
const GAME_LIMITS={horizon:{damping:20,arb:65},motorsport:{damping:40,arb:40}};

const cornerMasses=ch=>{
  const kg=ch.weight/KG_TO_LB;
  return{front:(kg*(ch.frontBias/100))/2,rear:(kg*(1-ch.frontBias/100))/2};
};
const parseTyre=str=>{
  const m=String(str??'').trim().match(/^(\d{2,3})\/(\d{2,3})[Rr](\d{1,2}(?:\.\d)?)$/);
  if(!m)return null;
  const width=+m[1],aspect=+m[2],rim=+m[3];
  const diameter=rim*25.4+2*(width*aspect/100);
  return{width,aspectRatio:aspect,rimDiameter:rim,diameter,radius:diameter/2};
};
// rideStiffness now stores Hz directly (0.80–3.50).
// Old saves/shares stored integers 0–100 — detect and auto-migrate.
const rsToHz=rs=>rs>3.5?0.8+(rs/100)*2.7:rs;
const hzToRs=hz=>Math.round(Math.max(0.80,Math.min(3.50,hz))*100)/100;
const flatRideRearHz=(fHz,wb,mph)=>{
  if(mph>=200)return{hz:fHz,clamped:false};
  const ms=mph*MPH_TO_MS;
  if(ms<1)return{hz:fHz*1.2,clamped:false};
  const t=wb/ms,d=(1/fHz)-(2*t);
  const raw=d>0.05?1/d:fHz*1.2;
  const clamped=raw>fHz*1.6;
  return{hz:clamped?fHz*1.6:raw,clamped};
};
// Shared ref: given avgHz = (fHz+rHz)/2 and flat-ride constraint, solve fHz.
// Substituting rHz=1/(1/fHz−2t) into avg equation gives quadratic:
//   t·fHz² − fHz·(1+2·avg·t) + avg = 0  →  smaller root = frontHz
const flatRideSharedHz=(avgHz,wb,mph)=>{
  if(mph>=200)return{fHz:avgHz,rHz:avgHz,clamped:false};
  const ms=mph*MPH_TO_MS;
  if(ms<1){const fHz=Math.max(0.8,avgHz/1.1);return{fHz,rHz:Math.max(0.8,2*avgHz-fHz),clamped:false};}
  const t=wb/ms;
  const B=-(1+2*avgHz*t),disc=B*B-4*t*avgHz;
  if(disc<0)return{fHz:avgHz,rHz:avgHz,clamped:true};
  const fHz=Math.max(0.8,(-B-Math.sqrt(disc))/(2*t));
  const res=flatRideRearHz(fHz,wb,mph);
  return{fHz,rHz:res.hz,clamped:fHz<0.8||res.clamped};
};
const solveSpring=(hz,mass,mr)=>{
  const wr=Math.pow(hz*2*Math.PI,2)*mass;
  return(wr/Math.pow(mr,2))/LB_IN_TO_NM;
};
const solveDamp=(hz,mass,z,lim)=>{
  const wr=Math.pow(hz*2*Math.PI,2)*mass,cc=2*Math.sqrt(wr*mass);
  return Math.min(lim,Math.max(1,cc*(z/100)*DAMPING_CALIBRATION));
};
const solveDampRaw=(hz,mass,z)=>{
  const wr=Math.pow(hz*2*Math.PI,2)*mass,cc=2*Math.sqrt(wr*mass);
  return cc*(z/100)*DAMPING_CALIBRATION; // truly unclamped — bounds applied after proportional scaling
};

const feelToPhysics=(ch,fe)=>{
  const gameLim=GAME_LIMITS[fe.gameMode??'horizon']?.arb??65;
  let frontHz=rsToHz(fe.rideStiffness);
  const rearHzMode=fe.rearHzMode??'flatRide';
  // uiRideRef: the reference the user has chosen (front/rear/shared)
  // rideRef:   the internal physics direction (always 'front' in CO-SOLVE since it
  //            works front→rear; we honor uiRideRef by pre-adjusting frontHz instead)
  const arbBalModeEarly=ARB_BAL_MODE_DEC.includes(fe.arbBalMode)?fe.arbBalMode:'weight';
  const uiRideRef=['front','rear','shared'].includes(fe.rideRef)?fe.rideRef:'front';
  const rideRef=arbBalModeEarly==='coSolve'?'front':uiRideRef;
  // CO-SOLVE: K = effectiveRHz/frontHz is constant for given chassis/target/share.
  // Invert it so slider controls the user's chosen reference axle.
  if(arbBalModeEarly==='coSolve'&&uiRideRef!=='front'){
    const twFc=parseTyre(ch.tyreF)?.width??265,twRc=parseTyre(ch.tyreR)?.width??265;
    const mc=cornerMasses(ch);
    const k=MECH_BALANCE_STIFFNESS_WEIGHT;
    const abt=Math.max(0.40,Math.min(0.90,fe.arbBalTarget??MECH_BALANCE_TARGET));
    const rst=Math.max(0.001,Math.min(0.999,(abt-(1-k)*(1-ch.frontBias/100))/k));
    const S=(fe.springShare??50)/100;
    const A=mc.rear*ch.trackR*ch.trackR/(mc.front*ch.trackF*ch.trackF);
    const Rbl=A*twRc/(twFc+A*twRc);
    const Rsp=Math.max(0.001,Math.min(0.999,Rbl+S*(rst-Rbl)));
    const Kcs=Math.sqrt(Rsp*mc.front*ch.trackF*ch.trackF*twFc/((1-Rsp)*mc.rear*ch.trackR*ch.trackR*twRc));
    if(uiRideRef==='rear')   frontHz=Math.max(0.8,frontHz/Kcs);
    else if(uiRideRef==='shared') frontHz=Math.max(0.8,2*frontHz/(1+Kcs));
  }
  let rearHz,rearHzClamped;
  if(rideRef==='shared'){
    // Slider represents avgHz = (fHz+rHz)/2; mode sets the ratio
    const avgHz=frontHz;
    if(rearHzMode==='multiplier'){
      const mult=fe.rearHzMult??1.20;
      frontHz=Math.max(0.8,2*avgHz/(1+mult));
      rearHz=Math.max(0.8,Math.min(4.0,2*avgHz*mult/(1+mult)));
      rearHzClamped=false;
    } else if(rearHzMode==='mech'){
      const K=MECH_BALANCE_STIFFNESS_WEIGHT;
      const twF_m=parseTyre(ch.tyreF)?.width??265,twR_m=parseTyre(ch.tyreR)?.width??265;
      const m_m=cornerMasses(ch);
      const arbBalTgt=Math.max(0.40,Math.min(0.90,fe.arbBalTarget??MECH_BALANCE_TARGET));
      const rsBalTgt=Math.max(0.05,Math.min(0.95,(arbBalTgt-(1-K)*(1-ch.frontBias/100))/K));
      const R_m=rsBalTgt/(1-rsBalTgt);
      const mult_m=Math.sqrt(R_m*m_m.front*ch.trackF*ch.trackF*twF_m/(m_m.rear*ch.trackR*ch.trackR*twR_m));
      frontHz=Math.max(0.8,2*avgHz/(1+mult_m));
      rearHz=Math.max(0.8,Math.min(4.0,2*avgHz*mult_m/(1+mult_m)));
      rearHzClamped=frontHz<=0.8||rearHz>=4.0;
    } else { // flatRide (independent collapses to equal in shared mode)
      const res=flatRideSharedHz(avgHz,ch.wheelbase,fe.targetSpeed);
      frontHz=res.fHz;rearHz=res.rHz;rearHzClamped=res.clamped;
    }
  } else {
    const primaryHz=frontHz; // frontHz = rsToHz(fe.rideStiffness)
    let secondaryHz,secondaryHzClamped;
    if(rearHzMode==='independent'){
      secondaryHz=Math.max(0.8,Math.min(4.0,fe.rearHzMan??1.5));
      secondaryHzClamped=false;
    } else if(rearHzMode==='multiplier'){
      const mult=fe.rearHzMult??1.20;
      const raw=rideRef==='front'?primaryHz*mult:primaryHz/mult;
      secondaryHz=Math.max(0.8,Math.min(4.0,raw));
      secondaryHzClamped=false;
    } else if(rearHzMode==='mech'){
      const K=MECH_BALANCE_STIFFNESS_WEIGHT;
      const twF_m=parseTyre(ch.tyreF)?.width??265,twR_m=parseTyre(ch.tyreR)?.width??265;
      const m_m=cornerMasses(ch);
      const arbBalTgt=Math.max(0.40,Math.min(0.90,fe.arbBalTarget??MECH_BALANCE_TARGET));
      const rsBalTgt=Math.max(0.05,Math.min(0.95,(arbBalTgt-(1-K)*(1-ch.frontBias/100))/K));
      const R_m=rsBalTgt/(1-rsBalTgt);
      const mult_m=Math.sqrt(R_m*m_m.front*ch.trackF*ch.trackF*twF_m/(m_m.rear*ch.trackR*ch.trackR*twR_m));
      const raw_m=rideRef==='front'?primaryHz*mult_m:primaryHz/mult_m;
      secondaryHz=Math.max(0.8,Math.min(4.0,raw_m));
      secondaryHzClamped=raw_m<0.8||raw_m>4.0;
    } else { // flatRide
      if(rideRef==='front'){
        const res=flatRideRearHz(primaryHz,ch.wheelbase,fe.targetSpeed);
        secondaryHz=res.hz;secondaryHzClamped=res.clamped;
      } else {
        // Inverse flat ride: given rearHz, solve frontHz
        if(fe.targetSpeed>=200){
          secondaryHz=primaryHz;secondaryHzClamped=false;
        } else {
          const ms=Math.max(1,fe.targetSpeed*MPH_TO_MS);
          const raw=1/(1/primaryHz+2*(ch.wheelbase/ms));
          secondaryHz=Math.max(0.8,raw);
          secondaryHzClamped=raw<0.8;
        }
      }
    }
    // Assign primary/secondary to front/rear axes
    if(rideRef==='front'){
      rearHz=secondaryHz;rearHzClamped=secondaryHzClamped;
    } else {
      rearHz=primaryHz;rearHzClamped=false;
      frontHz=secondaryHz; // re-assign: secondary is now front
    }
  }
  const dampingMode=fe.dampingMode??'ratio';
  const reboundZeta=Math.max(10,Math.min(115,fe.reboundZeta??70));
  const bumpZeta=dampingMode==='ratio'
    ? Math.max(10,Math.min(reboundZeta,reboundZeta*Math.min(100,fe.bumpRatio??56)/100))
    : Math.max(10,Math.min(115,fe.bumpZeta??39));
  const dampingBias=fe.dampingBias??0;
  const zetaF=Math.max(10,Math.min(115,dampingBias>0?reboundZeta:reboundZeta*(1+dampingBias/200)));
  const zetaR=Math.max(10,Math.min(115,dampingBias<0?reboundZeta:reboundZeta*(1-dampingBias/200)));
  const bumpZetaF=Math.max(10,Math.min(115,dampingBias>0?bumpZeta:bumpZeta*(1+dampingBias/200)));
  const bumpZetaR=Math.max(10,Math.min(115,dampingBias<0?bumpZeta:bumpZeta*(1-dampingBias/200)));
  const arbBalance=Math.max(20,Math.min(80,(100-ch.frontBias)+fe.arbBias*0.4));
  const arbMode=fe.arbMode??'auto';
  const arbTargetRoll=arbMode==='roll'
    ? Math.max(0.3,Math.min(5.0,fe.arbTargetRollMan))
    : 2.6-((frontHz-0.8)/2.7)*1.8;   // used only in roll mode now
  const arbShareMan=Math.max(0,Math.min(80,fe.arbShareMan??15));
  const arbFloor=Math.max(1,Math.min(fe.arbFloor??6,fe.arbCeil??gameLim));
  const arbCeil =Math.max(arbFloor+1,Math.min(gameLim,fe.arbCeil??gameLim));
  const arbBalTarget=Math.max(0.40,Math.min(0.90,fe.arbBalTarget??MECH_BALANCE_TARGET));
  const arbBalMode=ARB_BAL_MODE_DEC.includes(fe.arbBalMode)?fe.arbBalMode:'weight';
  const springShare=Math.max(0,Math.min(100,fe.springShare??50));
  return{frontHz,rearHz,rearHzClamped,rearHzMode,rideRef:uiRideRef,reboundZeta,bumpZeta,zetaF,zetaR,bumpZetaF,bumpZetaR,dampingMode,arbBalance,arbTargetRoll,arbMode,arbShareMan,arbFloor,arbCeil,arbBalTarget,arbBalMode,springShare};
};

const computeTune=(ch,phys,gameMode)=>{
  const lim=GAME_LIMITS[gameMode],m=cornerMasses(ch);
  const{frontHz:fHz,rearHz:rHz,reboundZeta,bumpZeta,zetaF,zetaR,bumpZetaF,bumpZetaR,arbBalance,arbTargetRoll,arbMode,arbShareMan,arbFloor,arbCeil,arbBalTarget,arbBalMode}=phys;
  // CO-SOLVE: solve rear Hz from spring share + mech balance target before anything else
  let effectiveRHz=rHz;
  if(arbBalMode==='coSolve'){
    const twF_cs=parseTyre(ch.tyreF)?.width??265,twR_cs=parseTyre(ch.tyreR)?.width??265;
    const rsSpF_cs=Math.pow(fHz*2*Math.PI,2)*m.front*ch.trackF*ch.trackF/2;
    const k=MECH_BALANCE_STIFFNESS_WEIGHT;
    const targetRsBalance=Math.max(0.001,Math.min(0.999,(arbBalTarget-(1-k)*(1-ch.frontBias/100))/k));
    const rsSpR_base=Math.pow(fHz*2*Math.PI,2)*m.rear*ch.trackR*ch.trackR/2;
    const R_baseline=rsSpR_base*twR_cs/(rsSpF_cs*twF_cs+rsSpR_base*twR_cs);
    const S=(phys.springShare??50)/100;
    const R_sp=Math.max(0.001,Math.min(0.999,R_baseline+S*(targetRsBalance-R_baseline)));
    const rsSpR_tgt=R_sp*rsSpF_cs*twF_cs/((1-R_sp)*twR_cs);
    effectiveRHz=Math.max(0.8,Math.min(4.0,Math.sqrt(2*rsSpR_tgt/(m.rear*ch.trackR*ch.trackR))/(2*Math.PI)));
  }
  const springF=solveSpring(fHz,m.front,1);
  const springR=solveSpring(effectiveRHz,m.rear,1);
  const rawRebF=solveDampRaw(fHz,m.front,zetaF);
  const rawRebR=solveDampRaw(effectiveRHz,m.rear,zetaR);
  const rawBmpF=solveDampRaw(fHz,m.front,bumpZetaF);
  const rawBmpR=solveDampRaw(effectiveRHz,m.rear,bumpZetaR);
  // Proportional scale: if max exceeds limit → scale down; if min below 1 → scale up.
  // Preserves F/R ratio at both bounds.
  const dampScale=(a,b)=>{
    const hi=Math.max(a,b),lo=Math.min(a,b);
    if(hi>lim.damping)return lim.damping/hi;
    if(lo<1)return 1/lo;
    return 1;
  };
  const rebScale=dampScale(rawRebF,rawRebR);
  const bmpScale=dampScale(rawBmpF,rawBmpR);
  const clampDamp=(v,s)=>Math.min(lim.damping,Math.max(1,Math.round(v*s*10)/10));
  const rebF=clampDamp(rawRebF,rebScale);
  const rebR=clampDamp(rawRebR,rebScale);
  const bumpF=clampDamp(rawBmpF,bmpScale);
  const bumpR=clampDamp(rawBmpR,bmpScale);
  const dampingClamped=rebScale!==1||bmpScale!==1;
  const wrFN=Math.pow(fHz*2*Math.PI,2)*m.front,wrRN=Math.pow(effectiveRHz*2*Math.PI,2)*m.rear;
  const rsSpF=(wrFN*ch.trackF*ch.trackF)/2,rsSpR=(wrRN*ch.trackR*ch.trackR)/2;
  const rsSp=rsSpF+rsSpR;
  const totalKg=ch.weight/KG_TO_LB,rollArm=ch.cgHeight-ROLL_CENTER_HEIGHT;
  const rollMoment=totalKg*9.81*rollArm;                       // N·m at 1g
  const rsTotalTarget=rollMoment/(arbTargetRoll*(Math.PI/180)); // N·m/rad (used in roll mode)
  const naturalRollDeg=(rsSp>0)?((rollMoment/rsSp)*(180/Math.PI)):5;
  const autoShareTarget=Math.max(5,Math.min(50,naturalRollDeg*7));
  const shareTarget=arbMode==='share'
    ? arbShareMan/100
    : autoShareTarget/100;             // auto uses natural-roll-derived share
  let rsAbBudget=arbMode==='roll'
    ? rsTotalTarget-rsSpF-rsSpR        // roll mode: invert roll equation as before
    : rsSp*(shareTarget/(1-shareTarget)); // auto + share: target a fraction directly
  const twF=parseTyre(ch.tyreF)?.width??265,twR=parseTyre(ch.tyreR)?.width??265;
  let rF=arbBalance/100;
  let _rsBalK=null;
  if((arbBalMode==='mech'||arbBalMode==='coSolve')&&rsAbBudget>0){
    const k=MECH_BALANCE_STIFFNESS_WEIGHT;
    const rsBalTarget=Math.max(0.001,Math.min(0.999,(arbBalTarget-(1-k)*(1-ch.frontBias/100))/k));
    _rsBalK=rsBalTarget/(1-rsBalTarget);
    rF=Math.max(0,Math.min(1,(_rsBalK*(rsSpF+rsAbBudget)*twF-rsSpR*twR)/(rsAbBudget*(twR+_rsBalK*twF))));
  }
  //
  const lightShare=Math.min(rF,1-rF);                          // smaller fraction
  const heavyShare=Math.max(rF,1-rF);                          // larger fraction
  const lightTrack=rF<=0.5?ch.trackR:ch.trackF;                // lighter side track
  const heavyTrack=rF>=0.5?ch.trackR:ch.trackF;                // heavier side track
  const rsLightFloor=arbFloor*ARB_RS_SCALE*lightTrack*lightTrack;
  const rsHeavyFloor=rsLightFloor*(heavyShare/lightShare);     // scaled to preserve ratio
  const budgetFloor=rsLightFloor+rsHeavyFloor;
  if(rsAbBudget<budgetFloor)rsAbBudget=budgetFloor;
  const rsHeavyCeil=arbCeil*ARB_RS_SCALE*heavyTrack*heavyTrack;
  const rsHeavyBudget=rsAbBudget*heavyShare;
  if(rsHeavyBudget>rsHeavyCeil)rsAbBudget=rsHeavyCeil/heavyShare;
  if(_rsBalK!==null)
    rF=Math.max(0,Math.min(1,(_rsBalK*(rsSpF+rsAbBudget)*twF-rsSpR*twR)/(rsAbBudget*(twR+_rsBalK*twF))));
  const clk=(rs,track)=>{const v=Math.min(Math.min(lim.arb,arbCeil),Math.max(1,rs/(ARB_RS_SCALE*track*track)));return Math.round(v*10)/10;};
  const arbF=clk(rsAbBudget*(1-rF),ch.trackF);
  const arbR=clk(rsAbBudget*rF,ch.trackR);
  const rsAbF=arbF*ARB_RS_SCALE*ch.trackF*ch.trackF;
  const rsAbR=arbR*ARB_RS_SCALE*ch.trackR*ch.trackR;
  const rsTotal=rsSpF+rsSpR+rsAbF+rsAbR;
  const rollDeg=rsTotal>0?rollMoment/rsTotal*(180/Math.PI):0;
  const rollClamped=arbMode==='roll'&&Math.abs(rollDeg-arbTargetRoll)>0.05;
  const nf=ch.frontBias/100;
  // positive = oversteer (rear-heavy roll stiffness), negative = understeer (front-heavy)
  const bSp=(rsSpF+rsSpR)>0?(nf-(rsSpF/(rsSpF+rsSpR)))*100:0;
  const bAb=(rsAbF+rsAbR)>0?(nf-(rsAbF/(rsAbF+rsAbR)))*100:0;
  const bTot=bSp+bAb;
  const rsWF=(rsSpF+rsAbF)*twF,rsWR=(rsSpR+rsAbR)*twR;
  const rsBalance=rsWF+rsWR>0?rsWR/(rsWF+rsWR):1-ch.frontBias/100;
  const mechBalance=MECH_BALANCE_STIFFNESS_WEIGHT*rsBalance
                   +(1-MECH_BALANCE_STIFFNESS_WEIGHT)*(1-ch.frontBias/100);
  const settleF=zetaF>0?2.302/((zetaF/100)*fHz*2*Math.PI):99; // ln(10)/(ζ·ωn)
  const settleR=zetaR>0?2.302/((zetaR/100)*effectiveRHz*2*Math.PI):99;
  return{springF,springR,
         rebF:Math.round(rebF*10)/10,rebR:Math.round(rebR*10)/10,
         bumpF:Math.round(bumpF*10)/10,bumpR:Math.round(bumpR*10)/10,
         arbF,arbR,
         fHz,rHz:effectiveRHz,settle:settleF,settleR,rollDeg,rollTarget:arbTargetRoll,rollClamped,dampingClamped,
         arbShare:rsTotal>0?(rsAbF+rsAbR)/rsTotal*100:0,
         bSp,bAb,bTot,mechBalance,
         rsSpF,rsSpR,rsAbF,rsAbR,
         balArbSplit:(arbBalMode==='mech'||arbBalMode==='coSolve')?Math.round(rF*100):null};
};

const computeAlignment=(ch,tune,layout,buildType)=>{
  const{fHz,rHz,rollDeg}=tune;
  const build=buildType??'track';
  const isDrift=build==='drift';
  const isStreet=build==='street';

  const camberGain=Math.max(0.55,Math.min(0.85,1.05-(ch.cgHeight??0.45)*0.8));
  const rearGainMult=layout==='FWD'?0.50:layout==='AWD'?0.70:0.75;
  const fwdReduction=layout==='FWD'?0.3:0.0;

  let recCamberF, recCamberR;
  if(isDrift){
    recCamberF=layout==='FWD'?-2.0:-3.0;
    recCamberR=layout==='FWD'?-1.0:-1.5;
  } else {
    const optimalCamber=isStreet?-1.0:-1.5;
    recCamberF=Math.round(Math.max(-4.0,Math.min(0.0,
      optimalCamber - rollDeg*camberGain + fwdReduction))*10)/10;
    recCamberR=Math.round(Math.max(-3.5,Math.min(0.0,
      optimalCamber - rollDeg*camberGain*rearGainMult))*10)/10;
  }

  const toeFByBuild={
    street: layout==='FWD'?0.05:0.0,
    track:  layout==='FWD'?0.05:-0.05,
    drift:  layout==='FWD'?0.0:-0.10,
  }[build]??-0.05;
  const recToeF=Math.round(Math.max(-0.20,Math.min(0.15,
    toeFByBuild+(ch.frontBias-50)*-0.003+(fHz-1.8)*0.010))*10)/10;

  const toeRBase=isDrift
    ? 0.05
    : layout==='RWD'
      ? (isStreet?0.15:0.10)
      : layout==='AWD'?0.08:0.05;
  const recToeR=Math.round(Math.max(0.0,Math.min(0.25,
    toeRBase+((1-ch.frontBias/100)-0.5)*0.20+Math.max(0,rHz-fHz)*-0.03))*10)/10;

  const casterBase=isDrift?4.8:isStreet?5.2:5.8;
  const recCaster=parseFloat(Math.max(4.0,Math.min(7.5,
    casterBase+(fHz-1.8)*0.4+(ch.frontBias-50)*0.04+(layout==='FWD'?-0.5:0))).toFixed(1));

  return{recCamberF,recCamberR,recToeF,recToeR,recCaster};
};

const DIFF_BIAS_SCALE=0.14; // slightly higher — AWD contributions now split by center fraction

const computeDiff=(ch,fe,dr)=>{
  const rB=1-ch.frontBias/100;
  const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,Math.round(v)));
  const biasExit=dr.diffBiasExit??0;       // rear exit intent (−50=grip, +50=rotate)
  const biasEntry=dr.diffBiasEntry??0;     // entry intent (−50=loose, +50=stable)
  const frontExitBias=dr.diffFrontExitBias??0; // AWD front exit push intent
  const build=dr.buildType??'track';

  let vals;
  if(dr.diffManual){
    vals=dr.layout==='AWD'
      ?{layout:'AWD',
        frontAccel:dr.diffFrontAccel??25, frontDecel:dr.diffFrontDecel??0,
        rearAccel: dr.diffRearAccel??50,  rearDecel: dr.diffRearDecel??10,
        center:    dr.diffCenter??65}
      :{layout:dr.layout,
        accel:dr.diffAccel??35, decel:dr.diffDecel??10};
  } else if(dr.layout==='AWD'){
    const center=cl(dr.diffCenter??65,45,80); // slider-driven; default 65 is sensible across builds
    vals={layout:'AWD',
      frontAccel:cl(28-biasExit*0.10+frontExitBias*0.12,10,40),
      frontDecel:0,
      rearAccel: cl(48+biasExit*0.25,20,70),
      rearDecel: cl(8+(rB-0.5)*15+biasEntry*0.15,0,20),
      center};
  } else {
    const isRWD=dr.layout==='RWD';
    const accelBase=isRWD
      ?{street:28,track:35,drift:48}[build]
      :{street:15,track:20,drift:12}[build];
    const decelBase=isRWD
      ?{street:15,track:12,drift:3}[build]
      :{street:8, track:5, drift:2}[build];
    const accel=isRWD
      ? cl(accelBase+biasExit*0.20, 10, 65)  // right=ROTATE → more rear lock
      : cl(accelBase+biasExit*0.15,  5, 35); // right=PUSH   → more front lock
    const decel=cl(decelBase+(rB-0.5)*(isRWD?15:5)+biasEntry*0.15, 0, isRWD?30:15);
    vals={layout:dr.layout,accel,decel};
  }

  const nf=ch.frontBias/100;
  let bDiffAccel=0, bDiffDecel=0, bDiffFront=0, bDiffRear=0;
  // positive = oversteer tendency, negative = understeer tendency
  if(vals.layout==='AWD'){
    const C=Math.max(0,Math.min(1,(vals.center??65)/100));
    const bFA=-vals.frontAccel*nf*(1-C)*DIFF_BIAS_SCALE;   // front accel → understeer (−)
    const bRA= vals.rearAccel*(1-nf)*C*DIFF_BIAS_SCALE;    // rear accel  → oversteer  (+)
    const bFD=-vals.frontDecel*nf*(1-C)*DIFF_BIAS_SCALE;   // front decel → understeer (−)
    const bRD= vals.rearDecel*(1-nf)*C*DIFF_BIAS_SCALE;    // rear decel  → oversteer  (+)
    bDiffFront=bFA+bFD;
    bDiffRear =bRA+bRD;
    bDiffAccel=bFA+bRA;
    bDiffDecel=bFD+bRD;
  } else if(vals.layout==='RWD'){
    bDiffAccel= vals.accel*(1-nf)*DIFF_BIAS_SCALE;  // rear accel → oversteer (+)
    bDiffDecel= vals.decel*(1-nf)*DIFF_BIAS_SCALE;  // rear decel → oversteer (+)
  } else {
    bDiffAccel=-vals.accel*nf*DIFF_BIAS_SCALE;  // front accel → understeer (−)
    bDiffDecel=-vals.decel*nf*DIFF_BIAS_SCALE;  // front decel → understeer (−)
  }

  return{...vals,bDiffAccel,bDiffDecel,bDiffFront,bDiffRear};
};

const computeCheck=(spr,damp,masses)=>{
  const wrF=spr.f*LB_IN_TO_NM,wrR=spr.r*LB_IN_TO_NM;
  const hF=wrF>0?Math.sqrt(wrF/masses.front)/(2*Math.PI):0;
  const hR=wrR>0?Math.sqrt(wrR/masses.rear)/(2*Math.PI):0;
  const ccF=2*Math.sqrt(wrF*masses.front),ccR=2*Math.sqrt(wrR*masses.rear);
  return{hF,hR,
    zRebF:ccF>0?(damp.rebF/DAMPING_CALIBRATION/ccF)*100:0,zRebR:ccR>0?(damp.rebR/DAMPING_CALIBRATION/ccR)*100:0,
    zBmpF:ccF>0?(damp.bumpF/DAMPING_CALIBRATION/ccF)*100:0,zBmpR:ccR>0?(damp.bumpR/DAMPING_CALIBRATION/ccR)*100:0};
};

const mergeDefaults=(initial,parsed)=>
  (initial&&typeof initial==='object'&&!Array.isArray(initial)
    &&parsed&&typeof parsed==='object'&&!Array.isArray(parsed))
    ?{...initial,...parsed}:parsed;
const usePersist=(key,initial)=>{
  const[val,setVal]=useState(()=>{
    try{const s=localStorage.getItem(key);
      return s?mergeDefaults(initial,JSON.parse(s)):initial;}
    catch(e){return initial;} // private browsing or parse error — use defaults
  });
  const set=v=>{
    const next=typeof v==='function'?v(val):v;
    setVal(next);
    try{localStorage.setItem(key,JSON.stringify(next));}catch{}
  };
  return[val,set];
};

const Hint=({text})=>{
  const[pos,setPos]=useState(null);
  const ref=useRef(null);
  const isTouch=useRef(false);

  const calcPos=()=>{
    if(!ref.current)return null;
    const r=ref.current.getBoundingClientRect();
    const TW=Math.min(220,window.innerWidth-16),TH=120,GAP=5,PAD=6;
    const top=r.bottom+GAP+TH>window.innerHeight?r.top-TH-GAP:r.bottom+GAP;
    const left=Math.max(PAD,Math.min(r.left,window.innerWidth-TW-PAD));
    return{top,left,width:TW};
  };

  const onMouseEnter=()=>{ if(!isTouch.current) setPos(calcPos()); };
  const onMouseLeave=()=>{ if(!isTouch.current) setPos(null); };

  const onClick=e=>{
    isTouch.current=true; // mark as touch device once we see a click from touch
    e.stopPropagation();
    setPos(p=>p?null:calcPos());
  };

  useEffect(()=>{
    if(!pos)return;
    const dismiss=()=>setPos(null);
    const t=setTimeout(()=>document.addEventListener('click',dismiss,{once:true}),10);
    return()=>{clearTimeout(t);document.removeEventListener('click',dismiss);};
  },[pos]);

  return(
    <span ref={ref} style={{display:'inline-block',cursor:'help',WebkitTapHighlightColor:'transparent'}}
          onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave}
          onTouchStart={()=>{isTouch.current=true;}}
          onClick={onClick}>
      <span style={{fontSize:10,color:'#6b7280',marginLeft:4}}>ⓘ</span>
      {pos&&ReactDOM.createPortal(
        <div style={{position:'fixed',top:pos.top,left:pos.left,zIndex:1000,width:pos.width??220,
                     background:'#0f172a',border:'1px solid #e2e8f011',borderRadius:2,
                     padding:'7px 9px',fontSize:11,color:'#94a3b8',lineHeight:1.6,
                     pointerEvents:'none',boxShadow:'0 4px 16px #00000088'}}>
          {text}
        </div>,
        document.body
      )}
    </span>
  );
};

const Field=({label,value,onChange,min,max,step=0.01,unit='',hint=null,logScale=false,logMid=null})=>{
  const mid=logMid??Math.sqrt(min*max);
  const valToT=v=>{
    if(!logScale)return(v-min)/(max-min);
    if(v<=mid)return 0.5*Math.log(Math.max(v,min)/min)/Math.log(mid/min);
    return 0.5+0.5*Math.log(v/mid)/Math.log(max/mid);
  };
  const tToVal=t=>{
    if(!logScale)return min+(max-min)*t;
    if(t<=0.5)return min*Math.pow(mid/min,t*2);
    return mid*Math.pow(max/mid,(t-0.5)*2);
  };
  const t=Math.max(0,Math.min(1,valToT(value)));
  const pct=t*100;
  const clamp=v=>Math.max(min,Math.min(max,v));
  const wheelStep=logScale?Math.max(1,Math.round(value*0.005)):step;
  const [draft,setDraft]=useState(null);
  const focused=draft!==null;
  const commit=()=>{
    if(draft===null)return;
    const v=parseFloat(draft);
    onChange(isNaN(v)?value:clamp(v));
    setDraft(null);
  };
  const numRef=useRef(null), sliRef=useRef(null);
  const valRef=useRef(value);
  const draftRef=useRef(draft);
  const onChangeRef=useRef(onChange); useLayoutEffect(()=>{onChangeRef.current=onChange;},[onChange]);
  useLayoutEffect(()=>{valRef.current=value;},[value]);
  useLayoutEffect(()=>{draftRef.current=draft;},[draft]);
  useEffect(()=>{
    const onWheel=e=>{
      const focused=document.activeElement===numRef.current||document.activeElement===sliRef.current;
      if(!focused)return;
      e.preventDefault();
      e.stopPropagation();
      const base=draftRef.current!==null&&!isNaN(parseFloat(draftRef.current))
        ? parseFloat(draftRef.current) : valRef.current;
      const dir=e.deltaY<0?1:-1;
      const dynStep=logScale?(base<6000?1:Math.max(1,Math.round((base-6000)/600))):step;
      const next=clamp(base+dir*dynStep);
      const snapped=logScale?Math.round(next):Math.round(next/step)*step;
      onChangeRef.current(parseFloat(snapped.toFixed(6)));
      if(draftRef.current!==null)setDraft(null);
    };
    const n=numRef.current, s=sliRef.current;
    n&&n.addEventListener('wheel',onWheel,{passive:false});
    s&&s.addEventListener('wheel',onWheel,{passive:false});
    return()=>{
      n&&n.removeEventListener('wheel',onWheel);
      s&&s.removeEventListener('wheel',onWheel);
    };
  },[min,max,step,logScale]);
  return(
    <div style={{marginBottom:10}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
        <span style={{fontSize:12,color:'#9ca3af',minWidth:0,overflow:'hidden',
                      textOverflow:'ellipsis',whiteSpace:'nowrap',marginRight:6}}>
          {label}{hint&&<Hint text={hint}/>}
        </span>
        <div style={{display:'flex',alignItems:'center',gap:3,flexShrink:0}}>
          <input ref={numRef} type="number" className="num" min={min} max={max} step={logScale?1:step}
            value={focused?draft:value}
            onFocus={()=>setDraft(String(value))}
            onChange={e=>setDraft(e.target.value)}
            onBlur={commit}
            onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}/>
          {unit&&<span style={{fontSize:10,color:'#6b7280',fontFamily:'Courier New',
                               whiteSpace:'nowrap'}}>{unit}</span>}
        </div>
      </div>
      <input ref={sliRef} type="range" className="sli" min={0} max={1} step={0.0001}
        value={logScale?t:undefined}
        {...(!logScale&&{min,max,step,value})}
        style={{background:`linear-gradient(to right,#e2e8f0 ${pct}%,#1e293b ${pct}%)`}}
        onChange={e=>onChange(logScale
          ?Math.round(clamp(tToVal(parseFloat(e.target.value))))
          :parseFloat(e.target.value))}/>
    </div>
  );
};


const FeelSlider=({label,value,onChange,min,max,step=1,leftLabel,rightLabel,readout=null,centered=false,locked=false,hint=null,markers=null})=>{
  const pct=((value-min)/(max-min))*100;
  const cPct=((0-min)/(max-min))*100;
  let bg;
  if(centered){
    if(value===0){
      bg=`linear-gradient(to right,#0f172a 49%,#334155 49%,#334155 51%,#0f172a 51%)`;
    } else if(value>0){
      bg=`linear-gradient(to right,#0f172a ${cPct}%,#e2e8f0 ${cPct}%,#e2e8f0 ${pct}%,#0f172a ${pct}%)`;
    } else {
      bg=`linear-gradient(to right,#0f172a ${pct}%,#e2e8f0 ${pct}%,#e2e8f0 ${cPct}%,#0f172a ${cPct}%)`;
    }
  } else {
    bg=`linear-gradient(to right,#e2e8f0 ${pct}%,#1e293b ${pct}%)`;
  }
  const wrapRef=useRef(null);
  const valRef=useRef(value);
  useLayoutEffect(()=>{valRef.current=value;},[value]);
  const lockRef=useRef(locked); lockRef.current=locked;
  const onChangeRef=useRef(onChange); useLayoutEffect(()=>{onChangeRef.current=onChange;},[onChange]);
  useEffect(()=>{
    const onWheel=e=>{
      if(document.activeElement!==wrapRef.current&&!wrapRef.current?.contains(document.activeElement))return;
      e.preventDefault();
      e.stopPropagation();
      if(lockRef.current)return;
      const dir=e.deltaY<0?1:-1;
      const next=Math.max(min,Math.min(max,valRef.current+dir*step));
      const snapped=Math.round(next/step)*step;
      onChangeRef.current(parseFloat(snapped.toFixed(6)));
    };
    const w=wrapRef.current;
    w&&w.addEventListener('wheel',onWheel,{passive:false});
    return()=>{w&&w.removeEventListener('wheel',onWheel);};
  },[min,max,step]);
  return(
    <div ref={wrapRef} style={{marginBottom:markers&&markers.some(m=>m.label)?18:10,opacity:locked?0.38:1,transition:'opacity .15s'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:3}}>
        <span style={{fontSize:12,color:'#9ca3af',minWidth:0,overflow:'hidden',
                      textOverflow:'ellipsis',whiteSpace:'nowrap',marginRight:6}}>{label}{hint&&<Hint text={hint}/>}</span>
        <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
          {locked&&<span style={{fontSize:10,color:'#94a3b888',letterSpacing:1}}>MANUAL</span>}
          {readout&&(typeof readout==='string'
            ?<span style={{fontSize:11,color:'#9ca3af',fontFamily:'Courier New'}}>{readout}</span>
            :readout)}
        </div>
      </div>
      <div style={{position:'relative'}}>
        <input type="range" className="sli" min={min} max={max} step={step} value={value}
          style={{background:bg,cursor:locked?'not-allowed':'pointer',pointerEvents:locked?'none':'auto'}}
          onChange={e=>!locked&&onChange(parseFloat(e.target.value))}/>
        {centered&&<div style={{
          position:'absolute',left:'50%',top:'50%',
          transform:'translate(-50%,-50%)',
          width:2,height:10,background:value===0?'#e2e8f0':'#334155',
          borderRadius:1,pointerEvents:'none',transition:'background .15s'}}/>}
        {markers&&markers.map(m=>{
          const pct=(m.value-min)/(max-min);
          const left=`calc(${pct*100}% + ${(0.5-pct)*14}px)`;
          const active=value>=m.value;
          return(
            <div key={m.value} style={{position:'absolute',left,top:'50%',
                transform:'translate(-50%,-50%)',pointerEvents:'none',
                display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
              <div style={{width:1.5,height:8,borderRadius:1,
                           background:active?m.color:'#1e293b',
                           transition:'background .15s'}}/>
              {m.label&&<span style={{fontSize:8,color:active?m.color:'#6b7280',
                                      letterSpacing:0.5,whiteSpace:'nowrap',
                                      transition:'color .15s',marginTop:2}}>
                {m.label}
              </span>}
            </div>
          );
        })}
      </div>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:4}}>
        <span style={{fontSize:10,color:'#6b7280',letterSpacing:1}}>{leftLabel}</span>
        <span style={{fontSize:10,color:'#6b7280',letterSpacing:1}}>{rightLabel}</span>
      </div>
    </div>
  );
};

const DampingDial=({rebound,bump})=>{
  const[hover,setHover]=useState(null); // 'rebound'|'bump'|null
  const SIZE=120,CX=60,CY=58,R=46;
  const GAP_DEG=60; // gap at bottom
  const START=180+GAP_DEG/2;  // 210° from top-clockwise = lower-left
  const SWEEP=360-GAP_DEG;
  const MIN_Z=10,MAX_Z=115;
  const zetaToAngle=z=>START+((z-MIN_Z)/(MAX_Z-MIN_Z))*SWEEP;
  const polar=(deg,r=R)=>{
    const rad=((deg-90)*Math.PI)/180; // SVG: 0deg = top, clockwise
    return[CX+r*Math.cos(rad),CY+r*Math.sin(rad)];
  };
  const arcPath=(a1,a2,r=R)=>{
    const[x1,y1]=polar(a1,r);
    const[x2,y2]=polar(a2,r);
    const sweep=((a2-a1)+360)%360;
    const large=sweep>180?1:0;
    return`M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large},1 ${x2.toFixed(2)},${y2.toFixed(2)}`;
  };
  const rebA=zetaToAngle(rebound);
  const bumpA=zetaToAngle(bump);
  const endA=START+SWEEP;
  const [rxSvg,rySvg]=polar(rebA);
  const [bxSvg,bySvg]=polar(bumpA);
  const bumpPct=rebound>0?Math.round((bump/rebound)*100):0;
  const label=hover==='rebound'?`${Math.round(rebound)}%`
             :hover==='bump'   ?`${Math.round(bump)}%`
             :`${bumpPct}%`;
  const labelSub=hover==='rebound'?'REBOUND'
                :hover==='bump'   ?'BUMP'
                :'B/R';
  const loA=Math.min(rebA,bumpA), hiA=Math.max(rebA,bumpA);
  const crossed=bump>rebound;
  return(
    <div style={{display:'flex',justifyContent:'center',marginBottom:4}}>
      <svg width={SIZE} height={SIZE} style={{overflow:'visible'}}>
        {/* background track */}
        <path d={arcPath(START,endA)} fill="none" stroke="#1e293b" strokeWidth={4} strokeLinecap="round"/>
        {/* rebound arc: START → rebA, red */}
        <path d={arcPath(START,rebA)} fill="none" stroke="#ef4444" strokeWidth={4} strokeLinecap="round" opacity={0.7}/>
        {/* bump arc: START → bumpA, blue */}
        <path d={arcPath(START,bumpA)} fill="none" stroke="#3b82f6" strokeWidth={4} strokeLinecap="round" opacity={0.7}/>
        {/* fill between thumbs */}
        <path d={arcPath(loA,hiA)} fill="none"
          stroke={crossed?'#f59e0b':'#7c3aed'} strokeWidth={3} strokeLinecap="round" opacity={0.5}/>
        {/* rebound thumb */}
        <circle cx={rxSvg} cy={rySvg} r={5} fill="#ef4444" stroke="#0f172a" strokeWidth={1.5}
          style={{cursor:'default'}}
          onMouseEnter={()=>setHover('rebound')} onMouseLeave={()=>setHover(null)}
          onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='rebound'?null:'rebound');}}/>
        {/* bump thumb */}
        <circle cx={bxSvg} cy={bySvg} r={5} fill="#3b82f6" stroke="#0f172a" strokeWidth={1.5}
          style={{cursor:'default'}}
          onMouseEnter={()=>setHover('bump')} onMouseLeave={()=>setHover(null)}
          onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='bump'?null:'bump');}}/>
        {/* center label */}
        <text x={CX} y={CY-4} textAnchor="middle" fill={crossed?'#f59e0b':'#e2e8f0'}
          fontSize={16} fontFamily="Courier New" fontWeight="700">{label}</text>
        <text x={CX} y={CY+11} textAnchor="middle" fill="#475569"
          fontSize={9} fontFamily="sans-serif" letterSpacing={2}>{labelSub}</text>
      </svg>
    </div>
  );
};

const _dialBase=(SIZE=120,CX=60,CY=58,R=46,GAP_DEG=60)=>{
  const START=180+GAP_DEG/2, SWEEP=360-GAP_DEG;
  const polar=(deg,r=R)=>{const rad=((deg-90)*Math.PI)/180;return[CX+r*Math.cos(rad),CY+r*Math.sin(rad)];};
  const arcPath=(a1,a2,r=R)=>{
    const[x1,y1]=polar(a1,r);const[x2,y2]=polar(a2,r);
    const sweep=((a2-a1)+360)%360;const large=sweep>180?1:0;
    return`M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large},1 ${x2.toFixed(2)},${y2.toFixed(2)}`;
  };
  return{START,SWEEP,polar,arcPath,CX,CY,R,SIZE};
};

// balance strip rendered inside an SVG at BY coordinate
const _BalStrip=({rearFrac,wtRearFrac,BY=108})=>{
  const BX=18,BW=84;
  const splitX=BX+rearFrac*BW;
  const wtX=BX+wtRearFrac*BW;
  return(<>
    <rect x={BX} y={BY} width={BW} height={3} rx={1.5} fill="#0f172a"/>
    <rect x={BX} y={BY} width={(1-rearFrac)*BW} height={3} rx={1.5} fill="#818cf8" opacity={0.45}/>
    <rect x={BX+(1-rearFrac)*BW} y={BY} width={rearFrac*BW} height={3} rx={1.5} fill="#38bdf8" opacity={0.45}/>
    <line x1={wtX} y1={BY-2} x2={wtX} y2={BY+5} stroke="#334155" strokeWidth={1}/>
    <rect x={splitX-1} y={BY-3} width={2} height={9} rx={1} fill="#94a3b8"/>
    <text x={BX-2} y={BY+13} textAnchor="end" fill="#334155" fontSize={8}>F</text>
    <text x={BX+BW+2} y={BY+13} textAnchor="start" fill="#334155" fontSize={8}>R</text>
  </>);
};

const SpringDial=({fHz,rHz,rsSpF,rsSpR,frontBias,clamped})=>{
  const[hover,setHover]=useState(null);
  const{START,SWEEP,polar,arcPath,CX,CY,SIZE}=_dialBase();
  const MIN_HZ=0.8,MAX_HZ=3.5;
  const toA=hz=>START+((Math.min(Math.max(hz,MIN_HZ),MAX_HZ)-MIN_HZ)/(MAX_HZ-MIN_HZ))*SWEEP;
  const endA=START+SWEEP;
  const a12=toA(1.2),a18=toA(1.8),a25=toA(2.5);
  const fA=toA(fHz),rA=toA(rHz);
  const[fxS,fyS]=polar(fA);const[rxS,ryS]=polar(rA);
  const spTot=rsSpF+rsSpR;
  const rearSpFrac=spTot>0?rsSpR/spTot:1-(frontBias/100);
  const wtRearFrac=1-frontBias/100;
  const dispVal=hover==='front'?fHz.toFixed(2):hover==='rear'?rHz.toFixed(2)
    :(fHz>0?`×${(rHz/fHz).toFixed(2)}`:'-');
  const dispSub=hover==='front'?'FRONT':hover==='rear'?'REAR':'F/R';
  const centerCol=clamped?'#f59e0b':'#e2e8f0';
  return(
    <div style={{display:'flex',justifyContent:'center',marginBottom:4}}>
      <svg width={SIZE} height={SIZE} style={{overflow:'visible'}}>
        <path d={arcPath(START,endA)} fill="none" stroke="#1e293b" strokeWidth={4} strokeLinecap="round"/>
        <path d={arcPath(START,a12)} fill="none" stroke="#1e3a5f" strokeWidth={4} strokeLinecap="round"/>
        <path d={arcPath(a12,a18)}   fill="none" stroke="#14532d" strokeWidth={4} strokeLinecap="round"/>
        <path d={arcPath(a18,a25)}   fill="none" stroke="#713f12" strokeWidth={4} strokeLinecap="round"/>
        <path d={arcPath(a25,endA)}  fill="none" stroke="#7f1d1d" strokeWidth={4} strokeLinecap="round"/>
        <circle cx={fxS} cy={fyS} r={5} fill="#818cf8" stroke="#0f172a" strokeWidth={1.5} style={{cursor:'default'}}
          onMouseEnter={()=>setHover('front')} onMouseLeave={()=>setHover(null)}
          onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='front'?null:'front');}}/>
        <circle cx={rxS} cy={ryS} r={5} fill="#38bdf8" stroke="#0f172a" strokeWidth={1.5} style={{cursor:'default'}}
          onMouseEnter={()=>setHover('rear')} onMouseLeave={()=>setHover(null)}
          onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='rear'?null:'rear');}}/>
        <text x={CX} y={CY-4} textAnchor="middle" fill={centerCol}
          fontSize={15} fontFamily="Courier New" fontWeight="700">{dispVal}</text>
        <text x={CX} y={CY+11} textAnchor="middle" fill="#475569"
          fontSize={9} fontFamily="sans-serif" letterSpacing={2}>{dispSub}</text>
        <_BalStrip rearFrac={rearSpFrac} wtRearFrac={wtRearFrac}/>
      </svg>
    </div>
  );
};

const ArbDial=({arbF,arbR,arbLimit,rsAbF,rsAbR,frontBias})=>{
  const[hover,setHover]=useState(null);
  const{START,SWEEP,polar,arcPath,CX,CY,SIZE}=_dialBase();
  const toA=v=>START+(Math.min(Math.max(v,0),arbLimit)/arbLimit)*SWEEP;
  const endA=START+SWEEP;
  const a50=toA(arbLimit*0.50),a75=toA(arbLimit*0.75),a90=toA(arbLimit*0.90);
  const fA=toA(arbF),rA=toA(arbR);
  const[fxS,fyS]=polar(fA);const[rxS,ryS]=polar(rA);
  const abTot=rsAbF+rsAbR;
  const rearAbFrac=abTot>0?rsAbR/abTot:1-(frontBias/100);
  const wtRearFrac=1-frontBias/100;
  const rearPct=Math.round(rearAbFrac*100);
  const dispVal=hover==='front'?arbF.toFixed(1):hover==='rear'?arbR.toFixed(1):`${rearPct}%`;
  const dispSub=hover==='front'?`/ ${arbLimit} F`:hover==='rear'?`/ ${arbLimit} R`:'R SPLIT';
  const warnF=arbF>arbLimit*0.88,warnR=arbR>arbLimit*0.88;
  const centerCol=warnF||warnR?'#f59e0b':'#e2e8f0';
  return(
    <div style={{display:'flex',justifyContent:'center',marginBottom:4}}>
      <svg width={SIZE} height={SIZE} style={{overflow:'visible'}}>
        <path d={arcPath(START,endA)} fill="none" stroke="#1e293b" strokeWidth={4} strokeLinecap="round"/>
        <path d={arcPath(START,a50)} fill="none" stroke="#1e3a5f" strokeWidth={4} strokeLinecap="round"/>
        <path d={arcPath(a50,a75)}   fill="none" stroke="#713f12" strokeWidth={4} strokeLinecap="round"/>
        <path d={arcPath(a75,a90)}   fill="none" stroke="#7c2d12" strokeWidth={4} strokeLinecap="round"/>
        <path d={arcPath(a90,endA)}  fill="none" stroke="#7f1d1d" strokeWidth={4} strokeLinecap="round"/>
        <circle cx={fxS} cy={fyS} r={5} fill={warnF?'#f59e0b':'#818cf8'} stroke="#0f172a" strokeWidth={1.5} style={{cursor:'default'}}
          onMouseEnter={()=>setHover('front')} onMouseLeave={()=>setHover(null)}
          onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='front'?null:'front');}}/>
        <circle cx={rxS} cy={ryS} r={5} fill={warnR?'#f59e0b':'#38bdf8'} stroke="#0f172a" strokeWidth={1.5} style={{cursor:'default'}}
          onMouseEnter={()=>setHover('rear')} onMouseLeave={()=>setHover(null)}
          onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='rear'?null:'rear');}}/>
        <text x={CX} y={CY-4} textAnchor="middle" fill={centerCol}
          fontSize={15} fontFamily="Courier New" fontWeight="700">{dispVal}</text>
        <text x={CX} y={CY+11} textAnchor="middle" fill="#475569"
          fontSize={9} fontFamily="sans-serif" letterSpacing={2}>{dispSub}</text>
        <_BalStrip rearFrac={rearAbFrac} wtRearFrac={wtRearFrac}/>
      </svg>
    </div>
  );
};

const ArbRangeSlider=({floor,ceil,onFloor,onCeil,min=1,max=65})=>{
  const trackRef=useRef(null);
  const floorRef=useRef(floor); floorRef.current=floor;
  const ceilRef=useRef(ceil);   ceilRef.current=ceil;
  const pct=v=>((v-min)/(max-min))*100;
  const fromPct=p=>Math.round(min+(max-min)*(p/100));
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

  const startDrag=useCallback((e,thumb)=>{
    e.preventDefault();
    const track=trackRef.current;
    if(!track)return;
    const move=ev=>{
      const client=ev.touches?ev.touches[0].clientX:ev.clientX;
      const{left,width}=track.getBoundingClientRect();
      const raw=clamp(((client-left)/width)*100,0,100);
      const val=fromPct(raw);
      if(thumb==="floor") onFloor(clamp(val,min,ceilRef.current-1));
      else                onCeil (clamp(val,floorRef.current+1,max));
    };
    const up=()=>{
      window.removeEventListener("mousemove",move);window.removeEventListener("mouseup",up);
      window.removeEventListener("touchmove",move);window.removeEventListener("touchend",up);
    };
    window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
    window.addEventListener("touchmove",move,{passive:false});window.addEventListener("touchend",up);
  },[min,max,onFloor,onCeil]);

  const onWheelFloor=useCallback(e=>{
    e.preventDefault();e.stopPropagation();
    onFloor(clamp(floorRef.current+(e.deltaY<0?1:-1),min,ceilRef.current-1));
  },[min,onFloor]);
  const onWheelCeil=useCallback(e=>{
    e.preventDefault();e.stopPropagation();
    onCeil(clamp(ceilRef.current+(e.deltaY<0?1:-1),floorRef.current+1,max));
  },[max,onCeil]);

  const floorThumbRef=useRef(null);
  const ceilThumbRef=useRef(null);
  useEffect(()=>{
    const f=floorThumbRef.current,c=ceilThumbRef.current;
    f&&f.addEventListener("wheel",onWheelFloor,{passive:false});
    c&&c.addEventListener("wheel",onWheelCeil, {passive:false});
    return()=>{
      f&&f.removeEventListener("wheel",onWheelFloor);
      c&&c.removeEventListener("wheel",onWheelCeil);
    };
  },[onWheelFloor,onWheelCeil]);

  const fPct=pct(floor),cPct=pct(ceil);
  const thumbStyle={position:"absolute",top:"50%",transform:"translate(-50%,-50%)",
    width:14,height:14,borderRadius:"50%",background:"#e2e8f0",
    cursor:"grab",boxSizing:"border-box",zIndex:2,boxShadow:"0 0 0 2px #02061799",touchAction:"none"};
  return(
    <div style={{marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:4}}>
        <span style={{fontSize:12,color:"#9ca3af"}}>ARB Range</span>
          <Hint text="Sets the minimum and maximum ARB click values the solver is allowed to use. Left thumb = floor (minimum clicks at high ride stiffness, preserves balance authority). Right thumb = ceiling (maximum clicks at soft ride stiffness, prevents bars from dominating). Both sides scale proportionally to preserve the front/rear balance ratio."/>
        <span style={{fontSize:11,color:"#9ca3af",fontFamily:"Courier New"}}>
          {floor}–{ceil} clicks
        </span>
      </div>
      <div ref={trackRef} style={{position:"relative",height:22,display:"flex",alignItems:"center",
                                  cursor:"default",userSelect:"none",touchAction:"none"}}>
        <div style={{position:"absolute",left:0,right:0,height:3,borderRadius:1.5,background:"#1e293b"}}/>
        <div style={{position:"absolute",left:`${fPct}%`,width:`${cPct-fPct}%`,height:3,
                     borderRadius:1.5,background:"#e2e8f0"}}/>
        <div ref={floorThumbRef} style={{...thumbStyle,left:`${fPct}%`}}
          onMouseDown={e=>startDrag(e,"floor")}
          onTouchStart={e=>startDrag(e,"floor")}/>
        <div ref={ceilThumbRef} style={{...thumbStyle,left:`${cPct}%`}}
          onMouseDown={e=>startDrag(e,"ceil")}
          onTouchStart={e=>startDrag(e,"ceil")}/>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
        <span style={{fontSize:10,color:"#374151",letterSpacing:1}}>1 SOFT</span>
        <span style={{fontSize:10,color:"#374151",letterSpacing:1}}>{max} STIFF</span>
      </div>
    </div>
  );
};

const Sec=({title,open,onToggle,onReset,children})=>{
  const[pending,setPending]=useState(false);
  const timer=useRef(null);
  const handleReset=e=>{
    e.stopPropagation();
    if(pending){clearTimeout(timer.current);setPending(false);onReset();}
    else{setPending(true);timer.current=setTimeout(()=>setPending(false),2000);}
  };
  useEffect(()=>()=>clearTimeout(timer.current),[]);
  return(
    <div style={{borderBottom:'1px solid #0f172a'}}>
      <button className={`stog${open?' stog-open':''}`} onClick={onToggle}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>

            onClick={handleReset}
            title={pending?'Click again to confirm':'Reset to defaults'}
            style={{fontSize:10,color:pending?'#f59e0b':'#6b7280',padding:'1px 5px',borderRadius:2,
                    border:`1px solid ${pending?'#f59e0b44':'#1e293b'}`,lineHeight:1.4,cursor:'pointer',
                    transition:'color .12s,border-color .12s',userSelect:'none'}}>
            {pending?'SURE?':'RESET'}

          <span style={{fontSize:11,color:open?'#9ca3af':'#6b7280',transition:'color .12s'}}>
            {open?'▲':'▼'}

    </div>
  );
};

const BiasSeg=({label,val,hint})=>{
  // positive = oversteer (red/right), negative = understeer (blue/left)
  const c=val>0.5?'#ef4444':val<-0.5?'#3b82f6':'#64748b';
  const scale=15;
  const pct=Math.min(50,Math.abs(val)/scale*50);
  const barStyle=val>=0?{left:'50%',width:`${pct}%`}:{right:'50%',width:`${pct}%`};
  return(
    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
      <div style={{width:72,display:'flex',alignItems:'center',gap:2,flexShrink:0}}>
        <span style={{fontSize:9,color:'#6b7280',letterSpacing:1,lineHeight:1.2}}>{label}</span>
        <Hint text={hint}/>
      </div>
      <div style={{flex:1,position:'relative',height:8,background:'#0f172a',borderRadius:2}}>
        <div style={{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'#1e293b'}}/>
        {Math.abs(val)>0.5&&<div style={{position:'absolute',top:1,bottom:1,borderRadius:1,
          background:c+'bb',...barStyle}}/>}
      </div>
      <span style={{fontFamily:'Courier New',fontSize:11,color:c,width:34,textAlign:'right',flexShrink:0}}>
        {val>=0?'+':''}{val.toFixed(1)}
      </span>
    </div>
  );
};

const aeroLoadCtx=eff=>eff<0.5?['HI DRAG','#ef4444']:eff<0.7?['MED DRAG','#f59e0b']:['LO DRAG','#64748b'];

const HandlingVerdict=({total,bSp,bAb,bDiffAccel,bDiffDecel,bDiffFront,bDiffRear,diffLayout,bBrakeEntry,bAero,bDampBias,mechBalance})=>{
  const cl=v=>Math.max(-50,Math.min(50,v));
  const abs=Math.abs(total);
  // positive = oversteer, negative = understeer
  const label=abs<3?'NEUTRAL':total>0?'OVERSTEER':'UNDERSTEER';
  const col=abs<3?'#e2e8f0':total>0?'#ef4444':'#3b82f6';
  const isAWD=diffLayout==='AWD';
  const contributors=[
    {name:'springs',val:bSp??0},{name:'ARB',val:bAb??0},
    ...(isAWD
      ?[{name:'diff front',val:bDiffFront??0},{name:'diff rear',val:bDiffRear??0}]
      :[{name:'diff exit',val:bDiffAccel??0},{name:'diff entry',val:bDiffDecel??0}]),
    {name:'brakes',val:bBrakeEntry??0},{name:'aero',val:bAero??0},{name:'damping',val:bDampBias??0}
  ];
  const dom=contributors.reduce((a,b)=>Math.abs(b.val)>Math.abs(a.val)?b:a,contributors[0]);
  const domStr=Math.abs(dom.val)>2?` Largest driver: ${dom.name.toUpperCase()}.`:'';
  const tip=abs<3
    ?`Setup is well balanced.${domStr} Fine-tune with alignment if needed.`
    :total>0
      ?(abs>10?`Move the Balance slider toward Understeer to correct.${domStr}`
              :`Small Balance adjustment toward Understeer should correct this.${domStr}`)
      :(abs>10?`Move the Balance slider toward Oversteer to correct.${domStr}`
              :`Small Balance adjustment toward Oversteer should correct this.${domStr}`);
  return(
    <div>
      {mechBalance!=null&&
        <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',
                     marginBottom:10,padding:'6px 10px',background:'#020617',
                     border:'1px solid #1e293b',borderRadius:2}}>
          <span style={{fontSize:10,color:'#6b7280',letterSpacing:2}}>MECH BALANCE</span>
          <div style={{display:'flex',alignItems:'baseline',gap:6}}>
            <span style={{fontFamily:'Courier New',fontSize:16,fontWeight:700,color:'#e2e8f0',lineHeight:1}}>
              {mechBalance.toFixed(2)}
            </span>
            <span style={{fontSize:10,color:'#6b7280',letterSpacing:1}}>0=FRONT · 1=REAR</span>
          </div>
        </div>}
      <div style={{marginBottom:8}}>
        <BiasSeg label="SPRINGS" val={bSp}
          hint="Spring roll-stiffness bias vs weight distribution. + = oversteer (rear springs relatively stiffer). − = understeer (front springs relatively stiffer)."/>
        <BiasSeg label="ARB" val={bAb}
          hint="ARB roll-stiffness bias vs weight distribution. + = oversteer (rear ARBs relatively stiffer). − = understeer (front ARBs relatively stiffer)."/>
        {isAWD?(
          <>
            <BiasSeg label="DIFF F" val={bDiffFront??0}
              hint="AWD front diff net contribution (accel+decel). Front lock pushes understeer (−). Center split and front weight fraction are factored in."/>
            <BiasSeg label="DIFF R" val={bDiffRear??0}
              hint="AWD rear diff net contribution (accel+decel). Rear lock pushes oversteer (+). Center split and rear weight fraction are factored in."/>
          </>
        ):(
          <>
            <BiasSeg label="DIFF EXIT" val={bDiffAccel??0}
              hint={diffLayout==='FWD'?'Front accel lock on-throttle exit. Higher lock = more understeer (−).':'Rear accel lock on-throttle exit. Higher lock = more oversteer (+).'}/>
            <BiasSeg label="DIFF ENTRY" val={bDiffDecel??0}
              hint={diffLayout==='FWD'?'Front decel lock off-throttle entry. Higher lock = more entry understeer (−).':'Rear decel lock off-throttle entry. Higher lock = more oversteer on entry (+).'}/>
          </>
        )}
        <BiasSeg label="BRAKES" val={bBrakeEntry??0}
          hint="Brake-balance contribution to entry. High front bias = understeer on entry (−). Low front bias (rear-biased) = oversteer tendency (+). Based on deviation from 50% neutral."/>
        <BiasSeg label="AERO" val={bAero??0}
          hint="Aero balance contribution. Front-heavy aero (above 0.50) = oversteer tendency (+). Rear-heavy aero (below 0.50) = understeer tendency (−). Use the AERO BIAS row in the Balance Guide (ARB section) to see how much offset this implies for your mech balance target."/>
        <BiasSeg label="DAMP" val={bDampBias??0}
          hint="Damping bias contribution. More front rebound damping resists weight transfer off the front, producing understeer tendency (−). More rear damping does the opposite (+)."/>
      </div>
      <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:5}}>
        <span style={{fontFamily:'Courier New',fontSize:20,fontWeight:700,color:col,lineHeight:1}}>
          {`${total>=0?'+':''}${total.toFixed(1)}`}
        </span>
        <span style={{fontSize:11,color:col,letterSpacing:2}}>{label}</span>
      </div>
      <div style={{fontSize:11,color:'#6b7280',lineHeight:1.6,padding:'6px 8px',
                   background:'#020617',borderRadius:2,border:'1px solid #0f172a'}}>{tip}</div>
      <div style={{fontSize:10,color:'#6b7280',lineHeight:1.5,marginTop:6}}>
        Roll-stiffness and differential contributions. Alignment also affects balance.
      </div>
    </div>
  );
};

              <Field label="Rebound Rear" value={ckDmp.rebR} onChange={pD('rebR')} min={1} max={lim.damping} step={0.1} unit={`/ ${lim.damping}`}/>
              <Field label="Bump Front" value={ckDmp.bumpF} onChange={pD('bumpF')} min={1} max={lim.damping} step={0.1} unit={`/ ${lim.damping}`}/>
              <Field label="Bump Rear" value={ckDmp.bumpR} onChange={pD('bumpR')} min={1} max={lim.damping} step={0.1} unit={`/ ${lim.damping}`}/>

const GAME_MODE_ENC={'horizon':0,'motorsport':1};
const GAME_MODE_DEC=['horizon','motorsport'];
const DAMPING_MODE_ENC={'ratio':0,'independent':1};
const DAMPING_MODE_DEC=['ratio','independent'];
const REAR_HZ_MODE_ENC={'flatRide':0,'independent':1,'multiplier':2};
const REAR_HZ_MODE_DEC=['flatRide','independent','multiplier','mech'];
const ARB_MODE_ENC={'auto':0,'roll':1,'share':2};
const ARB_MODE_DEC=['auto','roll','share','auto']; // index 3 was legacy 'balance' → auto
const ARB_BAL_MODE_ENC={'weight':0,'mech':1,'coSolve':2};
const ARB_BAL_MODE_DEC=['weight','mech','coSolve'];
const LAYOUT_ENC={'FWD':0,'RWD':1,'AWD':2};
const LAYOUT_DEC=['FWD','RWD','AWD'];
const BUILD_ENC={'street':0,'track':1,'drift':2};
const BUILD_DEC=['street','track','drift'];

const encodeTune=(ch,fe,dr,br)=>{
  const arr=[
    ch.weight,ch.frontBias,ch.wheelbase,ch.cgHeight,ch.trackF,ch.trackR,ch.motionRatioF,ch.motionRatioR,
    fe.rideStiffness,fe.arbBias??0,fe.targetSpeed,GAME_MODE_ENC[fe.gameMode]??0,
    DAMPING_MODE_ENC[fe.dampingMode??'ratio']??0,fe.reboundZeta??70,fe.bumpRatio??56,fe.bumpZeta??39,
    ARB_MODE_ENC[fe.arbMode??'auto']??0,fe.arbTargetRollMan??1.8,fe.arbShareMan??15,fe.arbFloor??6,fe.arbCeil??65,
    LAYOUT_ENC[dr.layout]??1,BUILD_ENC[dr.buildType??'track']??1,dr.diffManual?1:0,
    dr.diffBiasExit??0,dr.diffAccel??35,dr.diffDecel??10,
    dr.diffFrontAccel??28,dr.diffFrontDecel??0,dr.diffRearAccel??48,dr.diffRearDecel??8,dr.diffCenter??65,
    dr.diffBiasEntry??0,
    (br?.brakeManual?1:0),br?.brakeBias??DEF_BR.brakeBias,br?.brakePressure??DEF_BR.brakePressure,
    ch.aeroBalance??0.5,
    ch.aeroEfficiency??0.9,
    REAR_HZ_MODE_ENC[fe.rearHzMode??'flatRide']??0,
    fe.rearHzMan??1.5,
    fe.rearHzMult??1.20,
    fe.dampingBias??0,
    ...(()=>{const f=parseTyre(ch.tyreF),r=parseTyre(ch.tyreR);
      return[f?.width??265,r?.width??265,f?.aspectRatio??35,f?.rimDiameter??18,r?.aspectRatio??35,r?.rimDiameter??18];})(),
    fe.arbBalTarget??DEF_FE.arbBalTarget,
    ARB_BAL_MODE_ENC[fe.arbBalMode??'weight']??0,
    dr.diffFrontExitBias??0,
    fe.springShare??DEF_FE.springShare,
  ];
  return btoa(arr.join('|'));
};

const decodeTune=(code)=>{
  const raw=atob(code.trim());
  if(raw.startsWith('{')){
    const{ch:ic,fe:ife,dr:idr}=JSON.parse(raw);
    return{ch:ic,fe:ife,dr:idr};
  }
  const v=raw.split('|').map(Number);
  const ch={weight:v[0],frontBias:v[1],wheelbase:v[2],cgHeight:v[3],trackF:v[4],trackR:v[5],motionRatioF:v[6],motionRatioR:v[7],
            aeroBalance:v.length>=37?v[36]:0.5,
            aeroEfficiency:v.length>=38?v[37]:0.9};
  const fe={rideStiffness:v[8],arbBias:v[9],targetSpeed:v[10],gameMode:GAME_MODE_DEC[v[11]]??'horizon',
            dampingMode:DAMPING_MODE_DEC[v[12]]??'ratio',reboundZeta:v[13],bumpRatio:v[14],bumpZeta:v[15],
            arbMode:ARB_MODE_DEC[v[16]]??'auto',arbTargetRollMan:v[17],arbShareMan:v[18],arbFloor:v[19],arbCeil:v[20],
            rearHzMode:v.length>=39?REAR_HZ_MODE_DEC[v[38]]??'flatRide':'flatRide',
            rearHzMan:v.length>=40?v[39]:DEF_FE.rearHzMan,
            rearHzMult:v.length>=41?v[40]:DEF_FE.rearHzMult,
            dampingBias:v.length>=42?v[41]:0,
            arbBalTarget:v.length>=49?v[48]:DEF_FE.arbBalTarget,
            arbBalMode:v.length>=50?ARB_BAL_MODE_DEC[v[49]]??'weight':'weight',
            springShare:v.length>=52?v[51]:DEF_FE.springShare};
  const _fW=v.length>=43?v[42]:265,_rW=v.length>=44?v[43]:265;
  const _fA=v.length>=45?v[44]:35, _fR=v.length>=46?v[45]:18;
  const _rA=v.length>=47?v[46]:35, _rR=v.length>=48?v[47]:18;
  ch.tyreF=`${_fW}/${_fA}R${_fR}`;
  ch.tyreR=`${_rW}/${_rA}R${_rR}`;
  const dr={layout:LAYOUT_DEC[v[21]]??'RWD',buildType:BUILD_DEC[v[22]]??'track',diffManual:v[23]===1,
            diffBiasExit:v[24]??0,diffAccel:v[25],diffDecel:v[26],
            diffFrontAccel:v[27],diffFrontDecel:v[28],diffRearAccel:v[29],diffRearDecel:v[30],diffCenter:v[31],
            diffBiasEntry:v[32]??0,
            diffFrontExitBias:v.length>=51?v[50]:DEF_DR.diffFrontExitBias};
  const br=v.length>=36
    ?{brakeManual:v[33]===1,brakeBias:v[34],brakePressure:v[35]}
    :{...DEF_BR};
  return{ch,fe,dr,br};
};

const sanitizeTune=({ch,fe,dr,br})=>{
  const n=(v,def)=>(typeof v==='number'&&isFinite(v))?v:def;
  const cl=(v,lo,hi,def)=>Math.max(lo,Math.min(hi,n(v,def)));
  const sArbFloor=cl(fe?.arbFloor,1,64,DEF_FE.arbFloor);
  const sArbCeil=Math.max(sArbFloor+1,cl(fe?.arbCeil,1,65,DEF_FE.arbCeil));
  return{
    ch:{
      weight:       cl(ch?.weight,        100,  18000, DEF_CH.weight),
      frontBias:    cl(ch?.frontBias,      30,   70,   DEF_CH.frontBias),
      wheelbase:    cl(ch?.wheelbase,      0.4,  4.0,  DEF_CH.wheelbase),
      cgHeight:     cl(ch?.cgHeight,       0.2,  0.9,  DEF_CH.cgHeight),
      trackF:       cl(ch?.trackF,         1.0,  2.2,  DEF_CH.trackF),
      trackR:       cl(ch?.trackR,         1.0,  2.2,  DEF_CH.trackR),
      motionRatioF: cl(ch?.motionRatioF,   0.5,  1.0,  DEF_CH.motionRatioF),
      motionRatioR: cl(ch?.motionRatioR,   0.5,  1.0,  DEF_CH.motionRatioR),
      aeroBalance:  cl(ch?.aeroBalance,    0,    1.5,  DEF_CH.aeroBalance),
      aeroEfficiency:cl(ch?.aeroEfficiency,0.1,  1.0,  DEF_CH.aeroEfficiency),
      tyreF: parseTyre(ch?.tyreF)?ch.tyreF:DEF_CH.tyreF,
      tyreR: parseTyre(ch?.tyreR)?ch.tyreR:DEF_CH.tyreR,
    },
    fe:{
      rideStiffness:    (()=>{const rs=n(fe?.rideStiffness,DEF_FE.rideStiffness);const hz=rs>3.5?0.8+(rs/100)*2.7:rs;return Math.max(0.80,Math.min(3.50,Math.round(hz*100)/100));})(),
      arbBias:          cl(fe?.arbBias,          -50,   50,  DEF_FE.arbBias),
      arbBalTarget:     cl(fe?.arbBalTarget,     0.40, 0.90, DEF_FE.arbBalTarget),
      arbBalMode:       ARB_BAL_MODE_DEC.includes(fe?.arbBalMode)?fe.arbBalMode:DEF_FE.arbBalMode,
      springShare:      cl(fe?.springShare,         0,  100, DEF_FE.springShare),
      dampingBias:      cl(fe?.dampingBias,      -50,   50,  DEF_FE.dampingBias),
      targetSpeed:      cl(fe?.targetSpeed,       40,  200,  DEF_FE.targetSpeed),
      gameMode:         GAME_MODE_DEC.includes(fe?.gameMode)?fe.gameMode:DEF_FE.gameMode,
      dampingMode:      DAMPING_MODE_DEC.includes(fe?.dampingMode)?fe.dampingMode:DEF_FE.dampingMode,
      reboundZeta:      cl(fe?.reboundZeta,       10,  115,  DEF_FE.reboundZeta),
      bumpRatio:        cl(fe?.bumpRatio,         10,  100,  DEF_FE.bumpRatio),
      bumpZeta:         cl(fe?.bumpZeta,          10,  115,  DEF_FE.bumpZeta),
      arbMode:          ARB_MODE_DEC.includes(fe?.arbMode)?fe.arbMode:DEF_FE.arbMode,
      arbTargetRollMan: cl(fe?.arbTargetRollMan,  0.3,  5.0, DEF_FE.arbTargetRollMan),
      arbShareMan:      cl(fe?.arbShareMan,        0,   80,  DEF_FE.arbShareMan),
      arbFloor:         sArbFloor,
      arbCeil:          sArbCeil,
      rearHzMode:       REAR_HZ_MODE_DEC.includes(fe?.rearHzMode)?fe.rearHzMode:DEF_FE.rearHzMode,
      rearHzMan:        cl(fe?.rearHzMan,          0.8,  4.0, DEF_FE.rearHzMan),
      rearHzMult:       cl(fe?.rearHzMult,         0.5,  3.0, DEF_FE.rearHzMult),
      rideRef:          ['front','rear','shared'].includes(fe?.rideRef)?fe.rideRef:'front',
    },
    dr:{
      layout:         LAYOUT_DEC.includes(dr?.layout)?dr.layout:DEF_DR.layout,
      buildType:      BUILD_DEC.includes(dr?.buildType)?dr.buildType:DEF_DR.buildType,
      diffManual:     typeof dr?.diffManual==='boolean'?dr.diffManual:dr?.diffManual===1,
      diffBiasExit:      cl(dr?.diffBiasExit,      -50, 50, DEF_DR.diffBiasExit),
      diffBiasEntry:     cl(dr?.diffBiasEntry,     -50, 50, DEF_DR.diffBiasEntry),
      diffFrontExitBias: cl(dr?.diffFrontExitBias, -50, 50, DEF_DR.diffFrontExitBias),
      diffAccel:      cl(dr?.diffAccel,       0,  100,  DEF_DR.diffAccel),
      diffDecel:      cl(dr?.diffDecel,       0,  100,  DEF_DR.diffDecel),
      diffFrontAccel: cl(dr?.diffFrontAccel,  0,  100,  DEF_DR.diffFrontAccel),
      diffFrontDecel: cl(dr?.diffFrontDecel,  0,  100,  DEF_DR.diffFrontDecel),
      diffRearAccel:  cl(dr?.diffRearAccel,   0,  100,  DEF_DR.diffRearAccel),
      diffRearDecel:  cl(dr?.diffRearDecel,   0,  100,  DEF_DR.diffRearDecel),
      diffCenter:     cl(dr?.diffCenter,      0,  100,  DEF_DR.diffCenter),
    },
    br:{
      brakeManual:    typeof br?.brakeManual==='boolean'?br.brakeManual:br?.brakeManual===1,
      brakeBias:      cl(br?.brakeBias,       45,  70,  DEF_BR.brakeBias),
      brakePressure:  cl(br?.brakePressure,   50, 200,  DEF_BR.brakePressure),
    },
  };
};

const useTwoTap=(callback,delay=2000)=>{
  const[pending,setPending]=useState(false);
  const timer=useRef(null);
  useEffect(()=>()=>clearTimeout(timer.current),[]);
  const handle=()=>{
    if(pending){clearTimeout(timer.current);setPending(false);callback();}
    else{setPending(true);timer.current=setTimeout(()=>setPending(false),delay);}
  };
  return[pending,handle];
};

const PresetBtn=({name,onLoad})=>{
  const[pending,handle]=useTwoTap(onLoad);
  return(
    <button className="tbtn"
      style={{fontSize:10,padding:'5px 2px',textAlign:'center',
              ...(pending?{borderColor:'#f59e0b88',color:'#f59e0b'}:{})}}
      onClick={handle}
      title={pending?`Click again to load ${name}`:`Load ${name} preset`}>
      {pending?'SURE?':name}
    </button>
  );
};

const SaveSlot=({i,s,onLoad,onSave,onClear,onRename,onNotes,onSaveOver,onResetDefault})=>{
  const[editing,setEditing]=useState(false);
  const[draft,setDraft]=useState('');
  const[pendingLoad,handleLoad]=useTwoTap(onLoad);
  const[pendingClear,handleClear]=useTwoTap(onClear);
  const[pendingOver,handleOver]=useTwoTap(onSaveOver);
  const[pendingReset,handleReset]=useTwoTap(onResetDefault);
  const inputRef=useRef(null);

  const startEdit=e=>{
    e.stopPropagation();
    setDraft(s.name);
    setEditing(true);
    setTimeout(()=>{inputRef.current?.select();},10);
  };
  const commit=()=>{
    const name=draft.trim().slice(0,12)||s.name;
    onRename(i,name);
    setEditing(false);
  };

  const btnRow={display:'flex',gap:2,width:'100%'};
  const iconStyle={flex:1,lineHeight:'20px',textAlign:'center'};

  if(!s) return(
    <button className="tbtn" style={{fontSize:11,color:'#6b7280',borderStyle:'dashed',width:'100%',padding:'10px 8px'}}
      onClick={onSave} title={`Save current tune to slot ${i}`}>
      + {i}
    </button>
  );

  const notesTip=s.notes?` — ${s.notes}`:'';
  return(
    <div style={{display:'flex',flexDirection:'column',gap:2,width:'100%'}}>
      {editing
        ? <input ref={inputRef} autoFocus
            value={draft} onChange={e=>setDraft(e.target.value)}
            onBlur={commit}
            onKeyDown={e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){setEditing(false);}}}
            style={{width:'100%',background:'#0a0f1a',border:'1px solid #e2e8f033',borderRadius:2,
                    color:'#e2e8f0',fontFamily:'Courier New',fontSize:11,padding:'7px 8px',
                    outline:'none',textTransform:'uppercase',boxSizing:'border-box'}}/>
        : <button className="tbtn saved"
            style={{fontSize:11,width:'100%',padding:'9px 8px',overflow:'hidden',
                    textOverflow:'ellipsis',whiteSpace:'nowrap',
                    ...(pendingLoad?{borderColor:'#f59e0b88',color:'#f59e0b'}:{})}}
            onClick={handleLoad} title={pendingLoad?`Click again to load ${s.name}`:`${s.name}${notesTip}`}>
            {pendingLoad?'SURE?':s.name.slice(0,12).toUpperCase()}
          </button>}
      <div style={btnRow}>
        <IconBtn onClick={startEdit} title="Rename" char="✎" style={iconStyle}/>
        <IconBtn
          onClick={()=>{const n=prompt('Notes (shown on hover):',s.notes??'');if(n!==null)onNotes(i,n.slice(0,80));}}
          color={s.notes?'#60a5fa':'#374151'} activeBorder="#60a5fa44" activeColor="#60a5fa"
          title={s.notes||'Add notes'} char="ⓘ" active={!!s.notes} style={iconStyle}/>
        <IconBtn onClick={handleOver} activeBorder="#34d39944" activeColor="#34d399"
          title={pendingOver?'Click again to overwrite with current tune':'Overwrite with current tune'}
          char="↺" active={pendingOver} style={iconStyle}/>
        <IconBtn onClick={handleReset} activeBorder="#818cf844" activeColor="#818cf8"
          title={pendingReset?'Click again to restore default preset':'Reset to default preset'}
          char="↩" active={pendingReset} style={iconStyle}/>
        <IconBtn onClick={handleClear} activeBorder="#f59e0b44" activeColor="#f59e0b"
          title={pendingClear?'Click again to clear':'Clear slot'}
          char={pendingClear?'✓':'✕'} active={pendingClear} style={iconStyle}/>
      </div>
    </div>
  );
};

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){
    if(this.state.err)return(
      <div style={{padding:24,color:'#ef4444',fontFamily:'Courier New',fontSize:12,background:'#020617',minHeight:'100vh'}}>
        <div style={{marginBottom:8,color:'#e2e8f0',fontSize:14}}>SUSP.OS — Failed to load</div>
        <div style={{marginBottom:16,color:'#6b7280'}}>An error occurred. Try reloading the page.</div>
        <div style={{background:'#0f172a',padding:12,borderRadius:4,border:'1px solid #1e293b',
                     whiteSpace:'pre-wrap',wordBreak:'break-all',lineHeight:1.6}}>
          {this.state.err.toString()}
        </div>
        <button onClick={()=>window.location.reload()}
          style={{marginTop:16,padding:'8px 16px',background:'#0f172a',border:'1px solid #1e293b',
                  color:'#e2e8f0',borderRadius:4,cursor:'pointer',fontFamily:'Courier New',fontSize:12}}>
          RELOAD
        </button>
      </div>
    );
    return this.props.children;
  }
}

const TutorialPanel=({mode,step,onNext,onPrev,onClose,onDone})=>{
  const steps=TUTORIALS[mode]??[];
  const total=steps.length;
  const t=steps[step];
  // balance mode always anchors to the balance bar zone even though its steps have focus:null
  const focusKey=mode==='balance'?'balance-bar':(t?.focus?.[0]??null);
  const CARD_W=264;
  // pos: {top,left?,right?,arrowDir,arrowOff} or null = centred
  const[pos,setPos]=useState(null);

  useEffect(()=>{
    const el=focusKey?document.getElementById('zone-'+focusKey):null;
    // Scroll sidebar so element is visible — use direct scrollTop rather than
    // scrollIntoView which can target the wrong scroll container on mobile
    if(el){
      const sidebar=document.querySelector('.sidebar-scroll');
      if(sidebar){
        const sr=sidebar.getBoundingClientRect();
        const er=el.getBoundingClientRect();
        if(er.top<sr.top+40||er.bottom>sr.bottom-40){
          const relTop=er.top-sr.top+sidebar.scrollTop;
          sidebar.scrollTo({top:Math.max(0,relTop-80),behavior:'smooth'});
        }
      }
    }
    const measure=()=>{
      if(!el){setPos(null);return;}
      const r=el.getBoundingClientRect();
      // Hidden element (sidebar collapsed on desktop) → centre card
      if(r.width===0&&r.height===0){setPos(null);return;}
      const vw=window.innerWidth;
      const vh=window.innerHeight;
      const midY=(r.top+r.bottom)/2;
      const midX=(r.left+r.right)/2;
      if(midX<vw/2){
        // LEFT panel: float card just past the sidebar's right edge
        const sidebar=document.querySelector('.sidebar-scroll');
        const sbRight=sidebar?sidebar.getBoundingClientRect().right:r.right;
        const left=Math.min(sbRight+10,vw-CARD_W-8);
        const top=Math.max(50,Math.min(vh-220,midY-80));
        const arrowOff=Math.max(16,Math.min(164,midY-top));
        setPos({top,left,arrowDir:'left',arrowOff});
      } else {
        // RIGHT panel (output, balance-bar): float card above the element
        const top=Math.max(8,r.top-220);
        const left=Math.max(8,Math.min(vw-CARD_W-8,midX-CARD_W/2));
        const arrowOff=Math.max(12,Math.min(CARD_W-24,midX-left));
        setPos({top,left,arrowDir:'down',arrowOff});
      }
    };
    // Slight delay lets scrollIntoView settle before we measure
    const tid=setTimeout(measure,120);
    window.addEventListener('resize',measure);
    return()=>{clearTimeout(tid);window.removeEventListener('resize',measure);};
  },[focusKey]); // eslint-disable-line

  if(!t)return null;
  const mLabel={beginner:'BEG',intermediate:'INT',pro:'PRO',balance:'BALANCE'}[mode]??mode.toUpperCase();
  const btnStyle={background:'none',border:'1px solid #1e293b',borderRadius:2,color:'#9ca3af',
    fontFamily:'Courier New',fontSize:10,padding:'4px 10px',cursor:'pointer',letterSpacing:1};

  const cardBase={position:'fixed',zIndex:700,width:CARD_W,
    maxHeight:'calc(100vh - 40px)',display:'flex',flexDirection:'column',
    background:'#0f172a',border:'1px solid #334155',borderRadius:4,
    padding:'16px 16px 14px',boxShadow:'0 8px 40px #000d',fontFamily:'Courier New'};
  const cardStyle=pos
    ?{...cardBase,top:pos.top,...(pos.left!==undefined?{left:pos.left}:{right:pos.right}),
       maxHeight:`calc(100vh - ${pos.top+20}px)`}
    :{...cardBase,top:'50%',left:'50%',transform:'translate(-50%,-50%)'};

  const arrow=(()=>{
    if(!pos)return null;
    const base={position:'absolute',width:0,height:0};
    if(pos.arrowDir==='left') return(<>
      <div style={{...base,left:-8,top:pos.arrowOff-8,
        borderTop:'8px solid transparent',borderBottom:'8px solid transparent',borderRight:'8px solid #334155'}}/>
      <div style={{...base,left:-6,top:pos.arrowOff-7,
        borderTop:'7px solid transparent',borderBottom:'7px solid transparent',borderRight:'7px solid #0f172a'}}/>
    </>);
    return(<>
      <div style={{...base,bottom:-8,left:pos.arrowOff-8,
        borderLeft:'8px solid transparent',borderRight:'8px solid transparent',borderTop:'8px solid #334155'}}/>
      <div style={{...base,bottom:-6,left:pos.arrowOff-7,
        borderLeft:'7px solid transparent',borderRight:'7px solid transparent',borderTop:'7px solid #0f172a'}}/>
    </>);
  })();

  return(
    <div style={cardStyle}>
      {arrow}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:6}}>
        <div>
          <span style={{fontSize:9,color:'#94a3b8',letterSpacing:2}}>{mLabel} GUIDE  ·  {step+1} / {total}</span>
          <div style={{fontSize:13,color:'#e2e8f0',fontWeight:700,marginTop:3,letterSpacing:0.5}}>{t.title}</div>
        </div>
        <button onClick={onClose} style={{...btnStyle,padding:'3px 8px',marginTop:2,color:'#6b7280'}}>✕</button>
      </div>
      {/* progress bar */}
      <div style={{display:'flex',gap:3,marginBottom:10}}>
        {steps.map((_,i)=>(
          <div key={i} style={{height:2,flex:1,borderRadius:1,transition:'background .2s',
            background:i<step?'#334155':i===step?'#6366f1':'#1e293b'}}/>
        ))}
      </div>
      <p style={{fontSize:11,color:'#94a3b8',lineHeight:1.65,margin:'0 0 12px',
                 overflowY:'auto',flex:1,minHeight:0}}>{t.body}</p>
      <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
        {step>0&&<button style={btnStyle} onClick={onPrev}>← PREV</button>}
        {step<total-1
          ?<button style={{...btnStyle,borderColor:'#4f46e5',color:'#818cf8'}} onClick={onNext}>NEXT →</button>
          :<button style={{...btnStyle,borderColor:'#16a34a',color:'#4ade80'}} onClick={onDone??onClose}>DONE ✓</button>}
      </div>
    </div>
  );
};

<body>
<div id="root">
  <!-- Shown only if React fails to mount -->
  <div id="pre-load" style="padding:24px;color:#6b7280;font-family:var(--font-mono);font-size:12px;background:#020617;min-height:100vh">
    <div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">SUSP.OS</div>
    <div style="margin-bottom:16px">Loading...</div>
  </div>
</div>
<script>
// Global error catcher — fires before React/Babel, shows error on blank screen
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('pre-load');
  if(d){
    d.innerHTML='<div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">SUSP.OS — Failed to load</div>'
      +'<div style="color:#6b7280;margin-bottom:12px">JavaScript error on line '+line+'</div>'
      +'<div style="background:#0f172a;padding:12px;border-radius:4px;color:#ef4444;word-break:break-all;line-height:1.6">'+(msg||'Unknown error')+'</div>'
      +'<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#0f172a;border:1px solid #1e293b;color:#e2e8f0;border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-size:12px">RELOAD</button>';
  }
};
// Hide the pre-load message once React takes over
window.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){
    var d=document.getElementById('pre-load');
    if(d&&d.innerHTML.indexOf('Loading')>-1)d.style.display='none';
  },5000);
});
</script>
<script id="app-source" type="text/plain">
const {useState,useMemo,useRef,useEffect,useLayoutEffect}=React;

const KG_TO_LB=2.204622622,LB_IN_TO_NM=175.126790921,MPH_TO_MS=0.44704,IN_TO_MM=25.4;
const KMH_PER_MPH=1.60934;
const NMM_PER_LBIN=LB_IN_TO_NM/100; // ≈1.751 N/mm per lb/in
const ARB_RS_SCALE=240;
const rollCenterHeight=ch=>ch.cgHeight*0.20; // scales with CG height; ~0.09m for typical sports cars
const DAMPING_CALIBRATION=0.00135;
// Mech-balance model (tyre load sensitivity). See mechBalanceLLT.
const TIRE_LOAD_SENS=0.15;   // grip falloff per unit Fz/Fz_ref (tyre load sensitivity)
const MECH_BAL_GAIN=1.8;     // axle capacity delta → balance offset (calibrated to legacy 0.5-neutral scale)
const WIDTH_GRIP_EXP=0.4;    // tyre width → grip capacity, sub-linear
const TIRE_MECH_SCALE=0.08;  // tyre width rear/front log-ratio → mech balance correction (calibrated from Forza telemetry)
const MECH_BALANCE_TARGET=0.65;
const GAME_LIMITS={horizon:{damping:20,arb:65},motorsport:{damping:40,arb:40}};

const cornerMasses=ch=>{
  const kg=ch.weight/KG_TO_LB;
  return{front:(kg*(ch.frontBias/100))/2,rear:(kg*(1-ch.frontBias/100))/2};
};
const parseTyre=str=>{
  const s=String(str??'').trim();
  if(!s)return null;
  // Tolerant of whatever sits between the numbers — "265/35R18", "265x35r18",
  // "265-35-18", "265 35 18" all parse the same way. Only the digit groups
  // themselves matter; separators are just noise. Sanity-bounded so unrelated
  // text (e.g. stray numbers) doesn't get misread as a plausible tyre size.
  const tokens=s.match(/\d+(?:\.\d+)?/g);
  if(!tokens||!tokens.length)return null;
  const width=+tokens[0];
  if(!(width>=50&&width<=500))return null;
  if(tokens.length===1)return{width,aspectRatio:null,rimDiameter:null,diameter:null,radius:null};
  const aspect=+tokens[1];
  if(!(aspect>=10&&aspect<=100))return null;
  if(tokens.length===2)return{width,aspectRatio:aspect,rimDiameter:null,diameter:null,radius:null};
  const rim=+tokens[2];
  if(!(rim>=8&&rim<=30))return null;
  const diameter=rim*25.4+2*(width*aspect/100);
  return{width,aspectRatio:aspect,rimDiameter:rim,diameter,radius:diameter/2};
};
// Natural mech balance for this chassis — pure roll-stiffness rear fraction at equal springs,
// no ARBs (matches chassisAnalysis.natBal / the "NAT" reference the Balance Guide already uses).
// Uses the measured reading in place of the geometry prediction when MEASURE NAT BAL is active.
// Mech Balance Target/Balance Offset are stored as deltas from this value so a saved/shared
// build re-targets correctly against whatever chassis it's applied to.
const naturalMechBalanceOf=ch=>{
  if(ch.useMeasuredNatBal&&ch.measuredNatBal!=null)return Math.max(0.10,Math.min(0.90,ch.measuredNatBal));
  const mc=cornerMasses(ch);
  return mc.rear*ch.trackR*ch.trackR/(mc.front*ch.trackF*ch.trackF+mc.rear*ch.trackR*ch.trackR);
};
const resolveArbBalTarget=(ch,fe)=>fe.arbBalTarget==null
  ?MECH_BALANCE_TARGET
  :Math.max(0.20,Math.min(0.90,naturalMechBalanceOf(ch)+fe.arbBalTarget));
// rideStiffness now stores Hz directly (HZ_MIN–HZ_MAX).
// Old saves/shares stored integers 0–100 — detect and auto-migrate.
// Single source of truth for the spring-frequency operating band. Change here to
// retune the whole app — physics clamps, codec, slot-scaling, and UI sliders all read these.
const HZ_MIN=0.8,HZ_MAX=5.5;
const rsToHz=rs=>rs>6?0.8+(rs/100)*2.7:rs;
const hzToRs=hz=>Math.round(Math.max(HZ_MIN,Math.min(HZ_MAX,hz))*100)/100;
const flatRideRearHz=(fHz,wb,mph)=>{
  if(mph>=200)return{hz:fHz,clamped:false};
  const ms=mph*MPH_TO_MS;
  if(ms<1)return{hz:fHz*1.2,clamped:false};
  const t=wb/ms,d=(1/fHz)-(2*t);
  const raw=d>0.05?1/d:fHz*1.2;
  const clamped=raw>HZ_MAX;
  return{hz:Math.min(raw,HZ_MAX),clamped};
};
const computeOscillation=(hz,zetaReb100,zetaBump100,durationSec,nPts=300)=>{
  const wn=2*Math.PI*hz,dt=durationSec/nPts;
  const pts=[];let x=1.0,v=0.0;
  for(let i=0;i<=nPts;i++){
    pts.push({t:i*dt,x});
    const zeta=(v<=0?zetaReb100:zetaBump100)/100;
    const a=-wn*wn*x-2*zeta*wn*v;
    v+=a*dt;x+=v*dt;
  }
  return pts;
};
// Shared ref: given avgHz = (fHz+rHz)/2 and flat-ride constraint, solve fHz.
// Substituting rHz=1/(1/fHz−2t) into avg equation gives quadratic:
//   t·fHz² − fHz·(1+2·avg·t) + avg = 0  →  smaller root = frontHz
const flatRideSharedHz=(avgHz,wb,mph)=>{
  if(mph>=200)return{fHz:avgHz,rHz:avgHz,clamped:false};
  const ms=mph*MPH_TO_MS;
  if(ms<1){const fHz=Math.max(HZ_MIN,avgHz/1.1);return{fHz,rHz:Math.max(HZ_MIN,2*avgHz-fHz),clamped:false};}
  const t=wb/ms;
  const B=-(1+2*avgHz*t),disc=B*B-4*t*avgHz;
  if(disc<0)return{fHz:avgHz,rHz:avgHz,clamped:true};
  const fHz=Math.max(HZ_MIN,(-B-Math.sqrt(disc))/(2*t));
  const res=flatRideRearHz(fHz,wb,mph);
  return{fHz,rHz:res.hz,clamped:fHz<HZ_MIN||res.clamped};
};
const solveSpring=(hz,mass,mr)=>{
  const wr=Math.pow(hz*2*Math.PI,2)*mass;
  return(wr/Math.pow(mr,2))/LB_IN_TO_NM;
};
const solveDampRaw=(hz,mass,z)=>{
  const wr=Math.pow(hz*2*Math.PI,2)*mass,cc=2*Math.sqrt(wr*mass);
  return cc*(z/100)*DAMPING_CALIBRATION; // truly unclamped — bounds applied after proportional scaling
};
// Equal-settle damping ratios anchored to the ride-reference axle.
// The reference axle (the one the stiffness slider anchors) holds refZeta; the other axle's
// zeta is derived for equal settle time (ζ·Hz constant). settleBias>0 = rear settles faster,
// preserved across all refs. Returns unclamped {zF,zR}.
const settleZetas=(rideRef,fHz,rHz,refZeta,biasMult)=>{
  if(fHz<=0||rHz<=0) return {zF:refZeta,zR:refZeta};
  if(rideRef==='rear')   return {zR:refZeta, zF:refZeta*(rHz/fHz)/biasMult};
  if(rideRef==='shared'){const avg=(fHz+rHz)/2,b=Math.sqrt(biasMult);
                         return {zF:refZeta*(avg/fHz)/b, zR:refZeta*(avg/rHz)*b};}
  return {zF:refZeta, zR:refZeta*(fHz/rHz)*biasMult}; // front (default)
};

// ── Mech balance — steady-state US/OS from physics ───────────────────────────
// Derived from lateral-load-transfer distribution (set by the front/rear roll-
// stiffness RATIO), tyre load sensitivity (grip falls as vertical load rises —
// the mechanism by which roll stiffness shifts balance), and tyre width as a
// sub-linear grip-capacity multiplier. 0.5 = neutral, >0.5 = oversteer.
// Only Kf/Kr ratio matters for LLTD, so callers may pass relative stiffnesses.
const mechBalanceLLT=(ch,Kf,Kr)=>{
  const g=9.81,a=1.0;
  const twF=parseTyre(ch.tyreF)?.width??265,twR=parseTyre(ch.tyreR)?.width??265;
  const m=cornerMasses(ch),Mf=m.front*2,Mr=m.rear*2,Mt=Mf+Mr,RC=rollCenterHeight(ch);
  const Mphi=Mt*g*a*(ch.cgHeight-RC),sF=Kf/(Kf+Kr);     // sprung roll couple; front elastic share
  const dWf=Mphi*sF/ch.trackF+Mf*g*a*RC/ch.trackF;       // front lateral load transfer (N): elastic + geometric
  const dWr=Mphi*(1-sF)/ch.trackR+Mr*g*a*RC/ch.trackR;   // rear
  const FzRef=Mt*g/4;                                     // avg static wheel load
  const fy=Fz=>{const z=Math.max(0,Fz);return z*Math.max(0,1-TIRE_LOAD_SENS*(z/FzRef-1));};
  const wF=Mf*g/2,wR=Mr*g/2;                              // static wheel loads
  const FyF=Math.pow(twF/265,WIDTH_GRIP_EXP)*(fy(wF+dWf)+fy(wF-dWf));
  const FyR=Math.pow(twR/265,WIDTH_GRIP_EXP)*(fy(wR+dWr)+fy(wR-dWr));
  return Math.max(0,Math.min(1,0.5+MECH_BAL_GAIN*(FyF/(Mf*g)-FyR/(Mr*g))));
};
// pure roll-stiffness rear fraction Kr/(Kf+Kr) → balance
const balanceFromRsBal=(ch,rsBal)=>{
  const r=Math.max(1e-4,Math.min(1-1e-4,rsBal));
  return mechBalanceLLT(ch,1,r/(1-r));
};
const feelToPhysics=(ch,fe)=>{
  let frontHz=rsToHz(fe.rideStiffness);
  const rearHzMode=fe.rearHzMode??'flatRide';
  // uiRideRef: the reference the user has chosen (front/rear/shared)
  // rideRef:   the internal physics direction (always 'front' in CO-SOLVE since it
  //            works front→rear; we honor uiRideRef by pre-adjusting frontHz instead)
  const arbBalModeEarly=ARB_BAL_MODE_DEC.includes(fe.arbBalMode)?fe.arbBalMode:'weight';
  const uiRideRef=['front','rear','shared'].includes(fe.rideRef)?fe.rideRef:'front';
  const rideRef=arbBalModeEarly==='coSolve'?'front':uiRideRef;
  // CO-SOLVE: K = effectiveRHz/frontHz is constant for given chassis/target/share.
  // Invert it so slider controls the user's chosen reference axle.
  if(arbBalModeEarly==='coSolve'&&uiRideRef!=='front'){
    const mc=cornerMasses(ch);
    const abt=Math.max(0.20,Math.min(0.90,fe.arbBalTarget??MECH_BALANCE_TARGET));
    // Match computeTune: subtract the same tyre-width correction so Kcs is consistent.
    const twF=parseTyre(ch.tyreF)?.width??265,twR=parseTyre(ch.tyreR)?.width??265;
    const tireCorr=TIRE_MECH_SCALE*Math.log(twR/twF);
    const rst=Math.max(0.001,Math.min(0.999,abt-tireCorr));
    const S=(fe.springShare??50)/100;
    const A=mc.rear*ch.trackR*ch.trackR/(mc.front*ch.trackF*ch.trackF); // natural rear/front roll-stiffness ratio (no width)
    const Rbl=A/(1+A);
    const Rsp=Math.max(0.001,Math.min(0.999,Rbl+S*(rst-Rbl)));
    const Kcs=Math.sqrt(Rsp*mc.front*ch.trackF*ch.trackF/((1-Rsp)*mc.rear*ch.trackR*ch.trackR)); // rear/front Hz ratio (no width)
    if(uiRideRef==='rear')   frontHz=Math.max(HZ_MIN,frontHz/Kcs);
    else if(uiRideRef==='shared') frontHz=Math.max(HZ_MIN,2*frontHz/(1+Kcs));
  }
  let rearHz,rearHzClamped;
  if(rideRef==='shared'){
    // Slider represents avgHz = (fHz+rHz)/2; mode sets the ratio
    const avgHz=frontHz;
    if(rearHzMode==='multiplier'){
      const mult=fe.rearHzMult??1.20;
      frontHz=Math.max(HZ_MIN,2*avgHz/(1+mult));
      rearHz=Math.max(HZ_MIN,Math.min(HZ_MAX,2*avgHz*mult/(1+mult)));
      rearHzClamped=false;
    } else if(rearHzMode==='mech'&&arbBalModeEarly!=='coSolve'){
      const m_m=cornerMasses(ch);
      const arbBalTgt=Math.max(0.20,Math.min(0.90,fe.arbBalTarget??MECH_BALANCE_TARGET));
      const rsBalTgt=Math.max(0.05,Math.min(0.95,arbBalTgt));         // arbBalTarget is the rsBalance target
      // Weight ARBs sit at the natural balance ratio and dilute the spring correction.
      // Solve springs to a higher ratio so combined (springs + weight ARBs) still hits rsBalTgt:
      //   combined = (1-p)*b_sp + p*rsBalNat = rsBalTgt  →  b_sp = (rsBalTgt - p*rsBalNat)/(1-p)
      // Roll-stiffness fractions are width-independent (width is a grip effect, not stiffness).
      const _V_m=m_m.front*ch.trackF*ch.trackF,_W_m=m_m.rear*ch.trackR*ch.trackR;
      const _rsBalNat_m=_W_m/(_V_m+_W_m);
      let _p_m=0;
      if(arbBalModeEarly==='weight'||arbBalModeEarly==='manual'){
        if((fe.arbMode??'auto')==='share') _p_m=Math.max(0,Math.min(0.99,(fe.arbShareMan??20)/100));
        else if((fe.arbMode??'auto')==='auto'){
          // Two-pass: first pass uses avgHz as proxy; second uses corrected Hz so the
          // auto share assumed here matches what computeTune will settle on.
          let _estF=avgHz,_estR=avgHz;
          for(let _i=0;_i<2;_i++){
            const _rsSp=(Math.pow(_estF*2*Math.PI,2)*m_m.front*ch.trackF*ch.trackF
                        +Math.pow(_estR*2*Math.PI,2)*m_m.rear*ch.trackR*ch.trackR)/2;
            const _nRoll=_rsSp>0?(ch.weight/KG_TO_LB*9.81*(ch.cgHeight-rollCenterHeight(ch))/_rsSp)*(180/Math.PI):5;
            _p_m=Math.max(5,Math.min(50,_nRoll*7))/100;
            const _eff=_p_m>0?Math.max(0.05,Math.min(0.95,(rsBalTgt-_p_m*_rsBalNat_m)/(1-_p_m))):rsBalTgt;
            const _R=_eff/(1-_eff);
            const _mult=Math.sqrt(_R*m_m.front*ch.trackF*ch.trackF/(m_m.rear*ch.trackR*ch.trackR));
            _estF=Math.max(HZ_MIN,2*avgHz/(1+_mult));
            _estR=Math.max(HZ_MIN,Math.min(HZ_MAX,2*avgHz*_mult/(1+_mult)));
          }
        }
        // roll and basic modes: ARB budget is absolute (roll-moment-based or a direct click
        // target respectively), not a share fraction of spring stiffness — _p_m stays 0
      }
      let _manSolved_sh=false;
      if(arbBalModeEarly==='man'){
        const rsAbF_m=(fe.arbManF??20)*ARB_RS_SCALE*ch.trackF*ch.trackF;
        const rsAbR_m=(fe.arbManR??20)*ARB_RS_SCALE*ch.trackR*ch.trackR;

    // rsTotal denominator, so this collapses to one linear equation — see bSp/bAb below.
    const nf0=ch.frontBias/100;
    // Only expand the budget when ARB Bias is centred (0) — that's the only case where
    // "achieve exact cancellation" is actually the goal. The moment ARB Bias is nonzero,
    // the user has already chosen to move the split away from that exact-cancel point, so
    // inflating the budget to reach it first (only to immediately shift off it) just leaves
    // both ends oversized — the classic "ARB Bias pushed to REAR HEAVY + high Rear Multiplier
    // makes both F and R read MAX" bug. Skip the expansion whenever bias is doing the steering.
    if(arbMode==='auto'&&arbBias===0){
      // AUTO's natural-roll ARB budget can be too small (or force too extreme a split) to
      // fully cancel the springs' bias. Expand the budget just past the point where the
      // exact cancelling split becomes achievable. ROLL/SHARE budgets are explicit user
      // choices and are left untouched — neutral only solves the best split within them.
      const target=B=>nf0*(rsSp+B)-rsSpF;
      const cur=target(rsAbBudget);
      let bReq=null;
      if(cur<0&&nf0>0) bReq=rsSpF/nf0-rsSp;
      else if(cur>rsAbBudget&&nf0<1) bReq=(nf0*rsSp-rsSpF)/(1-nf0);
      // Cap the expansion at rsSp (ARBs ≤ 50% of total roll stiffness — the same ceiling
      // autoShareTarget itself never exceeds). Without this, a lopsided spring split (e.g.
      // from a high Rear Multiplier) can demand an arbitrarily large budget to fully cancel
      // the springs' bias, making ARBs "undesirably strong" well past what AUTO should ever
      // produce. Beyond this cap we accept a partial (clipped) cancellation instead.
      if(bReq!=null&&bReq>rsAbBudget) rsAbBudget=Math.min(bReq*1.01,rsSp);
    }
    if(rsAbBudget>0){
      const rsAbF_target=nf0*(rsSp+rsAbBudget)-rsSpF;
      const rF0=Math.max(0,Math.min(1,1-(rsAbF_target/rsAbBudget)));
      rF=Math.max(0,Math.min(1,rF0+arbBias*0.01)); // ARB Bias shifts away from the solved centre — full range at the extremes
    }
  } else if(arbBalMode==='chassis'){
    // Same shape as WEIGHT's split, but anchored to the car's actual natural mech balance
    // (track-width-corrected geometry, or the MEASURE NAT BAL reading when set) instead of
    // raw front weight %. WEIGHT intentionally stays on raw frontBias so BEG/INT output is
    // unaffected — this is the PRO-only mode that actually honours a MEASURE NAT BAL reading
    // (previously that calibration only reached the MECH/CO-SOLVE target, never WEIGHT/NEUTRAL's
    // own split — see docs/KNOWN_ISSUES.md).
    // SAME/OPPOSITE mirrors WEIGHT's own toggle — SAME tracks natural balance directly,
    // OPPOSITE mirrors around 50% so the bars counteract the chassis's natural tendency.
    const natPct=naturalMechBalanceOf(ch)*100;
    rF=Math.max(0,Math.min(1,Math.max(20,Math.min(80,(arbSplitOpposite?natPct:(100-natPct))+arbBias*0.4))/100));
  }
  //
  // In SHARE % mode the user explicitly controls the total ARB budget.
  // Skip the proportional floor raise — it can inflate the budget by 100–1000× when
  // the balance solver produces an extreme rF (near 0 or 1), silently overriding the
  // user's setting. Per-bar game minimum is still enforced by clk() below.
  if(_rsBalK!==null)
    rF=Math.max(0,Math.min(1,(_rsBalK*(rsSpF+rsAbBudget)-rsSpR)/(rsAbBudget*(1+_rsBalK))));
  const clk=(rs,track)=>{const v=Math.min(lim.arb,Math.max(1,rs/(ARB_RS_SCALE*track*track)));return Math.round(v*10)/10;};
  let arbF,arbR;
  if(arbMode==='man'){
    // Manual mode: use user-input ARB values directly (Stiffness Mode MAN — bypasses the
    // budget/split system entirely, which is why it lives here rather than in Balance Mode)
    arbF=Math.max(1,Math.min(lim.arb,arbManF??20));
    arbR=Math.max(1,Math.min(lim.arb,arbManR??20));
  } else {
    // Auto/WEIGHT/MECH/CO-SOLVE: solve from budget
    arbF=clk(rsAbBudget*(1-rF),ch.trackF);
    arbR=clk(rsAbBudget*rF,ch.trackR);
  }
  const rsAbF=arbF*ARB_RS_SCALE*ch.trackF*ch.trackF;
  const rsAbR=arbR*ARB_RS_SCALE*ch.trackR*ch.trackR;
  const rsTotal=rsSpF+rsSpR+rsAbF+rsAbR;
  const rollDeg=rsTotal>0?rollMoment/rsTotal*(180/Math.PI):0;
  const rollClamped=arbMode==='roll'&&Math.abs(rollDeg-arbTargetRoll)>0.05;
  const nf=ch.frontBias/100;
  // positive = oversteer (rear-heavy roll stiffness), negative = understeer (front-heavy)
  // Each term is weighted by its actual share of total roll stiffness so that ARBs
  // (typically 10–15% of rsTotal) don't appear equally important as springs (85–90%).
  const spShare=rsTotal>0?(rsSpF+rsSpR)/rsTotal:1;
  const abShare=rsTotal>0?(rsAbF+rsAbR)/rsTotal:0;
  const bSp=(rsSpF+rsSpR)>0?(nf-(rsSpF/(rsSpF+rsSpR)))*100*spShare:0;
  const bAb=(rsAbF+rsAbR)>0?(nf-(rsAbF/(rsAbF+rsAbR)))*100*abShare:0;
  const bTot=bSp+bAb;
  // Roll-stiffness rear fraction — matches what Forza displays as "Mech Balance".
  const rsKf=rsSpF+rsAbF,rsKr=rsSpR+rsAbR;
  const rsBalance=rsKf+rsKr>0?rsKr/(rsKf+rsKr):1-ch.frontBias/100;
  const mechBalance=Math.max(0,Math.min(1,rsBalance+tireCorr));    // tyre-width corrected: matches Forza's displayed mech balance
  const gripBalance=balanceFromRsBal(ch,rsBalance);                // physical at-limit balance from LLT model (informational)
  // MAN ARB stiffness bypasses the budget/split solve entirely (see arbMode==='man' branch
  // above), so a leftover arbBalMode of mech/coSolve from before switching to MAN must not
  // trigger this "target unreachable" warning — nothing is actually solving toward it.
  const mechBalClamped=arbMode!=='man'&&(arbBalMode==='mech'||arbBalMode==='coSolve')&&Math.abs(mechBalance-arbBalTarget)>0.01;
  const neutralClamped=arbBalMode==='neutral'&&(arbF<=1||arbF>=lim.arb||arbR<=1||arbR>=lim.arb);
  const settleF=zetaF>0?2.302/((zetaF/100)*fHz*2*Math.PI):99; // ln(10)/(ζ·ωn)
  const settleR=zetaR>0?2.302/((zetaR/100)*effectiveRHz*2*Math.PI):99;
  // CO-SOLVE contribution breakdown: how much of balance correction came from springs vs ARBs
  const rsBalSp=rsSpF+rsSpR>0?rsSpR/(rsSpF+rsSpR):0; // spring-only roll balance (after CO-SOLVE Hz adjustment)
  const coSolveSpCorr=arbBalMode==='coSolve'&&coSolveR_baseline!=null?rsBalSp-coSolveR_baseline:null;
  const coSolveAbCorr=arbBalMode==='coSolve'&&coSolveR_baseline!=null?rsBalance-rsBalSp:null;
  const coSolveLiftRisk=arbBalMode==='coSolve'&&effectiveRHz>fHz*1.20;
  return{springF,springR,
         rebF:Math.round(rebF*10)/10,rebR:Math.round(rebR*10)/10,
         bumpF:Math.round(bumpF*10)/10,bumpR:Math.round(bumpR*10)/10,
         arbF,arbR,
         fHz,rHz:effectiveRHz,settle:settleF,settleR,rollDeg,rollTarget:arbTargetRoll,rollClamped,mechBalClamped,neutralClamped,dampingClamped,
         arbShare:rsTotal>0?(rsAbF+rsAbR)/rsTotal*100:0,
         bSp,bAb,bTot,mechBalance,gripBalance,
         rsSpF,rsSpR,rsAbF,rsAbR,
         balArbSplit:(arbBalMode==='mech'||arbBalMode==='coSolve'||arbBalMode==='neutral'||arbBalMode==='chassis')?Math.round(rF*100):null,
         zetaF,zetaR,bumpZetaF,bumpZetaR,
         coSolveAutoS,coSolveSpCorr,coSolveAbCorr,coSolveLiftRisk};
};

const computeAlignment=(ch,tune,layout,buildType)=>{
  const{fHz,rHz,rollDeg}=tune;
  const build=buildType??'track';
  const isDrift=build==='drift';
  const isStreet=build==='street';
  const isRally=build==='rally';
  const isOffroad=build==='offroad';
  const isDrag=build==='drag';

  const camberGain=Math.max(0.55,Math.min(0.85,1.05-(ch.cgHeight??0.45)*0.8));
  const rearGainMult=layout==='FWD'?0.50:layout==='AWD'?0.70:0.75;
  const fwdReduction=layout==='FWD'?0.3:0.0;

  // Drift wants more static camber than Track for sustained high-slip-angle grip; Drag wants
  // near-zero for a flat straight-line contact patch. Both now scale with actual roll/CG like
  // every other build instead of being frozen constants (see docs/KNOWN_ISSUES.md history).
  const optimalCamber=isDrift?-2.5:isDrag?-0.2:isOffroad?-0.3:isRally?-0.8:isStreet?-1.0:-1.5;
  const recCamberF=Math.round(Math.max(-4.0,Math.min(0.0,
    optimalCamber - rollDeg*camberGain + fwdReduction))*10)/10;
  const recCamberR=Math.round(Math.max(-3.5,Math.min(0.0,
    optimalCamber - rollDeg*camberGain*rearGainMult))*10)/10;

  const toeFByBuild={
    street:  layout==='FWD'?0.05:0.0,
    track:   layout==='FWD'?0.05:-0.05,
    drift:   layout==='FWD'?0.0:-0.10,
    rally:   0.0,
    offroad: 0.05,
    drag:    0.0,
  }[build]??-0.05;
  const recToeF=Math.round(Math.max(-0.20,Math.min(0.15,
    toeFByBuild+(ch.frontBias-50)*-0.003+(fHz-1.8)*0.010))*10)/10;

  const toeRByBuild={
    street:  {RWD:0.15,AWD:0.08,FWD:0.05},
    track:   {RWD:0.10,AWD:0.08,FWD:0.05},
    drift:   {RWD:0.05,AWD:0.05,FWD:0.05},
    rally:   {RWD:0.10,AWD:0.08,FWD:0.05},
    offroad: {RWD:0.15,AWD:0.15,FWD:0.10},
    drag:    {RWD:0.0, AWD:0.0, FWD:0.0},
  }[build]??{RWD:0.10,AWD:0.08,FWD:0.05};
  const toeRBase=toeRByBuild[layout]??toeRByBuild.RWD;
  const recToeR=Math.round(Math.max(0.0,Math.min(0.25,
    toeRBase+((1-ch.frontBias/100)-0.5)*0.20+Math.max(0,rHz-fHz)*-0.03))*10)/10;

  const casterBase=isDrift?4.8:isDrag?4.0:isOffroad?4.5:isStreet?5.2:5.8;
  const recCaster=parseFloat(Math.max(4.0,Math.min(7.5,
    casterBase+(fHz-1.8)*0.4+(ch.frontBias-50)*0.04+(layout==='FWD'?-0.5:0))).toFixed(1));

  return{recCamberF,recCamberR,recToeF,recToeR,recCaster};
};

const DIFF_BIAS_SCALE=0.14; // slightly higher — AWD contributions now split by center fraction
const DIFF_TYPE_ENC={'race':0,'sport':1,'rally':2,'offroad':3,'drift':4};
const DIFF_TYPE_DEC=['race','sport','rally','offroad','drift'];
// Community-estimated scale factors: same lock % on Race produces more effective lock than Rally/Offroad.
// Rally ≈ 76% of Race, Offroad ≈ 52% of Race. Sport is accel-only and slightly softer than Race.
// Drift is more aggressive than Race — faster lock engagement, tuned for rotation over stability.
const DIFF_TYPE_SCALE={race:1.00,sport:0.88,rally:0.76,offroad:0.52,drift:1.10};
const DIFF_TYPE_RANGES={
  race:   {accel:[25,60],frontAccel:[18,32],rearAccel:[25,60],decel:[8,25]},
  sport:  {accel:[28,68],frontAccel:[20,36],rearAccel:[28,68],decel:null},
  rally:  {accel:[33,79],frontAccel:[24,42],rearAccel:[33,79],decel:[11,33]},
  offroad:{accel:[48,90],frontAccel:[35,62],rearAccel:[48,90],decel:[15,48]},
  drift:  {accel:[23,55],frontAccel:[16,29],rearAccel:[23,55],decel:[0,8]},
};

const computeDiff=(ch,fe,dr,natMechBalOverride=null)=>{
  const rB=1-ch.frontBias/100;
  const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,Math.round(v)));
  const biasExit=dr.diffBiasExit??0;       // rear exit intent (−50=grip, +50=rotate)
  const biasEntry=dr.diffBiasEntry??0;     // entry intent (−50=loose, +50=stable)
  const frontExitBias=dr.diffFrontExitBias??0; // AWD front exit push intent
  const build=dr.buildType??'track';
  const diffType=dr.diffType??'race';
  const typeScale=DIFF_TYPE_SCALE[diffType]??1.0;

  // MATCH CHASSIS: bias the auto-solver's intent toward the chassis mech target.
  // Off by default; manual mode bypasses it entirely.
  let effBiasExit=biasExit, effBiasEntry=biasEntry;
  if(dr.diffComplement&&!dr.diffManual){
    const cm=cornerMasses(ch);
    // Use measured nat balance when provided (measured mode active), else compute from geometry
    const natMechBal=natMechBalOverride!=null
      ?natMechBalOverride
      :(cm.rear*ch.trackR*ch.trackR)/(cm.front*ch.trackF*ch.trackF+cm.rear*ch.trackR*ch.trackR);
    const tgt=resolveArbBalTarget(ch,fe);
    const gap=tgt-natMechBal; // positive = user wants more rear/oversteer than natural
    // Cap correction so it can't dominate explicit user slider input
    const correction=Math.max(-25,Math.min(25,gap*150));
    // FWD's diffBiasExit/Entry are polarity-inverted vs RWD/AWD: more front lock means more
    // UNDERSTEER on a FWD car (see bDiffAccel/bDiffDecel in the balance formulas below), so
    // the correction must flip sign there or "more oversteer" targets would push FWD toward
    // more understeer instead.
    const signedCorrection=ch.layout==='FWD'?-correction:correction;
    effBiasExit =Math.max(-50,Math.min(50,biasExit +signedCorrection));
    effBiasEntry=Math.max(-50,Math.min(50,biasEntry+signedCorrection*0.5));
  }

  let vals;
  if(dr.diffManual){
    vals=ch.layout==='AWD'
      ?{layout:'AWD',
        frontAccel:dr.diffFrontAccel??25, frontDecel:dr.diffFrontDecel??0,
        rearAccel: dr.diffRearAccel??50,  rearDecel: dr.diffRearDecel??10,
        center:    dr.diffCenter??65}
      :{layout:ch.layout,
        accel:dr.diffAccel??35, decel:dr.diffDecel??10};
  } else if(ch.layout==='AWD'){
    const center=cl(dr.diffCenter??65,45,80); // slider-driven; default 65 is sensible across builds
    vals={layout:'AWD',
      frontAccel:cl((28-effBiasExit*0.10+frontExitBias*0.12)*typeScale,10,40),
      frontDecel:0,
      rearAccel: cl((48+effBiasExit*0.25)*typeScale,20,70),
      rearDecel: diffType==='sport'?0:cl(8+(rB-0.5)*15+effBiasEntry*0.15,0,20),
      center};
  } else {
    const isRWD=ch.layout==='RWD';
    const accelBase=isRWD
      ?{street:28,track:35,drift:48,rally:25,offroad:18,drag:65}[build]??35
      :{street:15,track:20,drift:12,rally:12,offroad:10,drag:20}[build]??20;
    const decelBase=isRWD
      ?{street:15,track:12,drift:3,rally:8,offroad:5,drag:0}[build]??12
      :{street:8, track:5, drift:2,rally:4,offroad:2,drag:0}[build]??5;
    // FWD's +effBiasExit*0.15 is intentionally the SAME sign as RWD's — do not flip it.
    // FWD's EXIT slider UI already inverts the stored value (~index.html:3444-3445) so
    // "more effBiasExit" means the same thing (more lock) on every layout; the UI flip is
    // what makes the slider's right side mean oversteer-leaning despite FWD's opposite
    // lock-to-balance polarity. Flipping the sign here too would double-cancel that fix.
    const accel=isRWD
      ? cl(accelBase*typeScale+effBiasExit*0.20, 10, 65)
      : cl(accelBase*typeScale+effBiasExit*0.15,  5, 35);
    const decel=diffType==='sport'?0:cl(decelBase*typeScale+(rB-0.5)*(isRWD?15:5)+effBiasEntry*0.15, 0, isRWD?30:15);
    vals={layout:ch.layout,accel,decel};
  }

  const nf=ch.frontBias/100;
  let bDiffAccel=0, bDiffDecel=0, bDiffFront=0, bDiffRear=0;
  // positive = oversteer tendency, negative = understeer tendency
  if(vals.layout==='AWD'){
    const C=Math.max(0,Math.min(1,(vals.center??65)/100));
    const bFA=-vals.frontAccel*nf*(1-C)*DIFF_BIAS_SCALE;   // front accel → understeer (−)
    const bRA= vals.rearAccel*(1-nf)*C*DIFF_BIAS_SCALE;    // rear accel  → oversteer  (+)
    const bFD=-vals.frontDecel*nf*(1-C)*DIFF_BIAS_SCALE;   // front decel → understeer (−)
    const bRD= vals.rearDecel*(1-nf)*C*DIFF_BIAS_SCALE;    // rear decel  → oversteer  (+)
    bDiffFront=bFA+bFD;
    bDiffRear =bRA+bRD;
    bDiffAccel=bFA+bRA;
    bDiffDecel=bFD+bRD;
  } else if(vals.layout==='RWD'){
    bDiffAccel= vals.accel*(1-nf)*DIFF_BIAS_SCALE;  // rear accel → oversteer (+)
    bDiffDecel= vals.decel*(1-nf)*DIFF_BIAS_SCALE;  // rear decel → oversteer (+)
  } else {
    bDiffAccel=-vals.accel*nf*DIFF_BIAS_SCALE;  // front accel → understeer (−)
    bDiffDecel=-vals.decel*nf*DIFF_BIAS_SCALE;  // front decel → understeer (−)
  }

  return{...vals,bDiffAccel,bDiffDecel,bDiffFront,bDiffRear};
};

// SOFT | ROAD | FIRM | RACE band boundaries (Hz). Single source of truth shared by
// the hzCtx badge, the RIDE spring dial zones, and the Ride Stiffness slider markers —
// change here and all three stay in sync.
const HZ_BANDS=[1.2,1.8,2.5];
const HZ_BAND_COLS=['#60a5fa','#22c55e','#f59e0b','#ef4444']; // SOFT, ROAD, FIRM, RACE
const hzCtx=hz=>{
  if(hz<HZ_BANDS[0])return['SOFT',HZ_BAND_COLS[0]];
  if(hz<HZ_BANDS[1])return['ROAD',HZ_BAND_COLS[1]];
  if(hz<HZ_BANDS[2])return['FIRM',HZ_BAND_COLS[2]];
  return['RACE',HZ_BAND_COLS[3]];
};
// Slider ticks at each band boundary, labelled with the band that begins there
// (SOFT is the implicit floor). Colour matches that band's hzCtx colour.
const HZ_MARKERS=HZ_BANDS.map((v,i)=>({value:v,color:HZ_BAND_COLS[i+1],
  label:['ROAD','FIRM','RACE'][i]}));
const arbCtx=(arb,limit)=>{
  const p=(arb-1)/(limit-1);
  if(p<0.50)return['LOW','#60a5fa'];
  if(p<0.75)return['MED','#f59e0b'];
  if(p<0.90)return['HIGH','#f97316'];
  return['MAX','#ef4444'];
};
const diffCtx=v=>{
  if(v===0)return['OFF','#94a3b8'];
  if(v<20)return['LOW','#cbd5e1'];
  if(v<45)return['MED','#94a3b8'];
  if(v<70)return['HIGH','#f59e0b'];
  return['MAX','#ef4444'];
};

const computeCheck=(spr,damp,masses)=>{
  const wrF=spr.f*LB_IN_TO_NM,wrR=spr.r*LB_IN_TO_NM;
  const hF=wrF>0?Math.sqrt(wrF/masses.front)/(2*Math.PI):0;
  const hR=wrR>0?Math.sqrt(wrR/masses.rear)/(2*Math.PI):0;
  const ccF=2*Math.sqrt(wrF*masses.front),ccR=2*Math.sqrt(wrR*masses.rear);
  return{hF,hR,
    zRebF:ccF>0?(damp.rebF/DAMPING_CALIBRATION/ccF)*100:0,zRebR:ccR>0?(damp.rebR/DAMPING_CALIBRATION/ccR)*100:0,
    zBmpF:ccF>0?(damp.bumpF/DAMPING_CALIBRATION/ccF)*100:0,zBmpR:ccR>0?(damp.bumpR/DAMPING_CALIBRATION/ccR)*100:0};
};

const mergeDefaults=(initial,parsed)=>
  (initial&&typeof initial==='object'&&!Array.isArray(initial)
    &&parsed&&typeof parsed==='object'&&!Array.isArray(parsed))
    ?{...initial,...parsed}:parsed;
const usePersist=(key,initial)=>{
  const[val,setVal]=useState(()=>{
    try{const s=localStorage.getItem(key);
      return s?mergeDefaults(initial,JSON.parse(s)):initial;}
    catch(e){return initial;} // private browsing or parse error — use defaults
  });
  const set=v=>{
    const next=typeof v==='function'?v(val):v;
    setVal(next);
    try{localStorage.setItem(key,JSON.stringify(next));}catch{}
  };
  return[val,set];
};

       dr:{...DEF_DR,buildType:'drift',diffType:'drift',
           diffBiasExit:22,diffBiasEntry:-18,diffRearAccel:65,diffRearDecel:15}},
    5:{name:'MOTORSPT',
       fe:{...DEF_FE,rideStiffness:3.20,rearHzMode:'multiplier',rearHzMult:0.92,

const Hint=({text})=>{
  const[pos,setPos]=useState(null);
  const ref=useRef(null);
  const isTouch=useRef(false);

  const calcPos=()=>{
    if(!ref.current)return null;
    const r=ref.current.getBoundingClientRect();
    const PAD=8,GAP=6;
    const TW=Math.min(260,window.innerWidth-PAD*2);
    const TH=240; // generous estimate — ensures correct above/below decision for long tooltips
    // Prefer below; fall back to above. Clamp both so tooltip never leaves viewport.
    const showBelow=r.bottom+GAP+TH<=window.innerHeight;
    const top=Math.max(PAD,showBelow?r.bottom+GAP:r.top-TH-GAP);
    // Centre on icon, then clamp to viewport edges
    const iconCx=(r.left+r.right)/2;
    const left=Math.max(PAD,Math.min(iconCx-TW/2,window.innerWidth-TW-PAD));
    return{top,left,width:TW};
  };

  const onMouseEnter=()=>{ if(!isTouch.current) setPos(calcPos()); };
  const onMouseLeave=()=>{ if(!isTouch.current) setPos(null); };

  const onClick=e=>{
    isTouch.current=true; // mark as touch device once we see a click from touch
    e.stopPropagation();
    setPos(p=>p?null:calcPos());
  };

  useEffect(()=>{
    if(!pos)return;
    const dismiss=()=>setPos(null);
    const t=setTimeout(()=>document.addEventListener('click',dismiss,{once:true}),10);
    return()=>{clearTimeout(t);document.removeEventListener('click',dismiss);};
  },[pos]);

  return(
    <span ref={ref} role="button" tabIndex={0} aria-label="Help"
          style={{display:'inline-block',cursor:'help',WebkitTapHighlightColor:'transparent'}}
          onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave}
          onTouchStart={()=>{isTouch.current=true;}}
          onFocus={()=>setPos(calcPos())} onBlur={()=>setPos(null)}
          onKeyDown={e=>{
            if(e.key==='Enter'||e.key===' '){e.preventDefault();setPos(p=>p?null:calcPos());}
            else if(e.key==='Escape'){setPos(null);}
          }}
          onClick={onClick}>
      <span style={{fontSize:12,color:'#94a3b8'}}>ⓘ</span>
      {pos&&ReactDOM.createPortal(
        <div style={{position:'fixed',top:pos.top,left:pos.left,zIndex:1000,width:pos.width??220,
                     background:'#0f172a',border:'1px solid #e2e8f011',borderRadius:2,
                     padding:'7px 9px',fontSize:11,color:'#94a3b8',lineHeight:1.6,
                     pointerEvents:'none',boxShadow:'0 4px 16px #00000088'}}>
          {text}
        </div>,
        document.body
      )}
    </span>
  );
};

const Field=({label,value,onChange,min,max,step=0.01,unit='',hint=null,logScale=false,logMid=null})=>{
  const mid=logMid??Math.sqrt(min*max);
  const valToT=v=>{
    if(!logScale)return(v-min)/(max-min);
    if(v<=mid)return 0.5*Math.log(Math.max(v,min)/min)/Math.log(mid/min);
    return 0.5+0.5*Math.log(v/mid)/Math.log(max/mid);
  };
  const tToVal=t=>{
    if(!logScale)return min+(max-min)*t;
    if(t<=0.5)return min*Math.pow(mid/min,t*2);
    return mid*Math.pow(max/mid,(t-0.5)*2);
  };
  const t=Math.max(0,Math.min(1,valToT(value)));
  const pct=t*100;
  const clamp=v=>Math.max(min,Math.min(max,v));
  const [draft,setDraft]=useState(null);
  const focused=draft!==null;
  const commit=()=>{
    if(draft===null)return;
    const v=parseFloat(draft);
    onChange(isNaN(v)?value:clamp(v));
    setDraft(null);
  };
  const numRef=useRef(null), sliRef=useRef(null);
  const valRef=useRef(value);
  const draftRef=useRef(draft);
  const onChangeRef=useRef(onChange); useLayoutEffect(()=>{onChangeRef.current=onChange;},[onChange]);
  useLayoutEffect(()=>{valRef.current=value;},[value]);
  useLayoutEffect(()=>{draftRef.current=draft;},[draft]);
  const stepBy=dir=>{
    const base=draftRef.current!==null&&!isNaN(parseFloat(draftRef.current))
      ? parseFloat(draftRef.current) : valRef.current;
    const dynStep=logScale?(base<6000?1:Math.max(1,Math.round((base-6000)/600))):step;
    const next=clamp(base+dir*dynStep);
    const snapped=logScale?Math.round(next):Math.round(next/step)*step;
    onChangeRef.current(parseFloat(snapped.toFixed(6)));
    if(draftRef.current!==null)setDraft(null);
  };
  useEffect(()=>{
    const onWheel=e=>{
      const focused=document.activeElement===numRef.current||document.activeElement===sliRef.current;
      if(!focused)return;
      e.preventDefault();
      e.stopPropagation();
      stepBy(e.deltaY<0?1:-1);
    };
    const n=numRef.current, s=sliRef.current;
    n&&n.addEventListener('wheel',onWheel,{passive:false});
    s&&s.addEventListener('wheel',onWheel,{passive:false});
    return()=>{
      n&&n.removeEventListener('wheel',onWheel);
      s&&s.removeEventListener('wheel',onWheel);
    };
  },[min,max,step,logScale]);
  return(
    <div style={{marginBottom:10,minWidth:0}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
        <span style={{fontSize:12,color:'#9ca3af',minWidth:0,overflow:'hidden',
                      textOverflow:'ellipsis',whiteSpace:'nowrap',marginRight:6}}>
          {label}{hint&&<Hint text={hint}/>}
        </span>
        <div style={{display:'flex',alignItems:'center',gap:3,flexShrink:0}}>
          <button type="button" className="nudge-btn" onClick={()=>stepBy(-1)}
            style={{border:'1px solid #1e293b',background:'#0a0f1a',color:'#9ca3af',
                    borderRadius:2,fontFamily:'var(--font-mono)',fontSize:14,lineHeight:1,
                    WebkitTapHighlightColor:'transparent'}}>&#8722;</button>
          <input ref={numRef} type="number" className="num" min={min} max={max} step={logScale?1:step}
            value={focused?draft:value}
            onFocus={()=>setDraft(String(value))}
            onChange={e=>setDraft(e.target.value)}
            onBlur={commit}
            onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}/>
          {unit&&<span style={{fontSize:10,color:'#94a3b8',fontFamily:'var(--font-mono)',
                               whiteSpace:'nowrap'}}>{unit}</span>}
          <button type="button" className="nudge-btn" onClick={()=>stepBy(1)}
            style={{border:'1px solid #1e293b',background:'#0a0f1a',color:'#9ca3af',
                    borderRadius:2,fontFamily:'var(--font-mono)',fontSize:14,lineHeight:1,
                    WebkitTapHighlightColor:'transparent'}}>&#43;</button>
        </div>
      </div>
      <input ref={sliRef} type="range" className="sli" min={0} max={1} step={0.0001}
        value={logScale?t:undefined}
        {...(!logScale&&{min,max,step,value})}
        style={{background:`linear-gradient(to right,#e2e8f0 ${pct}%,#1e293b ${pct}%)`}}
        onChange={e=>onChange(logScale
          ?Math.round(clamp(tToVal(parseFloat(e.target.value))))
          :parseFloat(e.target.value))}/>
    </div>
  );
};


const FeelSlider=({label,value,onChange,min,max,step=1,leftLabel,rightLabel,readout=null,locked=false,hint=null,markers=null})=>{
  const pct=((value-min)/(max-min))*100;
  const bg=`linear-gradient(to right,#e2e8f0 ${pct}%,#1e293b ${pct}%)`;
  const wrapRef=useRef(null);
  const valRef=useRef(value);
  useLayoutEffect(()=>{valRef.current=value;},[value]);
  const lockRef=useRef(locked); lockRef.current=locked;
  const onChangeRef=useRef(onChange); useLayoutEffect(()=>{onChangeRef.current=onChange;},[onChange]);
  useEffect(()=>{
    const onWheel=e=>{
      if(document.activeElement!==wrapRef.current&&!wrapRef.current?.contains(document.activeElement))return;
      e.preventDefault();
      e.stopPropagation();
      if(lockRef.current)return;
      const dir=e.deltaY<0?1:-1;
      const next=Math.max(min,Math.min(max,valRef.current+dir*step));
      const snapped=Math.round(next/step)*step;
      onChangeRef.current(parseFloat(snapped.toFixed(6)));
    };
    const w=wrapRef.current;
    w&&w.addEventListener('wheel',onWheel,{passive:false});
    return()=>{w&&w.removeEventListener('wheel',onWheel);};
  },[min,max,step]);
  return(
    <div ref={wrapRef} style={{marginBottom:markers&&markers.some(m=>m.label)?18:10,opacity:locked?0.38:1,transition:'opacity .15s'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:3}}>
        <span style={{fontSize:12,color:'#9ca3af',minWidth:0,overflow:'hidden',
                      textOverflow:'ellipsis',whiteSpace:'nowrap',marginRight:6}}>{label}{hint&&<Hint text={hint}/>}</span>
        <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
          {locked&&<span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>MANUAL</span>}
          {readout&&(typeof readout==='string'
            ?<span style={{fontSize:11,color:'#9ca3af',fontFamily:'var(--font-mono)'}}>{readout}</span>
            :readout)}
        </div>
      </div>
      <div style={{position:'relative'}}>
        <input type="range" className="sli" min={min} max={max} step={step} value={value}
          style={{background:bg,cursor:locked?'not-allowed':'pointer',pointerEvents:locked?'none':'auto'}}
          onChange={e=>!locked&&onChange(parseFloat(e.target.value))}/>
        {markers&&markers.map(m=>{
          const pct=(m.value-min)/(max-min);
          const left=`calc(${pct*100}% + ${(0.5-pct)*14}px)`;
          const active=m.lessThan?value<m.value:value>=m.value;
          return(
            <div key={m.value} style={{position:'absolute',left,top:'50%',
                transform:'translate(-50%,-50%)',pointerEvents:'none',
                display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
              <div style={{width:1.5,height:8,borderRadius:1,
                           background:active?m.color:'#1e293b',
                           transition:'background .15s'}}/>
              {m.label&&<span style={{fontSize:10,color:active?m.color:'#94a3b8',
                                      letterSpacing:0.5,whiteSpace:'nowrap',
                                      transition:'color .15s',marginTop:2}}>
                {m.label}
              </span>}
            </div>
          );
        })}
      </div>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:4}}>
        <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>{leftLabel}</span>
        <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>{rightLabel}</span>
      </div>
    </div>
  );
};

const DampingDial=({rebound,bump})=>{
  const[hover,setHover]=useState(null); // 'rebound'|'bump'|null
  const SIZE=120,CX=60,CY=58,R=46;
  const GAP_DEG=60; // gap at bottom
  const START=180+GAP_DEG/2;  // 210° from top-clockwise = lower-left
  const SWEEP=360-GAP_DEG;
  const MIN_Z=10,MAX_Z=115;
  const zetaToAngle=z=>START+((z-MIN_Z)/(MAX_Z-MIN_Z))*SWEEP;
  const polar=(deg,r=R)=>{
    const rad=((deg-90)*Math.PI)/180; // SVG: 0deg = top, clockwise
    return[CX+r*Math.cos(rad),CY+r*Math.sin(rad)];
  };
  const arcPath=(a1,a2,r=R)=>{
    const[x1,y1]=polar(a1,r);
    const[x2,y2]=polar(a2,r);
    const sweep=((a2-a1)+360)%360;
    const large=sweep>180?1:0;
    return`M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large},1 ${x2.toFixed(2)},${y2.toFixed(2)}`;
  };
  const rebA=zetaToAngle(rebound);
  const bumpA=zetaToAngle(bump);
  const endA=START+SWEEP;
  const [rxSvg,rySvg]=polar(rebA);
  const [bxSvg,bySvg]=polar(bumpA);
  const bumpPct=rebound>0?Math.round((bump/rebound)*100):0;
  const label=hover==='rebound'?`${Math.round(rebound)}%`
             :hover==='bump'   ?`${Math.round(bump)}%`
             :`${bumpPct}%`;
  const labelSub=hover==='rebound'?'REBOUND'
                :hover==='bump'   ?'BUMP'
                :'B/R';
  const loA=Math.min(rebA,bumpA), hiA=Math.max(rebA,bumpA);
  const crossed=bump>rebound;
  // Background zone bands use the same UNDER/BWORTH/OVER thresholds (40/70/100) as the
  // Rebound ζ/Bump ζ sliders elsewhere, styled like SpringDial's SOFT→RACE bands.
  const a40=zetaToAngle(40),a70=zetaToAngle(70),a100=zetaToAngle(100);
  return(
    <div style={{display:'flex',justifyContent:'center',marginBottom:4}}>
      <div style={{position:'relative',display:'inline-block'}}>
        <svg width={SIZE} height={SIZE} style={{overflow:'visible'}}>
          {/* background track — zone-tinted like SpringDial's SOFT→RACE bands */}
          <path d={arcPath(START,a40)}  fill="none" stroke="#1e3a5f" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a40,a70)}    fill="none" stroke="#14532d" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a70,a100)}   fill="none" stroke="#713f12" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a100,endA)}  fill="none" stroke="#7f1d1d" strokeWidth={4} strokeLinecap="round"/>
          {/* rebound arc: START → rebA, red */}
          <path d={arcPath(START,rebA)} fill="none" stroke="#ef4444" strokeWidth={4} strokeLinecap="round" opacity={0.7}/>
          {/* bump arc: START → bumpA, blue */}
          <path d={arcPath(START,bumpA)} fill="none" stroke="#3b82f6" strokeWidth={4} strokeLinecap="round" opacity={0.7}/>
          {/* fill between thumbs */}
          <path d={arcPath(loA,hiA)} fill="none"
            stroke={crossed?'#f59e0b':'#7c3aed'} strokeWidth={3} strokeLinecap="round" opacity={0.5}/>
          {/* rebound thumb */}
          <circle cx={rxSvg} cy={rySvg} r={5} fill="#ef4444" stroke="#0f172a" strokeWidth={1.5}
            style={{cursor:'default'}}
            onMouseEnter={()=>setHover('rebound')} onMouseLeave={()=>setHover(null)}
            onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='rebound'?null:'rebound');}}/>
          {/* bump thumb */}
          <circle cx={bxSvg} cy={bySvg} r={5} fill="#3b82f6" stroke="#0f172a" strokeWidth={1.5}
            style={{cursor:'default'}}
            onMouseEnter={()=>setHover('bump')} onMouseLeave={()=>setHover(null)}
            onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='bump'?null:'bump');}}/>
          {/* center label */}
          <text x={CX} y={CY-4} textAnchor="middle" fill={crossed?'#f59e0b':'#e2e8f0'}
            fontSize={16} fontFamily="JetBrains Mono, monospace" fontWeight="700">{label}</text>
          <text x={CX} y={CY+11} textAnchor="middle" fill="#475569"
            fontSize={9} fontFamily="sans-serif" letterSpacing={2}>{labelSub}</text>
          <text x={CX} y={CY+32} textAnchor="middle" fill="#334155"
            fontSize={8} fontFamily="sans-serif" letterSpacing={2}>DAMPERS</text>
        </svg>
        <span style={{position:'absolute',top:2,right:2,lineHeight:1}}>
          <Hint text="Red dot = rebound damping %, blue dot = bump damping %, both on a 10–115 range. Hover a dot to read its value. Center shows the bump-to-rebound ratio. The fill between them turns amber if bump exceeds rebound — bump should generally be softer (lower %) than rebound for a compliant, predictable ride. The background ring is tinted by zone: blue = under-damped (bouncy), green = approaching Butterworth, amber = at/past the Butterworth sweet spot, red = overdamped (sluggish) — same thresholds as the Rebound ζ/Bump ζ sliders."/>
        </span>
      </div>
    </div>
  );
};

const _dialBase=(SIZE=120,CX=60,CY=58,R=46,GAP_DEG=60)=>{
  const START=180+GAP_DEG/2, SWEEP=360-GAP_DEG;
  const polar=(deg,r=R)=>{const rad=((deg-90)*Math.PI)/180;return[CX+r*Math.cos(rad),CY+r*Math.sin(rad)];};
  const arcPath=(a1,a2,r=R)=>{
    const[x1,y1]=polar(a1,r);const[x2,y2]=polar(a2,r);
    const sweep=((a2-a1)+360)%360;const large=sweep>180?1:0;
    return`M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large},1 ${x2.toFixed(2)},${y2.toFixed(2)}`;
  };
  return{START,SWEEP,polar,arcPath,CX,CY,SIZE};
};

const SpringDial=({fHz,rHz,rsSpF,rsSpR,clamped,natBal,target,rideRef})=>{
  const[hover,setHover]=useState(null);
  const{START,SWEEP,polar,arcPath,CX,CY,SIZE}=_dialBase();
  const MIN_HZ=HZ_MIN,MAX_HZ=HZ_MAX;
  const toA=hz=>START+((Math.min(Math.max(hz,MIN_HZ),MAX_HZ)-MIN_HZ)/(MAX_HZ-MIN_HZ))*SWEEP;
  const endA=START+SWEEP;
  const a12=toA(HZ_BANDS[0]),a18=toA(HZ_BANDS[1]),a25=toA(HZ_BANDS[2]);
  const fA=toA(fHz),rA=toA(rHz);
  const[fxS,fyS]=polar(fA);const[rxS,ryS]=polar(rA);
  // Ghost dots: where the derived axle (the one the ride ref ISN'T) would sit for the
  // spring split to carry a given rear roll-stiffness fraction. Roll stiffness ∝ Hz², so
  // hold the reference axle fixed and scale the derived axle's Hz by √(target rs / current rs).
  const derived=rideRef==='rear'?'front':'rear';
  const ghostHz=frac=>{
    if(frac==null||rsSpF<=0||rsSpR<=0)return null;
    const f=Math.max(0.05,Math.min(0.95,frac));
    const hz=derived==='rear'
      ? rHz*Math.sqrt((f/(1-f)*rsSpF)/rsSpR)
      : fHz*Math.sqrt(((1-f)/f*rsSpR)/rsSpF);
    return(hz>=MIN_HZ&&hz<=MAX_HZ)?hz:null;
  };
  const natG=ghostHz(natBal),tgtG=ghostHz(target);
  const showTgtG=tgtG!=null&&(natG==null||Math.abs(tgtG-natG)>0.03);
  const ghostDot=(hz,col,key)=>{if(hz==null)return null;const[x,y]=polar(toA(hz));
    return<circle key={key} cx={x} cy={y} r={4} fill="none" stroke={col} strokeWidth={1.5} opacity={0.75}/>;};
  const dispVal=hover==='front'?fHz.toFixed(2):hover==='rear'?rHz.toFixed(2)
    :(fHz>0?`×${(rHz/fHz).toFixed(2)}`:'-');
  const dispSub=hover==='front'?'FRONT':hover==='rear'?'REAR':'F/R';
  const centerCol=clamped?'#f59e0b':'#e2e8f0';
  return(
    <div style={{display:'flex',justifyContent:'center',marginBottom:0}}>
      <div style={{position:'relative',display:'inline-block'}}>
        <svg width={SIZE} height={SIZE-20} style={{overflow:'visible',display:'block'}}>
          <path d={arcPath(START,endA)} fill="none" stroke="#1e293b" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(START,a12)} fill="none" stroke="#1e3a5f" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a12,a18)}   fill="none" stroke="#14532d" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a18,a25)}   fill="none" stroke="#713f12" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a25,endA)}  fill="none" stroke="#7f1d1d" strokeWidth={4} strokeLinecap="round"/>
          {ghostDot(natG,'#64748b','natG')}
          {showTgtG&&ghostDot(tgtG,'#4ade80','tgtG')}
          <circle cx={fxS} cy={fyS} r={5} fill="#818cf8" stroke="#0f172a" strokeWidth={1.5} style={{cursor:'default'}}
            onMouseEnter={()=>setHover('front')} onMouseLeave={()=>setHover(null)}
            onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='front'?null:'front');}}/>
          <circle cx={rxS} cy={ryS} r={5} fill="#f97316" stroke="#0f172a" strokeWidth={1.5} style={{cursor:'default'}}
            onMouseEnter={()=>setHover('rear')} onMouseLeave={()=>setHover(null)}
            onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='rear'?null:'rear');}}/>
          <text x={CX} y={CY-4} textAnchor="middle" fill={centerCol}
            fontSize={15} fontFamily="JetBrains Mono, monospace" fontWeight="700">{dispVal}</text>
          <text x={CX} y={CY+11} textAnchor="middle" fill="#475569"
            fontSize={9} fontFamily="sans-serif" letterSpacing={2}>{dispSub}</text>
          <text x={CX} y={CY+32} textAnchor="middle" fill="#334155"
            fontSize={8} fontFamily="sans-serif" letterSpacing={2}>RIDE</text>
        </svg>
        <span style={{position:'absolute',top:2,right:2,lineHeight:1}}>
          <Hint text="Purple dot = front spring Hz, orange dot = rear Hz, plotted on a SOFT→RACE arc. Hover a dot to read its value. Hollow rings mark where the derived axle would need to sit for natural balance (grey) and your target (green) — close the gap to green to hit your balance target."/>
        </span>
      </div>
    </div>
  );
};

const ArbDial=({arbF,arbR,arbLimit,rsAbF,rsAbR,natBal,target,rideRef})=>{
  const[hover,setHover]=useState(null);
  const{START,SWEEP,polar,arcPath,CX,CY,SIZE}=_dialBase();
  const toA=v=>START+(Math.min(Math.max(v,0),arbLimit)/arbLimit)*SWEEP;
  const endA=START+SWEEP;
  const a50=toA(arbLimit*0.50),a75=toA(arbLimit*0.75),a90=toA(arbLimit*0.90);
  const fA=toA(arbF),rA=toA(arbR);
  const[fxS,fyS]=polar(fA);const[rxS,ryS]=polar(rA);
  const abTot=rsAbF+rsAbR;
  const rearAbFrac=abTot>0?rsAbR/abTot:0.5;
  // Ghost dots: where the derived axle's ARB clicks would land for the ARB split to carry a
  // given rear roll-stiffness fraction. ARB roll stiffness ∝ clicks, so scale linearly.
  const derived=rideRef==='rear'?'front':'rear';
  const ghostClicks=frac=>{
    if(frac==null||rsAbF<=0||rsAbR<=0)return null;
    const f=Math.max(0.05,Math.min(0.95,frac));
    const v=derived==='rear'
      ? arbR*((f/(1-f)*rsAbF)/rsAbR)
      : arbF*(((1-f)/f*rsAbR)/rsAbF);
    return(v>=0&&v<=arbLimit)?v:null;
  };
  const natG=ghostClicks(natBal),tgtG=ghostClicks(target);
  const showTgtG=tgtG!=null&&(natG==null||Math.abs(tgtG-natG)>arbLimit*0.02);
  const ghostDot=(v,col,key)=>{if(v==null)return null;const[x,y]=polar(toA(v));
    return<circle key={key} cx={x} cy={y} r={4} fill="none" stroke={col} strokeWidth={1.5} opacity={0.75}/>;};
  const rearPct=Math.round(rearAbFrac*100);
  const dispVal=hover==='front'?arbF.toFixed(1):hover==='rear'?arbR.toFixed(1):`${rearPct}%`;
  const dispSub=hover==='front'?`/ ${arbLimit} F`:hover==='rear'?`/ ${arbLimit} R`:'R SPLIT';
  const warnF=arbF>arbLimit*0.88,warnR=arbR>arbLimit*0.88;
  const centerCol=warnF||warnR?'#f59e0b':'#e2e8f0';
  return(
    <div style={{display:'flex',justifyContent:'center',marginBottom:0}}>
      <div style={{position:'relative',display:'inline-block'}}>
        <svg width={SIZE} height={SIZE-20} style={{overflow:'visible',display:'block'}}>
          <path d={arcPath(START,endA)} fill="none" stroke="#1e293b" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(START,a50)} fill="none" stroke="#1e3a5f" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a50,a75)}   fill="none" stroke="#713f12" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a75,a90)}   fill="none" stroke="#7c2d12" strokeWidth={4} strokeLinecap="round"/>
          <path d={arcPath(a90,endA)}  fill="none" stroke="#7f1d1d" strokeWidth={4} strokeLinecap="round"/>
          {ghostDot(natG,'#64748b','natG')}
          {showTgtG&&ghostDot(tgtG,'#4ade80','tgtG')}
          <circle cx={fxS} cy={fyS} r={5} fill={warnF?'#f59e0b':'#818cf8'} stroke="#0f172a" strokeWidth={1.5} style={{cursor:'default'}}
            onMouseEnter={()=>setHover('front')} onMouseLeave={()=>setHover(null)}
            onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='front'?null:'front');}}/>
          <circle cx={rxS} cy={ryS} r={5} fill={warnR?'#f59e0b':'#f97316'} stroke="#0f172a" strokeWidth={1.5} style={{cursor:'default'}}
            onMouseEnter={()=>setHover('rear')} onMouseLeave={()=>setHover(null)}
            onTouchStart={e=>{e.stopPropagation();setHover(h=>h==='rear'?null:'rear');}}/>
          <text x={CX} y={CY-4} textAnchor="middle" fill={centerCol}
            fontSize={15} fontFamily="JetBrains Mono, monospace" fontWeight="700">{dispVal}</text>
          <text x={CX} y={CY+11} textAnchor="middle" fill="#475569"
            fontSize={9} fontFamily="sans-serif" letterSpacing={2}>{dispSub}</text>
          <text x={CX} y={CY+32} textAnchor="middle" fill="#334155"
            fontSize={8} fontFamily="sans-serif" letterSpacing={2}>ARB</text>
        </svg>
        <span style={{position:'absolute',top:2,right:2,lineHeight:1}}>
          <Hint text="Purple dot = front ARB clicks, orange dot = rear ARB clicks, plotted from 0 to your ceiling. Hover a dot to read its value. Hollow rings mark where the derived axle would need to sit for natural balance (grey) and your target (green)."/>
        </span>
      </div>
    </div>
  );
};

const Sec=({title,open,onToggle,onReset,children})=>{
  const[pending,setPending]=useState(false);
  const timer=useRef(null);
  const handleReset=e=>{
    e.stopPropagation();
    if(pending){clearTimeout(timer.current);setPending(false);onReset();}
    else{setPending(true);timer.current=setTimeout(()=>setPending(false),2000);}
  };
  useEffect(()=>()=>clearTimeout(timer.current),[]);
  // The header is a div (not a <button>) because RESET needs to be a real,
  // independently focusable <button> nested inside it — buttons can't nest
  // inside buttons in valid HTML. role="button"+tabIndex+onKeyDown restores
  // the same Enter/Space keyboard activation a native button gets for free.
  return(
    <div style={{borderBottom:'1px solid #0f172a',marginBottom:8}}>
      <div className={`stog${open?' stog-open':''}`} role="button" tabIndex={0}
           onClick={onToggle}
           onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onToggle();}}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:2,height:10,borderRadius:1,flexShrink:0,
                       background:open?'#e2e8f0':'#1e293b',transition:'background .12s'}}/>
          <span>{title}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          {onReset&&<button type="button"
            onClick={handleReset}
            title={pending?'Click again to confirm':'Reset to defaults'}
            style={{fontSize:10,color:pending?'#f59e0b':'#94a3b8',padding:'1px 5px',borderRadius:2,
                    background:'none',fontFamily:'inherit',
                    border:`1px solid ${pending?'#f59e0b44':'#1e293b'}`,lineHeight:1.4,cursor:'pointer',
                    transition:'color .12s,border-color .12s',userSelect:'none'}}>
            {pending?'SURE?':'RESET'}
          </button>}
          <span style={{fontSize:11,color:open?'#e2e8f0':'#94a3b8',transition:'color .12s'}}>
            {open?'▲':'▼'}
          </span>
        </div>
      </div>
      {open&&<div style={{padding:'8px 12px 10px'}}>{children}</div>}
    </div>
  );
};

const BiasSeg=({label,val,hint,primary,totalAbs})=>{
  // positive = oversteer (red/right), negative = understeer (blue/left)
  const c=val>0.5?'#ef4444':val<-0.5?'#3b82f6':'#cbd5e1';
  const scale=15;
  const pct=Math.min(50,Math.abs(val)/scale*50);
  const barStyle=val>=0?{left:'50%',width:`${pct}%`}:{right:'50%',width:`${pct}%`};
  const pctOfTotal=totalAbs>0.5?Math.round(Math.abs(val)/totalAbs*100):null;
  return(
    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3,
                 ...(primary?{background:'#0a0f1a',borderLeft:'2px solid '+(val>0?'#ef444466':'#3b82f666'),
                               borderRadius:2,padding:'3px 0 3px 4px',margin:'0 -2px 3px -4px'}:{})}}>
      <div style={{width:80,display:'flex',alignItems:'center',gap:2,flexShrink:0}}>
        <span style={{fontSize:10,color:primary?'#cbd5e1':'#94a3b8',letterSpacing:1,lineHeight:1.2,
                       whiteSpace:'nowrap',fontWeight:primary?700:400}}>{label}</span>
        <Hint text={hint}/>
      </div>
      <div style={{flex:1,position:'relative',height:8,background:'#0f172a',borderRadius:2}}>
        <div style={{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'#1e293b'}}/>
        {Math.abs(val)>0.5&&<div style={{position:'absolute',top:1,bottom:1,borderRadius:1,
          background:c+(primary?'ee':'99'),...barStyle}}/>}
      </div>
      <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:c,width:34,textAlign:'right',flexShrink:0,
                     fontWeight:primary?700:400}}>
        {val>=0?'+':''}{val.toFixed(1)}
      </span>
      <span style={{fontSize:10,color:pctOfTotal>40?c:'#475569',width:28,textAlign:'right',flexShrink:0}}>
        {pctOfTotal!=null?`${pctOfTotal}%`:''}
      </span>
    </div>
  );
};

const HandlingVerdict=({total,bSp,bAb,bDiffAccel,bDiffDecel,bDiffFront,bDiffRear,diffLayout,bBrakeEntry,bDampBias,gripBalance,uiMode,settleDamping})=>{
  const abs=Math.abs(total);
  // positive = oversteer, negative = understeer
  const label=abs<3?'NEUTRAL':total>0?'OVERSTEER':'UNDERSTEER';
  const col=abs<3?'#e2e8f0':total>0?'#ef4444':'#3b82f6';
  const isAWD=diffLayout==='AWD';
  const contributors=[
    {name:'springs',val:bSp??0},{name:'ARB',val:bAb??0},
    ...(isAWD
      ?[{name:'diff front',val:bDiffFront??0},{name:'diff rear',val:bDiffRear??0}]
      :[{name:'diff exit',val:bDiffAccel??0},{name:'diff entry',val:bDiffDecel??0}]),
    {name:'brakes',val:bBrakeEntry??0},{name:'damping',val:bDampBias??0}
  ];
  const totalAbs=contributors.reduce((s,c)=>s+Math.abs(c.val),0);
  // Sort by magnitude so dominant driver appears first
  const sorted=[...contributors].sort((a,b)=>Math.abs(b.val)-Math.abs(a.val));
  const dom=sorted[0];
  const domBig=Math.abs(dom.val)>2;
  // Actionable tip per dominant contributor
  const domTips={
    springs:   total>0?'Reduce the Mech Balance Target or use CO-SOLVE to balance spring stiffness.':'Raise the Mech Balance Target — springs are biased toward the front.',
    ARB:       total>0?'Reduce the Mech Balance Target or shift ARB Bias toward front-heavy.':'Raise the Mech Balance Target or shift ARB Bias toward rear-heavy.',
    'diff exit':  total>0?'Reduce rear exit lock in the Differential section.':'Increase rear exit lock to add rotation under power.',
    'diff entry': total>0?'Reduce rear entry lock in the Differential section.':'Reduce front entry lock.',
    'diff front': total>0?'Reduce front accel lock in the AWD Differential section.':'Raise front accel lock.',
    'diff rear':  total>0?'Reduce rear accel lock in the AWD Differential section.':'Raise rear accel lock.',
    ...(uiMode==='pro'?{brakes:total>0?'Add more front brake bias to reduce entry rotation.':'Reduce front brake bias to add entry rotation.'}:{}),
    damping:   settleDamping
      ?(total>0?'Shift Settle Bias toward front to make the front settle faster, resisting forward weight transfer.':'Shift Settle Bias toward rear to reduce front damping dominance.')
      :(total>0?'Increase front rebound (Damping Bias toward positive) to resist forward weight transfer.':'Reduce front rebound bias.'),
  };
  const tip=abs<3
    ? 'Setup is well balanced.'+(domBig?' Keep an eye on '+dom.name.toUpperCase()+' if the car feels inconsistent.':'')
    : (domBig?(domTips[dom.name]||'Adjust the dominant contributor.'):'Adjust Balance Target or ARB Bias.');
  const hints={
    springs:'Spring roll-stiffness bias vs weight distribution. + = oversteer (rear springs relatively stiffer). − = understeer (front springs relatively stiffer).',
    ARB:'ARB roll-stiffness bias vs weight distribution. + = oversteer (rear ARBs relatively stiffer). − = understeer (front ARBs relatively stiffer).',
    'diff front':'AWD front diff net contribution (accel+decel). Front lock pushes understeer (−). Center split and front weight fraction are factored in.',
    'diff rear':'AWD rear diff net contribution (accel+decel). Rear lock pushes oversteer (+). Center split and rear weight fraction are factored in.',
    'diff exit':diffLayout==='FWD'?'Front accel lock on-throttle exit. Higher lock = more understeer (−).':'Rear accel lock on-throttle exit. Higher lock = more oversteer (+).',
    'diff entry':diffLayout==='FWD'?'Front decel lock off-throttle entry. Higher lock = more entry understeer (−).':'Rear decel lock off-throttle entry. Higher lock = more oversteer on entry (+).',
    brakes:'Brake-balance contribution to entry. High front bias = understeer on entry (−). Low front bias (rear-biased) = oversteer tendency (+). Based on deviation from 50% neutral.',
    damping:'Damping bias contribution. More front rebound damping resists weight transfer off the front, producing understeer tendency (−). More rear damping does the opposite (+).',
  };
  const labelMap={'diff front':'DIFF F','diff rear':'DIFF R','diff exit':'DIFF EXIT','diff entry':'DIFF ENTRY','brakes':'BRAKES','damping':'DAMP'};
  const mechGroup=contributors.filter(c=>c.name==='springs'||c.name==='ARB');
  const dynGroup=contributors.filter(c=>c.name!=='springs'&&c.name!=='ARB');
  const GroupSection=({title,items})=>items.length===0?null:(
    <div style={{marginBottom:6}}>
      <div style={{fontSize:9,color:'#475569',letterSpacing:2,marginBottom:3,paddingBottom:2,
                   borderBottom:'1px solid #0f172a'}}>{title}</div>
      {items.map(({name,val})=>{
        const isDom=name===dom.name&&domBig;
        return <BiasSeg key={name} label={labelMap[name]??(name.toUpperCase())} val={val}
          hint={hints[name]??''} primary={isDom} totalAbs={totalAbs}/>;
      })}
    </div>
  );
  return(
    <div>
      {/* tip first — most actionable info at the top */}
      <div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6,padding:'6px 8px',marginBottom:8,
                   background:'#020617',borderRadius:2,border:'1px solid #0f172a'}}>{tip}</div>
      {/* contributors grouped: MECHANICAL (intentional setup) vs DYNAMIC (phase/behaviour) */}
      <GroupSection title="MECHANICAL" items={mechGroup}/>
      <GroupSection title="DYNAMIC" items={dynGroup}/>
      {/* grip balance context — physical at-limit tendency from LLT model */}
      {uiMode==='pro'&&gripBalance!=null&&Math.abs(gripBalance-0.5)>0.03&&<div style={{
          fontSize:10,color:'#4b5563',lineHeight:1.5,marginBottom:6,
          padding:'4px 8px',borderLeft:'2px solid #1e293b'}}>
        GRIP BIAS {gripBalance.toFixed(2)} — physical handling at limit
        {gripBalance<0.45?' (understeer-prone chassis — more suspension correction needed for neutral limit balance)':
         gripBalance>0.55?' (oversteer-prone chassis — less correction needed to achieve rotation)':''}
      </div>}
      <div style={{fontSize:10,color:'#475569',lineHeight:1.5,marginTop:4}}>
        Roll-stiffness and differential contributions. Alignment also affects balance.
      </div>
    </div>
  );
};

const CheckerModal=({onClose,lim,metricUnits,ch,setCh,setFe,initialMode})=>{
  const[ckMode,setCkMode]=useState(initialMode??'decode');
  const[probeHz,setProbeHz]=useState(2.5);
  const[ckSpr,setCkSpr]=useState({f:400,r:300});
  const[ckDmp,setCkDmp]=useState({rebF:5,rebR:5,bumpF:3,bumpR:3});
  const[ckArb,setCkArb]=useState({f:20,r:20});
  const[imported,setImported]=useState(false);
  const pS=k=>v=>setCkSpr(p=>({...p,[k]:v}));
  const pD=k=>v=>setCkDmp(p=>({...p,[k]:v}));
  const pA=k=>v=>setCkArb(p=>({...p,[k]:v}));
  const masses=useMemo(()=>cornerMasses(ch),[ch]);
  const ck=useMemo(()=>computeCheck(ckSpr,ckDmp,masses),[ckSpr,ckDmp,masses]);
  const importDecoded=()=>{
    const hzF=Math.max(HZ_MIN,Math.min(HZ_MAX,ck.hF));
    const hzR=Math.max(HZ_MIN,Math.min(HZ_MAX,ck.hR));
    const mult=Math.max(0.5,Math.min(3.0,Math.round((hzR/hzF)*100)/100));
    const domF=ck.zRebF>=ck.zRebR;
    const domZ=domF?ck.zRebF:ck.zRebR,otherZ=domF?ck.zRebR:ck.zRebF;
    const reboundZeta=Math.max(10,Math.min(115,Math.round(domZ)));
    const ratio=domZ>0?otherZ/domZ:1;
    const dampingBias=Math.max(-50,Math.min(50,Math.round(domF?200*(1-ratio):-200*(1-ratio))));
    const domBumpZ=domF?ck.zBmpF:ck.zBmpR;
    const bumpRatio=Math.max(10,Math.min(100,Math.round(reboundZeta>0?domBumpZ/reboundZeta*100:56)));
    setFe(p=>({...p,
      rideStiffness:Math.round(hzF*100)/100,
      rideRef:'front',rearHzMode:'multiplier',rearHzMult:mult,
      dampingMode:'ratio',dampCharMode:'zeta',settleMode:false,
      reboundZeta,bumpRatio,dampingBias,
      arbBalMode:'manual',
      arbMode:'man',arbManF:Math.max(1,Math.min(lim.arb,ckArb.f)),arbManR:Math.max(1,Math.min(lim.arb,ckArb.r))}));

    setTimeout(()=>setImported(false),2000);

                     padding:'8px 14px',borderBottom:'1px solid #1e293b'}}>

              onClick={()=>setCkMode('decode')}>DECODE</button>
            <button className="tbtn" style={{fontSize:9,color:ckMode==='probe'?'#60a5fa':'#475569'}}
              onClick={()=>setCkMode('probe')}>MEASURE</button>
            <button onClick={onClose} style={{background:'none',border:'none',color:'#94a3b8',
                                             cursor:'pointer',fontSize:17,lineHeight:1}}>✕</button>
          </div>

        <div style={{padding:14}}>
          {ckMode==='decode'&&<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:10,marginBottom:10}}>

                value={metricUnits?ch.weight/KG_TO_LB:ch.weight}
                onChange={metricUnits?v=>setCh(p=>({...p,weight:v*KG_TO_LB})):v=>setCh(p=>({...p,weight:v}))}

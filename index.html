const TutorialPanel=({mode,step,onNext,onPrev,onClose,onDone,zoom=1})=>{
  const steps=TUTORIALS[mode]??[];
  const total=steps.length;
  const t=steps[step];
  // balance mode always anchors to the balance bar zone even though its steps have focus:null
  const focusKey=mode==='balance'?'balance-bar':(t?.focus?.[0]??null);
  const CARD_W=264;
  // pos: {top,left?,right?,arrowDir,arrowOff} or null = centred
  const[pos,setPos]=useState(null);

  useEffect(()=>{
    const el=focusKey?document.getElementById('zone-'+focusKey):null;
    // Scroll sidebar so element is visible — use direct scrollTop rather than
    // scrollIntoView which can target the wrong scroll container on mobile
    if(el){
      const sidebar=document.querySelector('.sidebar-scroll');
      if(sidebar){
        const sr=sidebar.getBoundingClientRect();
        const er=el.getBoundingClientRect();
        if(er.top<sr.top+40||er.bottom>sr.bottom-40){
          const relTop=er.top-sr.top+sidebar.scrollTop;
          sidebar.scrollTo({top:Math.max(0,relTop-80),behavior:'smooth'});
        }
      }
    }
    const measure=()=>{
      if(!el){setPos(null);return;}
      const raw=el.getBoundingClientRect();
      // Hidden element (sidebar collapsed on desktop) → centre card
      if(raw.width===0&&raw.height===0){setPos(null);return;}
      // getBoundingClientRect() returns visual (viewport) pixels, but position:fixed
      // coordinates inside a CSS-zoomed container are in zoomed units (divide by zoom).
      const r={top:raw.top/zoom,bottom:raw.bottom/zoom,left:raw.left/zoom,right:raw.right/zoom};
      const vw=window.innerWidth/zoom;
      // Use the *visible* viewport height (excludes the iOS address bar/toolbar).
      const vh=((window.visualViewport&&window.visualViewport.height)||window.innerHeight)/zoom;
      const midY=(r.top+r.bottom)/2;
      const midX=(r.left+r.right)/2;
      if(midX<vw/2){
        // LEFT panel: float card just past the sidebar's right edge
        const sidebar=document.querySelector('.sidebar-scroll');
        const sbRight=sidebar?sidebar.getBoundingClientRect().right/zoom:r.right;
        const left=Math.min(sbRight+10,vw-CARD_W-8);
        // Anchor higher when the target sits near the bottom so the card keeps usable height.
        const top=Math.max(8,Math.min(vh-260,midY-80));
        const maxH=Math.max(140,vh-top-16);
        const arrowOff=Math.max(16,Math.min(maxH-16,midY-top));
        setPos({top,left,arrowDir:'left',arrowOff,maxH});
      } else {
        // RIGHT panel (output, balance-bar): float card entirely above the element
        const GAP=10;
        const availH=r.top-8-GAP;
        const maxH=Math.max(140,Math.min(availH,vh-24));
        const top=Math.max(8,r.top-maxH-GAP);
        const left=Math.max(8,Math.min(vw-CARD_W-8,midX-CARD_W/2));
        const arrowOff=Math.max(12,Math.min(CARD_W-24,midX-left));
        setPos({top,left,arrowDir:'down',arrowOff,maxH});
      }
    };
    // Slight delay lets scrollIntoView settle before we measure
    const tid=setTimeout(measure,120);
    window.addEventListener('resize',measure);
    if(window.visualViewport)window.visualViewport.addEventListener('resize',measure);
    return()=>{clearTimeout(tid);window.removeEventListener('resize',measure);
      if(window.visualViewport)window.visualViewport.removeEventListener('resize',measure);};
  },[focusKey]); // eslint-disable-line

  if(!t)return null;
  const mLabel={beginner:'BEG',intermediate:'INT',pro:'PRO',balance:'BALANCE'}[mode]??mode.toUpperCase();
  const btnStyle={background:'none',border:'1px solid #1e293b',borderRadius:2,color:'#9ca3af',
    fontFamily:'Courier New',fontSize:10,padding:'4px 10px',cursor:'pointer',letterSpacing:1};

  const cardBase={position:'fixed',zIndex:700,width:CARD_W,
    maxHeight:'calc(100dvh - 40px)',display:'flex',flexDirection:'column',
    background:'#0f172a',border:'1px solid #334155',borderRadius:4,
    padding:'16px 16px 14px',boxShadow:'0 8px 40px #000d',fontFamily:'Courier New'};
  const cardStyle=pos
    ?{...cardBase,top:pos.top,...(pos.left!==undefined?{left:pos.left}:{right:pos.right}),
       maxHeight:pos.maxH}
    :{...cardBase,top:'50%',left:'50%',transform:'translate(-50%,-50%)'};

  const arrow=(()=>{
    if(!pos)return null;
    const base={position:'absolute',width:0,height:0};
    if(pos.arrowDir==='left') return(<>
      <div style={{...base,left:-8,top:pos.arrowOff-8,
        borderTop:'8px solid transparent',borderBottom:'8px solid transparent',borderRight:'8px solid #334155'}}/>
      <div style={{...base,left:-6,top:pos.arrowOff-7,
        borderTop:'7px solid transparent',borderBottom:'7px solid transparent',borderRight:'7px solid #0f172a'}}/>
    </>);
    return(<>
      <div style={{...base,bottom:-8,left:pos.arrowOff-8,
        borderLeft:'8px solid transparent',borderRight:'8px solid transparent',borderTop:'8px solid #334155'}}/>
      <div style={{...base,bottom:-6,left:pos.arrowOff-7,
        borderLeft:'7px solid transparent',borderRight:'7px solid transparent',borderTop:'7px solid #0f172a'}}/>
    </>);
  })();

  return(
    <div style={cardStyle}>
      {arrow}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:6}}>
        <div>
          <span style={{fontSize:10,color:'#94a3b8',letterSpacing:2}}>{mLabel} GUIDE  ·  {step+1} / {total}</span>
          <div style={{fontSize:13,color:'#e2e8f0',fontWeight:700,marginTop:3,letterSpacing:0.5}}>{t.title}</div>
        </div>
        <button onClick={onClose} style={{...btnStyle,padding:'3px 8px',marginTop:2,color:'#94a3b8'}}>✕</button>
      </div>
      {/* progress bar */}
      <div style={{display:'flex',gap:3,marginBottom:10}}>
        {steps.map((_,i)=>(
          <div key={i} style={{height:2,flex:1,borderRadius:1,transition:'background .2s',
            background:i<step?'#334155':i===step?'#6366f1':'#1e293b'}}/>
        ))}
      </div>
      <p style={{fontSize:11,color:'#94a3b8',lineHeight:1.65,margin:'0 0 12px',
                 overflowY:'auto',flex:1,minHeight:0,
                 WebkitOverflowScrolling:'touch',overscrollBehavior:'contain'}}>{t.body}</p>
      <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
        {step>0&&<button style={btnStyle} onClick={onPrev}>← PREV</button>}
        {step<total-1
          ?<button style={{...btnStyle,borderColor:'#4f46e5',color:'#818cf8'}} onClick={onNext}>NEXT →</button>
          :<button style={{...btnStyle,borderColor:'#16a34a',color:'#4ade80'}} onClick={onDone??onClose}>DONE ✓</button>}
      </div>
    </div>
  );
};

function App(){
  const[ch,setCh]=usePersist('suspos_ch_v8',DEF_CH);
  const[fe,setFe]=usePersist('suspos_fe_v8',DEF_FE);
  const[dr,setDr]=usePersist('suspos_dr_v8',DEF_DR);
  const[al,setAl]=usePersist('suspos_al_v2',DEF_AL);
  const[br,setBr]=usePersist('suspos_br_v1',DEF_BR);
  const[metricUnits,setMetricUnits]=usePersist('suspos_units_v1',false);
  const[saves]=usePersist('suspos_saves_v9',PRESET_SAVES); // read-only: legacy slots, source for one-time MY BUILDS migration
  const[uiMode,setUiMode]=usePersist('suspos_uimode_v1','beginner');
  const[uiZoom,setUiZoom]=usePersist('suspos_zoom_v1',1.1);
  const bumpZoom=d=>setUiZoom(z=>parseFloat(Math.max(0.7,Math.min(1.6,z+d)).toFixed(2)));
  const[tutSeen,setTutSeen]=usePersist('suspos_tutorial_seen_v1',{beginner:false,intermediate:false,pro:false});
  const[balTutSeen,setBalTutSeen]=usePersist('suspos_baltut_seen_v1',false);
  const[balTutOpen,setBalTutOpen]=useState(false);
  const[balTutStep,setBalTutStep]=useState(0);
  const openBalTut=()=>{setBalTutStep(0);setBalTutOpen(true);};
  const closeBalTut=()=>setBalTutOpen(false);
  const[onboardSeen,setOnboardSeen]=usePersist('suspos_onboard_v1',true);
  const[garage,setGarage]=usePersist('suspos_garage_v1',[]);
  const[garageOpen,setGarageOpen]=useState(false);
  const[garageName,setGarageName]=useState('');
  const[myBuilds,setMyBuilds]=usePersist('suspos_builds_v1',[]);
  const[buildName,setBuildName]=useState('');
  // One-time migration: pull any customized old preset slots (suspos_saves_v9) into MY BUILDS.
  // The 6 factory slots that match their defaults are skipped; only renamed/overwritten slots move.
  // Non-destructive (old key left intact); guarded by a flag so it runs at most once per browser.
  useEffect(()=>{
    try{
      if(localStorage.getItem('suspos_builds_migrated_v1'))return;
      const migrated=[];
      for(let i=1;i<=6;i++){
        const s=saves[i],def=PRESET_SAVES[i];
        if(!s||!def)continue;
        const customized=s.name!==def.name||JSON.stringify(s.fe)!==JSON.stringify(def.fe)||JSON.stringify(s.dr)!==JSON.stringify(def.dr);
        if(!customized)continue;
        // skip if MY BUILDS already has an identical entry (idempotency safety)
        const dup=myBuilds.some(b=>b.name===s.name&&JSON.stringify(b.fe)===JSON.stringify(s.fe)&&JSON.stringify(b.dr)===JSON.stringify(s.dr));
        if(dup)continue;
        migrated.push({id:Date.now()+i,name:s.name,fe:{...DEF_FE,...s.fe},dr:{...DEF_DR,...s.dr},savedAt:'imported'});
      }
      if(migrated.length)setMyBuilds(b=>[...migrated,...b]);
      localStorage.setItem('suspos_builds_migrated_v1','1');
    }catch(e){/* corrupt/unavailable storage — skip migration, never block load */}
  },[]); // eslint-disable-line
  const[showComplexity,setShowComplexity]=useState(false);
  const closeOnboard=()=>{setOnboardSeen(true);setShowComplexity(false);};
  const[tutMode,setTutMode]=useState(null);
  const[tutStep,setTutStep]=useState(0);
  const openTut=mode=>{
    setTutMode(mode);setTutStep(0);
    // Step 0 sidebar is driven by its own metadata; default to open for all other guides
    const step0=TUTORIALS[mode]?.[0];
    if(!step0?.sidebar)setSidebarOpen(true);
  };
  const closeTut=()=>setTutMode(null);
  // Called only when user clicks DONE on the last step of the beginner guide
  const closeTutDone=()=>{if(tutMode==='beginner'||tutMode==='intermediate')setShowComplexity(true);closeTut();};
  // Gating: INT requires BEG completion, PRO requires INT completion
  const canAccessMode=m=>{
    if(m==='beginner')return true;
    if(m==='intermediate')return tutSeen.beginner;
    if(m==='pro')return tutSeen.intermediate;
    return false;

  const tryAccessMode=m=>{

  const brakePressure=br.brakeManual?(br.brakePressure??DEF_BR.brakePressure):100;
  // positive = oversteer, negative = understeer
  const bBrakeEntry=-(brakeBias-50)*BRAKE_BIAS_SCALE; // high front bias → understeer (−)
  const effectiveAvgZeta=(physics.zetaF+physics.zetaR)/2||70;
  const bDampBias=-(physics.zetaF-physics.zetaR)*16/effectiveAvgZeta; // more front rebound → understeer (−)
  const bTotFull=tune.bTot+diff.bDiffAccel+diff.bDiffDecel+bBrakeEntry+bDampBias;
  const recommendedDiffType=(()=>{
    const build=dr.buildType??'track';
    const base={track:'race',street:'sport',drift:'drift',rally:'rally',offroad:'offroad',drag:'race'}[build]??'race';
    // strongly oversteery track/drift/drag builds benefit from a softer type
    if(bTotFull>8&&base==='race') return 'sport';

  })();
  const lim=GAME_LIMITS[fe.gameMode];
  const responseFactors=(()=>{
    // Agility = transient response character: how quickly and freely the car responds to steering inputs.
    // ARBs and weight bias are excluded — they govern roll moment distribution (Handling Balance bar),
    // not response speed. Research (Milliken, OptimumG) confirms ARBs are a balance tool, not agility.
    const hzNorm=Math.min(1,Math.max(0,(physics.frontHz-HZ_MIN)/(HZ_MAX-HZ_MIN)));
    const effectiveReboundZeta=physics.dampCharMode==='settle'?physics.zetaF:physics.reboundZeta;
    const dampNorm=Math.min(1,Math.max(0,(effectiveReboundZeta-10)/105));
    // Toe range is -0.20° (toe-out, reactive) to +0.20° (toe-in, planted).
    // Old formula used a much wider range and only ever hit 0.20–0.47 of 0–1.
    const TOE_MIN=-0.20,TOE_MAX=0.20;
    const toeNorm=Math.min(1,Math.max(0,(TOE_MAX-(align.recToeF??-0.1))/(TOE_MAX-TOE_MIN)));
    const casterNorm=Math.min(1,Math.max(0,(7.5-(align.recCaster??5.5))/3.5));
    const rearFrontRatio=physics.frontHz>0?physics.rearHz/physics.frontHz:1;
    const rearHzNorm=Math.min(1,Math.max(0,(rearFrontRatio-0.7)/1.1));
    const score=hzNorm*0.50+(1-dampNorm)*0.20+toeNorm*0.15+casterNorm*0.10+rearHzNorm*0.05;
    return{score,hzNorm,dampNorm,toeNorm,casterNorm,rearHzNorm};

  // Full chassis geometry analysis — equal Hz, no ARBs
  const chassisAnalysis=(()=>{
    const twF=parseTyre(ch.tyreF)?.width??265,twR=parseTyre(ch.tyreR)?.width??265;
    // Natural balance = pure roll-stiffness rear fraction at equal springs, no ARBs.
    // This matches Forza's scale (arbBalTarget is also an rsBalance on this scale).
    const natBal=cm.rear*ch.trackR*ch.trackR/(cm.front*ch.trackF*ch.trackF+cm.rear*ch.trackR*ch.trackR);
    // Stability index: track width × tire width normalised to typical values
    const avgTrack=(ch.trackF+ch.trackR)/2;   // metres
    const avgTire=(twF+twR)/2;                 // mm
    const stabIdx=Math.sqrt((avgTrack/1.6)*(avgTire/265));
    // Recommendation target: co-solve/mech target when active, else neutral 0.50
    const hasMechTarget=fe.arbBalMode==='coSolve'||fe.arbBalMode==='mech';
    const targetBal=hasMechTarget?Math.max(0.40,Math.min(0.90,fe.arbBalTarget??0.55)):0.50;
    // REACH: find track-width changes that bring natural rsBalance toward target.
    // Tyre width affects grip capacity (shown via CHASSIS BAL physical display) but NOT
    // roll-stiffness fraction, so REACH shows track-only recommendations.
    const rsBalOf=o=>{const c={...ch,...o};const mc=cornerMasses(c);
      return mc.rear*c.trackR*c.trackR/(mc.front*c.trackF*c.trackF+mc.rear*c.trackR*c.trackR);};
    const scan=f=>{let best=f.lo,err=Infinity;
      for(let i=0;i<=80;i++){const v=f.lo+(f.hi-f.lo)*i/80;const e=Math.abs(f.bal(v)-targetBal);if(e<err){err=e;best=v;}}return best;};
    const r5=v=>Math.round(v/5)*5;
    const trackF_rec=r5(Math.max(800,Math.min(2200,scan({lo:0.8,hi:2.2,bal:t=>rsBalOf({trackF:t})})*1000)));
    const trackR_rec=r5(Math.max(800,Math.min(2200,scan({lo:0.8,hi:2.2,bal:t=>rsBalOf({trackR:t})})*1000)));
    const trackF_curr=Math.round(ch.trackF*1000),trackR_curr=Math.round(ch.trackR*1000);
    const dTrackF=trackF_rec-trackF_curr,dTrackR=trackR_rec-trackR_curr;
    // Feasibility: track ± 65mm
    const trackFfeas=Math.abs(dTrackF)<=65;
    const trackRfeas=Math.abs(dTrackR)<=65;
    return{natBal,stabIdx,targetBal,hasMechTarget,
           trackF_rec,trackR_rec,dTrackF,dTrackR,trackFfeas,trackRfeas};
  })();
  const _twF=parseTyre(ch.tyreF)?.width??265;
  const _twR=parseTyre(ch.tyreR)?.width??265;
  const natMechBalance=ch.useMeasuredNatBal&&ch.measuredNatBal!=null
    ?Math.max(0.10,Math.min(0.90,ch.measuredNatBal))
    :chassisAnalysis.natBal;
  // Gap-dependent chassis recommendations — use natMechBalance so measured mode takes effect here too
  const _r10=v=>Math.round(v/10)*10;
  const _sgap=chassisAnalysis.targetBal-natMechBalance;
  const gap=Math.abs(_sgap);
  const twR_rec=_r10(Math.max(100,Math.min(500,_twF*Math.exp(_sgap/TIRE_MECH_SCALE))));
  const twF_rec=_r10(Math.max(100,Math.min(500,_twR*Math.exp(-_sgap/TIRE_MECH_SCALE))));
  const dTyreR=twR_rec-_twR,dTyreF=twF_rec-_twF;

  const _parsedTyreR=parseTyre(ch.tyreR);

  const _weightAdj=Math.round((_rearBias-0.50)*30);          // +3% per 10% extra rear weight
  const _diamAdj  =Math.round((_diamRatio-1)*50);             // +2.5% per 5% larger rear diam
  const _natAdj   =Math.round(-(natMechBalance-0.50)*20);     // −2% per 0.1 above neutral natBal
  const recommendedCenter=Math.max(45,Math.min(90,_baseCenter+_weightAdj+_diamAdj+_natAdj));

      {showResetModal&&(
        <div style={{position:'fixed',inset:0,background:'#000000cc',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}}

      {showOscModal&&(()=>{
        const close=()=>setShowOscModal(false);

        const isCoSolve=(fe.arbBalMode??'weight')==='coSolve';

        const isShared=rRef==='shared';
        const secHz=rRef==='rear'?physics.frontHz:physics.rearHz;

        }else if(rearHzMode==='multiplier'){
          rearHzControl=<FeelSlider label={rRef==='rear'?'Front Multiplier':rRef==='shared'?'F/R Ratio':'Rear Multiplier'} value={fe.rearHzMult??1.20} onChange={pFe('rearHzMult')} min={0.50} max={3.00} step={0.01} leftLabel="×0.50" rightLabel="×3.00" markers={[{value:1.00,color:'#94a3b8',label:'MATCH'}]} readout={`\xd7${(fe.rearHzMult??1.20).toFixed(2)} → ${secHz.toFixed(2)} Hz ${secLabel.toLowerCase()}`}/>;
        }else if(rearHzMode==='flatRide'){

          const spdReadout=spd>=200?`FLAT RIDE OFF \xb7 ${secHz.toFixed(2)} Hz ${secLabel.toLowerCase()}`:metricUnits?`${Math.round(spd*KMH_PER_MPH)} km/h \xb7 ${secHz.toFixed(2)} Hz ${secLabel.toLowerCase()}`:`${spd} mph \xb7 ${secHz.toFixed(2)} Hz ${secLabel.toLowerCase()}`;
          rearHzControl=<FeelSlider label="Target Speed" value={240-spd} onChange={v=>pFe('targetSpeed')(240-v)} min={40} max={180} step={5} leftLabel="OFF" rightLabel="CITY" readout={spdReadout}/>;
        }else if(rearHzMode==='independent'){

            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>

                 style={{display:'block',background:'#020617',borderRadius:3,marginBottom:10}}>

              <line x1={fSetX} y1={0} x2={fSetX} y2={H} stroke="#38bdf855" strokeWidth={1} strokeDasharray="3 3"/>

                        <span style={{fontSize:9,color:'#4b5563',letterSpacing:0.5}}>GRIP BIAS</span>
                        <span style={{display:'flex',alignItems:'baseline',gap:2}}>
                          <span style={{fontFamily:'Courier New',fontSize:10,color:gpc}}>{gp.toFixed(2)}</span>
                          <span style={{fontSize:9,color:gpc}}>{gpl}</span>
                        </span>
                      </div>;
                    })()}
                  </div>
                  <div style={{flex:1,...box}}>
                    <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>STABILITY</span>
                    <span style={{fontFamily:'Courier New',fontSize:11,fontWeight:700,color:stabCol}}>{stabLabel}</span>
                  </div>
                </div>
                {showRec&&!ch.useMeasuredNatBal&&<div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:2,padding:'6px 7px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:anyFeasible?4:3}}>
                    <span style={{fontSize:10,color:'#94a3b8',letterSpacing:2}}>GEOMETRY GAP</span>
                    <span style={{fontFamily:'Courier New',fontSize:10,color:'#475569'}}>{dSign}{gap.toFixed(2)}</span>
                  </div>
                  {(trackFfeas||trackRfeas)&&<div style={{display:'flex',alignItems:'baseline',gap:4,marginBottom:3}}>
                    <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1,width:38,flexShrink:0}}>TRACK</span>
                    <span style={{flex:1,display:'flex',gap:8,fontFamily:'Courier New',fontSize:10}}>
                      {trackFfeas&&<span style={{color:'#e2e8f0'}}>F {fmtD(dTrackF)}mm</span>}
                      {trackRfeas&&<span style={{color:'#e2e8f0'}}>R {fmtD(dTrackR)}mm</span>}
                    </span>
                  </div>}
                  {(tyreFfeas||tyreRfeas)&&<div style={{display:'flex',alignItems:'baseline',gap:4,marginBottom:3}}>
                    <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1,width:38,flexShrink:0}}>TYRE</span>
                    <span style={{flex:1,display:'flex',gap:8,fontFamily:'Courier New',fontSize:10}}>
                      {tyreFfeas&&<span style={{color:'#e2e8f0'}}>F {fmtD(dTyreF)}mm</span>}
                      {tyreRfeas&&<span style={{color:'#e2e8f0'}}>R {fmtD(dTyreR)}mm</span>}
                    </span>
                  </div>}
                  <div style={{fontSize:10,color:'#94a3b8',lineHeight:1.4}}>
                    {!anyFeasible
                      ?'Gap exceeds geometry range — use ARBs to reach the target.'
                      :(targetBal>nm
                        ?'Wider rear track/tyre or narrower front increases rear roll stiffness toward target.'
                        :'Wider front track/tyre or narrower rear increases front roll stiffness toward target.')}
                  </div>
                </div>}
              </>);
            })()}
          </Sec></div>

          <div id="zone-drivetrain" style={dim('drivetrain')}><Sec title="DRIVETRAIN" open={open.drivetrain} onToggle={tog('drivetrain')}
            onReset={()=>setDr(p=>({...p,
              diffType:DEF_DR.diffType,
              diffManual:DEF_DR.diffManual,
              diffComplement:DEF_DR.diffComplement,
              diffBiasExit:DEF_DR.diffBiasExit,
              diffBiasEntry:DEF_DR.diffBiasEntry,
              diffFrontExitBias:DEF_DR.diffFrontExitBias,
              diffAccel:DEF_DR.diffAccel,
              diffDecel:DEF_DR.diffDecel,
              diffFrontAccel:DEF_DR.diffFrontAccel,
              diffFrontDecel:DEF_DR.diffFrontDecel,
              diffRearAccel:DEF_DR.diffRearAccel,
              diffRearDecel:DEF_DR.diffRearDecel,
              diffCenter:DEF_DR.diffCenter}))}>
            <Toggle label="" value={dr.layout} onChange={pDr('layout')}
              options={[{value:'FWD',label:'FWD'},{value:'RWD',label:'RWD'},{value:'AWD',label:'AWD'}]}/>
            {uiMode!=='beginner'&&<div style={{display:'flex',alignItems:'center',gap:4,marginTop:8,marginBottom:6,flexWrap:'wrap'}}>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:2,marginRight:2}}>DIFF TYPE</span>
              <Hint text="Differential type installed on the car. Sport is accel-only (no decel control). Race is the most aggressive — the same lock % produces stronger effective locking than Rally or Offroad. Rally and Offroad use gentler lock curves suited to low-traction surfaces. The AUTO solver scales its output to match your chosen type."/>
              <div style={{display:'flex',gap:3,marginLeft:'auto'}}>
                {['race','sport','rally','offroad','drift'].map(t=>(
                  <button key={t} className={`tog${(dr.diffType??'race')===t?' on':''}`}
                    onClick={()=>setDr(p=>({...p,diffType:t}))}>
                    {t.toUpperCase()}
                  </button>
                ))}
              </div>
            </div>}
            {uiMode==='pro'&&<div style={{display:'flex',alignItems:'center',gap:6,marginTop:4,marginBottom:10,flexWrap:'wrap'}}>
              <span style={{fontSize:12,color:'#94a3b8'}}>Differential Mode</span>
              <Hint text="AUTO derives lock values from layout, build type, weight bias, and the intent sliders. MANUAL exposes all individual lock percentages directly."/>
              <div style={{display:'flex',gap:3,marginLeft:'auto'}}>
                <button className={`tog${!dr.diffManual?' on':''}`}
                  onClick={()=>pDr('diffManual')(false)}>AUTO</button>
                <button className={`tog${dr.diffManual?' on':''}`}
                  onClick={()=>{
                    const d=diff;
                    setDr(p=>({...p,diffManual:true,
                      ...(d.layout==='AWD'
                        ?{diffFrontAccel:d.frontAccel,diffFrontDecel:d.frontDecel,
                          diffRearAccel:d.rearAccel,diffRearDecel:d.rearDecel,
                          diffCenter:d.center}
                        :{diffAccel:d.accel,diffDecel:d.decel})}));
                  }}>MANUAL</button>
              </div>
              {!dr.diffManual&&<div style={{display:'flex',alignItems:'center',gap:6,width:'100%',marginTop:4}}>
                <button className={`tog${dr.diffComplement?' on':''}`}
                  onClick={()=>pDr('diffComplement')(!dr.diffComplement)}
                  style={{marginLeft:'auto'}}
                  title="Bias the auto-solver to match chassis mech target.">
                  MATCH CHASSIS
                </button>
                <Hint text="When on, the diff auto-solver factors how far your mech balance target lies from the chassis's natural balance. A target tuned for more oversteer biases the diff toward rotation; a target tuned for understeer leans the diff toward stability. Off (default) means the diff ignores chassis target entirely. Has no effect in MANUAL mode."/>
              </div>}
            </div>}
            {!dr.diffManual&&<>
              <FeelSlider
                label="EXIT"
                value={dr.diffBiasExit??0}
                onChange={pDr('diffBiasExit')}
                min={-50} max={50}
                leftLabel={dr.layout==='FWD'?'ROTATION':'GRIP'}
                rightLabel={dr.layout==='FWD'?'PUSH':'ROTATE'}
                markers={[{value:0,color:'#475569'}]}
                hint={(dr.layout==='FWD'
                  ?'Front diff accel lock. Toward PUSH increases lock — more traction but more understeer on corner exit. Toward ROTATION reduces lock for cleaner pivot and less push.'
                  :dr.layout==='RWD'
                  ?'Rear diff accel lock. Toward ROTATE increases lock — more power oversteer on exit. Toward GRIP reduces lock for cleaner exit traction.'
                  :'Rear diff exit character. Toward ROTATE increases rear accel lock — more oversteer on exit. Toward GRIP reduces rear accel lock for traction.')
                  +(dr.diffComplement?' MATCH CHASSIS is on — this is further biased by your chassis mech target.':'')}
                readout={diff.layout==='AWD'
                  ?`R.Accel ${diff.rearAccel}%`
                  :`Accel ${diff.accel}%`}/>
              {dr.layout==='AWD'&&uiMode!=='beginner'&&
                <FeelSlider
                  label="FRONT EXIT"
                  value={dr.diffFrontExitBias??0}
                  onChange={pDr('diffFrontExitBias')}
                  min={-50} max={50}
                  leftLabel="NEUTRAL"
                  rightLabel="PUSH"
                  markers={[{value:0,color:'#475569'}]}
                  hint="Front diff accel lock for AWD. Toward PUSH increases front accel lock — more front-axle pull and understeer tendency on exit. Useful for AWD cars with strong rear rotation."
                  readout={`F.Accel ${diff.frontAccel}%`}/>}
              {dr.layout==='AWD'&&uiMode!=='beginner'&&(dr.diffType??'race')!=='sport'&&
                <FeelSlider
                  label="POWER SPLIT"
                  value={(dr.diffCenter??65)-50}
                  onChange={v=>pDr('diffCenter')(Math.round(v+50))}
                  min={-30} max={30}
                  leftLabel="FRONT"
                  rightLabel="REAR"
                  markers={[{value:0,color:'#475569'}]}
                  hint="AWD center torque split. Toward REAR sends more power rearward — increases oversteer tendency and rear diff contribution to handling balance. 60–70% rear is typical for track."
                  readout={`${diff.center??65}% rear`}/>}
              {(dr.diffType??'race')!=='sport'&&<FeelSlider
                label="ENTRY"
                value={dr.diffBiasEntry??0}
                onChange={pDr('diffBiasEntry')}
                min={-50} max={50}
                leftLabel="LOOSE"
                rightLabel="STABLE"
                markers={[{value:0,color:'#475569'}]}
                hint={(dr.layout==='FWD'
                  ?'Front diff decel lock. Toward STABLE increases lock — more resistance to rotation on entry (understeer). Toward LOOSE reduces lock for freer corner entry.'
                  :dr.layout==='RWD'
                  ?'Rear diff decel lock. Toward STABLE increases lock — resists lift-off oversteer. Toward LOOSE reduces lock for freer rotation on entry.'
                  :'Rear diff decel lock. Toward STABLE increases lock — resists lift-off oversteer. Toward LOOSE reduces lock for more rear rotation on entry.')
                  +(dr.diffComplement?' MATCH CHASSIS is on — this is further biased (at half strength) by your chassis mech target.':'')}
                readout={diff.layout==='AWD'
                  ?`R.Decel ${diff.rearDecel}%`
                  :`Decel ${diff.decel}%`}/>}
            </>}
            {uiMode==='pro'&&dr.diffManual&&(()=>{
              const dt=dr.diffType??'race';
              const ranges=DIFF_TYPE_RANGES[dt];
              const RangeHint=({r})=>r?<div style={{fontSize:10,color:'#475569',marginTop:1,marginBottom:4}}>typical: {r[0]}–{r[1]}%</div>:null;
              return dr.layout==='AWD'?(
                <>
                  <Field label="Front Accel" value={dr.diffFrontAccel} onChange={pDr('diffFrontAccel')}
                    min={0} max={100} step={1} unit="%"
                    hint={`Front axle lock under power. Higher = more front pull out of corners but risks understeer. Typical for ${dt}: ${ranges.frontAccel[0]}–${ranges.frontAccel[1]}%.`}/>
                  <RangeHint r={ranges.frontAccel}/>
                  {dt!=='sport'&&<>
                    <Field label="Front Decel" value={dr.diffFrontDecel} onChange={pDr('diffFrontDecel')}
                      min={0} max={100} step={1} unit="%"
                      hint="Front axle lock off throttle. 0 is strongly recommended — anything above strongly increases understeer on corner entry."/>
                    <RangeHint r={[0,0]}/>
                  </>}
                  <Field label="Rear Accel" value={dr.diffRearAccel} onChange={pDr('diffRearAccel')}
                    min={0} max={100} step={1} unit="%"
                    hint={`Rear axle lock under power. Higher = more oversteer on exit. Typical for ${dt}: ${ranges.rearAccel[0]}–${ranges.rearAccel[1]}%.`}/>
                  <RangeHint r={ranges.rearAccel}/>
                  {dt!=='sport'&&<>
                    <Field label="Rear Decel" value={dr.diffRearDecel} onChange={pDr('diffRearDecel')}
                      min={0} max={100} step={1} unit="%"
                      hint="Rear axle lock off throttle. Low values improve corner entry rotation. 0–15% typical."/>
                    <RangeHint r={ranges.decel}/>
                  </>}
                  <Field label="Center Split" value={dr.diffCenter} onChange={pDr('diffCenter')}
                    min={0} max={100} step={1} unit="% rear"
                    hint="Power distribution rear bias. Higher = more oversteer. 60–70% typical for track."/>
                </>
              ):(
                <>
                  <Field label="Accel Lock" value={dr.diffAccel} onChange={pDr('diffAccel')}
                    min={0} max={100} step={1} unit="%"
                    hint={dr.layout==='RWD'
                      ?`RWD rear accel lock. Higher = more exit oversteer. Typical for ${dt}: ${ranges.accel[0]}–${ranges.accel[1]}%.`
                      :`FWD front accel lock. Higher = more understeer on exit. Typical for ${dt}: ${ranges.accel[0]}–${ranges.accel[1]}%.`}/>
                  <RangeHint r={ranges.accel}/>
                  {dt!=='sport'&&<>
                    <Field label="Decel Lock" value={dr.diffDecel} onChange={pDr('diffDecel')}
                      min={0} max={100} step={1} unit="%"
                      hint={dr.layout==='RWD'
                        ?`RWD rear decel lock. Lower = better corner entry rotation, less lift-off oversteer. Typical for ${dt}: ${ranges.decel[0]}–${ranges.decel[1]}%.`
                        :`FWD front decel lock. Lower = less understeer on entry. Typical for ${dt}: ${ranges.decel[0]}–${ranges.decel[1]}%.`}/>
                    <RangeHint r={ranges.decel}/>
                  </>}
                </>
              );
            })()}
          </Sec></div>

          <div id="zone-arb" style={dim('arb')}><Sec title="ANTI-ROLL BARS" open={open.arb} onToggle={tog('arb')}
            onReset={()=>setFe(p=>({...p,
              arbBias:DEF_FE.arbBias,
              arbMode:DEF_FE.arbMode,
              arbBalMode:DEF_FE.arbBalMode,
              springShare:DEF_FE.springShare,
              arbTargetRollMan:DEF_FE.arbTargetRollMan,
              arbShareMan:DEF_FE.arbShareMan}))}>
            <ArbDial arbF={tune.arbF} arbR={tune.arbR} arbLimit={lim.arb}
              rsAbF={tune.rsAbF} rsAbR={tune.rsAbR} frontBias={ch.frontBias}
              natBal={natMechBalance} target={fe.arbBalTarget??0.65} rideRef={physics.rideRef}/>
            {(fe.arbBalMode??'weight')==='weight'&&
              <FeelSlider label="ARB Bias" value={fe.arbBias}
                onChange={pFe('arbBias')} min={-50} max={50} leftLabel="FRONT HEAVY" rightLabel="REAR HEAVY"
                markers={[{value:0,color:'#94a3b8',label:'NEUTRAL'}]}
                hint="Shifts the front/rear ARB stiffness split from the neutral weight-distribution default. FRONT HEAVY adds more front bar stiffness (more understeer). REAR HEAVY adds more rear bar stiffness (more oversteer). Neutral (centre) matches the car's weight balance."
                readout={`F ${Math.round((1-(physics.arbBalance/100))*100)}% / R ${Math.round(physics.arbBalance/100*100)}%`}/>
            }

            <div style={{display:'flex',alignItems:'center',gap:6,
                         padding:'5px 8px',background:'#0a0f1a',borderRadius:2,
                         border:'1px solid #1e293b',marginBottom:6,marginTop:-6}}>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>ROLL</span>
              <span style={{fontFamily:'Courier New',fontSize:13,fontWeight:700,
                            color:tune.rollClamped?'#f59e0b':'#e2e8f0'}}>{tune.rollDeg.toFixed(1)}</span>
              <span style={{fontSize:10,color:'#94a3b8'}}>°</span>
              <svg width="100%" height="24" viewBox="0 0 100 24" style={{flex:1,overflow:'visible',margin:'0 4px'}}>
                <line x1="5" y1="20" x2="95" y2="20" stroke="#1e293b" strokeWidth="2" strokeLinecap="round"/>
                {(fe.arbMode??'auto')==='roll'&&(
                  <g transform={`rotate(${-Math.min(tune.rollTarget*4,25)} 50 20)`}>
                    <line x1="15" y1="14" x2="85" y2="14" stroke="#3b82f6" strokeWidth="1.5"
                      strokeDasharray="3 2" opacity="0.4" strokeLinecap="round"/>
                  </g>
                )}
                <g transform={`rotate(${-Math.min(tune.rollDeg*4,25)} 50 20)`}
                   style={{transition:'transform 0.15s ease-out'}}>
                  <line x1="20" y1="14" x2="80" y2="14"
                    stroke={tune.rollClamped?'#f59e0b':'#e2e8f0'} strokeWidth="1.5" strokeLinecap="round"/>
                  <rect x="15" y="10" width="5" height="8" rx="1.5" fill="#0f172a"
                    stroke={tune.rollClamped?'#f59e0b':'#cbd5e1'} strokeWidth="1.5"/>
                  <rect x="80" y="10" width="5" height="8" rx="1.5" fill="#0f172a"
                    stroke={tune.rollClamped?'#f59e0b':'#cbd5e1'} strokeWidth="1.5"/>
                </g>
              </svg>
              <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>ARB SHARE</span>
              <span style={{fontFamily:'Courier New',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>{Math.round(tune.arbShare)}</span>
              <span style={{fontSize:10,color:'#94a3b8'}}>%</span>
            </div>
            {/* roll stiffness split bar */}
            <div style={{display:'flex',height:3,borderRadius:2,overflow:'hidden',marginBottom:2}}>
              <div style={{flex:Math.max(0,100-tune.arbShare),background:'#3b82f6',opacity:0.55,transition:'flex .2s'}}/>
              <div style={{flex:Math.max(0,tune.arbShare),background:'#f59e0b',opacity:0.75,transition:'flex .2s'}}/>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'#94a3b8',marginBottom:10}}>
              <span>SPRINGS {Math.round(100-tune.arbShare)}%</span>
              <span>ARBs {Math.round(tune.arbShare)}%</span>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10}}>
              <span style={{fontSize:12,color:'#94a3b8'}}>Stiffness Mode</span>
              <Hint text="AUTO derives ARB stiffness from the car's natural roll tendency — heavier, taller, softer cars get more ARB contribution. ROLL ° targets a specific body roll angle. SHARE % directly sets ARBs as a fraction of total roll stiffness."/>
              <div style={{display:'flex',gap:3,marginLeft:'auto'}}>
                <button className={`tog${(fe.arbMode??'auto')==='auto'?' on':''}`}
                  onClick={()=>pFe('arbMode')('auto')}>AUTO</button>
                <button className={`tog${(fe.arbMode??'auto')==='roll'?' on':''}`}
                  onClick={()=>setFe(p=>({...p,arbMode:'roll',
                    arbTargetRollMan:Math.round(physics.arbTargetRoll*10)/10}))}>ROLL °</button>
                <button className={`tog${(fe.arbMode??'auto')==='share'?' on':''}`}
                  onClick={()=>setFe(p=>({...p,arbMode:'share',
                    arbShareMan:Math.round(tune.arbShare)}))}>SHARE %</button>
              </div>
            </div>
            {(fe.arbMode??'auto')==='roll'&&
              <Field label="Target Roll Angle" value={fe.arbTargetRollMan} onChange={pFe('arbTargetRollMan')}
                min={0.3} max={5.0} step={0.1} unit="° @ 1g"
                hint="Body roll the anti-roll bars are solved to allow. Low (≈0.5–1°) = stiff bars, flat cornering. High (≈3–5°) = soft bars that let the suspension articulate over terrain."/>}
            {(fe.arbMode??'auto')==='share'&&
              <Field label="ARB Share" value={fe.arbShareMan??15} onChange={pFe('arbShareMan')}
                min={0} max={80} step={1} unit="%"
                hint="Fraction of total roll stiffness supplied by ARBs. 0% = springs handle all roll resistance. 20–30% is typical sport. Higher = stiffer bars relative to springs, more abrupt load transfer."/>}
            {uiMode==='pro'&&<div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10,marginTop:4}}>
              <span style={{fontSize:12,color:'#94a3b8'}}>Balance Mode</span>
              <Hint text="WEIGHT splits front/rear ARB from the car's weight distribution, adjusted by the ARB Bias slider. MAN lets you set front/rear ARB clicks directly for calibration testing. MECH solves the ARB split to hit the Mech Balance Target exactly. CO-SOLVE co-solves rear spring Hz and ARB split together."/>
              <div style={{display:'flex',gap:3,marginLeft:'auto'}}>
                <button className={`tog${(fe.arbBalMode??'weight')==='weight'?' on':''}`}
                  onClick={()=>pFe('arbBalMode')('weight')}>WEIGHT</button>
                <button className={`tog${(fe.arbBalMode??'weight')==='mech'?' on':''}`}
                  onClick={()=>pFe('arbBalMode')('mech')}>MECH</button>
                <button className={`tog${(fe.arbBalMode??'weight')==='coSolve'?' on':''}`}
                  onClick={()=>pFe('arbBalMode')('coSolve')}>CO-SOLVE</button>
                <button className={`tog${(fe.arbBalMode??'weight')==='man'?' on':''}`}
                  onClick={()=>{
                    const arbF=Math.round(tune.arbF*10)/10;
                    const arbR=Math.round(tune.arbR*10)/10;
                    setFe(p=>({...p,arbBalMode:'man',arbManF:arbF,arbManR:arbR}));
                  }}>MAN</button>
              </div>
            </div>}
            {(fe.arbBalMode??'weight')==='mech'&&<>
              <div style={{display:'flex',alignItems:'center',gap:8,
                           padding:'6px 10px',background:'#0a0f1a',borderRadius:2,
                           border:'1px solid #1e293b',marginBottom:10}}>
                <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>ARB SPLIT</span>
                <span style={{fontFamily:'Courier New',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>
                  F {tune.balArbSplit!=null?100-tune.balArbSplit:'—'}% / R {tune.balArbSplit??'—'}%
                </span>
              </div>
            </>}
            {(fe.arbBalMode??'weight')==='coSolve'&&<>
              <div style={{display:'flex',gap:8,marginBottom:10}}>
                <div style={{flex:1,display:'flex',alignItems:'center',gap:8,
                             padding:'6px 10px',background:'#0a0f1a',borderRadius:2,
                             border:'1px solid #1e293b'}}>
                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>ARB SPLIT</span>
                  <span style={{fontFamily:'Courier New',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>
                    F {tune.balArbSplit!=null?100-tune.balArbSplit:'—'}% / R {tune.balArbSplit??'—'}%
                  </span>
                </div>
                <div style={{flex:1,display:'flex',alignItems:'center',gap:8,
                             padding:'6px 10px',background:'#0a0f1a',borderRadius:2,
                             border:'1px solid #1e293b'}}>
                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1}}>SOLVED REAR Hz</span>
                  <span style={{fontFamily:'Courier New',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>
                    {tune.rHz!=null?tune.rHz.toFixed(2):'—'} Hz
                  </span>
                </div>
              </div>
              <FeelSlider label="SPRING SHARE" value={fe.springShare??50} onChange={pFe('springShare')}
                min={0} max={100} leftLabel="ARB ONLY" rightLabel="SPRING ONLY"
                markers={[{value:50,color:'#94a3b8',label:'50/50'}]}
                readout={`SPR ${fe.springShare??50}% / ARB ${100-(fe.springShare??50)}%`}
                hint="How much of the mechanical balance correction comes from rear spring stiffness vs ARB split. 0% = ARB handles all correction (rear Hz equals front Hz). 100% = springs handle all correction (ARB split near neutral). 50% = equal contribution from both."/>
            </>}
            {(fe.arbBalMode??'weight')==='man'&&<>
              <div style={{display:'flex',gap:6,marginBottom:10}}>
                <Field label="ARB F" value={fe.arbManF??20} onChange={pFe('arbManF')} min={1} max={65} step={0.1} hint="Front ARB clicks (manual)"/>
                <Field label="ARB R" value={fe.arbManR??20} onChange={pFe('arbManR')} min={1} max={65} step={0.1} hint="Rear ARB clicks (manual)"/>
              </div>
            </>}
          </Sec></div>

          <div id="zone-feel" style={dim('ride','feel')}><Sec title="RIDE" open={open.ride} onToggle={tog('ride')}
            onReset={()=>setFe(p=>({...p,
              rideStiffness:DEF_FE.rideStiffness,
              targetSpeed:DEF_FE.targetSpeed,
              rearHzMode:DEF_FE.rearHzMode,

                    ?"Front Hz as a fraction of rear Hz. ÷1.20 = front is 83% of rear stiffness. Useful when you want the front consistently softer."

            : (fe.rearHzMode??'flatRide')==='mech'

                          {secHz.toFixed(2)}

            })()}

              <span style={{fontFamily:'Courier New',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>{physics.frontHz.toFixed(2)}</span>

            </div>

                  markers={[

                  markers={[

                    {value:100,color:'#ef4444',label:'OVER'},
                  ]}
                  readout={(()=>{

                    const r=fe.reboundZeta??70;

              : <FeelSlider label="Damping Bias" value={-(fe.dampingBias??0)}
                  onChange={v=>pFe('dampingBias')(-v)} min={-50} max={50} step={1}
                  leftLabel="FRONT" rightLabel="REAR"

              <button className="tbtn" style={{fontSize:11}} onClick={()=>{

          {/* DATA MODAL — share / import / export */}
          {showDataModal&&(()=>{

              shareSel.fe?fe:DEF_FE,
              shareSel.dr?dr:DEF_DR,

            const doCopy=()=>{

                const ta=document.createElement('textarea');
                ta.value=sharePayload;document.body.appendChild(ta);ta.select();
                document.execCommand('copy');document.body.removeChild(ta);
                setShareCopied(true);
              }
            };
            const selectStyle={width:'100%',background:'#020617',border:'1px solid #1e293b',
              borderRadius:2,padding:'5px 8px',fontSize:11,color:'#e2e8f0',outline:'none',
              fontFamily:'Courier New',letterSpacing:1,marginBottom:14,cursor:'pointer',
              appearance:'none',WebkitAppearance:'none'};
            const chkRow=(key,label,sub,checked,onChange,disabled=false)=>(
              <label key={key} style={{display:'flex',alignItems:'center',gap:10,
                                       padding:'7px 0',borderBottom:'1px solid #1e293b',
                                       cursor:disabled?'default':'pointer',userSelect:'none',
                                       opacity:disabled?0.35:1}}>
                <input type="checkbox" checked={checked} disabled={disabled}

                  style={{accentColor:'#94a3b8',width:14,height:14,cursor:disabled?'default':'pointer'}}/>
                <div>
                  <div style={{fontSize:11,color:'#e2e8f0',letterSpacing:1}}>{label}</div>
                  <div style={{fontSize:9,color:'#475569'}}>{sub}</div>
                </div>
              </label>
            );
            return(
            <div style={{position:'fixed',inset:0,zIndex:900,display:'flex',alignItems:'center',
                         justifyContent:'center',background:'#000a'}}
                 onClick={e=>{if(e.target===e.currentTarget)close();}}>
              <div style={{background:'#0f172a',border:'1px solid #334155',borderRadius:4,
                           padding:'20px 22px',width:280,fontFamily:'Courier New',
                           boxShadow:'0 8px 40px #000d'}}>
                <div style={{fontSize:11,letterSpacing:2,color:'#94a3b8',marginBottom:12}}>SHARE</div>
                {/* mode selector */}
                <div style={{position:'relative',marginBottom:14}}>
                  <select value={dataMode} onChange={e=>{setDataMode(e.target.value);setShareCopied(false);setImportErr('');setRestoreData(null);setRestoreErr('');}}
                    style={selectStyle}>
                    <option value="share">COPY CODE — generate a tune code</option>
                    <option value="load">LOAD CODE — load from a tune code</option>
                    <option value="backup">BACKUP — download saved data</option>
                    <option value="restore">RESTORE — load from a backup file</option>
                  </select>
                  <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',
                                color:'#475569',pointerEvents:'none',fontSize:10}}>▾</span>
                </div>
                {(()=>{
                  const hints={
                    share:'Generates a compact code for the current tune — chassis, springs, dampers, ARBs, and all feel settings. Share it with any SUSP.OS user. Does not include your garage saves or saved builds.',
                    load:'Paste a code from another device or user to load their tune. This overwrites your current setup — save your current tune to MY BUILDS first if you want to keep it.',
                    backup:'Downloads a JSON file of all your garage saves and saved builds. Use this to move your collection to another device or keep a local copy. Does not include the current unsaved tune.',
                    restore:'Loads garage saves and builds from a backup file. You can choose to restore only garage, only builds, or both. Does not affect the current unsaved tune.',
                  };
                  return<div style={{fontSize:10,color:'#94a3b8',lineHeight:1.6,marginBottom:12,letterSpacing:0.3}}>{hints[dataMode]}</div>;
                })()}

                {/* SHARE */}
                {dataMode==='share'&&(<>
                  <div style={{fontSize:9,letterSpacing:2,color:'#475569',marginBottom:6}}>INCLUDE</div>
                  {[
                    {key:'ch',label:'CHASSIS',sub:'Weight · bias · tyres · geometry'},
                    {key:'fe',label:'FEEL',sub:'Ride · damping · ARB · balance'},
                    {key:'dr',label:'DRIVETRAIN',sub:'Layout · build type · diff'},
                  ].map(({key,label,sub})=>chkRow(key,label,sub,shareSel[key],
                    e=>{setShareSel(s=>({...s,[key]:e.target.checked}));setShareCopied(false);}))}
                  <textarea readOnly value={sharePayload} rows={3} onFocus={e=>e.target.select()}
                    style={{width:'100%',background:'#020617',border:'1px solid #1e293b',borderRadius:2,
                            padding:'6px 8px',fontSize:10,color:'#e2e8f0',outline:'none',resize:'none',
                            fontFamily:'Courier New',letterSpacing:0.5,marginTop:10,marginBottom:6,cursor:'text'}}/>
                  <div style={{fontSize:9,color:'#475569',marginBottom:12,letterSpacing:0.5}}>
                    Paste into LOAD CODE on any device running SUSP.OS
                  </div>
                  <div style={{display:'flex',gap:6}}>
                    <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CLOSE</button>
                    <button className={`tbtn${shareCopied?' saved':' on'}`} style={{flex:1,fontSize:11}}
                      onClick={doCopy}>{shareCopied?'COPIED':'COPY'}</button>
                  </div>
                </>)}

                {/* LOAD CODE */}
                {dataMode==='load'&&(<>
                  <textarea value={importCode} onChange={e=>{setImportCode(e.target.value);setImportErr('');}}
                    placeholder="Paste tune code here…" rows={3}
                    style={{width:'100%',background:'#020617',border:'1px solid #1e293b',borderRadius:2,
                            padding:'6px 8px',fontSize:10,color:'#e2e8f0',outline:'none',resize:'none',
                            fontFamily:'Courier New',letterSpacing:0.5,marginBottom:10}}/>
                  {importErr&&<div style={{fontSize:9,color:'#f87171',marginBottom:8,letterSpacing:0.5}}>{importErr}</div>}
                  <div style={{fontSize:9,letterSpacing:2,color:'#475569',marginBottom:6}}>APPLY TO</div>
                  {[
                    {key:'ch',label:'CHASSIS',sub:'Weight · bias · tyres · geometry'},
                    {key:'fe',label:'FEEL',sub:'Ride · damping · ARB · balance'},
                    {key:'dr',label:'DRIVETRAIN',sub:'Layout · build type · diff'},
                  ].map(({key,label,sub})=>chkRow(key,label,sub,importSel[key],
                    e=>setImportSel(s=>({...s,[key]:e.target.checked}))))}
                  <div style={{display:'flex',gap:6,marginTop:14}}>
                    <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CANCEL</button>
                    <button className="tbtn on" style={{flex:1,fontSize:11}}
                      disabled={!importCode.trim()||(!importSel.ch&&!importSel.fe&&!importSel.dr)}
                      onClick={()=>{
                        const code=importCode.replace(/\s/g,'');
                        try{
                          const{ch:ic,fe:ife,dr:idr}=sanitizeTune(decodeTune(code));
                          if(importSel.ch) setCh({...DEF_CH,...ic});
                          if(importSel.fe) setFe({...DEF_FE,...ife});
                          if(importSel.dr) setDr({...DEF_DR,...idr});
                          close();
                        }catch(e){
                          console.error('Import failed:',e,code);
                          setImportErr('Invalid code — make sure you pasted the full string.');
                        }
                      }}>LOAD</button>
                  </div>
                </>)}

                {/* BACKUP */}
                {dataMode==='backup'&&(<>
                  <div style={{fontSize:9,color:'#475569',marginBottom:10,letterSpacing:0.5,lineHeight:1.5}}>
                    Download a JSON backup of your saved data. Use this to transfer between devices or browsers.
                  </div>
                  {[
                    {key:'garage',label:'GARAGE',sub:'Chassis saves'},
                    {key:'builds',label:'MY BUILDS',sub:'Tune saves'},
                  ].map(({key,label,sub})=>chkRow(key,label,sub,exportSel[key],
                    e=>setExportSel(s=>({...s,[key]:e.target.checked}))))}
                  <div style={{display:'flex',gap:6,marginTop:14}}>
                    <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CANCEL</button>
                    <button className="tbtn on" style={{flex:1,fontSize:11}}
                      disabled={!exportSel.garage&&!exportSel.builds}
                      onClick={()=>{
                        const out={};
                        if(exportSel.garage) out.garage=garage;
                        if(exportSel.builds) out.builds=myBuilds;
                        const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
                        const url=URL.createObjectURL(blob);
                        const a=document.createElement('a');
                        a.href=url;a.download='suspos-data.json';a.click();
                        URL.revokeObjectURL(url);
                        close();
                      }}>DOWNLOAD</button>
                  </div>
                </>)}

                {/* RESTORE */}
                {dataMode==='restore'&&(<>
                  {!restoreData&&(<>
                    <div style={{fontSize:9,color:'#475569',marginBottom:10,letterSpacing:0.5,lineHeight:1.5}}>
                      Load a suspos-data.json backup file to restore saved data.
                    </div>
                    {restoreErr&&<div style={{fontSize:9,color:'#f87171',marginBottom:8,letterSpacing:0.5}}>{restoreErr}</div>}
                    <div style={{display:'flex',gap:6,marginTop:4}}>
                      <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CANCEL</button>
                      <button className="tbtn on" style={{flex:1,fontSize:11}} onClick={()=>{
                        const inp=document.createElement('input');
                        inp.type='file';inp.accept='.json,application/json';
                        inp.onchange=e=>{
                          const file=e.target.files?.[0];
                          if(!file)return;
                          const reader=new FileReader();
                          reader.onload=ev=>{
                            try{
                              const parsed=JSON.parse(ev.target.result);
                              if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw new Error();
                              if(!Array.isArray(parsed.garage)&&!Array.isArray(parsed.builds))throw new Error();
                              setRestoreData(parsed);
                              setRestoreSel({garage:Array.isArray(parsed.garage),builds:Array.isArray(parsed.builds)});
                              setRestoreErr('');
                            }catch{setRestoreErr('Invalid backup file.');}
                          };
                          reader.readAsText(file);
                        };
                        inp.click();
                      }}>CHOOSE FILE</button>
                    </div>
                  </>)}
                  {restoreData&&(<>
                    <div style={{fontSize:9,color:'#475569',marginBottom:8,letterSpacing:0.5,lineHeight:1.5}}>
                      Select what to restore. This will overwrite your current saves.
                    </div>
                    {[
                      {key:'garage',label:'GARAGE',sub:'Chassis saves'},
                      {key:'builds',label:'MY BUILDS',sub:'Tune saves'},
                    ].map(({key,label,sub})=>chkRow(key,label,sub,restoreSel[key],
                      e=>setRestoreSel(s=>({...s,[key]:e.target.checked})),
                      !Array.isArray(restoreData[key])))}
                    <div style={{display:'flex',gap:6,marginTop:14}}>
                      <button className="tbtn" style={{flex:1,fontSize:11}} onClick={close}>CANCEL</button>
                      <button className="tbtn on" style={{flex:1,fontSize:11}}
                        disabled={!restoreSel.garage&&!restoreSel.builds}
                        onClick={()=>{
                          if(restoreSel.garage&&Array.isArray(restoreData.garage)) setGarage(restoreData.garage);
                          if(restoreSel.builds&&Array.isArray(restoreData.builds)) setMyBuilds(restoreData.builds);
                          close();
                        }}>RESTORE</button>
                    </div>
                  </>)}
                </>)}
              </div>
            </div>
            );
          })()}

          {/* PINNED — HANDLING BALANCE */}
          <div id="zone-balance-bar" style={{flexShrink:0,borderTop:'1px solid #1e293b',background:'#020617',
                                             paddingBottom:'env(safe-area-inset-bottom,0px)',...dim('balance-bar')}}>
            {/* compact header row — tap to expand */}
            <div className="collapsible-hdr"
                 onClick={()=>{
                   if(isPhone){
                     // On phones the tap reveals/hides the full bar stack (the summary line stays).
                     const next=!footerOpen;
                     setFooterOpen(next);
                     if(next){ if(!balTutSeen){setBalTutSeen(true);openBalTut();} }
                     else { setOpen(p=>({...p,balanceExpanded:false})); } // collapsing also hides the detail panel
                   } else {
                     setOpen(p=>{
                       const next=!p.balanceExpanded;
                       if(next&&!balTutSeen){setBalTutSeen(true);openBalTut();}
                       return{...p,balanceExpanded:next};
                     });
                   }
                 }}
                 style={{padding:isPhone?'10px 8px':'10px 14px',cursor:'pointer'}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:5}}>
                <div style={{display:'flex',alignItems:'center',gap:isPhone?5:8,flex:1,minWidth:0,overflow:'hidden'}}>
                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:2,flexShrink:0}}>HANDLING BALANCE</span>
                  <Hint text="Combined steady-state handling tendency from all tuning inputs. Positive (+) = oversteer tendency, negative (−) = understeer. Zero is weight-matched neutral — neither end saturates grip first. Tap to expand for contributor breakdown and actionable tip."/>
                  <span style={{fontSize:10,color:'#94a3b8',letterSpacing:1,flexShrink:0}}>·</span>
                  <span style={{fontFamily:'Courier New',fontSize:13,fontWeight:700,flexShrink:0,
                                color:Math.abs(bTotFull)<3?'#e2e8f0':bTotFull>0?'#ef4444':'#3b82f6'}}>
                    {`${bTotFull>=0?'+':''}${bTotFull.toFixed(1)}`}
                  </span>
                  {!isMobile&&<span style={{fontSize:11,letterSpacing:2,flexShrink:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',
                                color:Math.abs(bTotFull)<3?'#e2e8f0':bTotFull>0?'#ef4444':'#3b82f6'}}>
                    {Math.abs(bTotFull)<3?'NEUTRAL':bTotFull>0?'OVERSTEER':'UNDERSTEER'}
                  </span>}
                </div>
                <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
                  {uiMode==='pro'&&tune.mechBalance!=null&&<span style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#475569',letterSpacing:1,fontFamily:'Courier New'}}>
                    <span>MECH {tune.mechBalance.toFixed(2)}
                    {(()=>{const _d=tune.mechBalance-natMechBalance;const _a=Math.abs(_d);
                      if(_a<0.01)return null;
                      return <span style={{color:_d>0?'#60a5fa':'#f59e0b'}}>{(_d>=0?'+':'')+_d.toFixed(2)}</span>;
                    })()}</span>
                    <Hint text="Mech Balance is the rear fraction of total roll stiffness (0 = all front, 1 = all rear, 0.5 = even split). This matches Forza's in-game mech balance display. The delta shows how far your setup has shifted from the car's natural balance — blue means more rear-biased than natural, amber means more front-biased."/>
                  </span>}
                  <span style={{fontSize:10,color:'#94a3b8'}}>
                    {(isPhone?footerOpen:open.balanceExpanded)?'▲':'▼'}
                  </span>
                </div>
              </div>
              {/* Bar stack — always shown on desktop; on phones it collapses behind the summary line. */}
              {(!isPhone||footerOpen)&&<>
              {/* compact stacked balance bar — each contributor rendered as a segment from centre */}
              {(()=>{
                const cl=v=>Math.max(-50,Math.min(50,v));
                const allSegs=[
                  {key:'sp', val:tune.bSp??0,   col:'#60a5fa'},  // springs — blue family
                  {key:'ab', val:tune.bAb??0,   col:'#818cf8'},  // ARBs — indigo
                  {key:'df', val:(diff.bDiffAccel??0)+(diff.bDiffDecel??0), col:'#f59e0b'}, // diff — amber
                  {key:'br', val:bBrakeEntry,   col:'#34d399'},  // brakes — green
                  {key:'dm', val:bDampBias,      col:'#a78bfa'},  // damping — violet
                ].filter(s=>Math.abs(s.val)>0.3);
                // Build segments left→right; each stacks outward from the previous
                // Negative segs grow leftward from centre, positive grow rightward
                let posOffset=0, negOffset=0;
                return(
                  <div style={{position:'relative',height:16,background:'#0a0f1a',border:'1px solid #1e293b',
                               borderRadius:2,overflow:'hidden'}}>
                    {/* zone shading */}
                    <div style={{position:'absolute',left:'5%', width:'20%',top:0,bottom:0,background:'#3b82f614'}}/>
                    <div style={{position:'absolute',left:'25%',width:'20%',top:0,bottom:0,background:'#3b82f608'}}/>
                    <div style={{position:'absolute',left:'55%',width:'20%',top:0,bottom:0,background:'#ef444408'}}/>
                    <div style={{position:'absolute',left:'75%',width:'15%',top:0,bottom:0,background:'#f9731614'}}/>
                    <div style={{position:'absolute',left:'90%',width:'10%',top:0,bottom:0,background:'#ef444422'}}/>
                    <div style={{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'#334155'}}/>
                    {allSegs.map(({key,val,col})=>{
                      const p=cl(val);
                      if(p>=0){
                        const seg={position:'absolute',top:2,bottom:2,borderRadius:1,
                          left:`${50+posOffset}%`,width:`${p}%`,
                          background:col+'bb'};
                        posOffset+=p;
                        return <div key={key} style={seg}/>;
                      } else {
                        const seg={position:'absolute',top:2,bottom:2,borderRadius:1,
                          right:`${50+negOffset}%`,width:`${-p}%`,
                          background:col+'bb'};
                        negOffset+=(-p);
                        return <div key={key} style={seg}/>;
                      }
                    })}
                    <div style={{position:'absolute',left:5,top:'50%',transform:'translateY(-50%)',
                                 fontSize:10,color:'#3b82f6',letterSpacing:1,fontWeight:700}}>US</div>
                    <div style={{position:'absolute',right:5,top:'50%',transform:'translateY(-50%)',
                                 fontSize:10,color:'#ef4444',letterSpacing:1,fontWeight:700}}>OS</div>
                  </div>

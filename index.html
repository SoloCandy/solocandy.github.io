const GAME_MODE_ENC={'horizon':0,'motorsport':1};
const GAME_MODE_DEC=['horizon','motorsport'];
const DAMPING_MODE_ENC={'ratio':0,'independent':1};
const DAMPING_MODE_DEC=['ratio','independent'];
const ARB_MODE_ENC={'auto':0,'roll':1,'share':2};
const ARB_MODE_DEC=['auto','roll','share'];
const LAYOUT_ENC={'FWD':0,'RWD':1,'AWD':2};
const LAYOUT_DEC=['FWD','RWD','AWD'];
const BUILD_ENC={'street':0,'track':1,'drift':2};
const BUILD_DEC=['street','track','drift'];

const encodeTune=(ch,fe,dr,br)=>{
  const arr=[
    ch.weight,ch.frontBias,ch.wheelbase,ch.cgHeight,ch.trackF,ch.trackR,ch.motionRatioF,ch.motionRatioR,
    fe.rideStiffness,fe.arbBias??0,fe.targetSpeed,GAME_MODE_ENC[fe.gameMode]??0,
    DAMPING_MODE_ENC[fe.dampingMode??'ratio']??0,fe.reboundZeta??70,fe.bumpRatio??56,fe.bumpZeta??39,
    ARB_MODE_ENC[fe.arbMode??'auto']??0,fe.arbTargetRollMan??1.8,fe.arbShareMan??15,fe.arbFloor??6,fe.arbCeil??65,
    LAYOUT_ENC[dr.layout]??1,BUILD_ENC[dr.buildType??'track']??1,dr.diffManual?1:0,
    dr.diffBiasExit??0,dr.diffAccel??35,dr.diffDecel??10,
    dr.diffFrontAccel??28,dr.diffFrontDecel??0,dr.diffRearAccel??48,dr.diffRearDecel??8,dr.diffCenter??65,
    dr.diffBiasEntry??0,
    (br?.brakeManual?1:0),br?.brakeBias??DEF_BR.brakeBias,br?.brakePressure??DEF_BR.brakePressure,
    ch.aeroBalance??0.5,
    ch.aeroEfficiency??0.9,
  ];
  return btoa(arr.join('|'));
};

const decodeTune=(code)=>{
  const raw=atob(code.trim());
  if(raw.startsWith('{')){
    const{ch:ic,fe:ife,dr:idr}=JSON.parse(raw);
    return{ch:ic,fe:ife,dr:idr};
  }
  const v=raw.split('|').map(Number);
  const ch={weight:v[0],frontBias:v[1],wheelbase:v[2],cgHeight:v[3],trackF:v[4],trackR:v[5],motionRatioF:v[6],motionRatioR:v[7],
            aeroBalance:v.length>=37?v[36]:0.5,
            aeroEfficiency:v.length>=38?v[37]:0.9};
  const fe={rideStiffness:v[8],arbBias:v[9],targetSpeed:v[10],gameMode:GAME_MODE_DEC[v[11]]??'horizon',
            dampingMode:DAMPING_MODE_DEC[v[12]]??'ratio',reboundZeta:v[13],bumpRatio:v[14],bumpZeta:v[15],
            arbMode:ARB_MODE_DEC[v[16]]??'auto',arbTargetRollMan:v[17],arbShareMan:v[18],arbFloor:v[19],arbCeil:v[20]};
  const dr={layout:LAYOUT_DEC[v[21]]??'RWD',buildType:BUILD_DEC[v[22]]??'track',diffManual:v[23]===1,
            diffBiasExit:v[24]??0,diffAccel:v[25],diffDecel:v[26],
            diffFrontAccel:v[27],diffFrontDecel:v[28],diffRearAccel:v[29],diffRearDecel:v[30],diffCenter:v[31],
            diffBiasEntry:v[32]??0};
  const br=v.length>=36
    ?{brakeManual:v[33]===1,brakeBias:v[34],brakePressure:v[35]}
    :{...DEF_BR};
  return{ch,fe,dr,br};
};

const sanitizeTune=({ch,fe,dr,br})=>{
  const n=(v,def)=>(typeof v==='number'&&isFinite(v))?v:def;
  const cl=(v,lo,hi,def)=>Math.max(lo,Math.min(hi,n(v,def)));
  const sArbFloor=cl(fe?.arbFloor,1,64,DEF_FE.arbFloor);
  const sArbCeil=Math.max(sArbFloor+1,cl(fe?.arbCeil,1,65,DEF_FE.arbCeil));
  return{
    ch:{
      weight:       cl(ch?.weight,        100,  18000, DEF_CH.weight),
      frontBias:    cl(ch?.frontBias,      30,   70,   DEF_CH.frontBias),
      wheelbase:    cl(ch?.wheelbase,      0.4,  4.0,  DEF_CH.wheelbase),
      cgHeight:     cl(ch?.cgHeight,       0.2,  0.9,  DEF_CH.cgHeight),
      trackF:       cl(ch?.trackF,         1.0,  2.2,  DEF_CH.trackF),
      trackR:       cl(ch?.trackR,         1.0,  2.2,  DEF_CH.trackR),
      motionRatioF: cl(ch?.motionRatioF,   0.5,  1.0,  DEF_CH.motionRatioF),
      motionRatioR: cl(ch?.motionRatioR,   0.5,  1.0,  DEF_CH.motionRatioR),
      aeroBalance:  cl(ch?.aeroBalance,    0,    1.5,  DEF_CH.aeroBalance),
      aeroEfficiency:cl(ch?.aeroEfficiency,0.1,  1.0,  DEF_CH.aeroEfficiency),
    },
    fe:{
      rideStiffness:    cl(fe?.rideStiffness,    0,    100,  DEF_FE.rideStiffness),
      arbBias:          cl(fe?.arbBias,          -50,   50,  DEF_FE.arbBias),
      targetSpeed:      cl(fe?.targetSpeed,       40,  200,  DEF_FE.targetSpeed),
      gameMode:         GAME_MODE_DEC.includes(fe?.gameMode)?fe.gameMode:DEF_FE.gameMode,
      dampingMode:      DAMPING_MODE_DEC.includes(fe?.dampingMode)?fe.dampingMode:DEF_FE.dampingMode,
      reboundZeta:      cl(fe?.reboundZeta,       10,  115,  DEF_FE.reboundZeta),
      bumpRatio:        cl(fe?.bumpRatio,         10,  100,  DEF_FE.bumpRatio),
      bumpZeta:         cl(fe?.bumpZeta,          10,  115,  DEF_FE.bumpZeta),
      arbMode:          ARB_MODE_DEC.includes(fe?.arbMode)?fe.arbMode:DEF_FE.arbMode,
      arbTargetRollMan: cl(fe?.arbTargetRollMan,  0.3,  5.0, DEF_FE.arbTargetRollMan),
      arbShareMan:      cl(fe?.arbShareMan,        0,   80,  DEF_FE.arbShareMan),
      arbFloor:         sArbFloor,
      arbCeil:          sArbCeil,
    },
    dr:{
      layout:         LAYOUT_DEC.includes(dr?.layout)?dr.layout:DEF_DR.layout,
      buildType:      BUILD_DEC.includes(dr?.buildType)?dr.buildType:DEF_DR.buildType,
      diffManual:     typeof dr?.diffManual==='boolean'?dr.diffManual:dr?.diffManual===1,
      diffBiasExit:   cl(dr?.diffBiasExit,  -50,  50,  DEF_DR.diffBiasExit),
      diffBiasEntry:  cl(dr?.diffBiasEntry, -50,  50,  DEF_DR.diffBiasEntry),
      diffAccel:      cl(dr?.diffAccel,       0,  100,  DEF_DR.diffAccel),
      diffDecel:      cl(dr?.diffDecel,       0,  100,  DEF_DR.diffDecel),
      diffFrontAccel: cl(dr?.diffFrontAccel,  0,  100,  DEF_DR.diffFrontAccel),
      diffFrontDecel: cl(dr?.diffFrontDecel,  0,  100,  DEF_DR.diffFrontDecel),
      diffRearAccel:  cl(dr?.diffRearAccel,   0,  100,  DEF_DR.diffRearAccel),
      diffRearDecel:  cl(dr?.diffRearDecel,   0,  100,  DEF_DR.diffRearDecel),
      diffCenter:     cl(dr?.diffCenter,      0,  100,  DEF_DR.diffCenter),
    },
    br:{
      brakeManual:    typeof br?.brakeManual==='boolean'?br.brakeManual:br?.brakeManual===1,
      brakeBias:      cl(br?.brakeBias,       45,  70,  DEF_BR.brakeBias),
      brakePressure:  cl(br?.brakePressure,   50, 200,  DEF_BR.brakePressure),
    },
  };
};

const SaveSlot=({i,s,onLoad,onSave,onClear,onRename})=>{
  const[editing,setEditing]=useState(false);
  const[draft,setDraft]=useState('');
  const[pendingClear,setPendingClear]=useState(false);
  const inputRef=useRef(null);
  const clearTimer=useRef(null);
  const handleClear=()=>{
    if(pendingClear){clearTimeout(clearTimer.current);setPendingClear(false);onClear();}
    else{setPendingClear(true);clearTimer.current=setTimeout(()=>setPendingClear(false),2000);}
  };
  useEffect(()=>()=>clearTimeout(clearTimer.current),[]);

  const startEdit=e=>{
    e.stopPropagation();
    setDraft(s.name);
    setEditing(true);
    setTimeout(()=>{inputRef.current?.select();},10);
  };
  const commit=()=>{
    const name=draft.trim().slice(0,12)||s.name;
    onRename(i,name);
    setEditing(false);
  };

  if(!s) return(
    <button className="tbtn" style={{fontSize:10,color:'#374151',borderStyle:'dashed'}}
      onClick={onSave} title={`Save current feel & drivetrain to slot ${i}`}>
      + SLOT {i}
    </button>
  );

  return(
    <div style={{display:'flex',gap:1,alignItems:'center'}}>
      {editing
        ? <input ref={inputRef} autoFocus
            value={draft} onChange={e=>setDraft(e.target.value)}
            onBlur={commit}
            onKeyDown={e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){setEditing(false);}}}
            style={{width:72,background:'#0a0f1a',border:'1px solid #e2e8f033',borderRadius:2,
                    color:'#e2e8f0',fontFamily:'Courier New',fontSize:10,padding:'2px 5px',
                    outline:'none',textTransform:'uppercase'}}/>
        : <button className="tbtn saved" style={{fontSize:10,maxWidth:80,overflow:'hidden',
                    textOverflow:'ellipsis',whiteSpace:'nowrap'}}
            onClick={onLoad}
            onDoubleClick={startEdit}
            title={`Load: ${s.name} — double-click to rename`}>
            {s.name.slice(0,12).toUpperCase()}
          </button>}
      {!editing&&<button onClick={startEdit}
        style={{background:'none',border:'1px solid #1e293b',borderRadius:2,
                color:'#374151',cursor:'pointer',fontSize:9,padding:'0 3px',lineHeight:'22px',
                flexShrink:0}}
        title="Rename">✎</button>}
      <button onClick={handleClear}
        style={{background:'none',border:`1px solid ${pendingClear?'#f59e0b44':'#1e293b'}`,borderRadius:2,
                color:pendingClear?'#f59e0b':'#374151',cursor:'pointer',fontSize:10,padding:'0 3px',lineHeight:'22px',
                flexShrink:0,transition:'color .12s,border-color .12s'}}
        title={pendingClear?'Click again to clear':'Clear slot'}>{pendingClear?'✓':'✕'}</button>
    </div>
  );
};

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){
    if(this.state.err)return(
      <div style={{padding:24,color:'#ef4444',fontFamily:'Courier New',fontSize:12,background:'#020617',minHeight:'100vh'}}>
        <div style={{marginBottom:8,color:'#e2e8f0',fontSize:14}}>SUSP.OS — Failed to load</div>
        <div style={{marginBottom:16,color:'#6b7280'}}>An error occurred. Try reloading the page.</div>
        <div style={{background:'#0f172a',padding:12,borderRadius:4,border:'1px solid #1e293b',
                     whiteSpace:'pre-wrap',wordBreak:'break-all',lineHeight:1.6}}>
          {this.state.err.toString()}
        </div>
        <button onClick={()=>window.location.reload()}
          style={{marginTop:16,padding:'8px 16px',background:'#0f172a',border:'1px solid #1e293b',
                  color:'#e2e8f0',borderRadius:4,cursor:'pointer',fontFamily:'Courier New',fontSize:12}}>
          RELOAD
        </button>
      </div>
    );
    return this.props.children;
  }
}

function App(){
  const[ch,setCh]=usePersist('suspos_ch_v8',DEF_CH);
  const[fe,setFe]=usePersist('suspos_fe_v8',DEF_FE);
  const[dr,setDr]=usePersist('suspos_dr_v8',DEF_DR);
  const[al,setAl]=usePersist('suspos_al_v2',DEF_AL);
  const[br,setBr]=usePersist('suspos_br_v1',DEF_BR);
  const[metricUnits,setMetricUnits]=usePersist('suspos_units_v1',false);
  const[saves,setSaves]=usePersist('suspos_saves_v9',PRESET_SAVES);
  const[open,setOpen]=useState({chassis:true,feel:true,arb:true,alignment:true,drivetrain:true,brakes:true,chassisAdv:false,balanceExpanded:true,statsOpen:false});
  const[showChecker,setShowChecker]=useState(false);
  const[sidebarOpen,setSidebarOpen]=useState(true);
  const[isMobile,setIsMobile]=useState(false);
  useEffect(()=>{
    const preload=document.getElementById('pre-load');
    if(preload)preload.style.display='none';
    const check=()=>{
      const mobile=window.innerWidth<768;
      setIsMobile(mobile);
      setSidebarOpen(!mobile);
    };
    check();
    window.addEventListener('resize',check);
    return()=>window.removeEventListener('resize',check);
  },[]);

  const pCh=k=>v=>setCh(p=>({...p,[k]:v}));
  const pFe=k=>v=>setFe(p=>({...p,[k]:v}));
  const pDr=k=>v=>setDr(p=>({...p,[k]:v}));
  const pAl=k=>v=>setAl(p=>({...p,[k]:v}));
  const pBr=k=>v=>setBr(p=>({...p,[k]:v}));
  const tog=k=>()=>setOpen(p=>({...p,[k]:!p[k]}));

  const physics=useMemo(()=>feelToPhysics(ch,fe),[ch,fe]);
  const tune=useMemo(()=>computeTune(ch,physics,fe.gameMode),[ch,physics,fe.gameMode]);
  const autoAlign=useMemo(()=>computeAlignment(ch,tune,dr.layout,dr.buildType),[ch,tune,dr.layout,dr.buildType]);
  const align=al.alignManual
    ?{recCamberF:al.camberF,recCamberR:al.camberR,
      recToeF:al.toeF,recToeR:al.toeR,recCaster:al.caster}
    :autoAlign;
  const diff=useMemo(()=>computeDiff(ch,fe,dr),[ch,fe,dr]);
  const recBrakeBias=Math.round(Math.max(45,Math.min(65,
    ch.frontBias+(dr.buildType==='drift'?-8:dr.buildType==='track'?-3:0))));
  const brakeBias=br.brakeManual?(br.brakeBias??DEF_BR.brakeBias):recBrakeBias;
  const brakePressure=br.brakeManual?(br.brakePressure??DEF_BR.brakePressure):100;
  const bBrakeEntry=(brakeBias-50)*BRAKE_BIAS_SCALE;
  const aeroEff=Math.max(0.1,ch.aeroEfficiency??0.9);
  const bAero=(0.5-(ch.aeroBalance??0.5))*AERO_BALANCE_SCALE*(0.9/aeroEff);
  const bTotFull=tune.bTot+diff.bDiffAccel+diff.bDiffDecel+bBrakeEntry+bAero;
  const lim=GAME_LIMITS[fe.gameMode];

  const handleSlot=i=>{
    const s=saves[i];
    if(s){
      setFe({...DEF_FE,...s.fe});
      setDr({...DEF_DR,...s.dr});
    }
    else{
      const hz=physics.frontHz.toFixed(1);
      const build=(dr.buildType??'track').toUpperCase();
      setSaves(p=>({...p,[i]:{fe,dr,name:`${build} ${hz}`}}));
    }
  };
  const clearSlot=i=>setSaves(p=>{const n={...p};delete n[i];return n;});
  const renameSlot=(i,name)=>setSaves(p=>({...p,[i]:{...p[i],name}}));

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh',minHeight:'-webkit-fill-available',overflow:'hidden'}}>
      {showChecker&&<CheckerModal onClose={()=>setShowChecker(false)} lim={lim} metricUnits={metricUnits}/>}

      {/* HEADER */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                   padding:'0 14px',height:42,borderBottom:'1px solid #0f172a',
                   flexShrink:0,background:'#020617'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button onClick={()=>setSidebarOpen(p=>!p)}
            style={{background:'none',border:'1px solid #1e293b',borderRadius:2,
                    color:sidebarOpen?'#e2e8f0':'#6b7280',cursor:'pointer',
                    padding:'3px 7px',fontSize:13,lineHeight:1,transition:'color .12s,border-color .12s',
                    borderColor:sidebarOpen?'#e2e8f033':'#1e293b'}}>
            {sidebarOpen?'✕':'☰'}
          </button>
          <div style={{fontWeight:700,fontSize:15,color:'#e2e8f0',letterSpacing:4}}>
            SUSP<span style={{color:'#374151'}}>.</span>OS
          </div>
        </div>
        <div style={{display:'flex',gap:3,alignItems:'center'}}>
          <button className={`tbtn${!metricUnits?' on':''}`}
            onClick={()=>setMetricUnits(false)} style={{fontSize:11}}>IMP</button>
          <button className={`tbtn${metricUnits?' on':''}`}
            onClick={()=>setMetricUnits(true)} style={{fontSize:11}}>MET</button>
          <div style={{width:1,height:16,background:'#1e293b',margin:'0 4px'}}/>
          {['horizon','motorsport'].map(m=>(
            <button key={m} className={`tbtn${fe.gameMode===m?' on':''}`}
              onClick={()=>pFe('gameMode')(m)} style={{fontSize:11}}>{m.toUpperCase()}</button>
          ))}
        </div>
      </div>

      {/* BODY */}
      <div style={{display:'flex',flex:1,overflow:'hidden',position:'relative'}}>

        {/* BACKDROP — mobile only, closes sidebar on tap */}
        {sidebarOpen&&isMobile&&
          <div onClick={()=>setSidebarOpen(false)}
               style={{position:'absolute',inset:0,background:'#00000088',zIndex:150}}/>}

        {/* SIDEBAR */}
        <div className="sidebar-scroll" style={{WebkitOverflowScrolling:'touch',overscrollBehavior:'contain',
          width:300,flexShrink:0,overflowY:'auto',
          borderRight:'1px solid #0f172a',background:'#020617',
          ...(isMobile?{
            position:'absolute',top:0,left:0,bottom:0,zIndex:200,
            transform:sidebarOpen?'translateX(0)':'translateX(-100%)',
            transition:'transform .2s ease',
            boxShadow:sidebarOpen?'4px 0 24px #000000cc':'none',
          }:{
            display:sidebarOpen?'block':'none',
          })
        }}>

          <Sec title="CHASSIS" open={open.chassis} onToggle={tog('chassis')}
            onReset={()=>setCh({...DEF_CH})}>
            <Field label="Weight"
              value={metricUnits?ch.weight/KG_TO_LB:ch.weight}
              onChange={metricUnits?v=>pCh('weight')(v*KG_TO_LB):pCh('weight')}
              min={metricUnits?45:100} max={metricUnits?8165:18000} step={1}
              unit={metricUnits?'kg':'lb'} logScale={true} logMid={metricUnits?2722:6000}
              hint={metricUnits
                ?"Total vehicle weight in kg. Find this on the car's stat page in Forza. Affects spring rates, damper forces, and ARB stiffness directly."
                :"Total vehicle weight in pounds. Find this on the car's stat page in Forza. Affects spring rates, damper forces, and ARB stiffness directly."}/>
            <Field label="Front Weight Bias" value={ch.frontBias} onChange={pCh('frontBias')} min={30} max={70} step={1} unit="%"
              hint="Percentage of total weight on the front axle. Shown on the car selection screen. 50% = perfect balance. Most front-engined cars are 52–58% front."/>
            <Field label="Aero Balance" value={ch.aeroBalance??0.5} onChange={pCh('aeroBalance')}
              min={0} max={1.5} step={0.01}
              hint="Aero balance as shown in Forza's tuning menu (0.00–1.50, same scale as Mech Balance). 0.50 = neutral / no aero. Above 0.50 = rear-biased downforce (oversteer tendency). Below 0.50 = front-biased (understeer tendency). Method: set all aero to max cornering, read the number from Forza, enter it here — then tune mechanical balance to cancel it."/>
            <Field label="Aero Efficiency" value={ch.aeroEfficiency??0.9} onChange={pCh('aeroEfficiency')}
              min={0.1} max={1.0} step={0.001}
              hint="Aero efficiency from Forza's tuning menu (typically 0.300–0.900). Lower = more total downforce. Scales how strongly the aero balance affects the overall handling total — a high-downforce car at 0.30 has 3× the aero load of a stock car at 0.90, so its balance bias matters proportionally more."/>
            <Field label="Wheelbase" value={Math.round(ch.wheelbase*1000)} onChange={v=>pCh('wheelbase')(v/1000)} min={400} max={4000} step={5} unit="mm"              hint="Distance between front and rear axles in millimetres. Used by the flat-ride formula to match rear spring frequency to your target speed. Typical cars: 2400–2900 mm."/>
            <Field label="CG Height" value={Math.round(ch.cgHeight*1000)} onChange={v=>pCh('cgHeight')(v/1000)} min={200} max={900} step={5} unit="mm"              hint="Estimated height of the centre of gravity above ground. Forza doesn't expose this — use 400–460 mm for sports cars, 480–550 mm for sedans, 580–700 mm for SUVs. Affects roll moment and ARB stiffness."/>
            <AdvancedToggle open={open.chassisAdv} onToggle={()=>setOpen(p=>({...p,chassisAdv:!p.chassisAdv}))}/>
            {open.chassisAdv&&<>
              <Field label="Track Width Front" value={Math.round(ch.trackF*1000)} onChange={v=>pCh('trackF')(v/1000)} min={1000} max={2200} step={5} unit="mm"                hint="Distance between left and right wheels. Typical: 1400–1800 mm. Wider = more roll resistance."/>
              <Field label="Track Width Rear" value={Math.round(ch.trackR*1000)} onChange={v=>pCh('trackR')(v/1000)} min={1000} max={2200} step={5} unit="mm"                hint="Distance between left and right wheels. Typical: 1400–1800 mm. Often slightly wider than front."/>
              <Field label="Motion Ratio Front" value={ch.motionRatioF} onChange={pCh('motionRatioF')} min={0.5} max={1.0} step={0.01}
                hint="Spring compression per inch of wheel travel. Default 1.0 = no correction (matches simplified calculator). Real values: MacPherson ~0.85–0.95, Wishbone ~0.75–0.90."/>
              <Field label="Motion Ratio Rear" value={ch.motionRatioR} onChange={pCh('motionRatioR')} min={0.5} max={1.0} step={0.01}
                hint="Spring compression per inch of wheel travel. Default 1.0 = no correction (matches simplified calculator). Real values: MacPherson ~0.85–0.95, Wishbone ~0.75–0.90."/>
            </>}
          </Sec>

          <Sec title="FEEL" open={open.feel} onToggle={tog('feel')}
            onReset={()=>setFe(p=>({...p,
              rideStiffness:DEF_FE.rideStiffness,
              targetSpeed:DEF_FE.targetSpeed,
              dampingMode:DEF_FE.dampingMode,
              reboundZeta:DEF_FE.reboundZeta,
              bumpRatio:DEF_FE.bumpRatio,
              bumpZeta:DEF_FE.bumpZeta}))}>
            <FeelSlider label="Ride Stiffness" value={fe.rideStiffness}
              onChange={pFe('rideStiffness')} min={0} max={100} leftLabel="COMFORT" rightLabel="RACE"
              readout={`${physics.frontHz.toFixed(2)} Hz`}
              hint="Sets the front spring frequency. COMFORT (0) = 0.80 Hz, street-soft. RACE (100) = 3.50 Hz, track-stiff. Rear frequency is derived automatically via the flat-ride formula. The Hz readout updates live."
              markers={[
                {value:19,color:'#64748b',label:'ROAD'},
                {value:44,color:'#f59e0b',label:'FIRM'},
                {value:74,color:'#ef4444',label:'RACE'},
              ]}/>
            <FeelSlider label="Target Speed" value={240-fe.targetSpeed}
              onChange={v=>pFe('targetSpeed')(240-v)} min={40} max={200} step={5}
              leftLabel="OFF" rightLabel="CITY"
              readout={fe.targetSpeed>=200
                ? `FLAT RIDE OFF · ${physics.rearHz.toFixed(2)} Hz rear`
                : metricUnits
                  ? `${Math.round(fe.targetSpeed*KMH_PER_MPH)} km/h · ${physics.rearHz.toFixed(2)} Hz rear${physics.rearHzClamped?' ⚠':''}`
                  : `${fe.targetSpeed} mph · ${physics.rearHz.toFixed(2)} Hz rear${physics.rearHzClamped?' ⚠':''}`}
              hint="The speed at which front and rear wheels hit bumps in phase (flat ride). Right (CITY) = lower speed tuning, softer rear, more oversteer feel. Left (OFF) = higher speed tuning, flat-ride correction disabled — rear Hz matches front Hz adjusted for mass only."/>
            <div style={{display:'flex',alignItems:'center',gap:6,
                         padding:'5px 8px',background:'#0a0f1a',borderRadius:2,
                         border:'1px solid #1e293b',marginBottom:10,marginTop:-6}}>
              <span style={{fontSize:10,color:'#4b5563',letterSpacing:1}}>FRONT</span>
              <span style={{fontFamily:'Courier New',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>{physics.frontHz.toFixed(2)}</span>
              <span style={{fontSize:10,color:'#4b5563'}}>Hz</span>
              <div style={{flex:1,height:1,background:'#1e293b'}}/>
              <span style={{fontSize:10,color:'#4b5563',letterSpacing:1}}>REAR</span>
              <span style={{fontFamily:'Courier New',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>{physics.rearHz.toFixed(2)}</span>
              <span style={{fontSize:10,color:'#4b5563'}}>Hz</span>
            </div>
            <DampingDial rebound={fe.reboundZeta??70} bump={physics.bumpZeta}/>
            {/* damping mode toggle */}
            <div style={{display:'flex',gap:3,marginBottom:10}}>
              <button className={`tog${(fe.dampingMode??'ratio')==='ratio'?' on':''}`}
                onClick={()=>setFe(p=>({...p,dampingMode:'ratio'}))}>BUMP RATIO</button>
              <button className={`tog${(fe.dampingMode??'ratio')==='independent'?' on':''}`}
                onClick={()=>setFe(p=>({...p,dampingMode:'independent',
                  bumpZeta:Math.round(physics.bumpZeta)}))}>INDEPENDENT</button>
            </div>
            <FeelSlider label="Rebound ζ" value={fe.reboundZeta??70}
              onChange={pFe('reboundZeta')} min={10} max={115} step={1}
              leftLabel="10%" rightLabel="115%"
              hint="Damping ratio for the rebound (extension) stroke — how quickly the suspension returns after compression. 55–70% is typical. Above 70% (Butterworth) the car feels planted but stiff. Above 100% (overdamped) the suspension moves sluggishly."
              markers={[
                {value:70, color:'#f59e0b',label:'BWORTH'},
                {value:100,color:'#ef4444',label:'OVER'},
              ]}
              readout={(()=>{
                const z=fe.reboundZeta??70;
                if(z>100)return`${z}% ⚠ OVERDAMPED`;
                if(z>70) return`${z}% · BUTTERWORTH`;
                return`${z}%`;
              })()}/>
            {(fe.dampingMode??'ratio')==='ratio'
              ? <FeelSlider label="Bump Ratio" value={fe.bumpRatio??56}
                  onChange={pFe('bumpRatio')} min={10} max={100} step={1}
                  leftLabel="10%" rightLabel="100%"
                  hint="Bump damping as a percentage of rebound. Lower = softer over sharp hits, more compliant on rough roads. Higher = more consistent feel between bump and rebound strokes. 40–65% is the typical real-world range. Readout shows ratio / resulting bump ζ."
                  markers={[{value:65,color:'#f59e0b',label:'FIRM'}]}
                  readout={(()=>{
                    const ratio=Math.min(100,fe.bumpRatio??56);
                    const bz=Math.max(10,Math.min((fe.reboundZeta??70),(fe.reboundZeta??70)*ratio/100));
                    const zLabel=bz>100?`${Math.round(bz)}% ⚠ OVERDAMPED`:
                                 bz>70 ?`${Math.round(bz)}% · BUTTERWORTH`:
                                         `${Math.round(bz)}%`;
                    return`${ratio}% / ${zLabel}`;
                  })()}/>
              : <FeelSlider label="Bump ζ" value={fe.bumpZeta??39}
                  onChange={pFe('bumpZeta')} min={10} max={115} step={1}
                  leftLabel="10%" rightLabel="115%"
                  hint="Bump damping ratio set independently from rebound. Useful when you want precise control — e.g. soft bump for road compliance with firm rebound for body control. Keep below rebound for normal handling."
                  readout={(()=>{
                    const z=fe.bumpZeta??39;
                    const r=fe.reboundZeta??70;
                    const cross=z>r?' ⚠ CROSSED':'';
                    if(z>100)return`${z}% ⚠ OVERDAMPED${cross}`;
                    if(z>70) return`${z}% · BUTTERWORTH${cross}`;
                    return`${z}%${cross}`;
                  })()}/>}
            <div style={{display:'flex',alignItems:'center',gap:6,
                         padding:'5px 8px',background:'#0a0f1a',borderRadius:2,
                         border:'1px solid #1e293b',marginBottom:4,marginTop:-6}}>
              <span style={{fontSize:10,color:'#4b5563',letterSpacing:1,whiteSpace:'nowrap'}}>REB</span>
              <span style={{fontFamily:'Courier New',fontSize:11,color:'#9ca3af'}}>{Math.round(physics.reboundZeta)}%</span>
              <span style={{fontSize:10,color:'#1e293b',flex:1,textAlign:'center'}}>·</span>
              <span style={{fontSize:10,color:'#4b5563',letterSpacing:1,whiteSpace:'nowrap'}}>BUMP</span>
              <span style={{fontFamily:'Courier New',fontSize:11,color:'#9ca3af'}}>{Math.round(physics.bumpZeta)}%</span>
              <span style={{fontSize:10,color:'#1e293b',flex:1,textAlign:'center'}}>·</span>
              <span style={{fontSize:10,color:'#4b5563',letterSpacing:1,whiteSpace:'nowrap'}}>SETTLE</span>
              <span style={{fontFamily:'Courier New',fontSize:11,color:'#9ca3af'}}>{tune.settle.toFixed(2)}s</span>
            </div>
          </Sec>

          <Sec title="ANTI-ROLL BARS" open={open.arb} onToggle={tog('arb')}
            onReset={()=>setFe(p=>({...p,
              arbBias:DEF_FE.arbBias,
              arbMode:DEF_FE.arbMode,
              arbTargetRollMan:DEF_FE.arbTargetRollMan,
              arbShareMan:DEF_FE.arbShareMan,
              arbFloor:DEF_FE.arbFloor,
              arbCeil:DEF_FE.arbCeil}))}>
            <FeelSlider label="ARB Bias" value={fe.arbBias}
              onChange={pFe('arbBias')} min={-50} max={50} leftLabel="FRONT HEAVY" rightLabel="REAR HEAVY"
              centered={true}
              hint="Shifts the front/rear ARB stiffness split from the neutral weight-distribution default. FRONT HEAVY adds more front bar stiffness (more understeer). REAR HEAVY adds more rear bar stiffness (more oversteer). Neutral (centre) matches the car's weight balance."
              readout={`F ${Math.round((1-(physics.arbBalance/100))*100)}% / R ${Math.round(physics.arbBalance/100*100)}%`}/>
            <ArbRangeSlider
              floor={fe.arbFloor??6} ceil={fe.arbCeil??lim.arb}
              onFloor={pFe('arbFloor')} onCeil={pFe('arbCeil')}
              max={lim.arb}/>
            <div style={{display:'flex',alignItems:'center',gap:6,
                         padding:'5px 8px',background:'#0a0f1a',borderRadius:2,
                         border:'1px solid #1e293b',marginBottom:10,marginTop:-6}}>
              <span style={{fontSize:10,color:'#4b5563',letterSpacing:1}}>ROLL</span>
              <span style={{fontFamily:'Courier New',fontSize:13,fontWeight:700,
                            color:tune.rollClamped?'#f59e0b':'#e2e8f0'}}>{tune.rollDeg.toFixed(1)}</span>
              <span style={{fontSize:10,color:'#4b5563'}}>°</span>
              <svg width="100%" height="24" viewBox="0 0 100 24" style={{flex:1,overflow:'visible',margin:'0 4px'}}>
                <line x1="5" y1="20" x2="95" y2="20" stroke="#1e293b" strokeWidth="2" strokeLinecap="round"/>
                {(fe.arbMode??'auto')==='roll'&&(
                  <g transform={`rotate(${-Math.min(tune.rollTarget*4,25)} 50 20)`}>
                    <line x1="15" y1="14" x2="85" y2="14" stroke="#3b82f6" strokeWidth="1.5"
                      strokeDasharray="3 2" opacity="0.4" strokeLinecap="round"/>
                  </g>
                )}
                <g transform={`rotate(${-Math.min(tune.rollDeg*4,25)} 50 20)`}
                   style={{transition:'transform 0.15s ease-out'}}>
                  <line x1="20" y1="14" x2="80" y2="14"
                    stroke={tune.rollClamped?'#f59e0b':'#e2e8f0'} strokeWidth="1.5" strokeLinecap="round"/>
                  <rect x="15" y="10" width="5" height="8" rx="1.5" fill="#0f172a"
                    stroke={tune.rollClamped?'#f59e0b':'#64748b'} strokeWidth="1.5"/>
                  <rect x="80" y="10" width="5" height="8" rx="1.5" fill="#0f172a"
                    stroke={tune.rollClamped?'#f59e0b':'#64748b'} strokeWidth="1.5"/>
                </g>
              </svg>
              <span style={{fontSize:10,color:'#4b5563',letterSpacing:1}}>ARB SHARE</span>
              <span style={{fontFamily:'Courier New',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>{Math.round(tune.arbShare)}</span>
              <span style={{fontSize:10,color:'#4b5563'}}>%</span>
            </div>            <div style={{marginBottom:10}}>
              <span style={{fontSize:12,color:'#6b7280',display:'inline-block',marginBottom:4}}>Stiffness Mode</span>
              <Hint text="AUTO derives ARB stiffness from the car's natural roll tendency — heavier, taller, softer cars get more ARB contribution. ROLL ° targets a specific body roll angle. SHARE % directly sets ARBs as a fraction of total roll stiffness."/>
              <div style={{display:'flex',gap:3}}>
                <button className={`tog${(fe.arbMode??'auto')==='auto'?' on':''}`}
                  onClick={()=>pFe('arbMode')('auto')}>AUTO</button>
                <button className={`tog${(fe.arbMode??'auto')==='roll'?' on':''}`}
                  onClick={()=>{
                    setFe(p=>({...p,arbMode:'roll',
                      arbTargetRollMan:Math.round(physics.arbTargetRoll*10)/10}));
                  }}>ROLL °</button>
                <button className={`tog${(fe.arbMode??'auto')==='share'?' on':''}`}
                  onClick={()=>{
                    setFe(p=>({...p,arbMode:'share',
                      arbShareMan:Math.round(tune.arbShare)}));
                  }}>SHARE %</button>
              </div>

            </div>
            {(fe.arbMode??'auto')==='roll'&&
              <Field label="Target Roll Angle" value={fe.arbTargetRollMan} onChange={pFe('arbTargetRollMan')}
                min={0.3} max={5.0} step={0.1} unit="° @ 1g"
                hint="Body roll the anti-roll bars are solved to allow. Low (≈0.5–1°) = stiff bars, flat cornering. High (≈3–5°) = soft bars that let the suspension articulate over terrain."/>}
            {(fe.arbMode??'auto')==='share'&&
              <Field label="ARB Share" value={fe.arbShareMan??15} onChange={pFe('arbShareMan')}
                min={0} max={80} step={1} unit="%"
                hint="Fraction of total roll stiffness supplied by ARBs. 0% = springs handle all roll resistance. 20–30% is typical sport. Higher = stiffer bars relative to springs, more abrupt load transfer."/>}
          </Sec>

          <Sec title="ALIGNMENT" open={open.alignment} onToggle={tog('alignment')}
            onReset={()=>setAl({...DEF_AL})}>
            <div style={{marginBottom:10}}>
              <span style={{fontSize:12,color:'#6b7280',display:'inline-block',marginBottom:4}}>Alignment Mode</span>
              <Hint text="AUTO derives camber, toe, and caster from build type, layout, CG height, and roll angle. MANUAL lets you enter specific values — seeds from the current AUTO recommendation when switching."/>
              <div style={{display:'flex',gap:3}}>
                <button className={`tog${!al.alignManual?' on':''}`}
                  onClick={()=>setAl(p=>({...p,alignManual:false}))}>AUTO</button>
                <button className={`tog${al.alignManual?' on':''}`}
                  onClick={()=>setAl(p=>({...p,alignManual:true,
                    camberF:autoAlign.recCamberF,camberR:autoAlign.recCamberR,
                    toeF:autoAlign.recToeF,toeR:autoAlign.recToeR,
                    caster:autoAlign.recCaster}))}>MANUAL</button>
              </div>

            </div>
            {al.alignManual&&<>
              <div style={{fontSize:10,color:'#4b5563',letterSpacing:2,marginBottom:6}}>CAMBER</div>
              <Field label="Front" value={al.camberF} onChange={pAl('camberF')}
                min={-4.0} max={0.0} step={0.1} unit="°"
                hint="Static front camber. Negative camber tilts the top of the tyre inward. Compensates for camber gain during body roll — outer tyre stays flat through corners."/>
              <Field label="Rear" value={al.camberR} onChange={pAl('camberR')}
                min={-3.5} max={0.0} step={0.1} unit="°"
                hint="Static rear camber. Rear typically needs less than front since body roll is shared more evenly and rear suspension often has lower camber gain."/>
              <div style={{fontSize:10,color:'#4b5563',letterSpacing:2,marginBottom:6,marginTop:4}}>TOE</div>
              <Field label="Front" value={al.toeF} onChange={pAl('toeF')}
                min={-0.2} max={0.2} step={0.1} unit="°"
                hint="Front toe angle. Negative = toe-out (improves turn-in, can cause instability). Positive = toe-in (more stable, slower turn-in). FWD typically toe-in, RWD typically slight toe-out."/>
              <Field label="Rear" value={al.toeR} onChange={pAl('toeR')}
                min={0.0} max={0.3} step={0.1} unit="°"
                hint="Rear toe angle. Positive = toe-in (increases stability, reduces rotation). Near zero for drift/rotation, higher for stability builds."/>
              <div style={{fontSize:10,color:'#4b5563',letterSpacing:2,marginBottom:6,marginTop:4}}>CASTER</div>
              <Field label="Caster" value={al.caster} onChange={pAl('caster')}
                min={4.0} max={7.5} step={0.1} unit="°"
                hint="Steering axis tilt. Higher caster improves straight-line stability and adds camber gain through steering input. Lower caster reduces steering effort (useful for FWD). 5.0–6.5° is typical."/>
            </>}
          </Sec>

          <Sec title="DRIVETRAIN" open={open.drivetrain} onToggle={tog('drivetrain')}
            onReset={()=>setDr(p=>({...p,
              diffManual:DEF_DR.diffManual,
              diffBiasExit:DEF_DR.diffBiasExit,
              diffBiasEntry:DEF_DR.diffBiasEntry,
              diffAccel:DEF_DR.diffAccel,
              diffDecel:DEF_DR.diffDecel,
              diffFrontAccel:DEF_DR.diffFrontAccel,
              diffFrontDecel:DEF_DR.diffFrontDecel,
              diffRearAccel:DEF_DR.diffRearAccel,
              diffRearDecel:DEF_DR.diffRearDecel,
              diffCenter:DEF_DR.diffCenter}))}>
            <Toggle label="" value={dr.layout} onChange={pDr('layout')}
              options={[{value:'FWD',label:'FWD'},{value:'RWD',label:'RWD'},{value:'AWD',label:'AWD'}]}/>
            <Toggle label="Build Type" value={dr.buildType??'track'} onChange={pDr('buildType')}
              options={[{value:'street',label:'STREET'},{value:'track',label:'TRACK'},{value:'drift',label:'DRIFT'}]}/>
            <div style={{marginTop:8,marginBottom:10}}>
              <span style={{fontSize:12,color:'#6b7280',display:'inline-block',marginBottom:4}}>Differential Mode</span>
              <Hint text="AUTO derives lock values from layout, build type, weight bias, and the Corner Exit/Entry sliders. MANUAL exposes all individual lock percentages."/>
              <div style={{display:'flex',gap:3}}>
                <button className={`tog${!dr.diffManual?' on':''}`}
                  onClick={()=>pDr('diffManual')(false)}>AUTO</button>
                <button className={`tog${dr.diffManual?' on':''}`}
                  onClick={()=>{
                    const d=diff;
                    setDr(p=>({...p,diffManual:true,
                      ...(d.layout==='AWD'
                        ?{diffFrontAccel:d.frontAccel,diffFrontDecel:d.frontDecel,
                          diffRearAccel:d.rearAccel,diffRearDecel:d.rearDecel,
                          diffCenter:d.center}
                        :{diffAccel:d.accel,diffDecel:d.decel})}));
                  }}>MANUAL</button>
              </div>

            </div>
            {!dr.diffManual&&<>
              <FeelSlider label="Corner Exit" value={dr.diffBiasExit??0}
                onChange={pDr('diffBiasExit')} min={-50} max={50} leftLabel="UNDERSTEER" rightLabel="OVERSTEER"
                centered={true}
                hint="Shifts accel lock values. Toward OVERSTEER increases rear accel lock (RWD) or decreases front accel lock (FWD/AWD) — more rotation on exit. Toward UNDERSTEER does the reverse."
                readout={diff.layout==='AWD'
                  ?`FA ${diff.frontAccel}% / RA ${diff.rearAccel}%`
                  :`Accel ${diff.accel}%`}/>
              <FeelSlider label="Corner Entry" value={-(dr.diffBiasEntry??0)}
                onChange={v=>pDr('diffBiasEntry')(-v)} min={-50} max={50} leftLabel="STABILITY" rightLabel="ROTATION"
                centered={true}
                hint="Shifts decel lock values. Toward ROTATION decreases decel lock — freer entry rotation. Toward STABILITY increases decel lock — more resistance to rotation on corner entry."
                readout={diff.layout==='AWD'
                  ?`RD ${diff.rearDecel}%`
                  :`Decel ${diff.decel}%`}/>
            </>}
            {dr.diffManual&&(dr.layout==='AWD'?(
              <>
                <div style={{fontSize:10,color:'#4b5563',letterSpacing:2,marginBottom:6,marginTop:2}}>FRONT AXLE</div>
                <Field label="Accel" value={dr.diffFrontAccel} onChange={pDr('diffFrontAccel')}
                  min={0} max={100} step={1} unit="%"
                  hint="Front axle lock under power. Higher = more front pull out of corners but risks understeer. 20–35% typical."/>
                <Field label="Decel" value={dr.diffFrontDecel} onChange={pDr('diffFrontDecel')}
                  min={0} max={100} step={1} unit="%"
                  hint="Front axle lock off throttle. 0 is strongly recommended — anything above strongly increases understeer on corner entry."/>
                <div style={{fontSize:10,color:'#4b5563',letterSpacing:2,marginBottom:6,marginTop:4}}>REAR AXLE</div>
                <Field label="Accel" value={dr.diffRearAccel} onChange={pDr('diffRearAccel')}
                  min={0} max={100} step={1} unit="%"
                  hint="Rear axle lock under power. Higher = more oversteer on exit. 40–60% typical."/>
                <Field label="Decel" value={dr.diffRearDecel} onChange={pDr('diffRearDecel')}
                  min={0} max={100} step={1} unit="%"
                  hint="Rear axle lock off throttle. Low values improve corner entry rotation. 0–15% typical."/>
                <div style={{fontSize:10,color:'#4b5563',letterSpacing:2,marginBottom:6,marginTop:4}}>CENTER</div>
                <Field label="Split" value={dr.diffCenter} onChange={pDr('diffCenter')}
                  min={0} max={100} step={1} unit="% rear"
                  hint="Power distribution rear bias. Higher = more oversteer. 60–70% typical for track."/>
              </>
            ):(
              <>
                <Field label="Accel Lock" value={dr.diffAccel} onChange={pDr('diffAccel')}
                  min={0} max={100} step={1} unit="%"
                  hint={dr.layout==='RWD'
                    ?"RWD rear accel lock. Higher = more exit oversteer. 25–45% typical."
                    :"FWD front accel lock. Higher = more understeer on exit. 15–25% typical."}/>
                <Field label="Decel Lock" value={dr.diffDecel} onChange={pDr('diffDecel')}
                  min={0} max={100} step={1} unit="%"
                  hint={dr.layout==='RWD'
                    ?"RWD rear decel lock. Lower = better corner entry rotation, less lift-off oversteer. 0–20% typical."
                    :"FWD front decel lock. Lower = less understeer on entry. 0–10% typical."}/>
              </>
            ))}
          </Sec>

          <Sec title="BRAKES" open={open.brakes} onToggle={tog('brakes')}
            onReset={()=>setBr({...DEF_BR})}>
            <div style={{marginBottom:10}}>
              <span style={{fontSize:12,color:'#6b7280',display:'inline-block',marginBottom:4}}>Brake Mode</span>
              <Hint text="AUTO derives a recommended brake balance from your front weight bias and build type. MANUAL lets you set specific values."/>
              <div style={{display:'flex',gap:3}}>
                <button className={`tog${!br.brakeManual?' on':''}`}
                  onClick={()=>setBr(p=>({...p,brakeManual:false}))}>AUTO</button>
                <button className={`tog${br.brakeManual?' on':''}`}
                  onClick={()=>setBr(p=>({...p,brakeManual:true,
                    brakeBias:recBrakeBias,brakePressure:100}))}>MANUAL</button>
              </div>
            </div>
            {br.brakeManual&&<>
              <Field label="Brake Balance" value={br.brakeBias??DEF_BR.brakeBias}
                onChange={pBr('brakeBias')} min={45} max={70} step={1} unit="% front"
                hint="Front brake bias. Higher front bias = stronger front braking, more resistance to corner entry rotation (understeer). Lower = more rear braking, more rotation tendency (oversteer). Start at your front weight distribution and adjust by feel."/>
              <Field label="Brake Pressure" value={br.brakePressure??DEF_BR.brakePressure}
                onChange={pBr('brakePressure')} min={50} max={200} step={5} unit="%"
                hint="Overall brake force multiplier. 100% is the default. Increase if the car doesn't slow down fast enough; decrease if the wheels lock under light braking. Tune this to match your tyre grip level."/>
            </>}
          </Sec>
        </div>

        {/* OUTPUT PANEL */}
        <div style={{flex:1,display:'flex',flexDirection:'column',background:'#020617',minHeight:0}}>

          {/* cards — scrollable */}
          <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',overscrollBehavior:'contain',padding:'8px 10px 6px',minHeight:0}}>

          {/* 1 — ALIGNMENT */}
          <Card title={`ALIGNMENT${al.alignManual?' · MANUAL':''}`}
            hint={dr.layout==='FWD'
              ?`${al.alignManual?'Manual values.':'Recommended starting point.'} Camber targets ${({street:'-1.0°',track:'-1.5°',drift:'-2.5°'})[dr.buildType??'track']} dynamic. FWD front camber reduced for traction. Toe-in front and rear for stability.`
              :dr.layout==='RWD'
              ?`${al.alignManual?'Manual values.':'Recommended starting point.'} Camber targets ${({street:'-1.0°',track:'-1.5°',drift:'-2.5°'})[dr.buildType??'track']} dynamic at ${tune.rollDeg.toFixed(1)}° roll. Front toe-out for turn-in, rear toe-in for stability.`
              :`${al.alignManual?'Manual values.':'Recommended starting point.'} Camber targets ${({street:'-1.0°',track:'-1.5°',drift:'-2.5°'})[dr.buildType??'track']} dynamic at ${tune.rollDeg.toFixed(1)}° roll. Front toe-out for turn-in, rear toe-in scaled to center bias.`}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr 1fr',gap:4}}>
              <Readout label="CAMBER F" value={align.recCamberF} unit="°" decimals={1}/>
              <Readout label="CAMBER R" value={align.recCamberR} unit="°" decimals={1}/>
              <Readout label="TOE F" value={align.recToeF} unit="°" decimals={1}/>
              <Readout label="TOE R" value={align.recToeR} unit="°" decimals={1}/>
              <Readout label="CASTER" value={align.recCaster} unit="°" decimals={1}/>
            </div>
          </Card>

          {/* 2+3 — ANTI-ROLL BARS + SPRINGS side by side */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:6}}>
          <Card title="ANTI-ROLL BARS" accent
            hint="Click values to enter in Forza's ARB tuning menu. Roll angle and ARB share are shown in the ANTI-ROLL BARS section of inputs. Amber warn when above 88% of the game limit.">
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4}}>
              <Readout label="FRONT" value={tune.arbF} warn={tune.arbF>lim.arb*0.88}
                unit={`/ ${lim.arb}`} ctx={arbCtx(tune.arbF,lim.arb)} primary/>
              <Readout label="REAR" value={tune.arbR} warn={tune.arbR>lim.arb*0.88}
                unit={`/ ${lim.arb}`} ctx={arbCtx(tune.arbR,lim.arb)} primary/>
            </div>
            {tune.rollClamped&&<div style={{fontSize:11,color:'#f59e0b',lineHeight:1.6,
                 marginTop:8,padding:'6px 8px',background:'#020617',borderRadius:2,
                 border:'1px solid #f5a62333'}}>
              Target {tune.rollTarget.toFixed(1)}° couldn't be reached within the 1–{lim.arb} range —
              achieved {tune.rollDeg.toFixed(1)}°. {tune.rollDeg>tune.rollTarget
                ?'Bars are maxed; stiffer springs would reduce roll further.'
                :'Springs alone already exceed the target; softer springs would allow the bars more authority.'}
            </div>}
          </Card>

          <Card title="SPRINGS" accent
            hint="Spring rates in lb/in to enter in Forza. The badge shows the frequency category — SOFT/ROAD/FIRM/RACE. Hz values are shown in the FEEL section of inputs.">
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4}}>
              <Readout label="FRONT"
                value={metricUnits?tune.springF*NMM_PER_LBIN:tune.springF}
                unit={metricUnits?'N/mm':'lb/in'} decimals={metricUnits?1:0}
                ctx={hzCtx(tune.fHz)} primary/>
              <Readout label="REAR"
                value={metricUnits?tune.springR*NMM_PER_LBIN:tune.springR}
                unit={metricUnits?'N/mm':'lb/in'} decimals={metricUnits?1:0}
                ctx={hzCtx(tune.rHz)} primary/>
            </div>
            {physics.rearHzClamped&&<div style={{fontSize:11,color:'#f59e0b',lineHeight:1.6,
                 marginTop:8,padding:'6px 8px',background:'#020617',borderRadius:2,
                 border:'1px solid #f5a62333'}}>
              Rear Hz capped at 1.6× front ({tune.rHz.toFixed(2)} Hz). Raise Target Speed or increase Ride Stiffness to bring the natural ratio within range.
            </div>}
          </Card>
          </div>

          {/* 4 — DAMPERS */}
          <Card title="DAMPERS" accent
            hint="Rebound (REB) and bump (BUMP) click values for front and rear dampers. Enter in Forza's damping tuning menu. Amber warn when above 88% of the game limit.">
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:4}}>
              <Readout label="REB F"  value={tune.rebF}  warn={tune.rebF >lim.damping*0.88} unit={`/ ${lim.damping}`} primary/>
              <Readout label="REB R"  value={tune.rebR}  warn={tune.rebR >lim.damping*0.88} unit={`/ ${lim.damping}`} primary/>
              <Readout label="BUMP F" value={tune.bumpF} warn={tune.bumpF>lim.damping*0.88} unit={`/ ${lim.damping}`} primary/>
              <Readout label="BUMP R" value={tune.bumpR} warn={tune.bumpR>lim.damping*0.88} unit={`/ ${lim.damping}`} primary/>
            </div>
            {tune.dampingClamped&&<div style={{fontSize:11,color:'#f59e0b',lineHeight:1.6,
                 marginTop:8,padding:'6px 8px',background:'#020617',borderRadius:2,
                 border:'1px solid #f5a62333'}}>
              F/R balance preserved — damper values scaled proportionally to fit within 1–{lim.damping}.
              Reduce Rebound ζ or Bump Ratio to achieve target damping character.
            </div>}
          </Card>

          {/* 5 — BRAKES */}
          <Card title={`BRAKES${br.brakeManual?' · MANUAL':''}`}
            hint="Brake balance and pressure starting point. Balance affects corner entry — higher front bias increases understeer tendency, lower increases rotation. Fine-tune in 1% steps by feel.">
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4}}>
              <Readout label="BALANCE" value={brakeBias} unit="% F"                ctx={brakeBias>55?['FRONT','#3b82f6']:brakeBias<50?['REAR','#ef4444']:['NEUTRAL','#64748b']}/>
              <Readout label="PRESSURE" value={brakePressure} unit="%" decimals={0}/>
            </div>
          </Card>

          {/* 6 — DIFFERENTIAL */}
          <Card title="DIFFERENTIAL"
            hint={diff.layout==='FWD'
              ?'Starting point — fine-tune by feel in 1% steps. Accel lock controls exit traction and understeer. Decel near zero improves corner entry rotation.'
              :diff.layout==='RWD'
              ?'Starting point — fine-tune by feel in 1% steps. Accel lock aids exit rotation. Decel low for better corner entry; raise for stability under lift-off.'
              :`Starting point — fine-tune by feel in 1% steps. Front decel at 0 minimises entry understeer. Rear decel low for rotation. Center ${diff.center}% rear.`}>
            {diff.layout==='AWD'?(
              <>
                <div style={{fontSize:9,color:'#374151',letterSpacing:2,marginBottom:3}}>FRONT AXLE</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4,marginBottom:6}}>
                  <Readout label="ACCEL" value={diff.frontAccel} unit="%" decimals={0} ctx={diffCtx(diff.frontAccel)}/>
                  <Readout label="DECEL" value={diff.frontDecel} unit="%" decimals={0} ctx={diffCtx(diff.frontDecel)}/>
                </div>
                <div style={{fontSize:9,color:'#374151',letterSpacing:2,marginBottom:3}}>REAR AXLE</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4,marginBottom:6}}>
                  <Readout label="ACCEL" value={diff.rearAccel} unit="%" decimals={0} ctx={diffCtx(diff.rearAccel)}/>
                  <Readout label="DECEL" value={diff.rearDecel} unit="%" decimals={0} ctx={diffCtx(diff.rearDecel)}/>
                </div>
                <div style={{fontSize:9,color:'#374151',letterSpacing:2,marginBottom:3}}>CENTER</div>
                <Readout label="SPLIT" value={diff.center} unit="% rear" decimals={0} ctx={diffCtx(diff.center)}/>
              </>
            ):(
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4}}>
                <Readout label="ACCEL LOCK" value={diff.accel} unit="%" decimals={0} ctx={diffCtx(diff.accel)}/>
                <Readout label="DECEL LOCK" value={diff.decel} unit="%" decimals={0} ctx={diffCtx(diff.decel)}/>
              </div>
            )}
            {/* diff handling summary strip */}
            {(()=>{
              const fmtBias=(v,label)=>{
                const abs=Math.abs(v).toFixed(1);
                const isOS=v<-0.05, isUS=v>0.05, neutral=Math.abs(v)<=0.05;
                const col=neutral?'#4b5563':isOS?'#ef4444':'#3b82f6';
                const arrow=neutral?'±':isOS?'→OS':'→US';
                return(
                  <div style={{display:'flex',alignItems:'baseline',gap:4}}>
                    <span style={{fontSize:9,color:'#374151',letterSpacing:1}}>{label}</span>
                    <span style={{fontFamily:'Courier New',fontSize:12,fontWeight:700,color:col}}>
                      {arrow} {neutral?'0.0':abs}
                    </span>
                  </div>
                );
              };
              return(
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                             marginTop:8,padding:'5px 8px',background:'#0f172a',borderRadius:2,
                             border:'1px solid #1e293b'}}>
                  {fmtBias(diff.bDiffAccel,'EXIT')}
                  <div style={{height:1,flex:1,background:'#1e293b',margin:'0 8px'}}/>
                  {fmtBias(diff.bDiffDecel,'ENTRY')}
                </div>
              );
            })()}
          </Card>

          </div>{/* end cards */}

          {/* AT-A-GLANCE STRIP — collapsible */}
          <div style={{flexShrink:0,borderTop:'1px solid #0f172a',background:'#020617'}}>
            <div onClick={()=>setOpen(p=>({...p,statsOpen:!p.statsOpen}))}
                 style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                         padding:'4px 12px',cursor:'pointer',userSelect:'none'}}>
              <span style={{fontSize:9,color:'#374151',letterSpacing:2}}>RAW VALUES</span>
              <span style={{fontSize:9,color:'#374151'}}>{open.statsOpen?'▲':'▼'}</span>
            </div>
            {open.statsOpen&&<div style={{padding:'0 12px 6px',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
              {[
                {l:'SP F', v:metricUnits?`${(tune.springF*NMM_PER_LBIN).toFixed(1)}`:`${tune.springF.toFixed(0)}`},
                {l:'SP R', v:metricUnits?`${(tune.springR*NMM_PER_LBIN).toFixed(1)}`:`${tune.springR.toFixed(0)}`},
                {l:'ARB F', v:`${tune.arbF}`},
                {l:'ARB R', v:`${tune.arbR}`},
                {l:'REB F', v:`${tune.rebF}`},
                {l:'REB R', v:`${tune.rebR}`},
                {l:'BMP F', v:`${tune.bumpF}`},
                {l:'BMP R', v:`${tune.bumpR}`},
              ].map(({l,v})=>(
                <div key={l} style={{display:'flex',alignItems:'baseline',gap:3}}>
                  <span style={{fontSize:9,color:'#374151',letterSpacing:1}}>{l}</span>
                  <span style={{fontFamily:'Courier New',fontSize:12,color:'#6b7280',fontWeight:700}}>{v}</span>
                </div>
              ))}
            </div>}
          </div>

          {/* TOOLBAR — saves, check, share, import */}
          <div style={{flexShrink:0,borderTop:'1px solid #0f172a',padding:'6px 12px',
                       display:'flex',gap:3,alignItems:'center',background:'#020617'}}>
            {[1,2,3].map(i=>(
              <SaveSlot key={i} i={i} s={saves[i]}
                onLoad={()=>handleSlot(i)}
                onSave={()=>handleSlot(i)}
                onClear={()=>clearSlot(i)}
                onRename={renameSlot}/>
            ))}
            <div style={{flex:1}}/>
            <button className="tbtn" onClick={()=>setShowChecker(true)} style={{fontSize:11}}>CHECK</button>
            <button className="tbtn" style={{fontSize:11}} onClick={()=>{
              try{
                const payload=encodeTune(ch,fe,dr,br);
                if(navigator.clipboard&&navigator.clipboard.writeText){
                  navigator.clipboard.writeText(payload).then(()=>{
                    alert('Tune code copied to clipboard. Share it with anyone running SUSP OS.');
                  }).catch(()=>prompt('Copy this tune code:',payload));
                } else {
                  prompt('Copy this tune code:',payload);
                }
              }catch(e){console.error('Share failed',e);}
            }}>SHARE</button>
            <button className="tbtn" style={{fontSize:11}} onClick={()=>{
              const raw=prompt('Paste a tune code:');
              if(!raw)return;
              const code=raw.replace(/\s/g,''); // strip any whitespace/linebreaks from paste
              try{
                const{ch:ic,fe:ife,dr:idr,br:ibr}=sanitizeTune(decodeTune(code));
                setCh({...DEF_CH,...ic});
                setFe({...DEF_FE,...ife});
                setDr({...DEF_DR,...idr});
                setBr({...DEF_BR,...ibr});
              }catch(e){
                console.error('Import failed:',e,code);
                alert('Invalid tune code: '+e.message+'\n\nMake sure you pasted the full string.');
              }
            }}>IMPORT</button>
          </div>

          {/* PINNED — HANDLING BALANCE */}
          <div style={{flexShrink:0,borderTop:'1px solid #1e293b',background:'#020617'}}>
            {/* compact header row — tap to expand */}
            <div onClick={()=>setOpen(p=>({...p,balanceExpanded:!p.balanceExpanded}))}
                 style={{padding:'10px 14px',cursor:'pointer'}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
                <span style={{fontSize:10,color:'#4b5563',letterSpacing:2}}>HANDLING BALANCE</span>
                <span style={{fontSize:10,color:'#4b5563',letterSpacing:1}}>·</span>
                <span style={{fontFamily:'Courier New',fontSize:13,fontWeight:700,
                              color:Math.abs(bTotFull)<3?'#e2e8f0':bTotFull>0?'#3b82f6':'#ef4444'}}>
                  {`${bTotFull>=0?'+':''}${bTotFull.toFixed(1)}`}
                </span>
                <span style={{fontSize:11,letterSpacing:2,
                              color:Math.abs(bTotFull)<3?'#e2e8f0':bTotFull>0?'#3b82f6':'#ef4444'}}>
                  {Math.abs(bTotFull)<3?'NEUTRAL':bTotFull>0?'UNDERSTEER':'OVERSTEER'}
                </span>
                {tune.mechBalance!=null&&<>
                  <span style={{fontSize:10,color:'#4b5563',letterSpacing:1,marginLeft:'auto'}}>MECH</span>
                  <span style={{fontFamily:'Courier New',fontSize:13,fontWeight:700,color:'#e2e8f0'}}>
                    {tune.mechBalance.toFixed(2)}
                  </span>
                </>}
                {(ch.aeroBalance??0.5)!==0.5&&<>
                  <span style={{fontSize:10,color:'#4b5563',letterSpacing:1,marginLeft:tune.mechBalance!=null?0:'auto'}}>AERO</span>
                  <span style={{fontFamily:'Courier New',fontSize:13,fontWeight:700,color:'#94a3b8'}}>
                    {(ch.aeroBalance??0.5).toFixed(2)}
                  </span>
                  {(()=>{const[label,col]=aeroLoadCtx(ch.aeroEfficiency??0.9);return(
                    <span style={{fontSize:9,color:col,background:col+'18',border:`1px solid ${col}44`,
                                  borderRadius:2,padding:'1px 4px',letterSpacing:1}}>{label}</span>
                  );})()}
                </>}
                <span style={{fontSize:10,color:'#374151',marginLeft:(ch.aeroBalance??0.5)!==0.5||tune.mechBalance!=null?6:'auto'}}>
                  {open.balanceExpanded?'▲':'▼'}
                </span>
              </div>
              {/* compact bias bar */}
              <div style={{position:'relative',height:14,background:'#0a0f1a',border:'1px solid #1e293b',
                           borderRadius:2,overflow:'hidden'}}>
                <div style={{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'#1e293b'}}/>
                {(()=>{
                  const cl=v=>Math.max(-50,Math.min(50,v));
                  const p=cl(-bTotFull);
                  const fs=p>=0?{left:'50%',width:`${p}%`}:{left:`${50+p}%`,width:`${-p}%`};
                  const fc=p>=0?'#ef444440':'#3b82f640';
                  return p!==0&&<div style={{position:'absolute',top:2,bottom:2,borderRadius:1,background:fc,...fs}}/>;
                })()}
                <div style={{position:'absolute',left:5,top:'50%',transform:'translateY(-50%)',
                             fontSize:9,color:'#3b82f6',letterSpacing:1,fontWeight:700}}>US</div>
                <div style={{position:'absolute',right:5,top:'50%',transform:'translateY(-50%)',
                             fontSize:9,color:'#ef4444',letterSpacing:1,fontWeight:700}}>OS</div>
              </div>
            </div>
            {/* expanded full verdict */}
            {open.balanceExpanded&&
              <div style={{padding:'0 14px 12px',borderTop:'1px solid #0f172a'}}>
                <HandlingVerdict total={bTotFull} bSp={tune.bSp} bAb={tune.bAb}
                  bDiffAccel={diff.bDiffAccel} bDiffDecel={diff.bDiffDecel}
                  bBrakeEntry={bBrakeEntry} bAero={bAero}
                  mechBalance={null}/>
              </div>}
          </div>

        </div>{/* end output panel */}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
</script>
<script>
(function(){
  var preload=document.getElementById('pre-load');
  function showError(msg,detail){
    if(preload){
      preload.style.display='block';
      preload.innerHTML='<div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">SUSP.OS \u2014 Failed to load</div>'
        +'<div style="color:#6b7280;margin-bottom:12px">'+msg+'</div>'
        +'<div style="background:#0f172a;padding:12px;border-radius:4px;color:#ef4444;word-break:break-all;line-height:1.6;font-size:11px">'+(detail||'')+'</div>'
        +'<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#0f172a;border:1px solid #1e293b;color:#e2e8f0;border-radius:4px;cursor:pointer;font-family:Courier New;font-size:12px">RELOAD</button>';
    }
  }
  try{
    if(typeof Babel==='undefined'){showError('Babel failed to load','Check your internet connection and reload.');return;}
    var src=document.getElementById('app-source').textContent;
    var compiled;
    try{
      compiled=Babel.transform(src,{
        presets:['env','react'],
        plugins:['transform-optional-chaining','transform-nullish-coalescing-operator','transform-logical-assignment-operators'],
        filename:'susp-os.jsx'
      }).code;
    }catch(e){
      showError('Babel compilation failed',e.message||String(e));
      return;
    }
    // Use indirect eval so errors are catchable on all browsers including iOS WebKit.
    // Direct script injection loses the error context on WebKit.
    try{
      (0,eval)(compiled);
    }catch(e){
      showError('Runtime error',e.message||String(e));
    }
  }catch(e){
    showError('Load failed',e.message||String(e));
  }
})();
</script>
</body>
</html>
